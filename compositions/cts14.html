      lab("Culiacán", 1922.6, 2240.4, { cls: "t-label clean", st: "left:20px;top:-15px;font-size:26px;color:var(--bone);text-transform:none" }, true, [1.2, 0.66]);
      lab("SINALOA", 2150, 2330, { cls: "t-display clean", st: "left:0;top:-24px;font-size:44px;color:var(--ember-light)" }, false, [0, 0]);
      lab("Nogales", 1278.8, 934.3, { cls: "t-label clean", st: "left:20px;top:-15px;font-size:26px;color:var(--bone);text-transform:none" }, true, [0.75, 0]);
      lab("UNITED STATES", 1700, 800, { cls: "t-display clean", st: "left:-200px;top:-28px;font-size:48px;color:var(--steel-light)" }, false, [0.62, 0]);
      lab("MEXICO", 2720, 1880, { cls: "t-display clean", st: "left:-90px;top:-30px;font-size:56px;color:var(--bone)" }, false, [0.75, 0]);
      // camera proxy (transform-origin 0 0): world point (px,py) at the screen centre with scale s
      const cv = { px: 1800, py: 2050, s: 1.05 };
      const updC = () => {
        gsap.set(cam, { x: 960 - cv.px * cv.s, y: 540 - cv.py * cv.s, scale: cv.s });
        L.forEach((l) => {
          const x = 960 + (l.mx - cv.px) * cv.s, y = 540 + (l.my - cv.py) * cv.s;
          // show[0] = scale above which the label shows (city), or below which it shows (country) when show[1] = 0
          let o;
          if (l.show[1] > 0) o = Math.max(0, Math.min(1, (cv.s - l.show[1]) / 0.12));   // cities fade as we pull out
          else if (l.show[0] > 0) o = Math.max(0, Math.min(1, (l.show[0] - cv.s) / 0.12)); // countries fade in as we pull out
          else o = 1;
          gsap.set(l.w, { x: x, y: y, opacity: o });
        });
      };
      updC();
      tl.fromTo(cv, { px: 1800, py: 2050, s: 1.05 }, { px: 2150, py: 1500, s: 0.47, duration: S(1340.40) - S(1334.55), ease: E.cam, immediateRender: false, onUpdate: updC }, S(1334.55));
      // END: the map dims to charcoal, the title small + the channel
      const end = $("end");
      gsap.set(end, { opacity: 0 });
      tl.fromTo($("map-dim"), { opacity: 0 }, { opacity: 0.74, duration: 0.8, ease: "sine.inOut", immediateRender: false }, S(1340.30));
      tl.fromTo(end, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: C(E.out, 0.7), immediateRender: true }, S(1340.60));
      gsap.set($("end-rule"), { scaleX: 0 });
      tl.fromTo($("end-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: C(E.out, 0.6), immediateRender: true }, S(1340.75));
      const cr = CT.credit($("map-cr"), "Map: AWS Terrain Tiles, Natural Earth");
      if (cr && cr.out) cr.out(tl, S(1340.3));
    })();

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
