    const ain = FX.markup.arrow(tl, $("zmk"), S(4907.2), { x1: 150, y1: 640, x2: 660, y2: 600, bend: -20, head: 26, dur: 0.6, color: "#161a24", width: 5, filter: zpen });

    const PX = [760, 830, 900, 970, 1040], PY = [470, 540, 470, 540, 470], parts = [];

    tl.to(parts, { x: (i) => 938 - PX[i], y: (i) => 526 - PY[i], scale: 0.4, opacity: 0, duration: 0.5, stagger: 0.05, ease: C(E.in, 0.5) }, S(4909.55));
    tl.fromTo($("prod"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: C(E.out, 0.45), immediateRender: false }, S(4909.95));
    tl.to($("prod"), { x: 820, duration: 1.0, ease: C(E.inOut, 1.0) }, S(4910.65));
