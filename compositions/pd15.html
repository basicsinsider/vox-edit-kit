    const SC = [["s1", 1860.20, 1864.50, "night"], ["s2", 1864.50, 1869.90, "paper"], ["s3", 1869.90, 1880.60, "night"], ["s4", 1880.60, 1885.45, "paper"],

    const later = (p, t) => { (Array.isArray(p) ? p : [p]).forEach((q) => { gsap.set(q, { opacity: 0 }); tl.set(q, { opacity: 1 }, t); }); return p; };

        gsap.set(d, { x: x0, y: y0 });
        // "eight": they pop up on the lab, one per 12 fps step
        tl.fromTo(d, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: C(E.out, 0.3), immediateRender: true }, S(1864.73) + i / 12);
        // "leave": they walk out to the empty lot on the right
        const t = S(1866.41) + i * 0.09;
        tl.to(d, { x: x1, duration: 1.0, ease: C(E.inOut, 1.0) }, t);
        tl.to(d, { y: y0 - 90, duration: 0.5, ease: C("power1.out", 0.5) }, t);
        tl.to(d, { y: y1, duration: 0.5, ease: C("power1.in", 0.5) }, t + 0.5);
      });
      // "start a company next door": the pen builds a house round them
      later(FX.markup.pen(tl, mk, S(1868.05), { points: [[1110, 650], [1112, 330], [1430, 236], [1748, 330], [1746, 650], [1110, 652]], jitter: 6, seed: 5, dur: 0.9, width: 9, color: MAG, filter: pen, ease: C("power1.inOut", 0.9) }), S(1868.05));
      later(FX.markup.pen(tl, mk, S(1868.90), { points: [[1060, 664], [1800, 660]], jitter: 5, seed: 7, dur: 0.35, width: 9, color: MAG, filter: pen }), S(1868.90));
      // ink arrow: out of the lab
      later(FX.markup.arrow(tl, mk, S(1866.45), { x1: 800, y1: 250, x2: 1090, y2: 300, bend: -60, head: 30, dur: 0.6, color: INK, width: 6, filter: pen }), S(1866.45));
      tl.fromTo(cam, { scale: 1.05, x: 50 }, { scale: 1.0, x: 0, duration: 2.2, ease: E.cam, immediateRender: false }, S(1864.50));
      tl.to(cam, { scale: 1.07, x: -50, duration: 3.3, ease: "power1.in" }, S(1866.60));   // push toward the new house → cut on action
    })();

    // ================= s3 · the photograph, the name =================
    (function () {
      const cam = $("s3-cam"), t0 = S(1869.90);
      tl.fromTo(cam, { scale: 1.12 }, { scale: 1.0, duration: 2.4, ease: E.out, immediateRender: false }, t0);   // continues the push from s2
      tl.to(cam, { scale: 1.06, duration: 8.3, ease: "none" }, t0 + 2.4);
      const ws = W("s3-title");
      rise(W("s3-the")[0], T(1870.65), { dur: 0.3, y: 10 });   // "the"
      rise(ws[0], T(1871.00), { dur: 0.7, y: 26 });            // "traitorous"
      rise(ws[1], T(1871.72), { dur: 0.5, y: 26 });            // "eight"
      // "these people": a sharp spot travels across the eight faces, then the whole print is sharp again
      FX.focalBlur(tl, $("s3-blur"), [{ x: 500, y: 430, r: 1500 },
        { t: S(1872.60), x: 90, y: 500, r: 150, dur: 1.0 }, { t: S(1873.70), x: 880, y: 520, r: 150, dur: 3.3 }, { t: S(1877.20), x: 500, y: 430, r: 1500, dur: 1.2 }], { soft: 1.8 });
    })();

    // ================= s4 · he gets very mad, sues them, names them =================
    (function () {
      const mk = $("s4-mk"), cam = $("s4-cam"), t0 = S(1880.60);
      FX.tintDefs(defs, SEG + "-tg", INK, PAPER); FX.tintDefs(defs, SEG + "-tm", MAGD, "#f6d3e2");
      $("s4-fg").style.filter = "url(#" + SEG + "-tg) contrast(1.15)"; $("s4-fm").style.filter = "url(#" + SEG + "-tm) contrast(1.25)";
      const pen = FX.markupDefs(mk, SEG + "-pen4", { boil: 4 });
      // "very mad": the face floods magenta in three 12 fps steps, the card shakes
      [[1881.27, 0.4], [1881.43, 0.75], [1881.60, 1]].forEach((k) => tl.set($("s4-fm"), { opacity: k[1] }, S(k[0])));
      tl.fromTo($("s4-face"), { x: 0 }, { x: 8, duration: 1 / 12, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, S(1881.43));
      // "sues them": pen arrow from him to the eight
      later(FX.markup.arrow(tl, mk, S(1882.31), { x1: 790, y1: 420, x2: 1068, y2: 470, bend: -70, head: 34, dur: 0.6, color: INK, width: 7, filter: pen }), S(1882.31));
      // "names them Traitorous Eight": the label is slapped on the photograph
      [["s4-l1", T(1883.83)], ["s4-l2", T(1884.55)]].forEach((k) =>
        tl.fromTo($(k[0]), { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.17, ease: C("power2.in", 0.17), immediateRender: true }, k[1]));
      tl.fromTo(cam, { scale: 1.06 }, { scale: 1.0, duration: 4.85, ease: "none", immediateRender: false }, t0);
    })();

    // ================= s5 · Fairchild Semiconductor =================
    (function () {
      const cam = $("s5-cam"), t0 = S(1885.45), mk = $("s5-mk");
      const on = FX.onFrame; FX.onFrame = (f) => on(FX.gate(t0 - 0.3, S(1892.90) + 0.2, f));
      FX.streaks($("s5-streaks"), { seed: 23, speed: 0.4, tint: [194, 197, 202], gain: 0.9 });
      FX.onFrame = on;
      tl.fromTo(cam, { scale: 1.07 }, { scale: 1.0, duration: 7.45, ease: "none", immediateRender: false }, t0);
      tl.fromTo($("s5-f"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, t0 + 0.25);
      rise(W("s5-t1")[0], T(1886.47), { dur: 0.7, y: 30 });   // "Fairchild"
      rise(W("s5-t2")[0], T(1887.19), { dur: 0.5, y: 20 });   // "Semiconductor(s)"
      // "a major company": the fab, 1958 and 1960
      tl.fromTo($("s5-a"), { y: 560, rotation: -12 }, { y: 0, rotation: -3, duration: 1.0, ease: C(E.out, 1.0), immediateRender: true }, S(1888.13));
      tl.fromTo($("s5-b"), { y: 560, rotation: 12 }, { y: 0, rotation: 2.5, duration: 1.0, ease: C(E.out, 1.0), immediateRender: true }, S(1888.60));
      // "all the way through the 1900s": a long time line runs on across the frame (no years — none are given)
      const g = el(mk, "g", { stroke: ASHL, "stroke-linecap": "round", fill: "none" });
      const line = el(g, "path", { d: "M96 962 L1824 964", "stroke-width": 5 });
      const L = 1728; line.setAttribute("stroke-dasharray", L + " " + L); gsap.set(line, { attr: { "stroke-dashoffset": L } });
      tl.to(line, { attr: { "stroke-dashoffset": 0 }, duration: 1.5, ease: C("power1.inOut", 1.5) }, S(1890.45));
      for (let i = 0; i <= 12; i++) { const x = 96 + i * 144, tk = el(g, "path", { d: "M" + x + " 948 L" + x + " 978", "stroke-width": 4 }); gsap.set(tk, { opacity: 0 });
        tl.set(tk, { opacity: 1 }, S(1890.45) + 0.15 + (i / 12) * 1.25); }
    })();

    // ================= s6 · sold, for like two billion dollars =================
    (function () {
      const cam = $("s6-cam"), t0 = S(1892.90);
      const ch = FX.roughDefs(defs, SEG + "-ch6", { scale: 4 });
      gsap.set($("s6-num"), { display: "block" });
      tl.fromTo(cam, { y: 150, scale: 1.08 }, { y: 130, scale: 1.12, duration: 3.8, ease: "none", immediateRender: false }, t0 - 0.45);
      // "sold": the stamp
      tl.fromTo($("s6-sold"), { opacity: 0, scale: 1.4 }, { opacity: 0.92, scale: 1, duration: 0.1, ease: "power2.in", immediateRender: true }, T(1893.91));
      FX.chokeSettle(tl, ch, $("s6-sw"), T(1893.91), 3, 0.12);
      tl.fromTo($("s6-card"), { y: 0 }, { y: 7, duration: 1 / 12, yoyo: true, repeat: 1, ease: "none", immediateRender: false }, S(1893.99));
      // the camera drops to make room, the number lands on "two billion"
      tl.to(cam, { y: 0, scale: 1.0, duration: 0.9, ease: C(E.inOut, 0.9) }, S(1896.30));
      const ws = W("s6-num");
      rise(ws[0], T(1897.19), { dur: 0.17, y: 20 });   // "two"
      rise(ws[1], T(1897.35), { dur: 0.17, y: 20 });   // "billion"
      tl.to($("s6-hl"), { scaleX: 1, duration: 0.25, ease: C("power1.inOut", 0.25) }, S(1897.25));
    })();

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
