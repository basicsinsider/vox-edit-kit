<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); color: var(--ink); }
    #s03-cam { position: absolute; inset: 0; }
    /* scene A: the year roll + the equation */
    #s03-kicker { position: absolute; left: 0; top: 300px; width: 1920px; text-align: center; font-size: 26px; color: var(--ink-soft); }
    #s03-year { position: absolute; left: 0; top: 350px; width: 1920px; text-align: center; font-size: 300px; color: var(--ink); line-height: 1; }
    #s03-year .reel { height: 300px; }
    #s03-year .reel-strip > span { height: 300px; line-height: 300px; }
    #s03-ago { position: absolute; left: 0; top: 690px; width: 1920px; text-align: center; font-size: 56px; color: var(--ink); }
    #s03-eq { position: absolute; left: 0; top: 390px; width: 1920px; height: 260px; }
    #s03-eq .lab { position: absolute; left: 0; top: -70px; width: 1920px; text-align: center; font-size: 26px; color: var(--ink-soft); }
    #s03-west, #s03-east, #s03-op { position: absolute; top: 40px; font-size: 190px; line-height: 1; }
    #s03-west { right: 1050px; color: var(--vermilion); transform-origin: 100% 60%; }
    #s03-east { left: 1050px; color: var(--navy); transform-origin: 0% 60%; }
    #s03-op { left: 900px; width: 120px; text-align: center; color: var(--ink); transform-origin: 50% 58%; }
    /* scene B: 90% isotype */
    #s03-b { position: absolute; inset: 0; }
    #s03-grid { position: absolute; left: 230px; top: 280px; width: 500px; height: 500px; }
    .s03-sq { position: absolute; width: 42px; height: 42px; background: var(--navy); }
    .s03-sq.w { background: var(--vermilion); }
    #s03-gridlab { position: absolute; left: 230px; top: 230px; font-size: 22px; color: var(--ink-soft); }
    #s03-legend { position: absolute; left: 230px; top: 800px; font-size: 22px; color: var(--ink); }
    #s03-legend i { display: inline-block; width: 18px; height: 18px; vertical-align: -2px; margin-right: 10px; }
    #s03-box { position: absolute; left: 850px; top: 266px; font-size: 220px; }
    #s03-of { position: absolute; left: 858px; top: 540px; font-size: 80px; color: var(--ink); }
    #s03-out { position: absolute; left: 858px; top: 640px; font-size: 66px; color: var(--ink); }
    #s03-sky { position: absolute; left: -80px; bottom: -150px; width: 2080px; mix-blend-mode: multiply; opacity: 0.9; }
    #s03-src { position: absolute; right: 96px; top: 60px; font-size: 18px; color: var(--ink-soft); }
  </style>
  <div id="root" data-composition-id="s03" data-width="1920" data-height="1080">
    <div class="paper-ground"></div>
    <div id="s03-cam">
      <div id="s03-a">
        <div id="s03-kicker" class="t-label">The U.S. economy</div>
        <div id="s03-year" class="t-display">2026</div>
        <div id="s03-ago" class="t-serif-i">100 years</div>
      </div>
      <div id="s03-eq">
        <div class="lab t-label">the equation</div>
        <div id="s03-west" class="t-display">WEST</div>
        <div id="s03-op" class="t-display">&gt;</div>
        <div id="s03-east" class="t-display">EAST</div>
      </div>
      <div id="s03-b">
        <img id="s03-sky" src="assets/archival/cutouts/nyc_skyline_1921_halftone.png" alt="" />
        <div id="s03-gridlab" class="t-label">Share of U.S. GDP · 1 square = 1%</div>
        <div id="s03-grid"></div>
        <div id="s03-legend" class="t-label"><i style="background:var(--navy)"></i>East &nbsp;&nbsp; <i style="background:var(--vermilion)"></i>West</div>
        <div id="s03-box"><span id="s03-pct" class="label-box">0%</span></div>
        <div id="s03-of" class="t-serif"><span>of </span><span>the </span><span>US </span><span>GDP</span></div>
        <div id="s03-out" class="t-serif-i"><span>was </span><span>happening </span><span>out </span><span>in </span><span>the </span><span class="hl" id="s03-hl" style="--hl:0">East</span></div>
      </div>
    </div>
    <div class="paper-tex" style="background-image:url('assets/textures/paper_cream_01.jpg')"></div>
    <div class="folds"></div>
    <div id="s03-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_02_norm.jpg'); opacity:0.28"></div>
    <div id="s03-dust" class="tx tx-dust" style="background-image:url('assets/textures/dust_03.jpg'); opacity:0.22"></div>
    <div class="vignette" style="opacity:0.45"></div>
    <audio id="s03-vo" src="vo10.mp3" data-start="0" data-duration="9.6" data-media-start="58.4" data-volume="1"></audio>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const T = (s) => +(s - 58.4).toFixed(3);
    const S = T;
    const $ = (id) => document.getElementById(id);
    FX.grain($("s03-grain"), 41);
    FX.dust($("s03-dust"), 43, 2);

    // ---- scene A: 2026 rolls back to 1926 on "100 years" ----
    tl.fromTo("#s03-kicker, #s03-year", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);
    // year as a reel on the hundreds digit: 0 -> 9 (2026 -> 1926), the 2 rolls to 1
    const year = $("s03-year");
    year.innerHTML = '<span class="reel"><span class="reel-strip" id="s03-r1"><span>2</span><span>1</span></span></span>'
      + '<span class="reel"><span class="reel-strip" id="s03-r2"><span>0</span><span>9</span></span></span>'
      + '<span>26</span>';
    tl.fromTo("#s03-r1, #s03-r2", { y: 0 }, { y: -300, duration: 0.5, ease: FX.choppy("power3.inOut", 0.5, 12), immediateRender: true }, T(59.63));
    FX.text.rise(tl, [$("s03-ago")], T(59.63), { dur: 0.45, y: 12, blur: 6 });
    tl.to("#s03-a", { y: -60, opacity: 0, duration: 0.35, ease: "power2.in" }, S(61.0));

    // ---- the equation: WEST > EAST, flips on "flipped" ----
    tl.fromTo("#s03-eq .lab", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(61.23));
    tl.fromTo("#s03-west, #s03-op, #s03-east", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08, ease: FX.choppy("back.out(2)", 0.35, 12), immediateRender: true }, S(61.3));
    tl.to("#s03-op", { rotation: 180, duration: 0.42, ease: FX.choppy("back.inOut(1.6)", 0.42, 12) }, S(63.15));
    tl.to("#s03-west", { scale: 0.62, opacity: 0.55, duration: 0.42, ease: FX.choppy("power3.inOut", 0.42, 12) }, S(63.15));
    tl.to("#s03-east", { scale: 1.22, duration: 0.42, ease: FX.choppy("power3.inOut", 0.42, 12) }, S(63.15));
    tl.to("#s03-eq", { y: -50, opacity: 0, duration: 0.3, ease: "power2.in" }, S(63.8));

    // ---- scene B: 90% isotype grid ----
    const grid = $("s03-grid");
    const sq = [];
    for (let c = 0; c < 10; c++) for (let r = 0; r < 10; r++) {
      const d = document.createElement("div");
      d.className = "s03-sq" + (c * 10 + r >= 90 ? " w" : "");
      d.style.left = c * 50 + "px"; d.style.top = (9 - r) * 50 + "px";
      grid.appendChild(d); sq.push(d);
    }
    tl.fromTo("#s03-gridlab, #s03-legend", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: true }, S(64.2));
    // squares fill at 12 fps in steps of 6–7 (whole columns of East first, then the West sliver)
    sq.forEach((d, i) => tl.fromTo(d, { scale: 0 }, { scale: 1, duration: 0.001, immediateRender: true }, S(64.15) + Math.floor(i / 7) / 12));
    tl.fromTo("#s03-box", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(64.11));
    FX.text.count(tl, $("s03-pct"), T(64.11), 0, 90, 1.1, (v) => Math.round(v) + "%");
    const ofW = $("s03-of").children, ofT = [T(64.83), T(64.91), T(65.07), T(65.47)];
    [...ofW].forEach((w, i) => tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, ofT[i]));
    const outW = $("s03-out").children, outT = [T(66.11), T(66.35), T(66.83), T(67.07), T(67.23), T(67.39)];
    [...outW].forEach((w, i) => tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, outT[i]));
    // yellow highlighter swipes across "East" exactly on the word (12 fps)
    tl.fromTo("#s03-hl", { "--hl": 0 }, { "--hl": 1, duration: 0.33, ease: FX.choppy("power2.out", 0.33, 12), immediateRender: true }, T(67.39));
    // the 1921 New York skyline rises behind (halftone print)
    tl.fromTo("#s03-sky", { y: 260 }, { y: 0, duration: 1.4, ease: FX.choppy("power3.out", 1.4, 12), immediateRender: true }, S(64.6));
    // slow camera push across the whole page
    tl.fromTo("#s03-cam", { scale: 1, transformOrigin: "50% 45%" }, { scale: 1.04, duration: 9.6, ease: "none" }, 0);

    FX.mount(tl, 9.6);
    window.__timelines["s03"] = tl;
  })();
  </script>
</template>
</body>
</html>
