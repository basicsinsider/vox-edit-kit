      rise($("nt1"), T(5382.96));                // theory

    })();

    // --- zone B: the market diagram
    const g = mk(dsvg, "g", {});
    // big company (copper building)
    const big = mk(g, "g", {}), bigIn = mk(big, "g", {});
    mk(bigIn, "rect", { x: B(200), y: 250, width: 300, height: 320, fill: COP });

    // the product (copper box) + the share ring for "dominant"
    const prod = mk(g, "g", {});
    mk(prod, "rect", { x: B(600), y: 320, width: 170, height: 170, rx: 14, fill: COP, stroke: COPD, "stroke-width": 8 });
    mk(prod, "path", { d: "M" + B(640) + " 360 L" + B(730) + " 360 L" + B(730) + " 450 L" + B(640) + " 450 Z", fill: COPL });
    const ring = mk(g, "circle", { cx: B(685), cy: 405, r: 140, fill: "none", stroke: COPD, "stroke-width": 16, "stroke-linecap": "round", transform: "rotate(-90 " + B(685) + " 405)" });
    // big customers (three large figures)
    const person = (parent, x, y, s, fill) => { const p = mk(parent, "g", {}); mk(p, "circle", { cx: x, cy: y - 92 * s, r: 34 * s, fill: fill });
      mk(p, "path", { d: "M" + (x - 58 * s) + " " + y + " Q" + (x - 58 * s) + " " + (y - 54 * s) + " " + x + " " + (y - 54 * s) + " Q" + (x + 58 * s) + " " + (y - 54 * s) + " " + (x + 58 * s) + " " + y + " Z", fill: fill }); return p; };
    const cust = [person(g, B(1480), 470, 1.25, INK), person(g, B(1620), 470, 1.25, INK), person(g, B(1760), 470, 1.25, INK)];
    // the money panel: big fat margins / revenue / profit
    const barM = mk(g, "rect", { x: B(600), y: 656, width: 300, height: 60, fill: COP });
    const barR = mk(g, "rect", { x: B(600), y: 768, width: 260, height: 34, fill: COPD });
    const barP = mk(g, "rect", { x: B(600), y: 868, width: 200, height: 34, fill: COPD });
    // the new player (magenta, small) + its small product
    const nw = mk(g, "g", {}), nwIn = mk(nw, "g", {});
    mk(nwIn, "rect", { x: B(1020), y: 790, width: 110, height: 110, fill: MAG });
    mk(nwIn, "rect", { x: B(1020), y: 778, width: 110, height: 14, fill: MAGD });
    for (let c = 0; c < 2; c++) for (let r = 0; r < 2; r++) mk(nwIn, "rect", { x: B(1040 + c * 46), y: 808 + r * 40, width: 24, height: 24, fill: MAGL });
    mk(nwIn, "rect", { x: B(1160), y: 832, width: 68, height: 68, rx: 8, fill: MAG, stroke: MAGD, "stroke-width": 6 });
    // quality meters: the big company's product vs the new one
    const mtr = mk(g, "g", {});
    mk(mtr, "rect", { x: B(1480), y: 680, width: 70, height: 280, fill: "none", stroke: INK, "stroke-width": 5 });
    mk(mtr, "rect", { x: B(1620), y: 680, width: 70, height: 280, fill: "none", stroke: INK, "stroke-width": 5 });
    const mBig = mk(mtr, "rect", { x: B(1486), y: 706, width: 58, height: 248, fill: COP });
    const mNew = mk(mtr, "rect", { x: B(1626), y: 836, width: 58, height: 118, fill: MAG });

    // initial (hidden) states
    gsap.set([big, prod, ring, mtr, nw].concat(cust), { opacity: 0 });
    gsap.set([barM, barR, barP], { scaleX: 0, transformOrigin: "0% 50%" });
    const L = 2 * Math.PI * 140; ring.setAttribute("stroke-dasharray", L + " " + L); gsap.set(ring, { attr: { "stroke-dashoffset": L } });

    // "usually there's a big company in an industry that's very successful"
    tl.to(big, { opacity: 1, duration: 0.001 }, S(5388.3));
    tl.fromTo(bigIn, { y: 40 }, { y: 0, duration: 0.6, ease: C(E.out, 0.6), immediateRender: false }, S(5388.3));
    rise($("bg1"), T(5388.32));                // big
    rise($("bg2"), T(5388.48));                // company
    // "has a successful product that's dominant in that industry"
    tl.to(prod, { opacity: 1, duration: 0.001 }, S(5391.5));
    tl.fromTo(prod, { scale: 0.5, svgOrigin: B(685) + " 405" }, { scale: 1, duration: 0.45, ease: C(E.out, 0.45), immediateRender: false }, S(5391.5));
    rise($("pr1"), T(5391.52));                // product
    tl.to(ring, { opacity: 1, duration: 0.001 }, S(5392.2));
    tl.to(ring, { attr: { "stroke-dashoffset": L * 0.18 }, duration: 0.9, ease: C(E.out, 0.9) }, S(5392.2));
    rise($("dm1"), T(5392.16));                // dominant
    // "all the big customers want this product"
    cust.forEach((c, i) => { tl.to(c, { opacity: 1, duration: 0.001 }, S(5394.6) + i * 0.08); tl.fromTo(c, { y: 30 }, { y: 0, duration: 0.45, ease: C(E.out, 0.45), immediateRender: false }, S(5394.6) + i * 0.08); });
    rise($("cu1"), T(5394.56));                // big
    rise($("cu2"), T(5394.80));                // customers
    const want = [];
    [[B(1430), 340], [B(1430), 400], [B(1430), 460]].forEach((p, i) => {
      const a = FX.markup.pen(tl, dsvg, S(5395.55) + i * 0.1, { points: [[p[0], p[1]], [B(1100), 360 + i * 30], [B(800), 380 + i * 25]], color: INK, width: 7, dur: 0.6, filter: pen, seed: 20 + i });
      gsap.set(a, { opacity: 0 }); tl.set(a, { opacity: 0.85 }, S(5395.55) + i * 0.1); want.push(a);
    });
    // "big fat margins … revenue and profit"
    rise($("mg1"), T(5397.04)); rise($("mg2"), T(5397.28)); rise($("mg3"), T(5397.52));
    tl.to(barM, { scaleX: 1, duration: 0.6, ease: C(E.out, 0.6) }, S(5397.35));
    rise($("rv1"), T(5398.96));
    tl.to(barR, { scaleX: 1, duration: 0.6, ease: C(E.out, 0.6) }, S(5399.0));
    rise($("pf1"), T(5399.52));
    tl.to(barP, { scaleX: 1, duration: 0.6, ease: C(E.out, 0.6) }, S(5399.55));

    // "there's usually a disruptive product that comes to market"

    tl.fromTo(nwIn, { x: 260 }, { x: 0, duration: 0.8, ease: C(E.out, 0.8), immediateRender: false }, S(5403.95));

    const rc = mk(dsvg, "clipPath", { id: SEG + "-rc" }), rcr = mk(rc, "rect", { x: B(1240), y: 500, width: 300, height: 0 });

    const xb = FX.markup.pen(tl, dsvg, S(5423.4), { points: [[B(1398), 628], [B(1334), 688]], color: INK, width: 9, dur: 0.18, filter: pen, seed: 33 });
    gsap.set([xa, xb], { opacity: 0 }); tl.set(xa, { opacity: 1 }, S(5423.15)); tl.set(xb, { opacity: 1 }, S(5423.4));

    whip("desk", "chart", S(W2), 1, 2);

    /* ===== chart · the theory as a line chart ===== */
    (function () {
      const s = $("csvg"), a = S(W2);
      tl.fromTo($("c5"), { scale: 1.0 }, { scale: 1.06, duration: S(W3) - a, ease: "sine.inOut", immediateRender: false }, a);
      // axes draw in as the shot lands
      drawLine(mk(s, "path", { d: "M240 140 L240.5 900", stroke: ASHL, "stroke-width": 4, fill: "none" }), a, 0.6);
      drawLine(mk(s, "path", { d: "M240 900 L1700 900.5", stroke: ASHL, "stroke-width": 4, fill: "none" }), a + 0.1, 0.8);
      tl.fromTo([$("perf"), $("time")], { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: true }, a + 0.3);
      // the big company: high, gently rising (copper)
      const bigL = mk(s, "path", { d: "M260 390 C700 360 1200 300 1660 250", fill: "none", stroke: COP, "stroke-width": 10, "stroke-linecap": "round" });
      drawLine(bigL, a + 0.2, 1.4);
      rise($("lb1"), T(5430.69)); rise($("lb2"), T(5430.93));   // the big company
      // the new product: starts at the bottom (magenta)
      rise($("ln1"), T(5428.29)); rise($("ln2"), T(5428.45));   // new product
      const nl = mk(s, "path", { d: "M260 850 C500 846 650 836 760 822 C900 800 1000 760 1100 700 C1250 610 1350 520 1450 430 C1530 360 1600 320 1660 300", fill: "none", stroke: MAG, "stroke-width": 12, "stroke-linecap": "round" });
      const NL = nl.getTotalLength(); nl.setAttribute("stroke-dasharray", NL + " " + NL);
      gsap.set(nl, { attr: { "stroke-dashoffset": NL }, opacity: 0 });
      tl.set(nl, { opacity: 1 }, S(5428.4));
      // first leg: "starts selling to all these customers that the big company just didn't care about"; then "slowly … improving at such a rate"

      tl.to(nl, { attr: { "stroke-dashoffset": 0 }, duration: S(5443.2) - S(5434.9), ease: C("sine.in", S(5443.2) - S(5434.9)) }, S(5434.9));

        tl.to(d, { attr: { fill: MAGL }, duration: 0.2 }, S(5430.4) + i * 0.12);
      });
      // the line's head dot follows the draw (sampled at build time)
      const pts = []; for (let i = 0; i <= 120; i++) { const q = nl.getPointAtLength(NL * i / 120); pts.push([q.x, q.y]); }
      const prog = { p: 0 };
      const putH = () => { const q = pts[Math.min(120, Math.max(0, Math.round(prog.p * 120)))]; head.setAttribute("cx", q[0].toFixed(1)); head.setAttribute("cy", q[1].toFixed(1)); };
      putH(); gsap.set(head, { opacity: 0 }); tl.set(head, { opacity: 1 }, S(5428.4));
      tl.fromTo(prog, { p: 0 }, { p: 0.32, duration: 2.6, ease: C("sine.out", 2.6), immediateRender: false, onUpdate: putH }, S(5428.4));
      tl.fromTo(prog, { p: 0.32 }, { p: 1, duration: S(5443.2) - S(5434.9), ease: C("sine.in", S(5443.2) - S(5434.9)), immediateRender: false, onUpdate: putH }, S(5434.9));
      // "… so much better than even what the biggest customers want": the demand line (dashed) and its label word by word
      const dl = mk(s, "path", { d: "M260 590 C700 575 1200 545 1660 520", fill: "none", stroke: BONE, "stroke-width": 6, "stroke-dasharray": "14 14", "stroke-linecap": "round" });
      const dc = mk(s, "clipPath", { id: SEG + "-dc" }), dcr = mk(dc, "rect", { x: 200, y: 400, width: 0, height: 300 });
      dl.setAttribute("clip-path", "url(#" + SEG + "-dc)");
      tl.fromTo(dcr, { attr: { width: 0 } }, { attr: { width: 1520 }, duration: 0.9, ease: C(E.inOut, 0.9), immediateRender: true }, S(5441.4));
      rise($("lw1"), T(5442.29)); rise($("lw2"), T(5442.45)); rise($("lw3"), T(5442.53)); rise($("lw4"), T(5442.85)); rise($("lw5"), T(5443.33));
      // crossing point flash (the new product passes the demand line ≈ 5442.4)
      const cx = mk(s, "circle", { cx: 1395, cy: 534, r: 12, fill: "none", stroke: MAGL, "stroke-width": 8, opacity: 0 });
      tl.fromTo(cx, { attr: { r: 12, opacity: 1 } }, { attr: { r: 110, opacity: 0 }, duration: 0.7, ease: C(E.out, 0.7), immediateRender: false }, S(5442.5));
      // "a lot cheaper. Fifty percent, eighty percent cheaper" — the key number (lemon)
      rise($("ch1"), T(5445.94));
      rise($("pc1"), T(5446.58), { dur: 0.4, y: 20 });
      rise($("pc2"), T(5447.38), { dur: 0.4, y: 20 });
    })();

    whip("chart", "desk", S(W3), -1, 3);

    // ===== back on the desk: the switch, the swap, the system, the fade =====
    // clear the earlier marks that the story has moved past
    tl.to([$("dp1"), $("dp2"), $("wo1"), mtr, rej, xa, xb, $("nw1")], { opacity: 0, duration: 0.4 }, S(5450.2));
    // "the big company customers start switching to the smaller company's product"
    want.forEach((a, i) => tl.to(a, { opacity: 0, duration: 0.3 }, S(5450.75) + i * 0.06));
    [[B(1500), 520], [B(1620), 520], [B(1740), 520]].forEach((p, i) => {
      const a = FX.markup.pen(tl, dsvg, S(5450.8) + i * 0.12, { points: [[p[0], p[1]], [B(1400 - i * 20), 660], [B(1250), 800]], color: MAGD, width: 7, dur: 0.7, filter: pen, seed: 40 + i });
      gsap.set(a, { opacity: 0 }); tl.set(a, { opacity: 0.9 }, S(5450.8) + i * 0.12);
      tl.to(a, { opacity: 0, duration: 0.4 }, S(5454.2));
    });
    cust.forEach((c, i) => tl.to(c, { x: -40, duration: 0.6, ease: C(E.out, 0.6) }, S(5450.85) + i * 0.08));
    // "and the smaller company becomes the big company"
    tl.fromTo(nw, { scale: 1, svgOrigin: B(1020) + " 900" }, { scale: 2.6, duration: 1.0, ease: C(E.out, 1.0), immediateRender: false }, S(5453.36));
    // "the big company that was big before cannot really compete": the money panel gives way to the company's system
    tl.to([barM, barR, barP, $("mg1"), $("mg2"), $("mg3"), $("rv1"), $("pf1"), ring, $("dm1")], { opacity: 0, duration: 0.4 }, S(5456.8));
    // "because their whole system is built on having bigger margins, salespeople getting paid a lot, customers, engineers, research departments"
    [[$("ti0"), T(5459.30)], [$("ti1"), T(5460.18)], [$("ti2"), T(5462.10)], [$("ti3"), T(5462.82)], [$("ti4"), T(5463.62)]].forEach((x) => pop(x[0], x[1], 0.3));
    // "everything is built to keep pushing this expensive product"
    const push = [];
    [[B(260), 640], [B(560), 640]].forEach((p, i) => {
      const a = FX.markup.pen(tl, dsvg, S(5466.1) + i * 0.15, { points: [[p[0], p[1] - 6], [p[0] + 120, 560], [B(640 + i * 60), 500]], color: COPD, width: 9, dur: 0.6, filter: pen, seed: 50 + i });
      gsap.set(a, { opacity: 0 }); tl.set(a, { opacity: 1 }, S(5466.1) + i * 0.15); push.push(a);
    });
    rise($("ex1"), T(5466.90));                // expensive (product)
    tl.to(prod, { scale: 1.08, svgOrigin: B(685) + " 405", duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, S(5466.4));
    // "so they slowly basically disappear": the whole copper side fades to a ghost
    const gone = [big, prod, $("bg1"), $("bg2"), $("pr1"), $("ex1"), $("ti0"), $("ti1"), $("ti2"), $("ti3"), $("ti4")].concat(push);
    tl.to(gone, { opacity: 0.12, duration: 0.8, ease: C("sine.inOut", 0.8) }, S(5468.3));

    FX.grain($("grain"), 3); FX.dust($("dust"), 5, 2);
    FX.mount(tl, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
