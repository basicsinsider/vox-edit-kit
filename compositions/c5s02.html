      const ne = add(c, `<img src="${D2}neasia_beige.jpg" style="position:absolute;left:${(230 * k).toFixed(1)}px;top:${(18 * k).toFixed(1)}px;width:${(45 * k).toFixed(1)}px;height:${(25 * k).toFixed(1)}px;opacity:0;filter:sepia(0.45) saturate(0.5) brightness(1.04) contrast(0.92)"/>`);
      add(c, `<div class="k-abs" style="left:0;top:0;width:${MW}px;height:${MH}px;background:url('${TX}paper_stained_01_hires.jpg') 0 0 / 1920px auto;mix-blend-mode:multiply;opacity:0.4"></div>`);
      const svg = add(c, `<svg class="k-mk" viewBox="0 0 ${MW} ${MH}" style="width:${MW}px;height:${MH}px"></svg>`);
      svg.innerHTML = `<path id="${SEG}-ussr" d="${PATHS.world.ussr}" fill="url(#${SEG}-hatch-red)" stroke="${RED}" stroke-width="3" opacity="0"/>
        <path id="${SEG}-cn" d="${PATHS.world.china}" fill="${RED}" fill-opacity="0.6" stroke="${RED}" stroke-width="3" filter="url(#${SEG}-wc)" opacity="0"/>`;
      const [ux, uy] = P(-95, 40);
      const nix = circ(c, PH + "nixon_official_portrait_nara530679.jpg", ux - 190, uy, 330, INK, "left:-40px;top:-20px;width:410px;height:485px;object-fit:cover;filter:grayscale(1) contrast(1.05)");
      const kis = circ(c, PH + "kissinger_portrait_1973_official.jpg", ux + 190, uy, 330, INK, "left:-50px;top:-10px;width:430px;height:529px;object-fit:cover;filter:grayscale(1) contrast(1.08)");
      const kl = txt(c, "t-label k-ink", `left:${ux + 30}px;top:${uy + 190}px;width:320px;text-align:center;font-size:56px`, "Kissinger");

      gsap.set(c, v0);
      pop(nix, S(361.70), 0.8);
      pop(kis, T(363.12), 0.8); say(kl, [T(363.12)], { dur: 0.6 });
      cam(c, S(363.9), v1, 2.6);
      tl.fromTo(document.getElementById(SEG + "-ussr"), { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(364.62));
      // leader-line labels in screen space (positions from the camera's resting state)
      const scr = (lon, lat, v) => { const [x, y] = P(lon, lat); return [x * v.scale + v.x, y * v.scale + v.y]; };
      const lab = (lon, lat, v, dx, dy, text, size, t0, cues, id) => {
        const [x, y] = scr(lon, lat, v);
        const svgL = add(sh, `<svg class="k-mk" viewBox="0 0 1920 1080"></svg>`);
        const ln = ink(svgL, `M${x.toFixed(0)} ${y.toFixed(0)} L${(x + dx * 0.5).toFixed(0)} ${(y + dy * 0.9).toFixed(0)} L${(x + dx).toFixed(0)} ${(y + dy).toFixed(0)}`, t0, 0.5, { color: INK, width: 3 });
        const b = txt(sh, "t-label k-ink", `left:${(x + dx + (dx > 0 ? 10 : -10)).toFixed(0)}px;top:${(y + dy - size * 0.6).toFixed(0)}px;font-size:${size}px;white-space:nowrap;${dx < 0 ? "transform:translateX(-100%)" : ""}`, text);
        say(b, cues, { dur: 0.6, y: 6 }); return [svgL, b];
      };
      const su = lab(95, 62, v1, 160, -150, "Soviet Union", 40, S(364.60), [T(364.64), T(364.96)]);
      const be = txt(sh, "t-serif-i k-ink", "left:0;top:110px;width:1920px;text-align:center;font-size:80px", "big evil empire");
      say(be, [T(367.13), T(367.37), T(367.77)], { dur: 0.6, y: 8 });
      // C5S079 (continuous): China fills red; zoom to the Sino-Soviet border, rings at the clash point
      tl.fromTo(document.getElementById(SEG + "-cn"), { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.7, ease: C(E.out, 0.7), immediateRender: true }, S(370.97));
      const cnl = lab(100, 33, v1, -170, 150, "China", 40, S(370.95), [T(370.97)]);
      tl.to([be, su[0], su[1]], { opacity: 0, duration: 0.4 }, S(368.70));
      const nf = txt(sh, "t-serif-i k-ink", "left:140px;top:110px;font-size:76px", "not too friendly");
      say(nf, [T(371.93), T(372.09), T(372.25)], { dur: 0.6, y: 8 });
      tl.to([cnl[0], cnl[1]], { opacity: 0, duration: 0.3 }, S(372.6));
      const z = P(134.0, 46.5), vz = look(z[0], z[1], 2.0, 1080, 560);
      cam(c, S(372.70), vz, 1.5);
      tl.to(ne, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, S(373.0));
      FX.focusHunt(tl, c, S(374.20), { dur: 0.8 });
      tl.to(c, { scale: 2.06, x: 1080 - z[0] * 2.06, y: 560 - z[1] * 2.06, duration: 2.2, ease: "none" }, S(374.2));
      const rg = add(c, `<svg class="k-mk" viewBox="0 0 ${MW} ${MH}" style="width:${MW}px;height:${MH}px"></svg>`);
      gated(375.2, 376.5, () => FX.radioWaves(rg, z[0], z[1], { rings: 3, max: 120, period: 1.1, width: 5, color: INK, from: S(375.29), to: S(376.5) }));
      add(c, `<div class="k-abs" style="left:${z[0] - 9}px;top:${z[1] - 9}px;width:18px;height:18px;border-radius:50%;background:${INK}"></div>`);
      const fw = add(sh, `<div class="k-abs t-label" style="left:1180px;top:620px;font-size:40px"><span class="k-inkbox"><span class="k-w">fought </span><span class="k-w">a </span><span class="k-w">war</span></span></div>`);
      fw.w = fw.querySelectorAll(".k-w"); say(fw, [T(375.29), T(375.69), T(375.85)], { dur: 0.45, y: 6 });
      credit(sh, "Relief: AWS Terrain Tiles / Natural Earth (public domain)", true);
    })();
    whip(shot("sc078"), shot("sc080"), S(376.39), { dir: 1, vertical: true });

    /* =================== C5S080 · 376.39–382.63 · what will later become known as the Kissinger diplomacy =================== */
    scene("sc080", 376.39, 382.63);
    ground("night", S(376.39));
    (function () {
      const sh = shot("sc080");
      const c = add(sh, `<div class="k-full" style="transform-origin:60% 55%"></div>`);
      add(c, `<img src="${D2}eob_office_crop.jpg" style="position:absolute;left:0;top:0;width:1920px;height:1080px;filter:url(#${SEG}-tint-night) brightness(0.62) contrast(1.12)"/>`);
      const cv = add(sh, `<canvas class="streaks" style="opacity:0.45"></canvas>`);
      gated(376.39, 382.7, () => FX.streaks(cv, { seed: 80, speed: 0.45, tint: [255, 206, 158], lo: 0.42, gain: 1.0 }));
      add(sh, `<div class="k-full" style="background:radial-gradient(ellipse 60% 40% at 50% 42%, rgba(10,12,15,0.55), rgba(10,12,15,0) 80%)"></div>`);
      const t1 = txt(sh, "t-display halate", "left:0;top:300px;width:1920px;text-align:center;font-size:120px", "the Kissinger");
      const t2 = txt(sh, "t-display halate", "left:0;top:430px;width:1920px;text-align:center;font-size:120px", "diplomacy");
      const blurIn = (el, t, d) => tl.fromTo(el, { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: C(E.out, d), immediateRender: true }, t);
      blurIn(t1.w[0], T(380.81), 0.6); blurIn(t1.w[1], T(380.97), 0.8); blurIn(t2.w[0], T(381.85), 0.6);
      camFrom(c, S(376.39), { scale: 1.0 }, { scale: 1.07 }, 6.24, "none");
      tl.to(c, { scale: 1.12, duration: 0.45, ease: E.in }, S(382.18));
      credit(sh, "Nixon and Kissinger, 11 Nov 1971 · White House Photo Office (public domain)");
    })();

    /* =================== C5S081–082 · 382.63–396.31 · peel China away from the Soviet Union … upper hand in the Cold War =================== */
    scene("sc081", 382.63, 396.41);
    ground("paper", S(382.63));
    (function () {
      const sh = shot("sc081");
      papers(sh, "paper_graph_01", "paper_torn_01");
      const c = add(sh, `<div class="k-full" style="transform-origin:50% 55%"></div>`);
      const grp = add(c, `<div class="k-full" style="transform-origin:960px 900px"></div>`);
      const beam = add(grp, `<div class="k-abs" style="left:260px;top:880px;width:1400px;height:14px;background:${INK};opacity:0"></div>`);
      const ful = add(c, `<svg class="k-abs" viewBox="0 0 160 120" style="left:880px;top:894px;width:160px;height:120px;opacity:0"><path d="M80 0 L150 115 L10 115 Z" fill="${INK}"/></svg>`);
      const ring = (x, y, color, inner, id) => add(grp, `<div class="k-abs" id="${SEG}-${id}" style="left:${x - 130}px;top:${y - 130}px;width:260px;height:260px;opacity:0"><div class="k-circ" style="left:0;top:0;width:260px;height:260px;border:8px solid ${color}">${inner}</div></div>`);
      const US = ring(470, 560, NAVY, `<div style="position:absolute;left:-60px;top:20px;width:380px;height:200px">${flag("us", 380, 200)}</div>`, "c-us");
      const SU = ring(1380, 400, RED, `<svg viewBox="0 0 260 260" style="position:absolute;left:0;top:0;width:260px;height:260px"><rect width="260" height="260" fill="url(#${SEG}-hatch-red)"/></svg>`, "c-su");
      const CN = ring(1450, 620, RED, `<div style="position:absolute;left:-20px;top:-10px;width:300px;height:280px">${flag("cn", 300, 200)}</div><div class="k-abs" style="left:-20px;top:190px;width:300px;height:90px;background:${RED};opacity:0.8"></div>`, "c-cn");
      const lab = (el, text, cues, size) => { const b = txt(el, "t-label k-ink", `left:-70px;top:274px;width:400px;text-align:center;font-size:${size || 28}px`, text); say(b, cues, { dur: 0.5, y: 6 }); return b; };
      tl.fromTo([SU, CN], { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, stagger: 0.08, ease: C(E.out, 0.7), immediateRender: true }, S(382.70));
      tl.fromTo(US, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: C(E.out, 0.7), immediateRender: true }, S(382.95));
      const pe = add(c, `<div class="k-abs t-label" style="left:880px;top:150px;font-size:44px"><span class="k-inkbox"><span class="k-w">peel</span></span></div>`);
      pe.w = pe.querySelectorAll(".k-w"); say(pe, [T(383.53)], { dur: 0.5 });
      tl.to(CN, { rotation: -14, skewX: -6, y: 40, duration: 0.35, ease: C(E.in, 0.35) }, S(383.60));
      tl.to(CN, { rotation: 0, skewX: 0, x: 120, y: 230, duration: 1.0, ease: C(E.inOut, 1.0) }, S(383.95));
      lab(CN, "China", [T(384.01)]);
      lab(SU, "Soviet Union", [T(384.97), T(385.37)]);
      const wk = add(c, `<div class="k-abs t-label" style="left:1590px;top:250px;font-size:40px"><span class="k-inkbox"><span class="k-w">weaken</span></span></div>`);
      wk.w = wk.querySelectorAll(".k-w"); say(wk, [T(385.85)], { dur: 0.5 });
      tl.to(SU.firstElementChild, { scale: 0.72, duration: 1.0, ease: C(E.inOut, 1.0) }, S(385.95));
      const bc = txt(c, "t-serif-i k-ink", "left:1330px;top:1010px;font-size:58px", "big country");
      say(bc, [T(388.41), T(388.65)], { dur: 0.5, y: 8 });
      tl.to(CN.firstElementChild, { scale: 1.25, duration: 0.6, ease: C(E.out, 0.6) }, S(388.47));
      tl.to([pe, wk], { opacity: 0, duration: 0.3 }, S(388.0));
      // C5S082 (continuous): China slides to the US side; the base becomes a seesaw tipping US + China up
      tl.to(bc, { opacity: 0, duration: 0.3 }, S(389.30));
      tl.to(CN, { x: -560, y: 280, duration: 1.3, ease: C(E.inOut, 1.3) }, S(389.45));
      tl.to(CN.firstElementChild, { scale: 1.0, duration: 1.0, ease: C(E.inOut, 1.0) }, S(389.45));

      say(ee, [T(391.21), T(391.45), T(391.85)], { dur: 0.5, y: 6 });
      tl.to(grp, { rotation: -7, duration: 1.0, ease: C(E.inOut, 1.0) }, S(394.33));
      const uh = txt(c, "t-serif-i k-ink", "left:180px;top:160px;font-size:72px", "upper hand");
      say(uh, [T(394.33), T(394.57)], { dur: 0.6, y: 8 });
      const cw = txt(c, "t-display k-ink", "left:0;top:40px;width:1920px;text-align:center;font-size:90px", "Cold War");

      camFrom(c, S(382.63), { scale: 1.0 }, { scale: 1.05 }, 13.7, "none");

    })();
    whip(shot("sc081"), shot("sc083"), S(396.31), { dir: 1 });

    /* =================== C5S083 · 396.31–399.67 · So that's why US is talking with China =================== */
    scene("sc083", 396.31, SEG_END);
    ground("night", S(396.31));
    (function () {
      const sh = shot("sc083");
      const c = add(sh, `<div class="k-full" style="transform-origin:55% 40%"></div>`);

    })();

    // scenes stay out of layout outside their window (built above while still laid out — odometer/measures need layout)
    SCENES.forEach((el) => gsap.set(el, { autoAlpha: 0, display: "none" }));
    gsap.set($("sc043"), { autoAlpha: 1, display: "block" });
    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {}; window.__timelines[SEG] = tl;
  })();
  </script>
