      tl.fromTo(mo, { x: 640, y: 330 }, { x: 1250, y: 330, duration: 1.0, ease: C(E.inOut, 1.0), immediateRender: false }, S(2301.94));
      push("sc005", 2295.60, 2307.40, 1.0, 1.04, { ease: "none" });
    })();

    /* ===== sc006 · FACE W (hard cut on the 2307.28 join) ===== */
    face("sc006", 2307.28, 2313.95, "W");

    /* ===== sc007 · the debate, side one (whip ←) ===== */
    whip("sc006", "sc007", S(2313.95), { dir: -1 });
    (function () {
      const hw = $("sc007-hw"), dc = $("sc007-dc"), mk = $("sc007-mk");
      gsap.set(hw, { rotation: -4 }); gsap.set(dc, { rotation: 4 });
      tl.fromTo(hw, { x: -420, rotation: -9 }, { x: 0, rotation: -4, duration: 1.2, ease: C(E.out, 1.2), immediateRender: true }, S(2313.95));
      tl.fromTo(dc, { x: 420, rotation: 9 }, { x: 0, rotation: 4, duration: 1.2, ease: C(E.out, 1.2), immediateRender: true }, S(2314.15));
      [["sc007-fcn", 2314.05], ["sc007-fmy", 2314.25], ["sc007-hwl", 2314.45], ["sc007-hwm", 2314.45], ["sc007-myl", 2314.65]].forEach((q) => rise($(q[0]), S(q[1]), { dur: 0.7, y: 14 }));
      // data halls circled (volt) once the card lands
      const dsv = $("sc007-dcsvg");
      const c1 = FX.markup.circle(tl, dsv, S(2315.60), { cx: 288, cy: 198, rx: 130, ry: 92, rot: -8, color: VOLTL, width: 6, dur: 0.7, seed: 3 });
      gsap.set(c1, { opacity: 0 }); tl.set(c1, { opacity: 1 }, S(2315.60));
      // "de-incentivizes" — Huawei's card dims
      tl.to(hw, { filter: "brightness(0.78) saturate(0.7)", duration: 0.9, ease: C(E.inOut, 0.9) }, S(2318.80));
      // "Chinese AI companies"
      ["sc007-l1", "sc007-l2", "sc007-l3"].forEach((id, i) => pop($(id), S(2320.72) + i * 0.16, { dur: 0.45, from: 0.7 }));
      // "orders" fly to Malaysia
      const slips = $("sc007-slips");
      for (let i = 0; i < 3; i++) {
        const s = document.createElement("div"); s.className = "n23-slip"; slips.appendChild(s);
        const ic = icon("chip", INK, 40, 40); ic.style.left = "23px"; ic.style.top = "9px"; s.appendChild(ic);
        s.style.left = "920px"; s.style.top = "690px";
        gsap.set(s, { opacity: 0 });
        const t0 = S(2322.16) + i * 0.24;
        tl.set(s, { opacity: 1 }, t0);
        tl.fromTo(s, { x: 0, y: 0, rotation: 0 }, { x: 470 + i * 26, y: -50 - i * 18, rotation: 6 + i * 5, duration: 0.6, ease: C(E.inOut, 0.6), immediateRender: false }, t0);
      }
      // the Huawei route: arrow, crossed out
      const ar = FX.markup.arrow(tl, mk, S(2323.42), { x1: 840, y1: 712, x2: 760, y2: 640, bend: 30, head: 22, color: INK, width: 5, dur: 0.45 });
      ar.forEach((p) => { p.style.mixBlendMode = "multiply"; gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, S(2323.42)); });
      const cr = FX.markup.cross(tl, mk, S(2323.92), { x: 802, y: 680, s: 30, color: ICED, width: 7, dur: 0.14 });
      cr.forEach((p) => { gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, S(2323.92)); });
      // tilt down to the race on "That way Huawei"
      const vw = $("sc007-vw");
      tl.fromTo(vw, { y: 0 }, { y: -1080, duration: 0.9, ease: C(E.inOut, 0.9), immediateRender: false }, S(2324.05));
      const bh = $("sc007-bh"), bt = $("sc007-bt"), bn = $("sc007-bn");
      gsap.set([bh, bt, bn], { scaleX: 0 });
      gsap.set([$("sc007-rt"), $("sc007-rn")], { opacity: 0 });
      tl.fromTo(bh, { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: C(E.out, 1.0), immediateRender: false }, S(2324.70));
      // "never catch up": the bar stalls with a small shudder
      tl.to(bh, { x: 6, duration: 1 / 12, ease: "steps(1)", yoyo: true, repeat: 3 }, S(2325.55));
      rise($("sc007-rt"), S(2327.41), { dur: 0.5, y: 8 });
      tl.fromTo(bt, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: C(E.out, 0.9), immediateRender: false }, S(2327.45));
      rise($("sc007-rn"), S(2328.85), { dur: 0.5, y: 8 });
      tl.fromTo(bn, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: C(E.out, 0.6), immediateRender: false }, S(2328.85));
    })();

    /* ===== sc008 · map: outside China; Taiwan; the switch (light-flash whip) ===== */
    whip("sc007", "sc008", S(2330.03), { dir: 1, flash: true });
    (function () {
      const m = mapCam("sc008"), svg = $("sc008-svg"), fill = $("sc008-fill"), sw = $("sc008-sw");
      const JB = [760, 1495], TW = [1664, 560], FJ = [1506, 524];   // JB = the Malaysian data centres (Kuala Lumpur region)
      m.set({ cx: 1138, cy: 1060, s: 0.86 });
      m.move(S(2330.03), 5.5, { cx: 1138, cy: 1050, s: 0.88 }, "none");
      m.move(S(2335.60), 2.4, { cx: 1138, cy: 820, s: 0.9 });
      m.move(S(2340.20), 1.8, { cx: 1138, cy: 1050, s: 0.9 });
      m.move(S(2347.20), 2.6, { cx: 1138, cy: 1020, s: 0.845 });
      // the data centre (volt) in Johor
      const dcp = m.pin(JB[0], JB[1]);
      const dci = icon("datacenter", VOLT, 120, 96); dci.style.left = "-60px"; dci.style.top = "-112px";
      dci.style.filter = "drop-shadow(0 0 16px rgba(201,236,143,0.55))"; dcp.appendChild(dci);
      const myl = m.label(JB[0] - 300, JB[1] - 20, "MALAYSIA", 50, "t-display", BONE, { css: "letter-spacing:0.05em" });
      gsap.set(myl, { opacity: 0 });
      // access lines DC → China
      const TG = [[1000, 600], [1323, 613], [1250, 470]], lines = [];
      TG.forEach((q, i) => {
        const p = el(svg, "path", { d: "M" + JB[0] + " " + (JB[1] - 60) + " Q" + ((JB[0] + q[0]) / 2 + 160 - i * 120) + " " + ((JB[1] + q[1]) / 2) + " " + q[0] + " " + q[1],
          fill: "none", stroke: VOLTL, "stroke-width": 5, "stroke-dasharray": "16 12", "stroke-linecap": "round" });
        const L = p.getTotalLength(); lines.push(p);
        gsap.set(p, { opacity: 0 });
        tl.set(p, { opacity: 0.9 }, S(2330.40) + i * 0.15);
        tl.fromTo(p, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: E.out, immediateRender: false }, S(2330.40) + i * 0.15);
      });
      pop(dci, S(2330.10), { dur: 0.6, from: 0.7 });
      // "these chips" — the DC pulses; "China" — CHINA label; "outside of China" — MALAYSIA
      tl.fromTo(dci, { scale: 1 }, { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, S(2332.00));
      const cnl = m.label(1060, 600, "CHINA", 76, "t-display", BONE, { css: "letter-spacing:0.06em" });
      rise(cnl, T(2333.65), { dur: 0.7, y: 10 });
      tl.fromTo(myl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: C(E.out, 0.6), immediateRender: false }, S(2334.62));
      // "a war with Taiwan": TAIWAN + red rings across the strait
      const twl = m.label(TW[0] + 160, TW[1] + 10, "TAIWAN", 44, "t-display", BONE, { css: "letter-spacing:0.05em" });
      rise(twl, T(2339.17), { dur: 0.6, y: 8 });
      const ring = el(svg, "g", {});
      FX.radioWaves(ring, FJ[0] + 40, FJ[1] + 10, { rings: 4, max: 190, period: 1.3, width: 7, color: REDL, from: S(2339.10), to: S(2343.2) });
      // the switch (Washington, ice) flips OFF on "shut down"
      const knob = sw.querySelector(".knob"), trk = sw.querySelector(".trk");
      gsap.set(sw, { opacity: 0 });
      tl.fromTo(sw, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: C(E.out, 0.6), immediateRender: false }, S(2341.70));
      gsap.set(knob, { x: 0 });   // ON: knob right (covers "Off"); OFF: knob slides left over "On"
      tl.to(knob, { x: -118, duration: 0.25, ease: C(E.inOut, 0.25) }, S(2342.70));
      tl.to(trk, { background: "rgba(13,16,18,0.92)", duration: 0.2 }, S(2342.75));
      tl.to(dci, { background: ASH, filter: "none", duration: 0.25 }, S(2342.85));
      // "shut down Chinese access": the lines die, ice cut marks
      tl.to(lines, { stroke: ASH, opacity: 0.35, duration: 0.4 }, S(2344.95));
      const cut = el(svg, "g", {});
      const cr = FX.markup.cross(tl, cut, S(2344.95), { x: 905, y: 1150, s: 34, color: ICEL, width: 8, dur: 0.14 });
      cr.forEach((p) => { gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, S(2344.95)); });
      // "not … an advantage": China's red dims
      tl.to(fill, { opacity: 0.45, duration: 1.0, ease: C(E.inOut, 1.0) }, S(2348.50));
    })();

    /* ===== sc009 · FACE C + compact scoreboard (hard cut on the 2351.48 join) ===== */
    face("sc009", 2351.48, 2357.55, "C");
    (function () {
      const sbc = NV.scoreboard($("sbc"), { prefix: SEG + "-sbc", compact: true, state: { 1: "x", 2: "check", 3: "x" }, row4Text: "The renting loophole", gate: [S(2351.2), S(2357.9)] });
      gsap.set($("sbc"), { clipPath: "inset(0% 100% 0% 0%)" });
      tl.fromTo($("sbc"), { clipPath: "inset(0% 100% 0% 0%)", x: -30 }, { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.9, ease: C(E.out, 0.9), immediateRender: false }, S(2351.90));
      sbc.markRow(tl, 4, "q", T(2354.13));
    })();

    /* ===== sc010 · NPR headline (whip) ===== */
    whip("sc009", "sc010", S(2357.55), { dir: 1 });
    (function () {
      const page = $("sc010-page"), mk = $("sc010-mk");
      gsap.set(page, { rotation: 1 });
      tl.fromTo(page, { y: 60 }, { y: 0, duration: 1.2, ease: C(E.out, 1.2), immediateRender: true }, S(2357.40));
      push("sc010", 2357.55, 2362.50, 1.0, 1.08, { ease: E.cam });
      // pen underline under "amid alleged spy scandal" (line 2 of the headline) on "spy"
      const u = FX.markup.pen(tl, mk, S(2361.01), { points: [[112, 292], [350, 296], [600, 291], [838, 295]], jitter: 4, seed: 5, dur: 0.55, width: 7, color: ICED, blend: "multiply" });
      gsap.set(u, { opacity: 0 }); tl.set(u, { opacity: 1 }, S(2361.01));
    })();

    /* ===== sc011 · FACE M → W on "So if you have" ===== */
    (function () {
      const fw = $("sc011-fw");
      gsap.set(fw, { scale: 1.25 });
      tl.fromTo(fw, { scale: 1.25 }, { scale: 1.275, duration: 2365.87 - 2362.43, ease: "none", immediateRender: false }, S(2362.43));
      tl.fromTo(fw, { scale: 1.0 }, { scale: 1.03, duration: 2372.36 - 2365.87, ease: "none", immediateRender: false }, S(2365.87));
    })();

    /* ===== sc012 · the full board, final state (vertical whip) ===== */
    whip("sc011", "sc012", S(2372.36), { dir: 1, vertical: true });
    (function () {
      const sbf = NV.scoreboard($("sbf"), { prefix: SEG + "-sbf", state: { 1: "x", 2: "check", 3: "x" }, row4Text: "The renting loophole", gate: [S(2372.0), S(2377.5)] });
      sbf.markRow(tl, 4, "q", S(2372.62));
      push("sc012", 2372.20, 2377.30, 1.0, 1.04, { ease: E.cam });
    })();

    /* ===== sc013 · FACE C ===== */
    face("sc013", 2377.16, 2385.40, "C");
    /* ===== sc014 · FACE M (framing jump on the 2385.40 join) ===== */
    face("sc014", 2385.40, 2394.97, "M");
    /* ===== sc015 · FACE W (jump on the 2394.97 join) → hold, fade to night ===== */
    face("sc015", 2394.97, 2402.00, "W");
    tl.fromTo($("end"), { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "sine.inOut", immediateRender: false }, S(2400.50));

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
</template>
