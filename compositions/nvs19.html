  <script>

    const INK = "#14181b", BONE = "#f0efe8", PAPER = "#e8e6dc", RED = "#dc2f3c", REDL = "#f6a4a9", REDD = "#7e151e", VOLT = "#86c232", VOLTL = "#c9ec8f", VOLTD = "#3f6410", YEL = "#f5d033";

    // ---------- scenes ----------
    const SC = [
      ["sc001", 1893.917, 1897.400, "night"], ["sc002", 1897.400, 1904.300, "map"], ["sc003", 1904.300, 1910.700, "paper"],
      ["sc004", 1910.700, 1919.900, "night"], ["sc005", 1919.900, 1927.300, "night"], ["sc006", 1927.300, 1931.540, "night"],
      ["sc007", 1931.540, 1954.950, "paper"], ["sc008", 1954.950, 1967.750, "paper"], ["sc009", 1967.750, 1976.200, "map"],

    ];
    const GROUND = { paper: [0.32, 0.16, 0.26], night: [0.9, 0.42, 0.38], map: [0.75, 0.3, 0.3] };
    const EARLY = { sc003: 0.45, sc007: 0.45 };   // slides: incoming scene visible during the slide
    function ground(kind, t) { const v = GROUND[kind]; tl.set([$("vig"), $("dust"), $("grain")], { opacity: (i) => v[i] }, t); }
    SC.forEach((s, i) => {
      const el = $(s[0]), a = s[1] - (EARLY[s[0]] || 0);
      if (i === 0) gsap.set(el, { autoAlpha: 1 });
      else tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.001, immediateRender: false }, S(a) - 0.002);
      if (s[2] < SEG_END) tl.set(el, { autoAlpha: 0 }, S(s[2]) + 0.05);
    });
    gsap.set([$("vig"), $("dust"), $("grain")], { opacity: (i) => GROUND.night[i] });
    SC.forEach((s, i) => { if (i > 0) ground(s[3], S(s[1])); });

    // ---------- helpers ----------
    const rise = (el, t, o) => { o = o || {}; const d = o.dur || 0.6;
      tl.fromTo(el, { opacity: 0, y: o.y == null ? 16 : o.y }, { opacity: 1, y: 0, duration: d, ease: C(E.out, d), immediateRender: true }, t); };
    const pop = (el, t, o) => { o = o || {}; const d = o.dur || 0.8;
      tl.fromTo(el, { opacity: 0, scale: o.from == null ? 0.6 : o.from }, { opacity: 1, scale: 1, duration: d, ease: C(E.out, d), immediateRender: true }, t); };
    const stop = (el, t, o) => { o = o || {}; const n = o.n || 3;   // stop-motion pin-on (12 fps)
      tl.fromTo(el, { opacity: 0, scale: o.from || 1.25 }, { opacity: 1, scale: 1, duration: n / 12, ease: "steps(" + n + ")", immediateRender: true }, t); };
    function el(parent, tag, attrs) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; }
    function ink(parent, d, t, dur, o) {
      o = o || {};
      const p = el(parent, "path", { d: d, fill: "none", stroke: o.color || INK, "stroke-width": o.width || 5, "stroke-linecap": "round", "stroke-linejoin": "round" });
      if (o.opacity != null) p.setAttribute("opacity", o.opacity);
      const len = p.getTotalLength() || 1;
      p.setAttribute("stroke-dasharray", len + " " + len); p.setAttribute("stroke-dashoffset", len);
      tl.fromTo(p, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: o.ease || C(E.out, dur), immediateRender: true }, t);
      return p;
    }
    const whipN = { n: 0 };
    function whip(a, b, t, o) {
      o = Object.assign({ dir: 1, vertical: false, flash: false, dur: 0.32 }, o);
      const k = ++whipN.n, ba = FX.whipDefs(defs, SEG + "-wa" + k), bb = FX.whipDefs(defs, SEG + "-wb" + k), h = o.dur / 2;
      const A = $(a + "-shot"), B = $(b + "-shot");
      tl.set(A, { filter: "url(#" + SEG + "-wa" + k + ")" }, t - h - 0.01); tl.set(A, { filter: "none" }, t + 0.06);
      tl.set(B, { filter: "url(#" + SEG + "-wb" + k + ")" }, t - 0.001); tl.set(B, { filter: "none" }, t + h + 0.02);
      FX.whip(tl, A, B, t, { dir: o.dir, vertical: o.vertical, dur: o.dur, blurA: ba, blurB: bb });
      if (o.flash) tl.fromTo($("flash"), { opacity: 0 }, { opacity: 0.85, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, t - 0.08);
    }
    function slide(a, b, t, o) {
      o = Object.assign({ axis: "x", from: 1, d: 0.45 }, o);
      const A = $(a + "-shot"), B = $(b + "-shot"), dist = (o.axis === "x" ? 1980 : 1140) * o.from;
      tl.fromTo(B, { [o.axis]: dist, boxShadow: "0 0 80px rgba(0,0,0,0.5)" }, { [o.axis]: 0, duration: o.d, ease: C(E.inOut, o.d), immediateRender: false }, t - o.d);
      tl.set(B, { boxShadow: "none" }, t);
      tl.fromTo(A, { [o.axis]: 0 }, { [o.axis]: -dist * 0.12, duration: o.d, ease: E.in, immediateRender: false }, t - o.d);
    }
    function push(id, a, b, s0, s1, o) {
      o = o || {};
      const vw = $(id + "-vw");
      if (o.origin) gsap.set(vw, { transformOrigin: o.origin });
      gsap.set(vw, { scale: s0 });
      tl.fromTo(vw, { scale: s0 }, { scale: s1, duration: b - a, ease: o.ease || "none", immediateRender: false }, S(a));
    }
    const exitPush = (id, t, s, d) => tl.to($(id + "-vw"), { scale: s, duration: d || 0.5, ease: E.in }, t);
    const at = (px, py, s) => ({ x: 960 - px * s, y: 540 - py * s, scale: s });
    function mapCam(cam) {
      const marks = [];
      const apply = (v) => { gsap.set(cam, { x: v.x, y: v.y, scale: v.scale }); const inv = "scale(" + (1 / v.scale).toFixed(4) + ")"; marks.forEach((m) => { m.style.transform = inv; }); };
      return {
        marks, apply,
        move(a, b, t, dur, ease) {
          const pr = { v: 0 }, e = ease || E.cam;
          tl.fromTo(pr, { v: 0 }, { v: 1, duration: dur, ease: "none", immediateRender: false, onUpdate: () => { const k = e(pr.v);
            apply({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, scale: a.scale + (b.scale - a.scale) * k }); } }, t);
        },
        mark(x, y, inner) {
          const o = document.createElement("div");
          o.style.cssText = "position:absolute;left:" + x + "px;top:" + y + "px;width:0;height:0;transform-origin:0 0;";

        },
      };
    }
    function label(text, o) {
      o = Object.assign({ size: 56, kind: "country", dx: 0, dy: 0 }, o);
      const d = document.createElement("div");
      d.className = o.kind === "place" ? "t-label" : "t-display";
      d.textContent = text;
      const left = o.align === "left" ? o.dx : -800 + o.dx;
      d.style.cssText = "position:absolute;white-space:nowrap;line-height:1;left:" + left + "px;" + (o.align === "left" ? "" : "width:1600px;text-align:center;") + "top:" + (-o.size * 0.5 + o.dy) + "px;font-size:" + o.size + "px;color:" + (o.color || BONE) +
        ";text-shadow:0 2px 4px rgba(0,0,0,0.75),0 0 14px rgba(0,0,0,0.55);" + (o.kind === "place" ? "" : "text-transform:uppercase;letter-spacing:0.04em;") + "opacity:0;";
      return d;
    }
    function pinEl(color, ring) { const p = document.createElement("div"); p.className = "n19-pin"; p.style.background = color; p.style.boxShadow = "0 0 0 7px " + ring + ", 0 0 18px rgba(0,0,0,0.5)"; p.style.opacity = 0; return p; }

    FX.grain($("grain"), 1901);
    FX.dust($("dust"), 1902, 2);
    const PEN = FX.markupDefs(defs, SEG + "-pen", { boil: 4 });
    defs.setAttribute("viewBox", "0 0 1 1");

    /* ===== sc001 · Kilby's first IC (archival print, gate weave) ===== */
    (function () {
      FX.weave($("sc001-wv"), { amp: 1.4, flicker: 0.04, seed: 19, from: 0, to: S(1897.6) });

    })();

    /* ===== sc002 · US map: Texas, not Silicon Valley / California (light-flash whip) ===== */
    whip("sc001", "sc002", S(1897.40), { dir: 1, flash: true });
    (function () {
      const cam = $("sc002-cam"), mc = mapCam(cam), svg = $("sc002-svg");
      const ltx = mc.mark(1693, 1005, label("Texas", { size: 70 }));
      const psv = mc.mark(261, 527, pinEl(BONE, "rgba(240,239,232,0.3)"));
      const lsv = mc.mark(261, 527, label("Silicon Valley", { kind: "place", size: 26, align: "left", dx: 30, dy: 0 }));
      const lca = mc.mark(476, 690, label("California", { size: 44 }));

      rise(ltx, T(1900.12), { dur: 0.6, y: 10 });
      // not Silicon Valley, not California
      stop(psv, S(1901.1), { n: 3, from: 1.8 });
      rise(lsv, T(1901.16), { dur: 0.5, y: 6 });
      tl.fromTo($("sc002-ca"), { opacity: 0 }, { opacity: 0.16, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, S(1902.15));
      rise(lca, T(1902.20), { dur: 0.5, y: 8 });

      gsap.set(x, { opacity: 0 }); tl.set(x, { opacity: 0.9 }, S(1902.62));

      tl.to(ltx, { opacity: 0, duration: 0.3 }, S(1903.3));

    slide("sc002", "sc003", S(1904.30), { axis: "y" });
    (function () {
      const h1 = $("sc003-h1"), h2 = $("sc003-h2"), pl = $("sc003-pl"), nm = $("sc003-nm"), yr = $("sc003-yr"), out = $("sc003-out"), por = $("sc003-por"), eng = $("sc003-eng");

      stop(por, S(1905.78), { n: 3, from: 1.15 });
      rise(nm, S(1906.1), { dur: 0.5, y: 8 });
      tl.fromTo(eng, { opacity: 0, y: 200, rotation: 5 }, { opacity: 1, y: 0, rotation: -2, duration: 0.9, ease: C(E.out, 0.9), immediateRender: true }, S(1906.4));

      tl.fromTo($("sc003-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: C(E.inOut, 0.9), immediateRender: true }, S(1907.85));
      stop(yr, T(1909.80), { n: 3, from: 1.35 });
      push("sc003", 1904.3, 1910.7, 1.0, 1.045, { ease: E.cam, origin: "960px 300px" });
    })();

    /* ===== sc004 · THE WAFER CHART: 10 % → 30 % (whip →) ===== */
    whip("sc003", "sc004", S(1910.70), { dir: 1 });
    (function () {
      const box = $("sc004-dies"), lit = [];
      const PITCH = 54, X0 = 720 - 266, Y0 = 560 - 266;
      for (let k = 0; k < 100; k++) {
        const x = X0 + (k % 10) * PITCH, y = Y0 + Math.floor(k / 10) * PITCH;
        const d = document.createElement("div"); d.className = "n19-die"; d.style.left = x + "px"; d.style.top = y + "px"; box.appendChild(d);
        const l = document.createElement("div"); l.className = "n19-lit"; l.style.left = x + "px"; l.style.top = y + "px"; box.appendChild(l); lit.push(l);
      }
      // deterministic order in which dies "work"
