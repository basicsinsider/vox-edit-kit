    SC.forEach((s, k) => { if (k) tl.set(OV, { opacity: (i) => GROUND[s[3]][i] }, S(s[1])); });

    // ---------- helpers ----------
    const rise = (el, t, o) => { o = o || {}; const d = o.dur || 0.6;

    const land = (el, t, o) => { o = Object.assign({ dur: 0.9, y: -70, rot: 0, dr: 6 }, o);

    function mk(parent, tag, attrs) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; }

    })();

    slide("sc003", "sc004", S(899.20));

    (function () {

      rise(pb.querySelector(".lab"), T(922.70), { dur: 0.4 });   // MIT

      tl.to($("s6-r1"), { opacity: 0, duration: 0.4 }, S(918.5)); tl.to($("s6-r3"), { opacity: 1, duration: 0.5 }, S(919.3));
      tl.to($("s6-r3"), { opacity: 0, duration: 0.4 }, S(920.6)); tl.to($("s6-r2"), { opacity: 1, duration: 0.5 }, S(921.9));
      tl.to(pa.querySelector(".lab"), { opacity: 0, duration: 0.3 }, S(920.6));

    })();

    (function () {
      const a = S(923.50), svg = $("s7-mk"), pf = FX.markupDefs(svg, SEG + "-pen7", { boil: 4 });

      const L = link.getTotalLength(); link.setAttribute("stroke-dasharray", L + " " + L); link.setAttribute("stroke-dashoffset", L);
      hideUntil(link, S(937.6));
      tl.fromTo(link, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: C(E.out, 0.8), immediateRender: false }, S(937.6));
      gsap.set($("s8-bos").querySelector("span"), { xPercent: -50, yPercent: -50 });
      rise($("s8-bos").querySelector("span"), T(938.62), { dur: 0.5, y: 0 });   // Boston
      rise($("s8-pm").querySelector(".lab"), T(939.90), { dur: 0.4 });          // MIT
      rise($("s8-ph").querySelector(".lab"), T(942.78), { dur: 0.4 });          // Harvard
    })();

    FX.grain($("grain"), 3); FX.dust($("dust"), 5, 2);
    FX.mount(tl, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
