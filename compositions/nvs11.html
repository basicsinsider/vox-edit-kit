        for (let k = 0; k < 13; k++) h += '<i style="top:' + (170 + k * 36) + 'px;width:' + (300 + ((k * 53 + i * 17) % 110)) + 'px"></i>';
        p.innerHTML = h;
      });
      gsap.set([pc, $("sc010-nm"), $("sc010-ro"), $("sc010-tag")].concat(pages), { opacity: 0 });
      stop(pc, S(1115.0), { n: 3, from: 1.2 });
      rise($("sc010-nm"), T(1115.26), { dur: 0.6, y: 10 });
      rise($("sc010-ro"), S(1115.6), { dur: 0.5, y: 8 });
      pages.forEach((p, i) => tl.fromTo(p, { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(1116.7) + i * 0.2));
      stop($("sc010-tag"), T(1118.70), { n: 2, from: 1.15 });
      // highlighter on two body lines of the top page (page 3: lines 4 and 7)
      [4, 7].forEach((k, j) => {
        const h = document.createElement("div");
        h.style.cssText = "position:absolute;left:46px;top:" + (162 + k * 36) + "px;width:" + (330 + j * 40) + "px;height:30px;background:" + YEL + ";mix-blend-mode:multiply;opacity:0.85;transform-origin:0 50%";
        pages[2].appendChild(h); gsap.set(h, { scaleX: 0 });
        tl.fromTo(h, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: C(E.inOut, 0.45), immediateRender: true }, S(1119.6) + j * 0.4);
      });
      stop($("sc010-st"), T(1120.94), { n: 3, from: 1.5 });
      push("sc010", 1114.86, 1122.0, 1.0, 1.05, { ease: E.cam, origin: "800px 520px" });
    })();

    /* ===== sc011 · two years behind · one twentieth of the compute (paper slides up) ===== */
    slide("sc010", "sc011", S(1122.00), { axis: "y" });
    (function () {
      const svg = $("sc011-svg");
      ink(svg, "M200 261 C700 259 1200 263 1720 260", S(1121.7), 1.0, { color: INK, width: 4, opacity: 0.75, ease: C(E.inOut, 1.0) });
      ink(svg, "M1700 246 L1724 260 L1700 275", S(1122.6), 0.2, { color: INK, width: 4, opacity: 0.75 });
      gsap.set([$("sc011-dd"), $("sc011-dl"), $("sc011-ud"), $("sc011-ul"), $("sc011-g1"), $("sc011-g2"), $("sc011-bc"), $("sc011-sc"), $("sc011-fr"), $("sc011-cp")], { opacity: 0 });
      stop($("sc011-dd"), S(1122.4), { n: 2, from: 1.6 });
      rise($("sc011-dl"), S(1122.5), { dur: 0.5, y: 8 });
      // bracket: DeepSeek → two years → American labs
      const br = FX.markup.pen(tl, svg, S(1124.9), { points: [[600, 312], [604, 330], [960, 333], [1316, 330], [1320, 312]], color: INK, width: 5, filter: PEN, dur: 0.9, seed: 7 });
      gsap.set(br, { opacity: 0 }); tl.set(br, { opacity: 1 }, S(1124.9));
      rise($("sc011-g1"), T(1124.86), { dur: 0.5, y: 10 });
      rise($("sc011-g2"), T(1125.34), { dur: 0.5, y: 10 });
      stop($("sc011-ud"), S(1125.66), { n: 2, from: 1.6 });
      rise($("sc011-ul"), T(1125.66), { dur: 0.5, y: 8 });
      // compute: 20 : 1 by area
      tl.fromTo($("sc011-bc"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 1.0, ease: C(E.out, 1.0), immediateRender: true }, S(1127.3));
      tl.fromTo($("sc011-sc"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.6, ease: C(E.out, 0.6), immediateRender: true }, S(1128.3));
      rise($("sc011-fr"), T(1128.46), { dur: 0.6, y: 12 });
      tl.fromTo($("sc011-frh"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: C(E.out, 0.4), immediateRender: true }, S(1128.9));
      rise($("sc011-cp"), T(1129.66), { dur: 0.5, y: 8 });
      push("sc011", 1122.0, 1130.85, 1.0, 1.04, { ease: E.cam, origin: "960px 560px" });
    })();

    /* ===== sc012 · researchers vs chips · isotype (vertical whip) ===== */
    whip("sc011", "sc012", S(1130.85), { dir: -1, vertical: true });
    (function () {
      const box = $("sc012-icons");
      function icons(cls, color, x0, y0, n, per, dx, dy, size, t, step) {
        const out = [];
        for (let k = 0; k < n; k++) {
          const d = document.createElement("div"); d.className = "n11-icon " + cls;
          d.style.cssText = "left:" + (x0 + (k % per) * dx) + "px;top:" + (y0 + Math.floor(k / per) * dy) + "px;width:" + size + "px;height:" + size + "px;background:" + color;
          box.appendChild(d); gsap.set(d, { opacity: 0 }); out.push(d);
          tl.fromTo(d, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 2 / 12, ease: "steps(2)", immediateRender: true }, t + k * step);
        }
        return out;
      }
      gsap.set([$("sc012-hc"), $("sc012-hu"), $("sc012-rr"), $("sc012-rc")], { opacity: 0 });
      rise($("sc012-hc"), T(1132.21), { dur: 0.6, y: 10 });
      icons("n11-ic-person", RED, 500, 290, 8, 4, 140, 130, 110, S(1133.15), 1 / 12);
      rise($("sc012-rr"), T(1134.45), { dur: 0.5, y: 8 });
      rise($("sc012-hu"), T(1135.73), { dur: 0.6, y: 10 });
      icons("n11-ic-person", ICE, 1250, 290, 5, 4, 140, 130, 110, S(1136.0), 1 / 12);
      rise($("sc012-rc"), T(1137.65), { dur: 0.5, y: 8 });
      icons("n11-ic-chip", VOLT, 740, 680, 1, 1, 0, 0, 100, S(1137.75), 0);
      icons("n11-ic-chip", VOLT, 1210, 640, 16, 8, 74, 92, 64, S(1137.8), 1 / 24);
      // "that's what counts": pen box round the chips row
      const bx = FX.markup.box(tl, $("sc012-svg"), S(1138.4), { x: 420, y: 610, w: 1400, h: 240, color: VOLTL, width: 6, filter: PEN, dur: 0.6 });
      gsap.set(bx, { opacity: 0 }); tl.set(bx, { opacity: 1 }, S(1138.4));
      push("sc012", 1130.85, 1139.73, 1.0, 1.04, { ease: E.cam });
    })();

    /* ===== sc013 · substation (hard cut) ===== */
    (function () {
      push("sc013", 1139.73, 1145.17, 1.0, 1.08, { ease: "none" });
      tl.fromTo($("sc013-img"), { filter: "grayscale(0.85) contrast(1.15) brightness(0.7)" }, { filter: "grayscale(0.85) contrast(1.15) brightness(0.86)", duration: 2.0, ease: "sine.inOut", immediateRender: true }, S(1141.0));
    })();

    /* ===== sc014 · atlas spread: electricity China ≫ US (whip →) ===== */
    whip("sc013", "sc014", S(1145.17), { dir: 1 });
    (function () {
      gsap.set([$("sc014-tc"), $("sc014-tu"), $("sc014-cn"), $("sc014-us"), $("sc014-b1"), $("sc014-l1"), $("sc014-b2"), $("sc014-l2"), $("sc014-ec")], { opacity: 0 });
      rise($("sc014-tc"), T(1145.17), { dur: 0.6, y: 10 });
      tl.fromTo($("sc014-cn"), { opacity: 0 }, { opacity: 0.85, duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(1145.3));
      rise($("sc014-tu"), S(1145.5), { dur: 0.6, y: 10 });
      tl.fromTo($("sc014-us"), { opacity: 0 }, { opacity: 0.85, duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(1145.6));
      gsap.set([$("sc014-e1"), $("sc014-e2")], { scaleX: 0 });
      tl.set([$("sc014-b1")], { opacity: 1 }, S(1146.95));
      rise($("sc014-l1"), T(1147.01), { dur: 0.5, y: 6 });
      tl.fromTo($("sc014-e1"), { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: C(E.out, 1.2), immediateRender: true }, S(1147.1));
      tl.set([$("sc014-b2")], { opacity: 1 }, S(1147.85));
      rise($("sc014-l2"), T(1147.89), { dur: 0.5, y: 6 });
      tl.fromTo($("sc014-e2"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: C(E.out, 0.9), immediateRender: true }, S(1148.0));
      // "nothing to use that electricity on": empty chip slot + pen arrow
      stop($("sc014-ec"), S(1150.4), { n: 2, from: 1.2 });
      const ar = FX.markup.arrow(tl, $("sc014-svg"), S(1150.67), { x1: 470, y1: 840, x2: 600, y2: 905, bend: 40, head: 22, color: REDD, width: 5, filter: PEN, dur: 0.6 });
      gsap.set(ar, { opacity: 0 }); tl.set(ar, { opacity: 1 }, S(1150.67));
      push("sc014", 1145.17, 1153.33, 1.0, 1.04, { ease: E.cam, origin: "700px 640px" });
    })();

    /* ===== sc015 · the US: all the chips we want (night slides in from the left) ===== */
    slide("sc014", "sc015", S(1153.33), { axis: "x", from: -1 });
    (function () {
      const box = $("sc015-racks"), SRC = "assets/nvidia/shared/hardware/cutouts/gb200_nvl72_rack_front_cutout.png";
      // three rows; back rows smaller (depth). Row 0 = front.
      const ROWS = [{ n: 7, h: 560, y: 470, t: S(1153.5) }, { n: 9, h: 420, y: 330, t: S(1158.05) }, { n: 11, h: 320, y: 230, t: S(1159.0) }];
      ROWS.slice().reverse().forEach((r) => {
        const w = r.h * 1134 / 3680, gap = w * 0.22, tot = r.n * w + (r.n - 1) * gap, x0 = 960 - tot / 2;
        for (let k = 0; k < r.n; k++) {
          const im = document.createElement("img"); im.src = SRC; im.alt = "";
          im.style.cssText = "position:absolute;left:" + (x0 + k * (w + gap)).toFixed(1) + "px;top:" + r.y + "px;width:" + w.toFixed(1) + "px;height:" + r.h + "px;filter:saturate(0.6) brightness(" + (r === ROWS[0] ? 0.95 : r === ROWS[1] ? 0.7 : 0.5) + ") drop-shadow(0 0 22px rgba(134,194,50,0.35))";
          box.appendChild(im); gsap.set(im, { opacity: 0 });
          const order = Math.abs(k - (r.n - 1) / 2);
          tl.fromTo(im, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 2 / 12, ease: "steps(2)", immediateRender: true }, r.t + Math.round(order) / 12);
        }
      });
      gsap.set($("sc015-lab"), { opacity: 0 });
      rise($("sc015-lab"), T(1153.89), { dur: 0.6, y: 10 });
      push("sc015", 1153.33, 1158.0, 1.18, 1.1, { ease: E.cam });
      tl.to($("sc015-vw"), { scale: 0.96, duration: 2.0, ease: E.cam }, S(1158.05));
    })();

    /* ===== sc016 · no public support · not enough electricity (light-flash whip) ===== */
    whip("sc015", "sc016", S(1160.61), { dir: -1, flash: true });
    (function () {
      const A = $("sc016-a"), B = $("sc016-b");
      gsap.set(B, { opacity: 0 });
      tl.fromTo(A, { y: 40 }, { y: 0, duration: 1.2, ease: C(E.out, 1.2), immediateRender: true }, S(1160.61));
      const u1 = FX.markup.pen(tl, $("sc016-sa"), S(1163.9), { points: [[8, 120], [300, 117], [600, 121]], color: REDD, width: 7, filter: PEN, dur: 0.8, seed: 9 });
      gsap.set(u1, { opacity: 0 }); tl.set(u1, { opacity: 1 }, S(1163.9));
      tl.fromTo(B, { opacity: 0, y: 700, rotation: 6 }, { opacity: 1, y: 0, rotation: 1.2, duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(1165.2));
      tl.to(A, { opacity: 0.55, duration: 0.4 }, S(1165.4));
      const u2 = FX.markup.pen(tl, $("sc016-sb"), S(1166.95), { points: [[346, 112], [500, 109], [648, 113]], color: REDD, width: 6, filter: PEN, dur: 0.4, seed: 10 });
      const u3 = FX.markup.pen(tl, $("sc016-sb"), S(1167.35), { points: [[8, 154], [90, 151], [176, 155]], color: REDD, width: 6, filter: PEN, dur: 0.3, seed: 11 });
      gsap.set([u2, u3], { opacity: 0 }); tl.set(u2, { opacity: 1 }, S(1166.95)); tl.set(u3, { opacity: 1 }, S(1167.35));
      push("sc016", 1160.61, 1168.53, 1.0, 1.05, { ease: E.cam, origin: "960px 520px" });
    })();

    /* ===== sc017 · mirror matrix: each side's problem (paper slides up) ===== */
    slide("sc016", "sc017", S(1168.53), { axis: "y" });
    (function () {
      const H = [$("sc017-hu"), $("sc017-hc"), $("sc017-r1"), $("sc017-r2")], M = [$("sc017-c1"), $("sc017-c2"), $("sc017-c3"), $("sc017-c4")];
      gsap.set(H.concat(M), { opacity: 0 });
      gsap.set([$("sc017-m1"), $("sc017-m2")], { scaleX: 0 });
      tl.fromTo($("sc017-m1"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: C(E.out, 0.7), immediateRender: true }, S(1168.3));
      tl.fromTo($("sc017-m2"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: C(E.out, 0.7), immediateRender: true }, S(1168.5));
      rise(H[0], S(1168.7), { dur: 0.5, y: 8 }); rise(H[1], S(1168.85), { dur: 0.5, y: 8 });
      rise(H[2], S(1169.0), { dur: 0.5, y: 6 }); rise(H[3], S(1169.1), { dur: 0.5, y: 6 });
      // "both sides are facing problems": US chips ✓ / power ✗ · China chips ✗ / power ✓
      stop(M[0], S(1169.4), { n: 2, from: 1.4 }); stop(M[1], S(1169.75), { n: 2, from: 1.4 });
      stop(M[3], S(1170.1), { n: 2, from: 1.4 }); stop(M[2], S(1170.45), { n: 2, from: 1.4 });
      // "in their unique ways": circle each side's problem
      const c1 = FX.markup.circle(tl, $("sc017-svg"), S(1171.4), { cx: 955, cy: 745, rx: 110, ry: 92, color: ICED, width: 6, filter: PEN, dur: 0.6, seed: 3 });
      const c2 = FX.markup.circle(tl, $("sc017-svg"), S(1171.75), { cx: 1520, cy: 480, rx: 110, ry: 92, color: REDD, width: 6, filter: PEN, dur: 0.6, seed: 6 });
      gsap.set([c1, c2], { opacity: 0 }); tl.set(c1, { opacity: 1 }, S(1171.4)); tl.set(c2, { opacity: 1 }, S(1171.75));
      push("sc017", 1168.53, 1173.9, 1.0, 1.04, { ease: E.cam, origin: "1000px 560px" });
      // "let's get back to the story": accelerating push = the cut on action into nvs12
      tl.to($("sc017-vw"), { scale: 1.3, duration: 0.68, ease: E.in }, S(1173.9));
    })();

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
</template>
