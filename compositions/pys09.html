    words("sc017-lt", [T(1023.58), T(1023.82), T(1024.38), T(1024.54)], { dur: 0.3, y: 10 });

    /* ===== sc018 · the loan tower: too big to fail (hard cut at the EDL join) ===== */
    (function () {
      const host = $("sc018-stack"), rnd = FX.rng(918), N = 44, t0 = S(1025.25), span = 2.4;
      for (let i = 0; i < N; i++) {
        const c = document.createElement("div"); c.className = "p9-lc";
        c.innerHTML = '<i style="top:16px; width:' + (120 + Math.floor(rnd() * 90)) + 'px"></i><i style="top:34px; width:' + (80 + Math.floor(rnd() * 80)) + 'px"></i>';
        c.style.left = (1150 + (rnd() - 0.5) * 30).toFixed(0) + "px"; c.style.top = (936 - i * 62).toFixed(0) + "px";
        host.appendChild(c);
        gsap.set(c, { rotation: (rnd() - 0.5) * 4, opacity: 0 });
        const t = t0 + Math.floor((i / N) * span * 12) / 12;
        tl.fromTo(c, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 2 / 12, ease: "steps(2)", immediateRender: true }, t);
      }
      const cam = $("sc018-cam");
      tl.fromTo(cam, { scale: 1.5 }, { scale: 0.42, duration: 3.0, ease: E.cam, immediateRender: false }, S(1025.20));
      tl.to(cam, { scale: 0.4, y: 10, duration: 0.55, ease: "none" }, S(1028.20));
      words("sc018-lt", [T(1027.21), T(1027.45), T(1027.77), T(1027.93)], { dur: 0.3, y: 12 });
    })();

    /* ===== sc019 · more than $300 million (whip ↓) ===== */
    whip("sc018", "sc019", S(1028.75), { dir: 1, vertical: true });
    (function () {
      const cam = $("sc019-cam"), num = $("sc019-num"), cnt = { v: 0 };
      tl.fromTo(cam, { scale: 1.06 }, { scale: 1.0, duration: 6.1, ease: E.cam, immediateRender: false }, S(1028.75));
      words("sc019-k", [T(1030.09), T(1030.25)], { dur: 0.4, y: 10 });
      tl.set(num, { opacity: 1 }, T(1030.49));
      tl.fromTo(cnt, { v: 0 }, { v: 300, duration: 0.75, ease: C("power2.out", 0.75), immediateRender: false, onUpdate: () => (num.textContent = "$" + Math.round(cnt.v)) }, T(1030.49));
      words("sc019-mil", [T(1031.21)], { dur: 0.45, y: 12 });
      out($("sc019-k"), S(1032.10), 0.3);
      words("sc019-own", [T(1033.13), T(1033.53), T(1033.69), T(1033.85), T(1034.17)], { dur: 0.35, y: 10 });
      // the money loops back to themselves: a teal loop around the number
      const lp = FX.markup.circle(tl, $("sc019-svg"), S(1033.80), { cx: 960, cy: 500, rx: 560, ry: 250, rot: -3, dur: 0.6, color: UENOL, width: 6, filter: PEN, seed: 9 });
      gsap.set(lp, { opacity: 0 }); tl.set(lp, { opacity: 0.9 }, S(1033.80));
      tl.to(cam, { scale: 1.08, duration: 0.45, ease: E.in }, S(1034.42));
    })();

    /* ===== sc020 · THE MERRY-GO-ROUND (whip → in the ride's direction) — hero, 2.5D ===== */
    whip("sc019", "sc020", S(1034.87), { dir: -1 });
    (function () {
      const CX = 1200, CY = 870, RX = 520, RY = 120, AX = 420, AY = 96;   // platform + rider orbit
      const RIM = { y: 330, rx: 560, ry: 74 }, APEX = { x: 1200, y: 120 };
      const base = $("sc020-base"), top = $("sc020-top"), riders = $("sc020-riders");
      // platform (back rim, deck, front skirt) + the circulation ring
      el(base, "ellipse", { cx: CX, cy: CY + 26, rx: RX + 14, ry: RY + 14, fill: "#06110f", opacity: 0.6 });
      el(base, "ellipse", { cx: CX, cy: CY, rx: RX, ry: RY, fill: UENOD });
      el(base, "ellipse", { cx: CX, cy: CY - 6, rx: RX - 18, ry: RY - 18, fill: "#0f6d63" });
      const ring = el(base, "ellipse", { cx: CX, cy: CY + 4, rx: RX + 40, ry: RY + 34, fill: "none", stroke: UENOL, "stroke-width": 4, "stroke-dasharray": "26 22", opacity: 0 });
      // canopy (cone stripes + sign band) is redrawn per step
      const cone = el(top, "g", {}), band = el(top, "g", {}), bulbs = el(top, "g", {});
      // riders
      const kinds = ["ueno", "bag", "loan", "co", "bag", "loan"], R = [];
      kinds.forEach((k, i) => {
        const d = document.createElement("div"); d.className = "p9-rider";
        let fig = "";
        if (k === "ueno") fig = '<div class="p9-fcard"><div class="p9-logo" style="left:18px; top:38px; width:124px; height:36px"></div></div>';
        if (k === "loan") fig = '<div class="p9-fcard" style="border-top-width:26px"><div class="t-label" style="position:absolute; left:16px; top:18px; font-size:22px; color:var(--ueno-dark)">loan</div><i style="position:absolute; left:16px; top:58px; width:96px; height:7px; background:rgba(12,92,84,0.4)"></i></div>';
        if (k === "co") fig = '<div class="p9-fcard" style="background:var(--ueno-dark); border-color:var(--ueno-light)"><svg viewBox="0 0 100 100" style="position:absolute; left:45px; top:18px; width:70px; height:70px"><g stroke="' + BONE + '" fill="none">' + BLDG + '</g></svg></div>';
        if (k === "bag") fig = '<svg viewBox="0 0 170 124" style="position:absolute; inset:0; overflow:visible"><path d="M62 18 L108 18 L96 36 C140 50 156 86 150 104 C146 118 128 122 85 122 C42 122 24 118 20 104 C14 86 30 50 74 36 Z" fill="' + UENO + '" stroke="' + UENOD + '" stroke-width="5"/><path d="M70 36 L100 36" stroke="' + UENOD + '" stroke-width="6"/><text x="85" y="104" text-anchor="middle" class="t-display" font-size="58" fill="' + BONE + '">$</text></svg>';
        d.innerHTML = '<div class="p9-pole"></div><div class="p9-fig">' + fig + "</div>";
        riders.appendChild(d); R.push({ d: d, pole: d.firstChild, fig: d.lastChild, ph: (i / kinds.length) * Math.PI * 2 });
      });
      const N = 16;
      function draw(a) {
        // cone stripes + band: only the front-facing segments
        let cH = "", bH = "", uH = "";
        for (let k = 0; k < N; k++) {
          const a1 = a + (k / N) * Math.PI * 2, a2 = a + ((k + 1) / N) * Math.PI * 2;
          const s1 = Math.sin(a1), s2 = Math.sin(a2);
          if (s1 < -0.05 && s2 < -0.05) continue;
          const x1 = APEX.x + RIM.rx * Math.cos(a1), y1 = RIM.y + RIM.ry * s1, x2 = APEX.x + RIM.rx * Math.cos(a2), y2 = RIM.y + RIM.ry * s2;
          const col = k % 2 ? BONE : UENO, shade = 0.55 + 0.45 * Math.max(0, (s1 + s2) / 2);
          cH += '<path d="M' + APEX.x + " " + APEX.y + " L" + x1.toFixed(1) + " " + y1.toFixed(1) + " L" + x2.toFixed(1) + " " + y2.toFixed(1) + 'Z" fill="' + col + '" opacity="' + shade.toFixed(2) + '"/>';
          bH += '<path d="M' + x1.toFixed(1) + " " + y1.toFixed(1) + " L" + x2.toFixed(1) + " " + y2.toFixed(1) + " L" + x2.toFixed(1) + " " + (y2 + 84).toFixed(1) + " L" + x1.toFixed(1) + " " + (y1 + 84).toFixed(1) + 'Z" fill="' + UENOD + '" stroke="' + UENOD + '" stroke-width="1"/>';
          const xm = (x1 + x2) / 2, ym = (y1 + y2) / 2 + 84;
          bH += '<path d="M' + x1.toFixed(1) + " " + (y1 + 84).toFixed(1) + " Q" + xm.toFixed(1) + " " + (ym + 26).toFixed(1) + " " + x2.toFixed(1) + " " + (y2 + 84).toFixed(1) + 'Z" fill="' + (k % 2 ? UENO : BONE) + '"/>';
          uH += '<circle cx="' + x1.toFixed(1) + '" cy="' + (y1 + 8).toFixed(1) + '" r="6" fill="#f8e9b8" opacity="' + (0.5 + 0.5 * Math.max(0, s1)).toFixed(2) + '"/>';
        }
        cone.innerHTML = '<ellipse cx="' + APEX.x + '" cy="' + RIM.y + '" rx="' + RIM.rx + '" ry="' + RIM.ry + '" fill="#0a3a35"/>' + cH;
        band.innerHTML = bH; bulbs.innerHTML = uH;
        // finial
        cone.insertAdjacentHTML("beforeend", '<circle cx="' + APEX.x + '" cy="' + (APEX.y - 10) + '" r="14" fill="' + BONE + '"/>');
        R.forEach((r, i) => {
          const th = a + r.ph, s = Math.sin(th), x = CX + AX * Math.cos(th), yb = CY + AY * s - 30;
          const depth = (s + 1) / 2, sc = 0.72 + 0.34 * depth, bob = Math.sin(th * 2 + i) * 26;
          const fy = yb - 150 * sc + bob;
          r.d.style.transform = "translate(" + x.toFixed(1) + "px, 0px)";
          r.d.style.zIndex = String(s > 0 ? 40 + Math.round(depth * 9) : 10 + Math.round(depth * 9));
          r.pole.style.top = (RIM.y + 84 + RIM.ry * s * 0.9).toFixed(1) + "px"; r.pole.style.height = (yb - RIM.y - 84 - RIM.ry * s * 0.9 + 10).toFixed(1) + "px";
          r.pole.style.transform = "scaleX(" + sc.toFixed(2) + ")";
          r.fig.style.transform = "translate(0px," + fy.toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
          r.fig.style.filter = "brightness(" + (0.55 + 0.45 * depth).toFixed(2) + ")";
        });
      }
      const rot = { a: 0 };
      draw(0);
      // rotation at 12 fps; speeds up into the cut
      tl.fromTo(rot, { a: 0 }, { a: 6.0, duration: 6.3, ease: C("none", 6.3), immediateRender: false, onUpdate: () => draw(rot.a) }, S(1034.87));
      tl.to(rot, { a: 10.5, duration: 1.43, ease: C("power2.in", 1.43), onUpdate: () => draw(rot.a) }, S(1041.17));
      // circulation ring marches round the base on "pay the bank back"
      tl.to(ring, { opacity: 0.85, duration: 0.4 }, S(1037.55));
      const dm = { o: 0 };
      tl.fromTo(dm, { o: 0 }, { o: -480, duration: 5.0, ease: C("none", 5.0), immediateRender: false, onUpdate: () => ring.setAttribute("stroke-dashoffset", dm.o.toFixed(1)) }, S(1037.55));
      // backdrop parallax + camera: close on the ride, pull back on "has a name", push into the cut
      tl.fromTo($("sc020-bg"), { x: 40 }, { x: -60, duration: 7.73, ease: "none", immediateRender: false }, S(1034.87));
      const cam = $("sc020-cam");
      tl.fromTo(cam, { scale: 1.22, x: -60, y: 60 }, { scale: 1.12, x: -40, y: 40, duration: 5.2, ease: E.cam, immediateRender: false }, S(1034.87));
      tl.to(cam, { scale: 0.96, x: -70, y: 30, duration: 1.3, ease: E.cam }, S(1040.20));
      tl.to(cam, { scale: 1.02, duration: 1.1, ease: "power1.in" }, S(1041.50));
      words("sc020-a", [T(1035.85), T(1036.25), T(1036.49), T(1036.57), T(1036.65)], { dur: 0.35, y: 10 });
      out($("sc020-a"), S(1037.40), 0.15);
      words("sc020-b", [T(1037.53), T(1037.77), T(1037.93), T(1038.25)], { dur: 0.35, y: 10 });
      out($("sc020-b"), S(1039.05), 0.15);
      words("sc020-c", [T(1039.21), T(1039.61), T(1039.77)], { dur: 0.35, y: 10 });
      out($("sc020-c"), S(1040.80), 0.3);
      words("sc020-title", [T(1041.53), T(1042.01), T(1042.25)], { dur: 0.3, y: 14 });
    })();

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
</template>
