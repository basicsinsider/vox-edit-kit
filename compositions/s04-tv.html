    tl.fromTo("#s04-flash", { opacity: 1 }, { opacity: 0, duration: 0.55, ease: "power2.out" }, 0.25);

    // Stanford / UC Berkeley / 1920s
    FX.text.odometer(tl, $("s04-st"), T(75.9), { dur: 0.6, stagger: 0.03, spins: 5, seed: 41 });
    tl.fromTo("#s04-amp", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T(76.5));
    FX.text.odometer(tl, $("s04-uc"), T(76.75), { dur: 0.6, stagger: 0.03, spins: 5, seed: 42 });
    tl.fromTo("#s04-era", { opacity: 0 }, { opacity: 1, duration: 0.01 }, T(78.2));
    FX.text.fill(tl, $("s04-y"), T(78.5), { per: 0.05, hold: 0.25, settle: 0.4, cool: "#f2cf3b" });
    tl.to("#s04-text", { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, T(81.2));

    // "opportunities in the West were scarce."
    FX.text.rise(tl, [$("s04-l1")], T(81.6), { dur: 0.6 });
    tl.fromTo("#s04-l2", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(83.35));

    FX.mount(tl, 10.2);
    window.__timelines["s04"] = tl;
