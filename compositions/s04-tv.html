<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--night); }
    #s04-defs { position: absolute; width: 0; height: 0; }
    #s04-bg { position: absolute; left: -260px; top: -150px; width: 2500px; height: 1350px; overflow: hidden; }
    #s04-bg img { position: absolute; left: -60px; top: -40px; width: 2620px; filter: url(#s04-tint) blur(3px); opacity: 0.5; }
    #s04-bgshade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,19,18,0.35) 0%, rgba(20,19,18,0.15) 45%, rgba(20,19,18,0.82) 70%, rgba(20,19,18,0.9) 100%); }
    #s04-set { position: absolute; left: 110px; top: 96px; width: 960px; height: 915px; }
    #s04-tube { position: absolute; left: 88px; top: 84px; width: 650px; height: 480px; background: radial-gradient(ellipse at 50% 45%, #1c1c1b, #050505 75%); }
    #s04-screen { position: absolute; left: 88px; top: 84px; width: 650px; height: 480px; overflow: hidden; background: #0b0b0b; transform-origin: 50% 50%; }
    #s04-film { position: absolute; left: 0; top: 0; width: 650px; height: 480px; object-fit: cover; }
    #s04-flash { position: absolute; inset: 0; background: #f4eee2; opacity: 0; mix-blend-mode: screen; }
    #s04-glare { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 45% at 30% 22%, rgba(255,250,240,0.20), rgba(255,250,240,0) 70%); mix-blend-mode: screen; }
    #s04-tv { position: absolute; left: 0; top: 0; width: 960px; height: 915px; filter: drop-shadow(0 30px 50px rgba(0,0,0,0.6)); }
    #s04-col { position: absolute; left: 1150px; top: 250px; width: 700px; }
    #s04-kick { font-size: 24px; color: #d9cdb9; }
    #s04-stan, #s04-berk { font-size: 104px; line-height: 1.04; white-space: nowrap; }
    #s04-or { font-size: 46px; color: #e8dccb; margin: 2px 0 0 4px; }
    #s04-era { margin-top: 34px; }
    #s04-era .k { font-size: 24px; color: #d9cdb9; }
    #s04-1920 { font-size: 130px; line-height: 1; margin-top: 6px; display: inline-block; transform-origin: 0 70%; }
    #s04-col2 { position: absolute; left: 1150px; top: 330px; width: 760px; }
    #s04-after { font-size: 50px; color: #e8dccb; }
    #s04-opp { font-size: 56px; line-height: 1.12; margin-top: 26px; color: var(--bone); }
    #s04-opp .west { color: var(--vermilion); font-style: normal; font-weight: 600; }
    #s04-scarce { font-size: 172px; line-height: 1; margin-top: 18px; filter: url(#s04-rough); }
  </style>
  <div id="root" data-composition-id="s04" data-width="1920" data-height="1080">
    <svg id="s04-defs"></svg>
    <div id="s04-bg"><img src="assets/archival/hoover/stanford_inner_quad_west_entrance_c1900.jpg" alt="" /><div id="s04-bgshade"></div></div>
    <div id="s04-set">
      <div id="s04-tube"></div>
      <div id="s04-screen">
        <video id="s04-film" class="clip" src="assets/archival/footage/berkeley_1932_grad_cut.mp4" muted playsinline
          data-start="0.3" data-duration="9.9" data-media-start="0" data-track-index="2"
          data-color-grading='{"intensity":1,"adjust":{"saturation":-1,"contrast":0.1},"effects":{"chromaticAberration":0.35,"chromaticAngle":0,"scanlines":0.4,"scanlineCount":0.17,"scanlineSoftness":1,"crtCurvature":0.35,"filmArtifacts":0.45}}'></video>
        <div id="s04-flash"></div>
        <div id="s04-glare"></div>
      </div>
      <img id="s04-tv" src="assets/textures/tv_frame_01.png" alt="" />
    </div>
    <div id="s04-col">
      <div id="s04-kick" class="t-label halate">studying at</div>
      <div id="s04-stan" class="t-display halate">STANFORD</div>
      <div id="s04-or" class="t-serif-i halate">or</div>
      <div id="s04-berk" class="t-display halate">UC BERKELEY</div>
      <div id="s04-era"><div class="k t-label halate">at this time, in the</div><div id="s04-1920" class="t-display halate yellow">1920s</div></div>
    </div>
    <div id="s04-col2">
      <div id="s04-after" class="t-serif-i halate"><span>after </span><span>you </span><span>graduate,</span></div>
      <div id="s04-opp" class="t-serif-i halate"><span>Opportunities </span><span>in </span><span>the </span><span class="west">West </span><span>were</span></div>
      <div id="s04-scarce" class="t-display halate">scarce.</div>
    </div>
    <div id="s04-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_01_norm.jpg')"></div>
    <div id="s04-dust" class="tx tx-dust" style="background-image:url('assets/textures/dust_01.jpg'); opacity:0.38"></div>
    <div class="vignette"></div>
    <audio id="s04-vo" src="vo10.mp3" data-start="0" data-duration="10.2" data-media-start="73.7" data-volume="1"></audio>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const T = (s) => +(s - 73.7).toFixed(3);
    const S = T;
    const $ = (id) => document.getElementById(id);
    const defs = $("s04-defs");
    FX.tintDefs(defs, "s04-tint", "#100f0e", "#8a7a64");
    const morph = FX.roughDefs(defs, "s04-rough", { freq: 0.04, scale: 6, choke: 9 });
    FX.grain($("s04-grain"), 51);
    FX.dust($("s04-dust"), 53, 2);
    FX.weave($("s04-screen"), { amp: 0.9, rot: 0.03, flicker: 0.05, seed: 54 });

    // Stanford backdrop drifts slowly (camera)
    tl.fromTo("#s04-bg", { x: 0, scale: 1.04 }, { x: -70, scale: 1.0, duration: 10.2, ease: "none" }, 0);
    tl.fromTo("#s04-set", { x: -10, scale: 0.985, transformOrigin: "40% 60%" }, { x: 10, scale: 1.015, duration: 10.2, ease: "none" }, 0);

    // CRT power-on: a bright line opens to the full picture with a white flash
    tl.fromTo("#s04-screen", { scaleY: 0.012, scaleX: 0.7 }, { scaleY: 1, scaleX: 1, duration: 0.32, ease: FX.choppy("expo.out", 0.32, 24), immediateRender: true }, S(74.0));
    tl.fromTo("#s04-flash", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: true }, S(74.0));

    // "studying at" / STANFORD / or / UC BERKELEY — odometer reels
    FX.text.rise(tl, [$("s04-kick")], T(75.07), { dur: 0.4, y: 8, blur: 6 });
    FX.text.odometer(tl, $("s04-stan"), T(75.95), { dur: 0.6, stagger: 0.035, seed: 41 });
    FX.text.rise(tl, [$("s04-or")], T(76.51), { dur: 0.3, y: 6, blur: 4 });
    FX.text.odometer(tl, $("s04-berk"), T(76.75), { dur: 0.6, stagger: 0.035, seed: 42 });
    // "this time in the 1920s" — yellow pop at 12 fps
    FX.text.rise(tl, [$("s04-era").querySelector(".k")], T(77.71), { dur: 0.4, y: 8, blur: 6 });
    tl.fromTo("#s04-1920", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.33, ease: FX.choppy("back.out(2.2)", 0.33, 12), immediateRender: true }, T(78.51));
    tl.to("#s04-col", { y: -40, opacity: 0, duration: 0.3, ease: "power2.in" }, S(79.5));

    // "after you graduate," — word by word
    [T(79.95), T(80.35), T(80.59)].forEach((c, i) => tl.fromTo($("s04-after").children[i], { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, c));
    // "Opportunities in the West were"
    const oppT = [T(81.55), T(82.35), T(82.51), T(82.59), T(83.07)];
    oppT.forEach((c, i) => tl.fromTo($("s04-opp").children[i], { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.12, immediateRender: true }, c));
    // "scarce." — Simple Choker reveal with rough, boiling edges at 12 fps
    tl.fromTo("#s04-scarce", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(83.39));
    FX.choke(tl, morph, T(83.39), 9, 0.42);

    FX.mount(tl, 10.2);
    window.__timelines["s04"] = tl;
  })();
  </script>
</template>
</body>
</html>
