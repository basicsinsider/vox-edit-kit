      const A = $(a + "-shot"), B = $(b + "-shot"), h = 0.16;
      const ba = FX.whipDefs(defs, SEG + "-wa" + k), bb = FX.whipDefs(defs, SEG + "-wb" + k);
      tl.set(A, { filter: "url(#" + SEG + "-wa" + k + ")" }, t - h - 0.01); tl.set(A, { filter: "none" }, t + 0.06);
      tl.set(B, { filter: "url(#" + SEG + "-wb" + k + ")" }, t - 0.001); tl.set(B, { filter: "none" }, t + h + 0.02);
      FX.whip(tl, A, B, t, { dir: dir, dur: 0.32, blurA: ba, blurB: bb });
    };

    /* ===== sc001 · 3087.93–3094.05 · the ruler's portrait on a street billboard — "a dictatorship, one-party state" ===== */
    (function () {
      tl.fromTo($("s1-cam"), { scale: 1.0 }, { scale: 1.07, duration: 6.3, ease: "none", immediateRender: true }, 0);
      const on = FX.onFrame; FX.onFrame = (f) => on(FX.gate(0, S(3094.3), f));
      FX.weave($("s1-wv"), { amp: 0.7, rot: 0.02, flicker: 0.05, seed: 26 });
      FX.onFrame = on;
      tl.set($("s1-tagbox"), { opacity: 1 }, T(3093.00));
      rise($("s1-t1"), T(3093.00), { dur: 0.3, y: 8 });   // one(-party)
      rise($("s1-t2"), T(3093.48), { dur: 0.3, y: 8 });   // state
    })();

    whip("sc001", "sc002", S(3094.21), 1, 1);

    /* ===== sc002 · 3094.05–3103.95 · the name card: Chiang Kai-shek ===== */
    (function () {
      const a = S(3094.05);
      tl.fromTo($("s2-cam"), { scale: 1.0 }, { scale: 1.04, duration: 9.9, ease: "none", immediateRender: false }, a);
      tl.fromTo($("s2-block"), { scaleY: 0.2 }, { scaleY: 1, duration: 1.0, ease: C(E.out, 1.0), immediateRender: true }, a + 0.1);
      tl.fromTo($("s2-fig"), { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 1.1, ease: C(E.out, 1.1), immediateRender: true }, a + 0.12);
      rise($("s2-n1"), T(3094.77), { dur: 0.45, y: 20 });   // Chiang
      rise($("s2-n2"), T(3095.33), { dur: 0.4, y: 20 });    // Kai-
      rise($("s2-n3"), T(3095.81), { dur: 0.4, y: 20 });    // shek
      tl.fromTo($("s2-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: C(E.out, 0.6), immediateRender: true }, S(3096.3));
      rise($("s2-r1"), T(3096.53), { dur: 0.4, y: 10 });    // ruling (the country)
      rise($("s2-r2"), T(3097.57), { dur: 0.4, y: 10 });    // nationalist
      rise($("s2-r3"), T(3098.35), { dur: 0.4, y: 10 });    // general
      land($("s2-c1"), S(3098.45), { rot: -3, dr: -6, dur: 0.9 });               // the general, 1945
      land($("s2-c2"), S(3100.95), { rot: 2.5, dr: 6, dur: 0.9 });               // "when the government comes to Taiwan"
      rise($("s2-twl"), T(3101.63), { dur: 0.4, y: 8 });    // Taiwan
      // "he basically takes over the country": pen circle round the island (markup emphasis)
      const svg = $("s2-mk"); FX.markupDefs(svg, SEG + "-pen", { boil: 4 }); svg.setAttribute("viewBox", "0 0 1920 1080");
      const c = FX.markup.circle(tl, svg, S(3102.75), { cx: 1397, cy: 786, rx: 96, ry: 124, rot: -8, dur: 0.6, seed: 5, color: MAG, width: 7, filter: "url(#" + SEG + "-pen)" });
      gsap.set(c, { opacity: 0 }); tl.set(c, { opacity: 1 }, S(3102.75));
    })();

    whip("sc002", "sc003", S(3103.99), -1, 2);

    /* ===== sc003 · 3103.95–3113.00 · Taiwan's dictatorship vs China's: Chiang | Mao ===== */
    (function () {
      const a = S(3103.95);
      tl.fromTo($("s3-cam"), { scale: 1.0 }, { scale: 1.05, duration: DUR - a, ease: "none", immediateRender: false }, a);
      gsap.set($("s3-c1"), { rotation: -2 });
      rise($("s3-tw"), T(3104.27), { dur: 0.45, y: 12 });    // Taiwanese (dictatorship)
      // "different": a pen ≠ between the two cards
      const svg = $("s3-ne"); FX.markupDefs(svg, SEG + "-pen3", { boil: 4 }); svg.setAttribute("viewBox", "0 0 1920 1080");
      const f = "url(#" + SEG + "-pen3)";
      [[[900, 484], [1020, 478]], [[900, 540], [1020, 534]], [[990, 432], [930, 588]]].forEach((p, i) => {
        FX.markup.pen(tl, svg, S(3106.83) + i * 0.16, { points: p, jitter: 5, seed: 7 + i, dur: 0.22, width: 11, color: MAG, blend: "normal", filter: f });
      });
      // the other side: China — card arrives face down, turns over on the name
      tl.to($("s3-band2"), { opacity: 1, duration: 0.4, ease: C(E.out, 0.4) }, a + 0.5);
      land($("s3-c2"), a + 0.4, { rot: 2, dr: 7, dur: 0.9, y: -90 });
      rise($("s3-cn"), T(3107.55), { dur: 0.45, y: 12 });    // Chinese (dictatorship … in China)
      tl.fromTo($("s3-ccp"), { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.3, ease: C(E.out, 0.3), immediateRender: true }, T(3109.87));   // CCP
      const t = T(3111.23);                                   // Mao
      tl.to($("s3-c2"), { scaleX: 0.02, duration: 0.14, ease: "power2.in" }, t - 0.14);
      tl.set($("s3-back"), { opacity: 0 }, t);
      tl.to($("s3-c2"), { scaleX: 1, duration: 0.3, ease: C(E.out, 0.3) }, t);
      rise($("s3-m1"), T(3111.23), { dur: 0.3, y: 10 });      // Mao
      rise($("s3-m2"), T(3111.63), { dur: 0.3, y: 10 });      // Zedong
    })();

    FX.grain($("grain"), 3); FX.dust($("dust"), 5, 2);
    FX.mount(tl, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
