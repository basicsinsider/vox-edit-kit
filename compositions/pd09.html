          <img id="pd09-c2i" src="assets/archival/hp/packard_david_1933.jpg" alt="" style="object-position:38% 20%; filter:url(#pd09-tint)"></div></div>

  <script>
  (function () {
    const SEG = "pd09", START = 1107.5, DUR = 22.4667;
    const T = (s) => +(s - START).toFixed(3);   // TEXT cues (audited): literal = word start − 0.06
    const S = (s) => +(s - START).toFixed(3);   // structural cues
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(SEG + "-" + id);
    const defs = $("defs"), E = FX.ease, C = (e, d) => FX.choppy(e, d, 12);
    FX.tintDefs(defs, SEG + "-tint", "#12151c", "#e6e7e2");
    const rise = (el, t, o) => { o = o || {}; const d = o.dur || 0.6;
      tl.fromTo(el, { opacity: 0, y: o.y == null ? 16 : o.y }, { opacity: 1, y: 0, duration: d, ease: C(E.out, d), immediateRender: true }, t); };

    FX.streaks($("streaks"), { seed: 23, speed: 0.5, xfreq: 0.1, lo: 0.46, hi: 0.96, gamma: 2.6, tint: [200, 205, 215], gain: 0.9 });

    // ---- beat 1 · 1107.50–1115.7 · "So in nineteen thirty eight, roughly a decade after he starts teaching…"
    gsap.set($("fred"), { x: -70, opacity: 1 });
    tl.fromTo($("fred"), { x: -70 }, { x: 0, duration: 1.6, ease: C(E.out, 1.6), immediateRender: false }, 0);
    tl.fromTo($("cam"), { scale: 1.05 }, { scale: 1.0, duration: 8.2, ease: "sine.out", immediateRender: true }, 0);
    rise($("fredtag"), S(1107.62), { dur: 0.5 });       // name tag for the man on screen (not a narration cue)
    rise($("fredrole"), S(1107.86), { dur: 0.5 });
    FX.text.odometer(tl, $("year"), T(1107.96), { dur: 0.55, stagger: 0.04, spins: 6, seed: 4 });   // nineteen thirty eight

    // decade ruler: alive from frame 0; the magenta dot runs ten ticks on "roughly a decade after he starts teaching"
    (function () {
      const NS = "http://www.w3.org/2000/svg", g = document.createElementNS(NS, "g"); $("rule").appendChild(g);
      const mk = (tag, a) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); g.appendChild(n); return n; };
      const X0 = 812, X1 = 1772, Y = 742;
      const base = mk("line", { x1: X0, y1: Y, x2: X1, y2: Y, stroke: "#c2c5ca", "stroke-width": 3, "stroke-opacity": 0.7 });
      gsap.set(base, { attr: { x2: X0 + 120 } });
      tl.fromTo(base, { attr: { x2: X0 + 120 } }, { attr: { x2: X1 }, duration: 1.3, ease: C(E.out, 1.3), immediateRender: false }, 0);
      for (let i = 0; i <= 10; i++) {
        const x = X0 + (X1 - X0) * i / 10, tk = mk("line", { x1: x, y1: Y - (i % 10 === 0 ? 22 : 12), x2: x, y2: Y + (i % 10 === 0 ? 22 : 12), stroke: "#c2c5ca", "stroke-width": 3, "stroke-opacity": 0.7 });
        if (i > 1) { gsap.set(tk, { opacity: 0 }); tl.set(tk, { opacity: 1 }, 0.1 + i * 0.1); }
      }
      const span = mk("line", { x1: X0, y1: Y, x2: X0, y2: Y, stroke: "#d1307a", "stroke-width": 7, "stroke-linecap": "round" });
      const dot = mk("circle", { cx: X0, cy: Y, r: 13, fill: "#d1307a" });
      gsap.set([span, dot], { opacity: 0 });
      tl.set([span, dot], { opacity: 1 }, S(1108.98));
      const pr = { v: 0 };
      tl.fromTo(pr, { v: 0 }, { v: 1, duration: 1.6, ease: C(E.inOut, 1.6), immediateRender: false,
        onUpdate: () => { const x = X0 + (X1 - X0) * pr.v; span.setAttribute("x2", x); dot.setAttribute("cx", x); } }, S(1108.98));
      tl.to(g, { opacity: 0, duration: 0.5, ease: "power1.in" }, S(1115.5));
    })();

    // ---- beat 2 · 1115.78–1123.9 · "two of his favorite students … keep them in the West"
    tl.to($("year"), { scale: 0.36, x: 0, y: -234, duration: 1.3, ease: C(E.inOut, 1.3) }, S(1115.7));
    tl.to($("fred"), { x: -40, duration: 1.3, ease: C(E.inOut, 1.3) }, S(1115.7));
    [["c1", -3, 1117.88, -1], ["c2", 2.5, 1118.2, 1]].forEach((c) => {
      gsap.set($(c[0]), { rotation: c[1] });
      tl.fromTo($(c[0]), { opacity: 0, y: -90, rotation: c[1] + c[3] * 7 }, { opacity: 1, y: 0, rotation: c[1], duration: 0.9, ease: C(E.out, 0.9), immediateRender: false }, S(c[2]));
    });
    gsap.set([$("c1i"), $("c2i")], { clipPath: "inset(0% 0% 100% 0%)", webkitClipPath: "inset(0% 0% 100% 0%)" });
    tl.fromTo($("cam"), { scale: 1.0 }, { scale: 1.035, duration: 8.2, ease: "sine.inOut", immediateRender: false }, S(1115.7));

    // ---- beat 3 · 1124.02–1129.97 · "Bill Hewlett and David Packard. — HP founders."
    const reveal = (img, t) => tl.fromTo(img, { clipPath: "inset(0% 0% 100% 0%)", webkitClipPath: "inset(0% 0% 100% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", webkitClipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: C(E.out, 0.5), immediateRender: false }, t);
    reveal($("c1i"), S(1125.9));
    reveal($("c2i"), S(1126.96));
    rise($("n1a"), T(1125.96), { dur: 0.4, y: 14 });   // Bill
    rise($("n1"), T(1126.28), { dur: 0.4, y: 14 });    // Hewlett
    rise($("n2a"), T(1127.00), { dur: 0.4, y: 14 });   // David
    rise($("n2"), T(1127.32), { dur: 0.4, y: 14 });    // Packard
    // HP — only on Sunkit's answer
    tl.to([$("h"), $("p")], { color: "#f3a6c8", duration: 0.001 }, T(1129.00));
    tl.fromTo($("hp"), { opacity: 0, scale: 1.5, rotation: -9 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: C(E.out, 0.3), immediateRender: true }, T(1129.00));   // HP
    rise($("founders"), T(1129.48), { dur: 0.2, y: 6 });   // founders

    FX.grain($("grain"), 3); FX.dust($("dust"), 5, 2);
    FX.mount(tl, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
