      tl.fromTo(board, { opacity: 0, x: 420 }, { opacity: 1, x: 0, duration: 1.2, ease: C(E.out, 1.2), immediateRender: true }, S(1805.45));
      // pen arrow: the transistor goes INTO the machine
      const mk = $("a-mk");
      const pen = FX.markupDefs(mk, SEG + "-apen", { boil: 4 });
      FX.markup.arrow(tl, mk, S(1806.9), { x1: 300, y1: 456, x2: 576, y2: 520, bend: -44, head: 30, dur: 0.6, color: INK, width: 6, filter: pen }).forEach((p) => { gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, S(1806.9)); });
      // rows of transistors glued in, 12 fps, accelerating
      const glyph = (c) => "url(\"data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='44' height='36' viewBox='0 0 44 36'><circle cx='22' cy='13' r='7.5' fill='" + c + "'/><path d='M17 19 V31 M22 19 V33 M27 19 V31' stroke='" + c + "' stroke-width='1.8' fill='none'/></svg>") + "\")";
      const rows = $("a-rows");
      $("a-dense").style.backgroundImage = glyph(INK);
      let t = S(1807.37), gap = 0.26;
      for (let i = 0; i < 20; i++) {
        const r = document.createElement("div"); r.className = "d14-row"; r.style.top = i * 36 + "px"; r.style.backgroundImage = glyph(INK); rows.appendChild(r);
        const d = Math.max(0.16, gap * 1.6);
        tl.fromTo(r, { width: 0 }, { width: 1188, duration: d, ease: FX.choppy("none", d, 24), immediateRender: true }, t);
        t += gap; gap = Math.max(0.035, gap * 0.78);
      }
      // "tens of thousands": the board pulls back — the rows were one small corner of it
      tl.fromTo(rows, { scale: 1 }, { scale: 0.32, duration: 1.2, ease: C(E.inOut, 1.2), immediateRender: false }, S(1808.50));
      rise($("a-n1"), T(1808.41), { dur: 0.4, y: 14 });   // "tens (of)"
      rise($("a-n2"), T(1808.89), { dur: 0.4, y: 14 });   // "thousands"
      tl.to("#pd14-a-n1 i", { scaleX: 1, duration: 0.3, ease: C("power1.inOut", 0.3) }, S(1809.15));
      tl.to("#pd14-a-n2 i", { scaleX: 1, duration: 0.35, ease: C("power1.inOut", 0.35) }, S(1809.40));
    })();

    // ================= B · the same hand-wiring for every machine =================
    (function () {
      const belt = $("b-belt"), iron = $("b-iron"), PITCH = 640, N = 6;
      // soldering iron (tip at the div's origin)
      iron.querySelector("svg").innerHTML =
        '<g transform="translate(0,420) rotate(-38)">' +
        '<path d="M0 0 L26 -9 L26 9 Z" fill="' + INK + '"/><rect x="24" y="-7" width="120" height="14" fill="' + ASH + '"/><rect x="140" y="-12" width="26" height="24" fill="' + INK + '"/>' +
        '<rect x="164" y="-22" width="250" height="44" rx="20" fill="' + INK + '"/><rect x="190" y="-22" width="26" height="44" fill="' + MAG + '"/></g>';
      const W = wires(41, 6, 9, 9, 65, 110, 50, 50);
      const devs = [];
      for (let k = 0; k < N; k++) {
        const d = document.createElement("div"); d.className = "d14-dev"; d.style.left = (770 + k * PITCH) + "px";
        let h = '<svg viewBox="0 0 380 640"><rect x="4" y="4" width="372" height="632" rx="46" fill="' + BONE + '" stroke="' + INK + '" stroke-width="6"/>';
        h += '<rect x="36" y="82" width="308" height="456" rx="8" fill="none" stroke="' + INK + '" stroke-width="3" opacity="0.55"/>';

        h += '<g class="wr"></g><g class="ph" fill="none" stroke="' + INK + '" stroke-width="5" stroke-linecap="round"><circle cx="190" cy="588" r="24"/><path d="M150 44 H230"/></g></svg>';
        d.innerHTML = h; belt.appendChild(d);
        const no = document.createElement("div"); no.className = "d14-no t-display"; no.style.left = (770 + k * PITCH) + "px"; no.textContent = "No. " + (k + 1); belt.appendChild(no);
        const g = d.querySelector(".wr"), ph = d.querySelector(".ph");
        const paths = W.map((w) => { const p = el(g, "path", { d: w.d, fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round" });

          const a = el(g, "circle", { cx: w.ax, cy: w.ay, r: 8, fill: INK }), b = el(g, "circle", { cx: w.bx, cy: w.by, r: 8, fill: INK }); gsap.set([a, b], { opacity: 0 }); return { p, a, b, w }; });

      shift(2, S(1815.65), 0.65); wire(2, S(1816.35), S(1817.70), 0);
      shift(3, S(1817.75), 0.5); wire(3, S(1818.30), S(1819.00), 0);

    })();

    // ================= C · one bad wire — the whole thing is dead =================

      h += '<g id="pd14-c-pd" fill="' + BONE + '" stroke="' + ASHD + '" stroke-width="4">';
      for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) h += '<circle cx="' + (X0 + c * D) + '" cy="' + (Y0 + r * D) + '" r="9"/>';
      h += "</g>";
      // the hero wire (centre) + its two broken halves
      h += '<path id="pd14-c-hero" d="M905 430 Q1050 470 1125 650" fill="none" stroke="' + ASHL + '" stroke-width="7" stroke-linecap="round"/>';
      h += '<g id="pd14-c-brk" fill="none" stroke="' + MAGL + '" stroke-width="7" stroke-linecap="round" opacity="0"><path d="M905 430 Q975 440 1010 468 Q1030 452 1022 430"/><path d="M1125 650 Q1108 580 1066 536 Q1082 520 1104 524"/></g>';
      h += '<g id="pd14-c-spk" stroke="' + BONE + '" stroke-width="5" stroke-linecap="round" opacity="0"><path d="M1040 500 L1040 452 M1040 500 L1088 478 M1040 500 L996 520 M1040 500 L1066 546 M1040 500 L1006 462"/></g>';

      svg.innerHTML = h;
      const wr = $("c-wr"), pl = $("c-pl"), pd = $("c-pd"), hero = $("c-hero"), brk = $("c-brk"), spk = $("c-spk"), ms = $("c-ms");
      const t0 = S(1819.95);
      // current pulses run along every wire until the break
      const dm = { o: 0 };
      tl.fromTo(dm, { o: 0 }, { o: -760, duration: 3.6, ease: C("none", 3.6), immediateRender: false, onUpdate: () => pl.setAttribute("stroke-dashoffset", dm.o.toFixed(1)) }, t0);

      const circ = FX.markup.circle(tl, mk, S(1822.09), { cx: 1022, cy: 532, rx: 190, ry: 168, rot: -8, dur: 0.6, color: MAG, width: 9, filter: pen, seed: 5 });
      gsap.set(circ, { opacity: 0 }); tl.set(circ, { opacity: 1 }, S(1822.09));
      show($("c-tag"), T(1822.09));   // "one (wire)"

      tl.set(hero, { opacity: 0 }, S(1822.93)); tl.set(brk, { opacity: 1 }, S(1822.93));
      tl.set(spk, { opacity: 1 }, S(1822.93)); tl.set(spk, { opacity: 0 }, S(1822.93) + 2 / 12);

      [[1823.51, 0.55, 0.8], [1823.83, 0.4, 0.6], [1824.15, 0.24, 0.4]].forEach((k) => { tl.set(wr, { opacity: k[1] }, S(k[0])); tl.set(pd, { opacity: k[2] }, S(k[0])); });
      // "imagine … if you're building missiles": pull back — the board sits inside a missile
      const SCL = 0.34;
      tl.to($("c-tag"), { opacity: 0, duration: 0.2 }, S(1824.47));
      tl.to(cam, { scale: SCL, x: -78, duration: 2.3, ease: E.cam }, S(1824.47));
      ink(ms, "M-700 -300 L2620 -300 Q3320 -270 3700 540 Q3320 1350 2620 1380 L-700 1380 Z", S(1825.55), 1.6, { color: BONE, width: 15, ease: C("power1.inOut", 1.6) });
      ink(ms, "M-700 -300 L-1250 -620 L-1250 -120 L-700 150", S(1826.3), 0.7, { color: BONE, width: 15, ease: C("power1.out", 0.7) });
      ink(ms, "M-700 1380 L-1250 1700 L-1250 1200 L-700 930", S(1826.3), 0.7, { color: BONE, width: 15, ease: C("power1.out", 0.7) });
      ink(ms, "M-700 330 L-920 250 L-920 830 L-700 750", S(1826.6), 0.5, { color: BONE, width: 15, ease: C("power1.out", 0.5) });
      ink(ms, "M2200 -290 L2204 1370", S(1826.9), 0.35, { color: BONE, width: 9, opacity: 0.55, ease: C("none", 0.35) });
      ink(ms, "M-250 -290 L-246 1370", S(1826.9), 0.35, { color: BONE, width: 9, opacity: 0.55, ease: C("none", 0.35) });
      // the break keeps blinking inside the missile (12 fps), camera keeps drifting
      const big = el(mk, "circle", { cx: 1022, cy: 532, r: 330, fill: "none", stroke: MAGL, "stroke-width": 26, opacity: 0 });
      for (let i = 0; i < 4; i++) { tl.set(big, { opacity: 0.9 }, S(1827.0) + i * 0.34); tl.set(big, { opacity: 0.25 }, S(1827.0) + i * 0.34 + 0.17); }
      tl.to(cam, { scale: SCL * 1.04, duration: 1.7, ease: "none" }, S(1826.77));
    })();

    // ================= D · the desk: who is working on it, and the wish =================
    (function () {
      const t0 = S(1828.40), cam = $("d-cam"), mk = $("d-mk");
      const pen = FX.markupDefs(mk, SEG + "-dpen", { boil: 4 });

      let h = '<g fill="none" stroke="' + ASHL + '" stroke-width="2.4" stroke-linecap="round" opacity="0.75">' + W.map((w) => '<path d="' + w.d + '"/>').join("") + "</g><g fill=\"" + BONE + '">';
      for (let c = 0; c < 16; c++) for (let r = 0; r < 9; r++) h += '<circle cx="' + (46 + c * 32) + '" cy="' + (41 + r * 40) + '" r="3.4"/>';
      h += '</g><path d="M268 150 Q290 160 300 172 M336 240 Q328 214 314 198" fill="none" stroke="' + MAGL + '" stroke-width="5" stroke-linecap="round"/>';
      h += '<circle cx="302" cy="194" r="58" fill="none" stroke="' + MAGL + '" stroke-width="5"/>';

      const ph1 = $("d-ph1"), ph2 = $("d-ph2"), c1 = $("d-c1"), c2 = $("d-c2");
      // "people who are working on solving this issue": Bell Labs engineers at the hand-wired TRADIC
      tl.fromTo(ph1, { x: -640, rotation: -12 }, { x: 0, rotation: -3, duration: 1.1, ease: C(E.out, 1.1), immediateRender: false }, t0 - 0.1);
      show(c1, t0 + 1.0);
      // "How can we standardize this process": a clean, printed-looking template …
      const box = $("d-tpls"), tp = [];
      for (let k = 3; k >= 0; k--) {
        const d = document.createElement("div"); d.className = "d14-tpl";
        let s = '<svg viewBox="0 0 392 282"><g fill="none" stroke="' + INK + '" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">';
        s += '<path class="tr" d="M60 60 H200 V110 H332"/><path class="tr" d="M60 110 H150 V172 H332"/><path class="tr" d="M60 172 H110 V222 H260"/><path class="tr" d="M260 60 H332"/><path class="tr" d="M190 222 V172"/></g><g fill="' + INK + '">';
        [[60, 60], [60, 110], [60, 172], [332, 110], [332, 172], [260, 222], [260, 60], [332, 60], [190, 222]].forEach((p) => { s += '<rect x="' + (p[0] - 9) + '" y="' + (p[1] - 9) + '" width="18" height="18"/>'; });
        s += "</g></svg>"; d.innerHTML = s; box.appendChild(d); tp[k] = d;
        if (k) gsap.set(d, { opacity: 0 });
      }
      tl.fromTo(tp[0], { x: 760, rotation: 8 }, { x: 0, rotation: 1.5, duration: 1.0, ease: C(E.out, 1.0), immediateRender: true }, S(1831.45));
      Array.from(tp[0].querySelectorAll(".tr")).forEach((p, i) => { const len = p.getTotalLength() || 1; p.setAttribute("stroke-dasharray", len + " " + len);
        tl.fromTo(p, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: C("none", 0.5), immediateRender: true }, S(1832.39) + i * 0.16); });
      // … with a pen question mark (it is still only a question)
      const q1 = FX.markup.pen(tl, mk, S(1833.61), { points: [[1500, 196], [1530, 150], [1590, 150], [1612, 190], [1570, 226], [1560, 252]], jitter: 5, seed: 8, dur: 0.6, width: 8, color: MAG, filter: pen });
      const q2 = FX.markup.pen(tl, mk, S(1834.25), { points: [[1557, 276], [1562, 282]], jitter: 1, seed: 9, dur: 0.12, width: 11, color: MAG, filter: pen });
      [[q1, 1833.61], [q2, 1834.25]].forEach((q) => { gsap.set(q[0], { opacity: 0 }); tl.set(q[0], { opacity: 1 }, S(q[1])); });
      // "replicated": identical copies deal out, 12 fps
      [1, 2, 3].forEach((k) => {
        const t = S(1835.72) + (k - 1) * 0.25;
        tl.set(tp[k], { opacity: 1, rotation: 1.5 }, t);
        tl.fromTo(tp[k], { x: 0, y: 0 }, { x: -34 * k, y: 96 * k, duration: 0.5, ease: C(E.out, 0.5), immediateRender: false }, t);
      });
      // "without having to do it by hand individually": the HP wiring line, crossed out by the pen
      tl.fromTo(ph2, { x: -700, rotation: 14 }, { x: 0, rotation: 3.5, duration: 1.0, ease: C(E.out, 1.0), immediateRender: true }, S(1836.30));
      show(c2, S(1837.25));
      const x1 = FX.markup.pen(tl, mk, S(1837.40), { points: [[196, 610], [520, 950]], jitter: 10, seed: 3, dur: 0.3, width: 10, color: MAG, filter: pen });
      const x2 = FX.markup.pen(tl, mk, S(1837.76), { points: [[516, 604], [204, 956]], jitter: 10, seed: 4, dur: 0.3, width: 10, color: MAG, filter: pen });
      [[x1, 1837.40], [x2, 1837.76]].forEach((q) => { gsap.set(q[0], { opacity: 0 }); tl.set(q[0], { opacity: 1 }, S(q[1])); });

      const cc = FX.markup.circle(tl, mk, S(1839.45), { cx: 950, cy: 478, rx: 328, ry: 250, rot: -3, dur: 0.8, color: MAG, width: 9, filter: pen, seed: 11 });

  })();
  </script>
