    /* ===== the balance scale (ref ast_0659daaead12498d): Mexico (olive) vs United States (steel) ===== */
    function scale(host, pre, a0) {
      const box = $(host);
      const PX = 960, PY = 300, ARM = 470, STR = 300;

      // base + post
      el(svg, "path", { d: "M760 980 Q960 930 1160 980 L1160 1000 L760 1000 Z", fill: INK });
      el(svg, "rect", { x: 944, y: PY, width: 32, height: 690, fill: INK });
      el(svg, "path", { d: "M920 " + (PY - 40) + " L960 " + (PY - 90) + " L1000 " + (PY - 40) + " Z", fill: INK });
      const beam = el(svg, "g", {});
      el(beam, "rect", { x: PX - ARM - 20, y: PY - 11, width: 2 * ARM + 40, height: 22, rx: 11, fill: INK });
      el(beam, "circle", { cx: PX, cy: PY, r: 26, fill: INK });
      el(beam, "circle", { cx: PX, cy: PY, r: 10, fill: "#e9e0cd" });
      const strings = [el(svg, "path", { stroke: INK, "stroke-width": 4, fill: "none" }), el(svg, "path", { stroke: INK, "stroke-width": 4, fill: "none" })];
      const mkPan = (col, colL, colD, sil, label) => {
        const g = el(svg, "g", {});
        const star = []; for (let i = 0; i < 32; i++) { const r = i % 2 ? 120 : 150, a = i / 32 * Math.PI * 2; star.push((Math.cos(a) * r).toFixed(1) + " " + (Math.sin(a) * r - 215).toFixed(1)); }
        el(g, "path", { d: "M" + star.join(" L") + " Z", fill: colL, opacity: 0.55 });
        el(g, "circle", { cx: 0, cy: -215, r: 104, fill: col });
        el(g, "circle", { cx: 0, cy: -215, r: 92, fill: "none", stroke: colL, "stroke-width": 4 });
        el(g, "path", { d: "M-170 0 L170 0 Q150 60 0 64 Q-150 60 -170 0 Z", fill: INK });
        el(g, "rect", { x: -175, y: -6, width: 350, height: 10, rx: 5, fill: INK });
        return g;
      };
      // silhouettes as coloured masks (white+alpha PNG via CSS mask, positioned in the pan's own div)
      const panL = mkPan(OLIVE, OLIVEL, OLIVED, "", "MEXICO"), panR = mkPan(STEEL, STEELL, STEELD, "", "UNITED STATES");
      const silL = div(box, "c8-abs", "width:176px;height:105px;background:" + OLIVED + ";-webkit-mask:url('assets/cartels/cts08/derived/sil_mexico.png') center/contain no-repeat;mask:url('assets/cartels/cts08/derived/sil_mexico.png') center/contain no-repeat");
      const silR = div(box, "c8-abs", "width:190px;height:80px;background:" + STEELD + ";-webkit-mask:url('assets/cartels/cts08/derived/sil_usa.png') center/contain no-repeat;mask:url('assets/cartels/cts08/derived/sil_usa.png') center/contain no-repeat");
      const labL = div(box, "c8-abs t-display", "width:400px;text-align:center;font-size:40px;color:" + OLIVED, "MEXICO");
      const labR = div(box, "c8-abs t-display", "width:400px;text-align:center;font-size:40px;color:" + STEELD, "UNITED STATES");
      // weights on the pans (HTML, follow the pans)
      const wL = div(box, "c8-abs", "width:340px;height:200px");
      const wR = div(box, "c8-abs", "width:340px;height:200px");
      const st = { a: a0 };
      function apply() {
        const r = st.a * Math.PI / 180;
        beam.setAttribute("transform", "rotate(" + st.a.toFixed(2) + " " + PX + " " + PY + ")");
        const lx = PX - Math.cos(r) * ARM, ly = PY - Math.sin(r) * ARM, rx = PX + Math.cos(r) * ARM, ry = PY + Math.sin(r) * ARM;
        strings[0].setAttribute("d", "M" + lx.toFixed(1) + " " + ly.toFixed(1) + " L" + (lx - 150) + " " + (ly + STR).toFixed(1) + " M" + lx.toFixed(1) + " " + ly.toFixed(1) + " L" + (lx + 150) + " " + (ly + STR).toFixed(1));
        strings[1].setAttribute("d", "M" + rx.toFixed(1) + " " + ry.toFixed(1) + " L" + (rx - 150) + " " + (ry + STR).toFixed(1) + " M" + rx.toFixed(1) + " " + ry.toFixed(1) + " L" + (rx + 150) + " " + (ry + STR).toFixed(1));
        panL.setAttribute("transform", "translate(" + lx.toFixed(1) + " " + (ly + STR).toFixed(1) + ")");
        panR.setAttribute("transform", "translate(" + rx.toFixed(1) + " " + (ry + STR).toFixed(1) + ")");
        silL.style.left = (lx - 88).toFixed(1) + "px"; silL.style.top = (ly + STR - 215 - 52).toFixed(1) + "px";
        silR.style.left = (rx - 95).toFixed(1) + "px"; silR.style.top = (ry + STR - 215 - 40).toFixed(1) + "px";
        labL.style.left = (lx - 200).toFixed(1) + "px"; labL.style.top = (ly + STR + 86).toFixed(1) + "px";
        labR.style.left = (rx - 200).toFixed(1) + "px"; labR.style.top = (ry + STR + 86).toFixed(1) + "px";
        wL.style.left = (lx - 170).toFixed(1) + "px"; wL.style.top = (ly + STR - 200).toFixed(1) + "px";
        wR.style.left = (rx - 170).toFixed(1) + "px"; wR.style.top = (ry + STR - 200).toFixed(1) + "px";
      }
      apply();
      const api = { st, apply, wL, wR, svg, labL, labR, panL, panR,
        tip(t, a, d, ease) { tl.to(st, { a: a, duration: d, ease: ease || C(E.inOut, d), onUpdate: apply }, t); },
        tipFrom(t, a1, a2, d, ease) { tl.fromTo(st, { a: a1 }, { a: a2, duration: d, ease: ease || C(E.inOut, d), immediateRender: false, onUpdate: apply }, t); } };
      return api;
    }
    // a weight block sitting on a pan (bottom-aligned inside the 340×200 weight box)
    function block(box, x, w, h, col, colL, label, lift) {
      const b = div(box, "c8-abs", "left:" + x + "px;bottom:" + (lift || 0) + "px;width:" + w + "px;height:" + h + "px;background:" + col + ";box-shadow:inset 0 0 0 3px " + colL + ";border-radius:4px");
      div(b, "c8-p2", "background-image:url('assets/textures/paper_fiber_01.jpg');opacity:0.35;mix-blend-mode:multiply");

    }

    /* ===== sc012 · the American side … CIA intelligence was instrumental (whip →) ===== */
    whip("sc011", "sc012", S(729.9), { dir: 1 });
    (function () {
      push("sc012", 729.9, 741.84, 1.0, 1.05, { origin: "960px 560px" });

      block(sc.wL, 40, 120, 70, OLIVE, OLIVED, null, 0); block(sc.wL, 175, 120, 70, OLIVE, OLIVED, null, 0); block(sc.wL, 105, 120, 70, OLIVE, OLIVED, null, 72);
      block(sc.wR, 140, 60, 40, STEEL, STEELD, null, 0);
      // "the American side": US medallion pulses
      tl.fromTo(sc.panR, { scale: 1, svgOrigin: "0 -215" }, { scale: 1.08, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, S(730.28));
      // "a different story": the beam trembles
      sc.tipFrom(S(732.15), -7, -4.5, 0.4); sc.tip(S(732.55), -7, 0.5);
      // "officials … behind the scenes": three anonymous steel busts beside the US pan
      const BUST = "url('data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240"><circle cx="100" cy="78" r="50" fill="#fff"/><path d="M14 240 Q16 150 100 140 Q184 150 186 240 Z" fill="#fff"/></svg>') + "')";
      const bb = [];
      [[1540, 420], [1630, 400], [1720, 420]].forEach((p, i) => {
        const d = div($("sc012-sc"), "c8-bust", "left:" + p[0] + "px;top:" + p[1] + "px;width:96px;height:116px;background:" + STEELD + ";-webkit-mask-image:" + BUST + ";mask-image:" + BUST);
        gsap.set(d, { opacity: 0 }); pop(d, S(733.2) + i / 12 * 2, { from: 1.3, n: 2, to: 0.85 }); bb.push(d);
      });
      tl.to(bb, { opacity: 0, duration: 0.5 }, S(736.6));
      // "CIA intelligence": a big steel weight drops onto the US pan; "instrumental": the scale tips to the US
      const cia = block(sc.wR, 70, 200, 120, STEELD, STEEL, "CIA", 40);
      gsap.set(cia, { opacity: 0 });
      tl.fromTo(cia, { opacity: 0, y: -420 }, { opacity: 1, y: 0, duration: 0.55, ease: C(E.in, 0.55), immediateRender: false }, S(737.0));
      sc.tip(S(737.55), -5.5, 0.25, "power2.out");
      sc.tip(S(738.9), 8, 1.3, C(E.out, 1.3));
      CT.credit($("sc012-cr"), "Accounts: Mexican government · U.S. officials via NYT", { theme: "paper" });
    })();

    /* ===== sc013 · two days later, the State of the Union (hard cut on action) ===== */
    (function () {
      push("sc013", 741.74, 751.68, 1.04, 1.12, { origin: "35% 40%" });
      const tsvg = $("sc013-tsvg"), d1 = $("sc013-d1"), d2 = $("sc013-d2"), two = $("sc013-two"), nm = $("sc013-name"), q = $("sc013-q");
      const dot1 = el(tsvg, "circle", { cx: 22, cy: 112, r: 12, fill: OLIVEL }), dot2 = el(tsvg, "circle", { cx: 22, cy: 412, r: 12, fill: STEELL });
      hideAll([dot1, dot2, d1, d2, two]);
      pop(dot1, T(742.56), { from: 1.8, n: 2 }); rise(d1, T(742.56), { dur: 0.5, y: 10 });
      ink(tsvg, "M22 132 L23 392", S(742.85), 0.9, { color: ASHL, width: 3 });
      rise(two, T(742.80), { dur: 0.5, y: 6 });
      pop(dot2, T(744.34), { from: 1.8, n: 2 }); rise(d2, T(744.34), { dur: 0.5, y: 10 });
      gsap.set(nm, { opacity: 1 }); words("sc013-name", [T(745.84), T(746.16)], { dur: 0.45, y: 8 });
      tl.to($("sc013-tlw"), { opacity: 0, x: -30, duration: 0.5, ease: E.in }, S(746.5));
      gsap.set(q, { opacity: 0 });
      tl.fromTo(q, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.0, ease: C(E.out, 1.0), immediateRender: false }, S(747.0));
      CT.credit($("sc013-cr"), "Photo: The White House · Quote: ABC News");
    })();

    /* ===== sc014 · depending on who you ask: big part / small part → an important part (whip ←) ===== */
    slide("sc013", "sc014", S(751.58), { axis: "y", d: 0.5 });
    (function () {
      push("sc014", 751.58, 760.8, 1.03, 1.0, { origin: "960px 560px", ease: E.cam });
      const sc = scale("sc014-sc", "b", 8);
      block(sc.wL, 40, 120, 70, OLIVE, OLIVED, null, 0); block(sc.wL, 175, 120, 70, OLIVE, OLIVED, null, 0); block(sc.wL, 105, 120, 70, OLIVE, OLIVED, null, 72);
      block(sc.wR, 140, 60, 40, STEEL, STEELD, null, 0); block(sc.wR, 70, 200, 120, STEELD, STEEL, "CIA", 40);
      // "depending on who you ask": wobble
      sc.tipFrom(S(751.85), 8, -6, 0.6); sc.tip(S(752.45), 6, 0.55); sc.tip(S(753.0), -4, 0.5);
      sc.tip(S(754.45), 10, 0.6, C(E.out, 0.6));          // "a big part"
      sc.tip(S(755.4), -6, 0.6, C(E.out, 0.6));           // "or a small part"
      sc.tip(S(756.4), 2.5, 1.6, C(E.out, 1.6));          // "but nonetheless" → settles, US a little down
      // "important part": pen circle round the US medallion
      const svg = sc.svg;
      const cx = 960 + Math.cos(2.5 * Math.PI / 180) * 470, cy = 300 + Math.sin(2.5 * Math.PI / 180) * 470 + 300 - 140;
      const c = FX.markup.circle(tl, svg, S(758.0), { cx: cx, cy: cy, rx: 215, ry: 230, rot: -8, color: STEELD, width: 7, dur: 0.8, filter: "url(#" + SEG + "-pen)", seed: 4 });
      gsap.set(c, { opacity: 0 }); tl.set(c, { opacity: 1 }, S(758.0)); c.style.mixBlendMode = "multiply";
    })();

    /* ===== sc015 · THE DEAL: what if the US wants to do more than hand off information? (light-flash whip →) ===== */
    whip("sc014", "sc015", S(760.7), { dir: 1, flash: true });
    (function () {
      push("sc015", 760.7, 768.458, 1.0, 1.03, { origin: "960px 560px" });
      const deal = CT.deal($("sc015-deal"), { prefix: SEG + "-deal", ground: "night", gate: [S(760.4), S(768.458)] });
      deal.build(tl, S(760.45));
      deal.focus(tl, S(764.16), "find");
      // "do more than just hand off information": the steel half presses into the line — tension, a crack starts
      const pf = deal.panels.find;
      tl.fromTo(pf, { x: 0 }, { x: 34, duration: 1.6, ease: C(E.inOut, 1.6), immediateRender: false }, S(765.2));
      tl.fromTo(deal.line, { x: 0 }, { x: 6, duration: 0.08, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, S(766.4));
      const svg = $("sc015-svg");
      [[960, 520, 930, 494, 912, 470], [962, 548, 990, 568, 1004, 598], [961, 506, 984, 480], [960, 560, 936, 586]].forEach((c, i) => {
        const d = "M" + c[0] + " " + c[1] + " L" + c[2] + " " + c[3] + (c[4] ? " L" + c[4] + " " + c[5] : "");
        ink(svg, d, S(767.2) + i * 0.08, 0.3, { color: STEELL, width: 5 });
      });
    })();

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
