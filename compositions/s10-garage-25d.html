<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #15120f; }
    #s10-stage { position: absolute; inset: 0; perspective: 1200px; perspective-origin: 960px 540px; }
    #s10-world { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 960px 540px; }
    .s10-layer { position: absolute; inset: 0; transform-origin: 960px 540px; }
    .s10-layer img { position: absolute; display: block; }
    #s10-bd { left: -260px; top: -340px; width: 2440px; height: 1830px; filter: brightness(0.5) saturate(0.75) sepia(0.25) blur(4px); }
    #s10-sky { position: absolute; left: -400px; right: -400px; top: -400px; height: 900px;
      background: linear-gradient(180deg, rgba(120,52,30,0.55), rgba(120,52,30,0) 100%); mix-blend-mode: soft-light; }
    #s10-title { position: absolute; left: 0; right: 0; top: 60px; text-align: center; }
    #s10-title .ca { font-size: 30px; color: #e8dccb; }
    #s10-title .pa { font-size: 250px; line-height: 0.95; margin-top: 6px; filter: url(#s10-choke); }
    #s10-gar { left: 411px; top: 183px; width: 1098px; height: 921px; filter: sepia(0.22) saturate(0.8) contrast(1.04) brightness(0.8) drop-shadow(0 40px 60px rgba(0,0,0,0.5)); }
    #s10-hedge { left: 60px; top: 380px; width: 560px; height: 1243px; filter: brightness(0.5) saturate(0.8) blur(6px); }
    #s10-house { left: 1690px; top: -700px; width: 300px; height: 2385px; filter: brightness(0.42) saturate(0.7) blur(6px); }
    #s10-ground { position: absolute; left: -300px; right: -300px; bottom: -200px; height: 420px; background: linear-gradient(180deg, rgba(21,18,15,0), rgba(21,18,15,0.95) 60%); }
    #s10-haze { position: absolute; left: -400px; right: -400px; top: 200px; height: 900px;
      background: radial-gradient(ellipse 60% 45% at 55% 40%, rgba(255,214,170,0.22), rgba(255,214,170,0) 70%); mix-blend-mode: screen; }
    #s10-rays { position: absolute; left: 600px; top: -300px; width: 1800px; height: 1500px; mix-blend-mode: soft-light; opacity: 0.55;
      background: repeating-conic-gradient(from 200deg at 85% 0%, rgba(255,226,180,0.0) 0deg, rgba(255,226,180,0.55) 2deg, rgba(255,226,180,0.0) 5deg, rgba(255,226,180,0.0) 9deg);
      -webkit-mask-image: radial-gradient(ellipse 70% 80% at 85% 0%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse 70% 80% at 85% 0%, #000 20%, transparent 75%); filter: blur(6px); }
    #s10-lower { position: absolute; left: 110px; bottom: 90px; width: 760px; }
    #s10-lower .a { font-size: 26px; color: #cfc6b6; }
    #s10-lower .b { font-size: 50px; margin-top: 8px; }
  </style>
  <div id="root" data-composition-id="s10" data-width="1920" data-height="1080">
    <svg id="s10-svg" width="0" height="0" style="position:absolute"></svg>
    <div id="s10-stage">
      <div id="s10-world">
        <div class="s10-layer" id="s10-L0"><img id="s10-bd" src="assets/archival/hp/layers/backdrop.jpg" alt="" /><div id="s10-sky"></div></div>
        <div class="s10-layer" id="s10-L1"><div id="s10-title"><div class="ca t-label halate" id="s10-ca">California</div><div class="pa t-display halate" id="s10-pa">PALO ALTO</div></div></div>
        <div class="s10-layer" id="s10-Lh"><div id="s10-haze"></div></div>
        <div class="s10-layer" id="s10-L2"><img id="s10-gar" src="assets/archival/hp/layers/garage.png" alt="" /><div id="s10-ground"></div></div>
        <div class="s10-layer" id="s10-L3"><img id="s10-hedge" src="assets/archival/hp/layers/hedge.png" alt="" /><img id="s10-house" src="assets/archival/hp/layers/house.png" alt="" /></div>
      </div>
    </div>
    <div id="s10-rays"></div>
    <div id="s10-lower"><div class="a t-label halate" id="s10-la">367 Addison Avenue</div><div class="b t-serif-i halate" id="s10-lb">two students, one garage</div></div>
    <div id="s10-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_01_norm.jpg')"></div>
    <div id="s10-dust" class="tx tx-dust" style="background-image:url('assets/textures/dust_03.jpg')"></div>
    <div class="vignette"></div>
    <audio id="s10-vo" src="vo10.mp3" data-start="0" data-duration="7.0" data-media-start="544.5" data-volume="1"></audio>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const T = (s) => s - 544.5;
    const $ = (id) => document.getElementById(id);
    const choke = FX.roughDefs($("s10-svg"), "s10-choke", { freq: 0.03, scale: 6, choke: 0 });
    FX.grain($("s10-grain"), 101);
    FX.dust($("s10-dust"), 102, 2);

    // place each depth layer so the resting frame matches the flat photo layout
    const P = 1200;
    [["#s10-L0", -900], ["#s10-L1", -420], ["#s10-Lh", -200], ["#s10-L2", 0], ["#s10-L3", 320]].forEach(([sel, z]) =>
      gsap.set(sel, { z, scale: (P - z) / P }));

    // camera: slow dolly in + lateral drift -> parallax between layers
    tl.fromTo("#s10-rays", { opacity: 0.35, x: 0 }, { opacity: 0.6, x: -80, duration: 7.0, ease: "none" }, 0);
    tl.fromTo("#s10-world", { x: 150, z: -80, rotationY: -3 }, { x: -150, z: 150, rotationY: 3, duration: 7.0, ease: "sine.inOut" }, 0);

    // lower third on "start some kind of company"
    FX.text.random(tl, $("s10-la"), T(547.3), { dur: 0.5, seed: 10 });
    FX.text.rise(tl, [$("s10-lb")], T(547.7), { dur: 0.6 });
    tl.to("#s10-lower", { opacity: 0, duration: 0.35 }, T(549.3));

    // "here in California, in Palo Alto" — title behind the roof
    FX.text.random(tl, $("s10-ca"), T(548.95), { dur: 0.45, seed: 11 });
    tl.fromTo("#s10-pa", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(549.85));
    FX.choke(tl, choke, T(549.85), 18, 0.6);

    FX.mount(tl, 7.0);
    window.__timelines["s10"] = tl;
  })();
  </script>
</template>
</body>
</html>
