        const place = () => { const i = Math.min(200, Math.round(pos.k * 200)), q = P[i]; o.style.left = q[0].toFixed(1) + "px"; o.style.top = q[1].toFixed(1) + "px";
          msk.setAttribute("stroke-dashoffset", (L * (1 - pos.k)).toFixed(1)); };
        tl.set(o, { opacity: 1 }, t0);
        tl.fromTo(pos, { k: 0 }, { k: 1, duration: dur, ease: E.inOut, immediateRender: false, onUpdate: place }, t0);
        tl.fromTo(p, { opacity: 0 }, { opacity: 0.55, duration: dur, ease: "none", immediateRender: true }, t0);
        // breach ring where it crosses the ban
        const ring = el(svg, "circle", { cx: P[ci][0], cy: P[ci][1], r: 20, fill: "none", stroke: VOLTL, "stroke-width": 10 });
        gsap.set(ring, { opacity: 0 });
        tl.fromTo(ring, { attr: { r: 20 }, opacity: 0.95 }, { attr: { r: 260 }, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, ringT);
        tl.set(carrier, { opacity: 1 }, t0);
        return { P, o, dur };
      }
      // small chips: plane from the Pacific → Shanghai, carrying a graphics card
      const plane = icon("plane", BONE, 96, 96); plane.style.left = "-48px"; plane.style.top = "-48px"; plane.style.transform = "rotate(-100deg)";
      const card = icon("gpu_card", VOLT, 96, 66); card.style.left = "44px"; card.style.top = "-92px";
      const r1 = route("M6700 3150 C6100 2700 5300 2560 4560 2650", S(872.06), 1.45, plane, card, S(872.06) + 1.45 * 0.62);
      // big chips: ship from the South China Sea → Shenzhen / Hong Kong, carrying a server rack
      const ship = icon("ferry", BONE, 120, 96); ship.style.left = "-60px"; ship.style.top = "-60px";
      const rack = icon("server_rack", VOLT, 62, 104); rack.style.left = "62px"; rack.style.top = "-124px";
      const r2 = route("M4700 4600 C4520 4250 4120 4000 3870 3700", S(873.26), 1.5, ship, rack, S(873.26) + 1.5 * 0.5);

      // "you're not really keeping anything out": chips stream along both routes and pile up inside China
      const dots = [];
      [[r1, [S(874.70), S(875.05), S(875.40)]], [r2, [S(874.85), S(875.20), S(875.55)]]].forEach((rr) => {
        rr[1].forEach((t0) => {
          const c = el(svg, "rect", { x: -26, y: -26, width: 52, height: 52, rx: 8, fill: VOLT, stroke: VOLTL, "stroke-width": 6 });
          gsap.set(c, { opacity: 0 });
          const k = { v: 0 };

          tl.fromTo(k, { v: 0 }, { v: 1, duration: 1.2, ease: E.inOut, immediateRender: false,
            onUpdate: () => { const q = rr[0].P[Math.min(200, Math.round(k.v * 200))]; c.setAttribute("transform", "translate(" + q[0].toFixed(1) + " " + q[1].toFixed(1) + ")"); } }, t0);
          tl.to(c, { opacity: 0, duration: 0.15 }, t0 + 1.2);
          dots.push(c);

      });
      const PILE = [[4300, 2700], [3950, 2750], [4150, 2900], [3800, 2950], [4000, 3100], [4200, 3150], [3600, 3150], [3900, 3350], [3700, 3400],
                    [4100, 3350], [4350, 2500], [3500, 3300], [3750, 3200], [4050, 2600]];
      PILE.forEach((q, i) => {

        gsap.set(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 0 }, { opacity: 0.95, duration: 1 / 12, ease: "steps(1)", immediateRender: true }, S(875.30) + Math.floor(i * 1.6) / 12);
      });
      // carriers fade once delivered
      tl.to([r1.o, r2.o], { opacity: 0, duration: 0.4 }, S(876.20));
    })();

    /* ===== sc002 · FACE M (hard cut on the map push) ===== */
    face("sc002", 877.50, 880.80, "M");

    /* ===== sc003 · THE SCOREBOARD — built, results empty; row 1 ✗ on "not" ===== */
    whip("sc002", "sc003", S(880.80), { dir: 1 });
    const sb = NV.scoreboard($("sb"), { prefix: SEG + "-sb", gate: [S(880.4), S(891.4)] });
    push("sc003", 880.80, 891.18, 1.0, 1.035, { ease: E.cam });
    sb.markRow(tl, 1, "x", T(888.78));

    /* ===== sc004 · FACE W (hard cut on the board push) ===== */
    face("sc004", 891.18, 897.98, "W");

    /* ===== sc005 · FACE C (framing jump exactly on the 897.98 join) ===== */
    face("sc005", 897.98, 905.45, "C");

    /* ===== sc006 · the 2022 rule between two presidents (slides up) ===== */
    slide("sc005", "sc006", S(905.45), { axis: "y" });
    (function () {
      const doc = $("sc006-doc"), bi = $("sc006-bi"), tr = $("sc006-tr"), dsvg = $("sc006-docsvg"), mk = $("sc006-mk");
      gsap.set(doc, { rotation: -2 });
      tl.fromTo(doc, { y: 260, rotation: 4 }, { y: 0, rotation: -2, duration: 1.2, ease: C(E.out, 1.2), immediateRender: true }, S(905.30));
      // pen circle round the rule's 3A090 heading on "ban" (threshold page p.26: 222–379 × 272–289 pt, ×0.915)
      const c1 = FX.markup.circle(tl, dsvg, S(907.45), { cx: 272, cy: 256, rx: 88, ry: 24, rot: -3, color: ICED, width: 6, dur: 0.7, seed: 4 });
      c1.style.mixBlendMode = "multiply"; gsap.set(c1, { opacity: 0 }); tl.set(c1, { opacity: 1 }, S(907.45));
      // presidents pop in, 12 fps stop-motion
      gsap.set([bi, tr], { opacity: 0 });
      tl.fromTo(bi, { opacity: 0, scale: 1.12, rotation: -3 }, { opacity: 1, scale: 1, rotation: -1, duration: 3 / 12, ease: "steps(3)", immediateRender: true }, S(909.53));
      tl.fromTo(tr, { opacity: 0, scale: 1.12, rotation: 3 }, { opacity: 1, scale: 1, rotation: 1, duration: 3 / 12, ease: "steps(3)", immediateRender: true }, S(909.77));
      W("sc006-tb").concat(W("sc006-tt")).forEach((w) => gsap.set(w, { opacity: 1 }));
      rise($("sc006-tb"), T(909.53), { dur: 0.5, y: 8 });
      rise($("sc006-tt"), T(909.77), { dur: 0.5, y: 8 });
      // "who don't agree on much" — they lean apart
      tl.to(bi, { x: -16, rotation: -3, duration: 0.6, ease: C(E.inOut, 0.6) }, S(910.45));
      tl.to(tr, { x: 16, rotation: 3, duration: 0.6, ease: C(E.inOut, 0.6) }, S(910.45));
      // "are keeping this policy in place" — both arrows to the rule
      const a1 = FX.markup.arrow(tl, mk, S(911.45), { x1: 560, y1: 520, x2: 700, y2: 440, bend: -40, head: 26, color: ICED, width: 7, dur: 0.55 });
      const a2 = FX.markup.arrow(tl, mk, S(911.70), { x1: 1360, y1: 520, x2: 1222, y2: 440, bend: 40, head: 26, color: ICED, width: 7, dur: 0.55 });
      [a1, a2].forEach((pp, i) => pp.forEach((p) => { p.style.mixBlendMode = "multiply"; gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, S([911.45, 911.70][i])); }));
      push("sc006", 905.45, 913.08, 1.0, 1.04, { ease: E.cam, origin: "960px 470px" });
    })();

    /* ===== sc007 · FACE W (hard cut, starts on the 913.08 join) ===== */
    face("sc007", 913.08, 918.10, "W");

    /* ===== sc008 · FACE M (punch-in on "Maybe") ===== */
    face("sc008", 918.10, 921.95, "M");

    /* ===== sc009 · the lead (light-flash whip) — B-roll to the end, camera still drifting ===== */
    whip("sc008", "sc009", S(921.95), { dir: 1, flash: true });
    (function () {
      const us = $("sc009-us"), cn = $("sc009-cn"), svg = $("sc009-svg");
      gsap.set(us, { scaleX: 0 }); gsap.set(cn, { scaleX: 0 });
      rise($("sc009-ax"), S(922.05), { dur: 0.6, y: 6 });
      rise($("sc009-lcn"), S(922.15), { dur: 0.6, y: 8 });
      tl.fromTo(cn, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: C(E.out, 0.9), immediateRender: true }, S(922.25));
      tl.fromTo(us, { scaleX: 0 }, { scaleX: 1, duration: 1.5, ease: C(E.out, 1.5), immediateRender: true }, S(922.40));
      words("sc009-lus", [T(924.17)], { dur: 0.6, y: 8 });
      // THE LEAD bracket between the two ends
      const br = FX.markup.pen(tl, svg, S(923.25), { points: [[552, 738], [554, 770], [1160, 772], [1778, 768], [1780, 470]], jitter: 5, seed: 6, dur: 0.6, width: 5, color: ICEL, blend: "normal" });
      gsap.set(br, { opacity: 0 }); tl.set(br, { opacity: 1 }, S(923.25));
      words("sc009-lead", [T(923.45)], { dur: 0.8, y: 12 });
      // "some chips flowing into China" — five chips drop into China's bar, it barely moves
      const box = $("sc009-chips");
      for (let i = 0; i < 5; i++) {
        const c = icon("chip", VOLT, 64, 64); c.style.left = (500 + i * 9) + "px"; c.style.top = "584px";
        c.style.filter = "drop-shadow(0 0 10px rgba(201,236,143,0.55))";
        box.appendChild(c);
        gsap.set(c, { opacity: 0 });
        const t0 = S(929.85) + i * 0.32;
        tl.fromTo(c, { opacity: 1, y: 560, x: -40 }, { y: 0, x: 0, duration: 0.55, ease: C(E.in, 0.55), immediateRender: false }, t0);
        tl.set(c, { opacity: 0 }, t0 + 0.55);
        tl.to(cn, { width: 150 + (i + 1) * 9, duration: 1 / 12, ease: "steps(1)" }, t0 + 0.55);
      }
      // "don't really change what you're trying to achieve" — circle THE LEAD
      const c9 = FX.markup.circle(tl, svg, S(932.45), { cx: 1165, cy: 830, rx: 300, ry: 82, rot: -2, color: ICEL, width: 6, dur: 0.75, seed: 8 });
      gsap.set(c9, { opacity: 0 }); tl.set(c9, { opacity: 1 }, S(932.45));
      push("sc009", 921.95, 935.00, 1.0, 1.06, { ease: "none" });
    })();

    FX.mount(tl, DURATION);

  })();
