      ink(mk, "M620 172 L1822 170 L1824 912 L622 914 L620 168", S(285.50), 1.0, { color: REDD, width: 5, ease: C(E.inOut, 1.0) });
      rise($("sc010-cn"), T(286.34), { dur: 0.5, y: 6 });
      // the foreign company is let in
      tl.to(fc, { x: 620, duration: 0.9, ease: C(E.inOut, 0.9) }, S(286.70));
      tl.to([d1, d2], { x: 620, duration: 0.9, ease: C(E.inOut, 0.9) }, S(286.70));
      // "forming a partnership with the Chinese company"
      stop(cc, S(287.80));
      ink(mk, "M772 728 L774 760 L1716 758 L1718 726", S(288.20), 0.6, { color: INK, width: 5 });
      rise($("sc010-pl"), T(288.34), { dur: 0.5, y: 8 });
      rise($("sc010-ccl"), T(289.30), { dur: 0.5, y: 8 });
      // trade secrets → technology, handed over
      tl.fromTo(d1, { opacity: 0 }, { opacity: 1, duration: 1 / 12, immediateRender: true }, T(291.14));
      tl.to(d1, { x: 1105, y: 0, rotation: -6, duration: 0.6, ease: C(E.inOut, 0.6) }, S(291.30));
      tl.fromTo(d2, { opacity: 0 }, { opacity: 1, duration: 1 / 12, immediateRender: true }, T(292.18));
      tl.to(d2, { x: 1290, y: 14, rotation: 5, duration: 0.25, ease: C(E.out, 0.25) }, S(292.24));
      push("sc010", 283.04, 293.03, 1.0, 1.04, { ease: E.cam, origin: "1220px 540px" });
    })();

    /* ===== sc011 · FACE C (hard cut) ===== */
    face("sc011", 293.03, 296.15, "C");

    /* ===== sc012 · the world: IP theft called out; global south; WTO (vertical whip) ===== */
    whip("sc011", "sc012", S(296.15), { dir: 1, vertical: true });
    (function () {
      const cam = $("sc012-cam"), svg = $("sc012-svg");
      const L = {
        cn: mlab(cam, 6307, 778, "China", { size: 76 }), us: mlab(cam, 800, 690, "United States", { size: 60 }),
        de: mlab(cam, 3800, 352, "Germany", { size: 44 }), uk: mlab(cam, 3420, 300, "UK", { size: 44 }), fr: mlab(cam, 3545, 485, "France", { size: 44 }),
        gs: mlab(cam, 4041, 1690, "Global south", { size: 56 }),
      };
      // WTO card at Geneva (counter-scaled)
      const wo = document.createElement("div"); wo.style.cssText = "position:absolute;left:3663px;top:486px;width:0;height:0;transform-origin:0 0;";
      wo.innerHTML = '<div style="position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:' + BONE + ';box-shadow:0 0 0 6px rgba(240,239,232,0.3)"></div>' +
        '<div class="n3-wto" style="left:34px;top:-64px"><img src="assets/nvidia/shared/logos/wto.svg" alt="" /></div>';
      cam.appendChild(wo);
      const woIn = wo; gsap.set(wo.children, { opacity: 0 });
      camPath(cam, [
        [296.15, 5950, 900, 0.60], [300.55, 6120, 860, 0.66], [302.00, 1800, 860, 0.55], [303.35, 1850, 860, 0.57],
        [304.45, 3600, 400, 2.0], [307.55, 3590, 410, 2.1], [309.00, 3500, 1660, 0.42], [311.60, 3480, 1640, 0.43],
        [312.75, 3600, 1300, 0.44], [314.47, 3600, 1290, 0.455],
      ], Object.values(L).map((l) => l.outer).concat([wo]));
      const fade = (id, t, d) => tl.fromTo($(id), { opacity: 0 }, { opacity: 1, duration: d || 0.7, ease: C(E.out, d || 0.7), immediateRender: true }, t);
      fade("sc012-cn", S(297.20), 1.0);
      rise(L.cn.inner, T(299.45), { dur: 0.6, y: 10 });
      fade("sc012-us", S(301.05));
      rise(L.us.inner, T(301.05), { dur: 0.6, y: 10 });
      fade("sc012-de", T(304.49), 0.5); rise(L.de.inner, T(304.49), { dur: 0.5, y: 8 });
      fade("sc012-uk", T(305.21), 0.5); rise(L.uk.inner, T(305.21), { dur: 0.5, y: 8 });
      fade("sc012-fr", T(305.77), 0.5); rise(L.fr.inner, T(305.77), { dur: 0.5, y: 8 });
      fade("sc012-gs", S(309.21), 0.8); rise(L.gs.inner, T(309.21), { dur: 0.6, y: 10 });
      tl.to([L.de.inner, L.uk.inner, L.fr.inner], { opacity: 0, duration: 0.3 }, S(307.70));
      // WTO pinned at Geneva, then arrows from the global south
      stop(wo.children[0], S(312.70));
      tl.fromTo(wo.children[1], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, T(312.81));
      [[1911, 2075, 3560, 640, -260], [4041, 1693, 3700, 690, 120], [5680, 1201, 3830, 600, 260]].forEach((q, i) => {
        const ps = FX.markup.arrow(tl, svg, S(313.00) + i * 0.1, { x1: q[0], y1: q[1], x2: q[2], y2: q[3], bend: q[4], head: 60, color: BONE, width: 11, dur: 0.55 });
        ps.forEach((p) => { gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 0.9 }, S(313.00) + i * 0.1); });
      });
    })();

    /* ===== sc013 · FACE C (hard cut) ===== */
    face("sc013", 314.47, 319.62, "C");
    /* ===== sc014 · FACE W (framing change on the 319.62 join) ===== */
    face("sc014", 319.62, 323.11, "W");

    /* ===== sc015 · uranium triptych → cutting the curve → AI chips (light-flash whip) ===== */
    whip("sc014", "sc015", S(323.11), { dir: -1, flash: true });
    (function () {
      const pl = $("sc015-pl"), pr = $("sc015-pr"), ring = $("sc015-ring"), wrap = $("sc015-wrap");
      fillIco("sc015-lock", "lock"); fillIco("sc015-ok", "check"); fillIco("sc015-no", "cross");
      FX.weave($("sc015-wv"), { amp: 1.4, flicker: 0.05, seed: 315, from: S(327.3), to: S(343.95) });
      gsap.set([pl, pr], { clipPath: "inset(0% 0% 100% 0%)" });
      // centre: uranium pellets (already there as the scene lands)
      tl.fromTo(ring, { scale: 0.85 }, { scale: 1, duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(323.11));
      // "nuclear energy" — the power plant wipes in left
      tl.fromTo(pl, { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(323.30));
      tl.fromTo($("sc015-plimg"), { scale: 1.12 }, { scale: 1.0, duration: 4.0, ease: E.cam, immediateRender: true }, S(323.30));
      // "nuclear bomb" — Trinity, right
      tl.fromTo(pr, { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(327.75));
      tl.fromTo($("sc015-primg"), { scale: 1.12 }, { scale: 1.0, duration: 4.0, ease: E.cam, immediateRender: true }, S(327.75));
      // "export … enriched uranium … heavily controlled"
      tl.to([pl, pr], { opacity: 0.32, duration: 0.8, ease: "power1.inOut" }, S(330.20));
      tl.to(ring, { scale: 1.2, duration: 1.2, ease: C(E.inOut, 1.2) }, S(330.70));
      rise($("sc015-l1"), T(332.25), { dur: 0.6, y: 10 });
      stop($("sc015-lock"), S(333.80));
      // cutting the curve: pellets → GPU die (same circle), lock and label swap at the cut
      const mid = FX.curveCut(tl, wrap, $("sc015-pel"), $("sc015-die"), S(334.75), 0.72, { from: 1, to: 1.3 });
      tl.set([$("sc015-lock"), $("sc015-l1")], { opacity: 0 }, mid);
      tl.to(wrap, { scale: 1.0, duration: 1.4, ease: E.cam }, mid + 0.1);
      rise($("sc015-l2"), T(335.05), { dur: 0.5, y: 8 });
      tl.to([pl, pr], { opacity: 0.18, duration: 0.6 }, mid);
      // good things / bad things with AI
      pop($("sc015-ok"), S(339.85), { dur: 0.6, from: 0.6 });
      pop($("sc015-no"), S(342.25), { dur: 0.5, from: 0.6 });
      push("sc015", 323.11, 343.91, 1.0, 1.05, { ease: "none" });
    })();

    /* ===== sc016 · Taiwan Strait, tilted terrain (whip →) ===== */
    whip("sc015", "sc016", S(343.91), { dir: 1 });
    (function () {
      const cam = $("sc016-cam"), svg = $("sc016-svg");
      gsap.set($("sc016-tilt"), { rotationX: 30 });
      const P = (lon, lat) => [(lon - 100) * 127.95, (48 - lat) * 150];
      const cnp = P(116.6, 26.4), twp = P(123.7, 23.4);
      const Lc = mlab(cam, cnp[0], cnp[1], "China", { size: 84 }), Lt = mlab(cam, twp[0], twp[1], "Taiwan", { size: 64 });
      camPath(cam, [[343.91, 2470, 3470, 0.92], [351.83, 2560, 3540, 1.06]], [Lc.outer, Lt.outer]);
      tl.fromTo($("sc016-cn"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(345.61));
      rise(Lc.inner, T(345.61), { dur: 0.6, y: 10 });
      // "invading" — three arrows across the strait
      [[[118.9, 25.5], [120.9, 25.05]], [[118.3, 24.7], [120.3, 24.25]], [[117.9, 23.9], [119.95, 23.45]]].forEach((q, i) => {
        const a = P(q[0][0], q[0][1]), b = P(q[1][0], q[1][1]);
        const ps = FX.markup.arrow(tl, svg, S(349.53) + i * 0.12, { x1: a[0], y1: a[1], x2: b[0], y2: b[1], bend: -40, head: 46, color: RED, width: 16, dur: 0.5 });
        ps.forEach((p) => { gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, S(349.53) + i * 0.12); });
      });
      // "a US ally, Taiwan"
      tl.fromTo($("sc016-tw"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, S(350.25));
      rise(Lt.inner, T(351.05), { dur: 0.25, y: 8 });
    })();

    /* ===== sc017 · FACE M (hard cut) ===== */
    face("sc017", 351.83, 358.94, "M");
    /* ===== sc018 · FACE C punch-in on "The main question" — pushes on into nvs04 ===== */
    face("sc018", 358.94, 362.292, "C");

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
