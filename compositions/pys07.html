  <script>
  (function () {

    // ---------- scenes ----------
    const SC = [
      ["sc001", 706.20, 710.30, "face"], ["sc002", 710.30, 721.46, "paper"], ["sc003", 721.46, 726.58, "night"], ["sc004", 726.58, 731.22, "face"],

    const GROUND = { paper: [0.32, 0.16, 0.26], night: [1, 0.42, 0.36], desk: [0.9, 0.3, 0.3], face: [0, 0, 0] };
    const EARLY = { sc008: 0.45 };   // paper slide: incoming scene visible during the slide
    SC.forEach((s, i) => {
      const el = $(s[0]), a = s[1] - (EARLY[s[0]] || 0);

    const pop = (el, t, o) => { o = o || {}; const d = o.dur || 0.8;

    const out = (el, t, d) => tl.to(el, { opacity: 0, duration: d || 0.25, ease: "power1.in" }, t);
    const W = (id) => Array.from($(id).querySelectorAll(".p7-w"));
    function words(id, cues, o) { const ws = W(id); cues.forEach((c, i) => rise(ws[i], c, o)); }
    function el(parent, tag, attrs) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; }
    function ink(parent, d, t, dur, o) {
      o = o || {};
      const p = el(parent, "path", { d: d, fill: "none", stroke: o.color || INK, "stroke-width": o.width || 5, "stroke-linecap": "round", "stroke-linejoin": "round" });

        p.setAttribute("stroke-dasharray", len + " " + len); p.setAttribute("stroke-dashoffset", len);
        gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: o.opacity == null ? 1 : o.opacity }, t);
        tl.fromTo(p, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: o.ease || C(E.out, dur), immediateRender: true }, t);

    const hl = (id, t, d) => tl.fromTo($(id), { scaleX: 0 }, { scaleX: 1, duration: d || 0.4, ease: C(E.out, d || 0.4), immediateRender: true }, t);
    const whipN = { n: 0 };
    function whip(a, b, t, o) {
      o = Object.assign({ dir: 1, vertical: false, flash: false, dur: 0.32 }, o);
      const k = ++whipN.n, ba = FX.whipDefs(defs, SEG + "-wa" + k), bb = FX.whipDefs(defs, SEG + "-wb" + k), h = o.dur / 2;
      const A = $(a + "-shot"), B = $(b + "-shot");
      tl.set(A, { filter: "url(#" + SEG + "-wa" + k + ")" }, t - h - 0.01); tl.set(A, { filter: "none" }, t + 0.06);
      tl.set(B, { filter: "url(#" + SEG + "-wb" + k + ")" }, t - 0.001); tl.set(B, { filter: "none" }, t + h + 0.02);
      FX.whip(tl, A, B, t, { dir: o.dir, vertical: o.vertical, dur: o.dur, blurA: ba, blurB: bb });
      if (o.flash) tl.fromTo($("flash"), { opacity: 0 }, { opacity: 0.85, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, t - 0.08);
    }
    function slide(a, b, t, o) {

      const bar = $("sc002-bar"), cert = $("sc002-cert");

    })();

    /* ===== sc003 · investor + government money (hard cut on action) ===== */
    (function () {
      tl.fromTo($("sc003-cam"), { scale: 1.08 }, { scale: 1.0, duration: 5.12, ease: E.cam, immediateRender: false }, S(721.46));
      tl.fromTo($("sc003-pena"), { x: 30 }, { x: -20, duration: 5.12, ease: "none", immediateRender: false }, S(721.46));

      words("sc003-a", [T(721.80), T(722.12), T(722.28), T(722.68)], { dur: 0.4, y: 10 });
      // investor link: Peña → the bank (plum-light pen arrow)

    /* ===== sc005 · FACE W (jump cut) ===== */
    face("sc005", 731.22, 737.15, "W");
    words("sc005-lt", [T(731.96), T(732.36), T(732.52), T(732.84)], { dur: 0.4, y: 10 });

    tl.fromTo($("sc006-vw"), { scale: 1.0 }, { scale: 1.07, duration: 2.87, ease: "none", immediateRender: false }, S(737.15));
    words("sc006-lt", [T(737.64), T(737.72), T(737.88), T(738.12)], { dur: 0.4, y: 10 });
    (function () {

        lin.style.left = (-L).toFixed(1) + "px"; lin.style.top = (-Tp).toFixed(1) + "px";
        lin.style.transformOrigin = p.x.toFixed(1) + "px " + p.y.toFixed(1) + "px";
        hdl.style.left = (p.x + R * 0.62 - 30).toFixed(1) + "px"; hdl.style.top = (p.y + R * 0.62).toFixed(1) + "px";
      };

        ic.style.left = (xs[i] + 20) + "px"; ic.innerHTML = '<g stroke="' + INK + '" fill="none">' + BLDG + "</g>";

  })();
