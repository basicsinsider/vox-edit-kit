<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--night); }
    #s06-stage { position: absolute; inset: 0; perspective: 1700px; }
    #s06-defs { position: absolute; width: 0; height: 0; }
    #s06-bg { position: absolute; left: -200px; top: -400px; width: 2320px; filter: url(#s06-tintd) blur(16px); opacity: 0.4; }
    #s06-tilt { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #s06-cam { position: absolute; left: 0; top: 0; width: 1600px; height: 1984px; transform-origin: 0 0; }
    #s06-page { position: absolute; left: 0; top: 0; width: 1600px; height: 1984px; filter: url(#s06-tint); box-shadow: 0 40px 90px rgba(0,0,0,0.7); }
    #s06-ht { position: absolute; left: 0; top: 0; width: 1600px; height: 1984px; mix-blend-mode: overlay; background-size: 260px auto; background-repeat: repeat; opacity: 0.2; }
    #s06-hl { position: absolute; left: 0; top: 0; width: 1600px; height: 1984px; mix-blend-mode: multiply; overflow: visible; }
    #s06-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,19,18,0) 42%, rgba(20,19,18,0.78) 64%, rgba(20,19,18,0.9) 100%); opacity: 0; }
    #s06-clip { position: absolute; left: 1250px; top: 120px; width: 440px; height: 560px; background: #e9dcc3; padding: 16px 16px 16px; box-shadow: 0 26px 50px rgba(0,0,0,0.6); }
    #s06-clip .ph { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #s06-clip img { position: absolute; left: -2%; top: -6%; width: 104%; filter: url(#s06-tint) contrast(1.05); }
    #s06-name { position: absolute; left: 1250px; top: 726px; font-size: 92px; line-height: 1; white-space: nowrap; filter: url(#s06-rough); }
    #s06-cap { position: absolute; left: 1254px; top: 840px; width: 600px; font-size: 38px; color: #e8dccb; }
  </style>
  <div id="root" data-composition-id="s06" data-width="1920" data-height="1080">
    <svg id="s06-defs"></svg>
    <img id="s06-bg" src="assets/archival/newspapers/nyt_1928-11-07_hoover_wins_frontpage.jpg" alt="" />
    <div id="s06-stage"><div id="s06-tilt">
      <div id="s06-cam">
        <img id="s06-page" src="assets/archival/newspapers/nyt_1928-11-07_hoover_wins_frontpage.jpg" alt="" />
        <div id="s06-ht" style="background-image:url('assets/textures/halftone_01_norm.jpg')"></div>
        <svg id="s06-hl" viewBox="0 0 1600 1984"><rect id="s06-hlr" x="74" y="244" width="546" height="70" fill="#f2d33b" filter="url(#s06-roughhl)"/></svg>
      </div>
    </div></div>
    <div id="s06-shade"></div>
    <div id="s06-clip"><div class="ph"><img src="assets/archival/hoover/hoover_presidential_portrait_photo_NARA.jpg" alt="" /></div></div>
    <div id="s06-name" class="t-display halate">Herbert Hoover</div>
    <div id="s06-cap" class="t-serif-i halate"><span>future </span><span>president </span><span>of </span><span>the </span><span>United </span><span>States</span></div>
    <div id="s06-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_01_norm.jpg')"></div>
    <div id="s06-dust" class="tx tx-dust" style="background-image:url('assets/textures/dust_03.jpg'); opacity:0.35"></div>
    <div class="vignette"></div>
    <audio id="s06-vo" src="vo10.mp3" data-start="0" data-duration="8.4" data-media-start="122.9" data-volume="1"></audio>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const T = (s) => +(s - 122.9).toFixed(3);
    const S = T;
    const $ = (id) => document.getElementById(id);
    const defs = $("s06-defs");
    FX.tintDefs(defs, "s06-tint", "#1f1b17", "#ecdfc6");
    FX.tintDefs(defs, "s06-tintd", "#0f0e0d", "#5a5044");
    const morph = FX.roughDefs(defs, "s06-rough", { freq: 0.04, scale: 6, choke: 8 });
    FX.roughDefs(defs, "s06-roughhl", { freq: 0.06, scale: 9 });
    FX.grain($("s06-grain"), 71);
    FX.dust($("s06-dust"), 73, 2);

    // camera over the page (page pixels): full front page -> push to the headline
    const cam = (cx, cy, z) => ({ x: 960 - cx * z, y: 540 - cy * z, scale: z });
    tl.fromTo("#s06-tilt", { rotationX: 20, rotationZ: -4, y: 30 }, { rotationX: 9, rotationZ: -2.5, y: 0, duration: 8.4, ease: "power1.inOut", immediateRender: true }, 0);
    tl.fromTo("#s06-cam", cam(800, 1000, 0.5), Object.assign(cam(790, 960, 0.56), { duration: 1.1, ease: "none", immediateRender: true }), 0);
    tl.to("#s06-cam", Object.assign(cam(560, 330, 1.55), { duration: 2.3, ease: FX.choppy("power3.inOut", 2.3, 24) }), S(124.0));
    tl.to("#s06-cam", Object.assign(cam(600, 345, 1.68), { duration: 2.1, ease: "none" }), S(126.3));
    // halftone dots grow stronger as we get closer to the print
    tl.fromTo("#s06-ht", { opacity: 0.18 }, { opacity: 0.55, duration: 2.3, ease: "power2.in" }, S(124.0));
    tl.fromTo("#s06-bg", { scale: 1.0 }, { scale: 1.12, duration: 8.4, ease: "none" }, 0);

    // rough yellow highlighter swipes across HOOVER WINS on "president" (12 fps)
    tl.fromTo("#s06-hlr", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: FX.choppy("power2.out", 0.4, 12), immediateRender: true }, T(126.84));

    // Hoover clipping drops in (stop-motion 12 fps) as the page settles
    tl.fromTo("#s06-shade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, S(126.0));
    tl.fromTo("#s06-clip", { opacity: 0, y: -90, rotation: -9, scale: 1.18 }, { opacity: 1, y: 0, rotation: 2.5, scale: 1, duration: 0.42, ease: FX.choppy("back.out(1.6)", 0.42, 12), immediateRender: true }, S(126.0));
    tl.fromTo("#s06-clip", { x: 0 }, { x: -18, duration: 6.0, ease: "none" }, S(126.4));
    // "future president of the United States" word by word
    [T(126.36), T(126.84), T(127.32), T(127.48), T(127.64), T(128.04)].forEach((c, i) =>
      tl.fromTo($("s06-cap").children[i], { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, c));
    // "Herbert Hoover" — choker reveal with rough edges
    tl.fromTo("#s06-name", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(128.52));
    FX.choke(tl, morph, T(128.52), 8, 0.5);

    FX.mount(tl, 8.4);
    window.__timelines["s06"] = tl;
  })();
  </script>
</template>
</body>
</html>
