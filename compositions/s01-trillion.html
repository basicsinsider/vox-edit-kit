<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--night); }
    #s01-streaks { opacity: 0.6; filter: blur(2.5px); }
    #s01-leak { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: screen; opacity: 0; }
    #s01-date { position: absolute; left: 0; top: 250px; width: 1920px; text-align: center; font-size: 30px; letter-spacing: 0.42em; color: #e8dccb; }
    #s01-block { position: absolute; left: 320px; top: 360px; width: 1100px; height: 420px; }
    #s01-twelve { position: absolute; left: 0; top: 0; font-size: 330px; line-height: 1; }
    #s01-right { position: absolute; left: 430px; top: 46px; width: 760px; }
    #s01-companies { font-size: 76px; letter-spacing: 0.04em; line-height: 1; color: var(--bone); }
    #s01-us { font-size: 46px; color: #e8dccb; margin-top: 10px; }
    #s01-worth { font-size: 24px; color: #d9cdb9; margin-top: 46px; }
    #s01-money { font-size: 92px; line-height: 1; margin-top: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #s01-tril { font-size: 44px; color: #e8dccb; margin-top: 8px; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080">
    <canvas id="s01-streaks" class="streaks"></canvas>
    <img id="s01-leak" src="assets/textures/lightleak_02.jpg" alt="" />
    <div id="s01-date" class="t-label halate">October 2026</div>
    <div id="s01-block">
      <div id="s01-twelve" class="t-display halate yellow">12</div>
      <div id="s01-right">
        <div id="s01-companies" class="t-display">COMPANIES</div>
        <div id="s01-us" class="t-serif-i halate">in the United States</div>
        <div id="s01-worth" class="t-label halate">each worth more than</div>
        <div id="s01-money" class="t-display halate">$0</div>
        <div id="s01-tril" class="t-serif-i halate">a trillion dollars</div>
      </div>
    </div>
    <div id="s01-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_01_norm.jpg')"></div>
    <div id="s01-dust" class="tx tx-dust" style="background-image:url('assets/textures/dust_02.jpg')"></div>
    <div class="vignette"></div>
    <audio id="s01-vo" src="vo10.mp3" data-start="0" data-duration="6.8" data-media-start="19.0" data-volume="1"></audio>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const T = (s) => +(s - 19.0).toFixed(3);   // text cues: voiceover seconds -> local
    const S = T;                                 // structural cues (not audited)
    const $ = (id) => document.getElementById(id);

    FX.streaks($("s01-streaks"), { seed: 31, speed: 0.5, tint: [255, 206, 158], lo: 0.4, gain: 1.05 });
    FX.grain($("s01-grain"), 11);
    FX.dust($("s01-dust"), 13, 2);

    // light streaks fade up, very slow drift; one breath of light leak
    tl.fromTo("#s01-streaks", { opacity: 0 }, { opacity: 0.6, duration: 1.2, ease: "power1.out" }, 0);
    tl.fromTo("#s01-streaks", { y: 0 }, { y: -40, duration: 6.8, ease: "none" }, 0);
    tl.fromTo("#s01-leak", { opacity: 0 }, { opacity: 0.16, duration: 1.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, S(22.0));

    // "October 2026" — letters appear in random order
    FX.text.random(tl, $("s01-date"), T(19.06), { dur: 0.75, seed: 6 });

    // "12" — odometer, yellow halation (the one key number)
    FX.text.odometer(tl, $("s01-twelve"), T(21.12), { dur: 0.75, stagger: 0.08, seed: 12 });
    // "companies" — Vox fill pop: yellow, settles to bone
    FX.text.fill(tl, $("s01-companies"), T(21.70), { per: 0.03, hold: 0.3, settle: 0.5, cool: "#f4eee2" });
    // "in the United States"
    FX.text.rise(tl, [$("s01-us")], T(22.18), { dur: 0.5, y: 14, blur: 8 });
    // "worth more than"
    FX.text.rise(tl, [$("s01-worth")], T(23.46), { dur: 0.4, y: 10, blur: 6 });
    // "a trillion" — the counter starts on "a" and lands on $1,000,000,000,000 as "dollars" begins
    tl.fromTo("#s01-money", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(24.10));
    FX.text.count(tl, $("s01-money"), T(24.10), 0, 1e12, 0.84, (v) => "$" + (Math.round(v / 1e9) * 1e9).toLocaleString("en-US"));
    FX.text.rise(tl, [$("s01-tril")], T(24.90), { dur: 0.45, y: 10, blur: 6 });

    // slow push on the whole title block (camera), settles before the cut
    tl.fromTo("#s01-block", { scale: 0.97, transformOrigin: "40% 50%" }, { scale: 1.02, duration: 6.8, ease: "none" }, 0);

    FX.mount(tl, 6.8);
    window.__timelines["s01"] = tl;
  })();
  </script>
</template>
</body>
</html>
