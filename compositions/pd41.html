<!doctype html>

<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
    .p41-shot { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
    .p41-p1, .p41-p2 { position: absolute; inset: 0; background-size: cover; background-position: center; pointer-events: none; mix-blend-mode: multiply; filter: saturate(0.3); }
    #pd41-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
    #pd41-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

    .p41-w { display: inline-block; white-space: pre; opacity: 0; }
    #pd41-card { position: absolute; left: 740px; top: 318px; width: 440px; height: 380px; background: var(--bone); box-shadow: 0 22px 40px rgba(22,26,36,0.28); opacity: 0; }
    #pd41-card::after { content: ""; position: absolute; inset: 0; background-image: url('assets/textures/paper_fiber_01_norm.jpg'); background-size: 600px auto; mix-blend-mode: overlay; opacity: 0.5; pointer-events: none; }
    #pd41-tape { position: absolute; left: 885px; top: 296px; width: 150px; height: 42px; background: rgba(155,216,176,0.8); transform: rotate(-3deg); box-shadow: 0 2px 5px rgba(22,26,36,0.2); opacity: 0; }
    #pd41-title { left: 778px; top: 352px; font-size: 54px; line-height: 1.0; color: var(--ink); }
    .p41-lab { font-size: 30px; color: var(--ink); }
    #pd41-gov { left: 150px; top: 230px; width: 360px; text-align: center; }
    #pd41-fund { left: 516px; top: 262px; }
    #pd41-ctl { left: 330px; top: 706px; }
    #pd41-pc { left: 1430px; top: 880px; width: 380px; text-align: center; }
    .p41-co { position: absolute; width: 230px; height: 150px; background: var(--paper-2); box-shadow: 0 14px 26px rgba(22,26,36,0.25); opacity: 0; }
    .p41-co::after { content: ""; position: absolute; inset: 0; background-image: url('assets/textures/paper_fiber_01_norm.jpg'); background-size: 400px auto; mix-blend-mode: overlay; opacity: 0.5; pointer-events: none; }
    .p41-co svg { position: absolute; left: 0; top: 0; width: 230px; height: 150px; }
    #pd41-grain, #pd41-dust, #pd41-vig { z-index: 8; }
  </style>

  <div id="root" data-composition-id="pd41" data-vo-start="5076.3" data-duration="12.2667" data-width="1920" data-height="1080">
    <!-- sc001 · 5076.30–5088.57 · "Because what they really want to do … is to set up a research institute, which the government is funding, but it's
         out of government control. So this institute is doing research and then spinning out private companies." · grid-paper flow diagram:
         government → funding → research institute (control line cut) → private companies spun out (ref b76c4b43; ported from pd28 sc002 desk) -->
    <div class="p41-shot" id="pd41-shot">
      <div class="p41-p1" style="background-image:url('assets/textures/paper_graph_01_hires.jpg'); opacity:0.5"></div>
      <div class="p41-p2" style="background-image:url('assets/textures/paper_fiber_01.jpg'); opacity:0.35"></div>
      <div id="pd41-cam">
        <svg id="pd41-svg" viewBox="0 0 1920 1080"></svg>
        <div id="pd41-card"></div>
        <div id="pd41-tape"></div>
        <div class="p41-abs t-display" id="pd41-title"><span class="p41-w" id="pd41-t1">RESEARCH</span><br><span class="p41-w" id="pd41-t2">INSTITUTE</span></div>
        <svg id="pd41-lab" viewBox="0 0 1920 1080" style="position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible"></svg>
        <div class="p41-co" id="pd41-co0" style="left:1490px; top:236px"></div>
        <div class="p41-co" id="pd41-co1" style="left:1560px; top:450px"></div>
        <div class="p41-co" id="pd41-co2" style="left:1490px; top:664px"></div>
        <div class="p41-abs t-label p41-lab" id="pd41-gov"><span class="p41-w" id="pd41-g1">Government</span></div>
        <div class="p41-abs t-label p41-lab" id="pd41-fund"><span class="p41-w" id="pd41-f1">Funding</span></div>
        <div class="p41-abs t-label p41-lab" id="pd41-ctl"><span class="p41-w" id="pd41-c1">Out </span><span class="p41-w" id="pd41-c2">of </span><span class="p41-w" id="pd41-c3">government </span><span class="p41-w" id="pd41-c4">control</span></div>
        <div class="p41-abs t-label p41-lab" id="pd41-pc"><span class="p41-w" id="pd41-p1">Private </span><span class="p41-w" id="pd41-p2">companies</span></div>
        <svg id="pd41-mk" viewBox="0 0 1920 1080" style="position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; pointer-events:none"></svg>
      </div>
    </div>

    <audio id="pd41-vo" class="temp-vo" src="vo_pd.mp3" data-start="0" data-duration="12.2667" data-media-start="5076.3" data-volume="1"></audio>
    <div id="pd41-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_01_norm.jpg'); opacity:0.3"></div>
    <div id="pd41-dust" class="tx tx-dust" style="background-image:url('assets/textures/dust_02.jpg'); opacity:0.14"></div>
    <div id="pd41-vig" class="vignette" style="opacity:0.28"></div>
  </div>

  <script>
  (function () {
    const SEG = "pd41", START = 5076.3, DUR = 12.2667, END = START + DUR;
    const T = (s) => +(s - START).toFixed(3);   // TEXT cues (audited): literal = word start − 0.06
    const S = (s) => +(s - START).toFixed(3);   // structural cues
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(SEG + "-" + id);
    const E = FX.ease, C = (e, d) => FX.choppy(e, d, 12), NS = "http://www.w3.org/2000/svg";
    const INK = "#161a24", BOARD = "#2f9e5b", BOARDD = "#17603a", MAG = "#d1307a", ASH = "#878c96";
    const svg = $("svg"), lab = $("lab"), mkSvg = $("mk");
    const mk = (parent, tag, a) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); parent.appendChild(n); return n; };
    const rise = (el, t, o) => { o = o || {}; const d = o.dur || 0.4;
      tl.fromTo(el, { opacity: 0, y: o.y == null ? 12 : o.y }, { opacity: 1, y: 0, duration: d, ease: C(E.out, d), immediateRender: true }, t); };
    const drawLine = (p, t, dur, from) => { const L = p.getTotalLength(); p.setAttribute("stroke-dasharray", L + " " + L);
      const f0 = L * (1 - (from || 0));
      gsap.set(p, { attr: { "stroke-dashoffset": f0 } });
      tl.fromTo(p, { attr: { "stroke-dashoffset": f0 } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: C("sine.inOut", dur), immediateRender: false }, t); return p; };
    const pen = FX.markupDefs(mkSvg, SEG + "-pen", { boil: 4 });

    // frame 0: slow push on the desk; the pen is already sketching the institute's outline ("what they really want to do")
    tl.fromTo($("cam"), { scale: 1.0, x: 0 }, { scale: 1.045, x: -14, duration: DUR, ease: "sine.inOut", immediateRender: true }, 0);
    const sketch = mk(svg, "path", { d: "M744 324 L1178 320 L1182 698 L742 702 Z", fill: "none", stroke: INK, "stroke-width": 4, "stroke-linejoin": "round", opacity: 0.6 });
    drawLine(sketch, 0, 2.6, 0.42);

    // "set up a research institute": the card drops onto the sketch, the tape, then the title word by word
    tl.fromTo($("card"), { opacity: 0, y: -26, rotation: -2.5 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, S(5079.6));
    tl.to(sketch, { opacity: 0, duration: 0.2 }, S(5080.0));
    tl.fromTo($("tape"), { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: C(E.out, 0.3), immediateRender: true }, S(5079.95));
    rise($("t1"), T(5080.15), { y: 16 });   // research
    rise($("t2"), T(5080.71), { y: 16 });   // institute

    // "which the government": the government building (Taiwan = board green) builds up column by column
    const gov = mk(svg, "g", {});
    const gx = 330, gy = 440;
    const govParts = [
      mk(gov, "path", { d: "M" + (gx - 150) + " " + (gy + 120) + " H" + (gx + 150) + " V" + (gy + 146) + " H" + (gx - 150) + " Z", fill: BOARDD }),
      mk(gov, "path", { d: "M" + (gx - 130) + " " + (gy - 40) + " H" + (gx + 130) + " V" + (gy - 18) + " H" + (gx - 130) + " Z", fill: BOARDD }),
    ];
    for (let i = 0; i < 5; i++) govParts.push(mk(gov, "rect", { x: gx - 112 + i * 52, y: gy - 14, width: 26, height: 130, fill: BOARD }));
    govParts.push(mk(gov, "path", { d: "M" + (gx - 150) + " " + (gy - 44) + " L" + gx + " " + (gy - 120) + " L" + (gx + 150) + " " + (gy - 44) + " Z", fill: BOARD }));
    govParts.forEach((p, i) => { gsap.set(p, { opacity: 0 }); tl.fromTo(p, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25, ease: C(E.out, 0.25), immediateRender: false }, S(5081.85) + i * 0.06); });
    rise($("g1"), T(5081.91));               // government

    // "is funding": a thick green arrow with coins sliding along it
    const fund = mk(svg, "path", { d: "M498 380 Q620 300 728 410", fill: "none", stroke: BOARD, "stroke-width": 12, "stroke-linecap": "round" });
    gsap.set(fund, { opacity: 0 }); tl.set(fund, { opacity: 1 }, S(5082.55));
    drawLine(fund, S(5082.55), 0.5);
    const fh = mk(svg, "path", { d: "M700 384 L730 412 L692 420", fill: "none", stroke: BOARD, "stroke-width": 12, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0 });
    tl.set(fh, { attr: { opacity: 1 } }, S(5083.0));
    rise($("f1"), T(5082.55));               // funding
    for (let i = 0; i < 3; i++) {
      const coin = mk(svg, "g", { opacity: 0 }), cc = mk(coin, "g", {});
      mk(cc, "circle", { cx: 0, cy: 0, r: 17, fill: "#9bd8b0", stroke: BOARDD, "stroke-width": 4 });
      mk(cc, "rect", { x: -3, y: -9, width: 6, height: 18, fill: BOARDD });
      const pr = { u: 0 }, put = () => { const u = pr.u, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u;
        cc.setAttribute("transform", "translate(" + (a * 498 + b * 620 + c * 716).toFixed(1) + " " + (a * 380 + b * 300 + c * 396).toFixed(1) + ")"); };
      put();
      const t0 = S(5083.0) + i * 0.33;
      tl.set(coin, { attr: { opacity: 1 } }, t0);
      tl.fromTo(pr, { u: 0 }, { u: 1, duration: 0.7, ease: C("sine.inOut", 0.7), immediateRender: false, onUpdate: put }, t0);
      tl.set(coin, { attr: { opacity: 0 } }, t0 + 0.72);
    }

    // "but it's out of government control": a control wire from the government reaches for the institute and is cut (magenta pen X)
    const ctl = mk(svg, "path", { d: "M500 560 Q610 640 732 610", fill: "none", stroke: INK, "stroke-width": 6, "stroke-linecap": "round" });
    gsap.set(ctl, { opacity: 0 }); tl.set(ctl, { opacity: 1 }, S(5083.4));
    drawLine(ctl, S(5083.4), 0.5);
    tl.set(ctl, { attr: { "stroke-dasharray": "10 14" } }, S(5084.3));
    tl.to(ctl, { opacity: 0.45, duration: 0.3 }, S(5084.3));
    const x1 = FX.markup.pen(tl, mkSvg, S(5084.05), { points: [[580, 562], [652, 640]], color: MAG, width: 11, dur: 0.22, filter: pen, seed: 4 });
    const x2 = FX.markup.pen(tl, mkSvg, S(5084.3), { points: [[654, 564], [578, 636]], color: MAG, width: 11, dur: 0.22, filter: pen, seed: 6 });
    gsap.set([x1, x2], { opacity: 0 }); tl.set(x1, { opacity: 1 }, S(5084.05)); tl.set(x2, { opacity: 1 }, S(5084.3));
    rise($("c1"), T(5083.91));               // out
    rise($("c2"), T(5084.15));               // of
    rise($("c3"), T(5084.31));               // government
    rise($("c4"), T(5084.71));               // control

    // "this institute is doing research": a flask bubbling inside the card
    const fl = mk(lab, "g", { opacity: 0 });
    mk(fl, "path", { d: "M936 526 V566 L892 646 Q884 664 904 664 H1016 Q1036 664 1028 646 L984 566 V526", fill: "none", stroke: INK, "stroke-width": 7, "stroke-linejoin": "round", "stroke-linecap": "round" });
    mk(fl, "path", { d: "M928 524 H992", stroke: INK, "stroke-width": 7, "stroke-linecap": "round" });
    mk(fl, "path", { d: "M910 622 H1010 L1024 648 Q1028 658 1016 658 H904 Q892 658 896 648 Z", fill: BOARD });
    tl.fromTo(fl, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.001, immediateRender: false }, S(5086.45));
    tl.fromTo(fl, { y: 14 }, { y: 0, duration: 0.4, ease: C(E.out, 0.4), immediateRender: false }, S(5086.45));
    [[948, 0], [972, 0.22], [958, 0.44]].forEach((b, i) => {
      const bu = mk(lab, "circle", { cx: b[0], cy: 610, r: 9, fill: "none", stroke: BOARDD, "stroke-width": 4, opacity: 0 });
      tl.fromTo(bu, { attr: { cy: 612, opacity: 1 } }, { attr: { cy: 500, opacity: 0 }, duration: 1.0, ease: C("sine.out", 1.0), immediateRender: false }, S(5086.6) + b[1]);
    });

    // "and then spinning out private companies": three company cards spin out of the institute along short arrows
    const coPos = [[1490, 236], [1560, 450], [1490, 664]];
    coPos.forEach((p, i) => {
      const el = $("co" + i), s = mk(el.appendChild(document.createElementNS(NS, "svg")), "g", {});
      el.lastChild.setAttribute("viewBox", "0 0 230 150");
      mk(s, "path", { d: "M58 118 V66 L88 48 V66 L118 48 V66 L148 48 V118 Z", fill: ASH });
      mk(s, "rect", { x: 152, y: 34, width: 18, height: 84, fill: ASH });
      mk(s, "rect", { x: 40, y: 118, width: 150, height: 8, fill: INK });
      [76, 100, 124].forEach((x) => mk(s, "rect", { x: x, y: 84, width: 12, height: 14, fill: "#e7e6df" }));
      const dx = 960 - (p[0] + 115), dy = 510 - (p[1] + 75), t0 = S(5087.2) + i * 0.09;
      tl.fromTo(el, { opacity: 0, x: dx, y: dy, rotation: -300, scale: 0.3 }, { opacity: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.7, ease: C(E.out, 0.7), immediateRender: true }, t0);
      const ar = mk(svg, "path", { d: "M1186 " + (470 + i * 40) + " Q1300 " + (480 + i * 40) + " " + (p[0] - 18) + " " + (p[1] + 75), fill: "none", stroke: INK, "stroke-width": 5, "stroke-linecap": "round", "stroke-dasharray": "2 12" });
      gsap.set(ar, { opacity: 0 }); tl.set(ar, { opacity: 0.8 }, t0 + 0.25);
    });
    rise($("p1"), T(5087.83), { dur: 0.3 });   // private
    rise($("p2"), T(5088.07), { dur: 0.3 });   // companies

    FX.grain($("grain"), 4); FX.dust($("dust"), 6, 2);
    FX.mount(tl, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
