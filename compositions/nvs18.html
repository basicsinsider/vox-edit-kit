    function el(parent, tag, attrs) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; }
    function div(parent, cls, css, html) { const d = document.createElement("div"); if (cls) d.className = cls; d.style.cssText = css || ""; if (html) d.innerHTML = html; parent.appendChild(d); return d; }
    function ink(parent, d, t, dur, o) {
      o = o || {};
      const p = el(parent, "path", { d: d, fill: "none", stroke: o.color || INK, "stroke-width": o.width || 5, "stroke-linecap": "round", "stroke-linejoin": "round" });

    }
    const whipN = { n: 0 };
    function whip(a, b, t, o) {

      const k = ++whipN.n, ba = FX.whipDefs(defs, SEG + "-wa" + k), bb = FX.whipDefs(defs, SEG + "-wb" + k), h = o.dur / 2;
      const A = $(a + "-shot"), B = $(b + "-shot");
      tl.set(A, { filter: "url(#" + SEG + "-wa" + k + ")" }, t - h - 0.01); tl.set(A, { filter: "none" }, t + 0.06);
      tl.set(B, { filter: "url(#" + SEG + "-wb" + k + ")" }, t - 0.001); tl.set(B, { filter: "none" }, t + h + 0.02);
      FX.whip(tl, A, B, t, { dir: o.dir, vertical: o.vertical, dur: o.dur, blurA: ba, blurB: bb, dist: o.vertical ? 120 : 700 });
      if (o.flash) tl.fromTo($("flash"), { opacity: 0 }, { opacity: 0.85, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, t - 0.08);

    function slide(a, b, t, o) {

      const A = $(a + "-shot"), B = $(b + "-shot"), dist = (o.axis === "x" ? 1980 : 1140) * o.from;
      tl.fromTo(B, { [o.axis]: dist, boxShadow: "0 0 80px rgba(0,0,0,0.5)" }, { [o.axis]: 0, duration: o.d, ease: C(E.inOut, o.d), immediateRender: false }, t - o.d);

    const gated = (a, b, fn) => { const on = FX.onFrame; FX.onFrame = (f) => on(FX.gate(S(a), S(b), f)); fn(); FX.onFrame = on; };
    let PEN, MARK;

    /* sc012 → sc013: match dissolve on the wafer outline (1886.93–1887.35) */

        crates.push(c);
      });
      // CCP: the flag on the gate post (1848.91)
      pop($("sc006-flag"), S(1848.88), { from: 1.4, n: 3 });
      // "not giving … permission" → the barrier arm drops shut (12 fps)
      gsap.set($("sc006-arm"), { rotation: -78 });
      tl.fromTo($("sc006-arm"), { rotation: -78 }, { rotation: 0, duration: 0.7, ease: C(E.out, 0.7), immediateRender: false }, S(1849.80));
      // "companies" → the Chinese buyers waiting on the far side
      const lg = [["alibaba_wordmark", 1500, 300, 300, 90], ["bytedance", 1530, 440, 240, 90], ["tencent_wordmark", 1500, 580, 300, 80], ["baidu", 1530, 710, 240, 90]];
      lg.forEach((g, i) => {
        const im = document.createElement("img"); im.className = "n18-logo"; im.alt = ""; im.src = "assets/nvidia/shared/logos/" + g[0] + ".svg";
        im.style.cssText = "left:" + g[1] + "px;top:" + g[2] + "px;width:" + g[3] + "px;height:" + g[4] + "px;filter:brightness(0);opacity:0.86";
        $("sc006-logos").appendChild(im);
        gsap.set(im, { opacity: 0 });
        tl.fromTo(im, { opacity: 0, x: 40 }, { opacity: 0.86, x: 0, duration: 0.6, ease: C(E.out, 0.6), immediateRender: true }, S(1850.62) + i * 0.1);
      });
      // "permission" → red lock on the barrier + marker circle
      const lock = $("sc006-lock");
      lock.style.webkitMaskImage = ICO("lock"); lock.style.maskImage = ICO("lock");
      pop(lock, S(1851.20), { from: 1.5, n: 3 });
      const circ = FX.markup.circle(tl, svg, S(1851.45), { cx: 1155, cy: 620, rx: 120, ry: 104, rot: -8, color: RED, width: 8, filter: MARK, dur: 0.55, seed: 5 });
      gsap.set(circ, { opacity: 0 }); tl.set(circ, { opacity: 1 }, S(1851.45));
      // "take delivery" → the crates push toward the gate and stop at the barrier
      crates.forEach((c, i) => {
        tl.to(c, { x: 260, duration: 0.5, ease: C(E.inOut, 0.5) }, S(1851.98) + i * 0.03);
        tl.to(c, { x: 236, duration: 0.25, ease: C("power2.out", 0.25) }, S(1852.48) + i * 0.03);
      });
      push("sc006", 1848.62, 1853.5, 1.0, 1.04, { ease: E.cam, origin: "960px 620px" });
    })();

    /* ===== sc007 · why? ===== */
    (function () {
      push("sc007", 1853.42, 1856.5, 1.0, 1.07, { ease: E.cam, origin: "700px 600px" });
      const svg = $("sc007-svg");
      const q = pen(svg, S(1853.45), { points: [[1236, 330], [1252, 262], [1306, 226], [1372, 236], [1410, 290], [1392, 352], [1334, 396], [1318, 458], [1320, 520]], jitter: 4, seed: 7, dur: 0.75, width: 18, color: REDL, filter: PEN, blend: "normal" });
      const dt = pen(svg, S(1854.25), { points: [[1318, 598], [1324, 606]], jitter: 1, seed: 8, dur: 0.12, width: 26, color: REDL, filter: PEN, blend: "normal" });
      tl.fromTo([q, dt], { scale: 1 }, { scale: 1.04, duration: 2.2, ease: "none", transformOrigin: "1320px 420px", immediateRender: false }, S(1854.3));
    })();

    /* ===== sc008 · win the AI war — why not take the good chips? ===== */
    (function () {
      const bus = $("sc008-bus"), bcn = $("sc008-bcn");
      gsap.set([bus, bcn], { scaleX: 0 });
      tl.fromTo(bus, { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: C(E.out, 1.4), immediateRender: false }, S(1856.55));
      tl.fromTo(bcn, { scaleX: 0 }, { scaleX: 1, duration: 1.5, ease: C(E.out, 1.5), immediateRender: false }, S(1856.70));
      // "the good chips" → a crate of chips sits right beside China's lane
      const c = div($("sc008-crate"), "n18-crate", "left:1080px;top:780px", '<div class="s"></div>');
      div(c, "c n18-ico", "background:" + VOLTD + ";-webkit-mask-image:" + ICO("chip") + ";mask-image:" + ICO("chip"));
      gsap.set(c, { opacity: 0 });
      tl.fromTo(c, { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, S(1859.42));
      // "that it has access to" → dashed pen arrow from the crate up to China's bar: it could just take them
      const svg = $("sc008-svg");
      const a = pen(svg, S(1860.0), { points: [[1160, 770], [1176, 700], [1220, 650], [1300, 606]], jitter: 3, seed: 4, dur: 0.6, width: 7, color: INK, filter: PEN });
      a.setAttribute("stroke-dasharray", "16 14"); a.removeAttribute("stroke-dashoffset");
      gsap.set(a, { opacity: 0 });
      tl.fromTo(a, { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "steps(5)", immediateRender: true }, S(1860.0));
      const hd = pen(svg, S(1860.45), { points: [[1266, 594], [1302, 604], [1290, 640]], jitter: 2, seed: 9, dur: 0.18, width: 7, color: INK, filter: PEN });
      push("sc008", 1856.45, 1861.6, 1.0, 1.05, { ease: E.cam, origin: "1100px 560px" });
    })();

    /* ===== sc009 · what a chip company needs (fab footage) ===== */
    (function () {
      push("sc009", 1861.48, 1868.2, 1.04, 1.1, { ease: "none", origin: "960px 540px" });
      FX.focusHunt(tl, $("sc009-vw"), S(1861.62), { dur: 0.7, a: 3, b: 5 });
    })();

    /* ===== sc010 · Huawei: successful, but China wants more ===== */
    (function () {
      push("sc010", 1868.12, 1873.72, 1.0, 1.05, { ease: E.cam, origin: "560px 760px" });
      tl.fromTo($("sc010-bp"), { x: 0 }, { x: -26, duration: 5.6, ease: "none", immediateRender: false }, S(1868.12));
      tl.fromTo($("sc010-mp"), { x: 0 }, { x: 22, duration: 5.6, ease: "none", immediateRender: false }, S(1868.12));
      const lc = $("sc010-lc");
      gsap.set(lc, { opacity: 0 });
      tl.fromTo(lc, { opacity: 0, y: 90, rotation: -9 }, { opacity: 1, y: 0, rotation: -3, duration: 0.8, ease: C(E.out, 0.8), immediateRender: true }, S(1868.78));
      // "wants it to be MORE successful" → red pen arrow climbing out of the logo card
      const svg = $("sc010-svg");
      const ar = FX.markup.arrow(tl, svg, S(1872.30), { x1: 700, y1: 630, x2: 880, y2: 250, bend: -60, head: 46, dur: 0.6, color: RED, width: 11, filter: PEN });
      ar.forEach((p) => { gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, S(1872.30)); });
      tl.to($("sc010-vw"), { scale: 1.2, duration: 0.5, ease: E.in }, S(1873.25));
    })();

    /* ===== sc011 · VOLUME: orders pile up ===== */
    (function () {
      const svg = $("sc011-svg");
      ink(svg, "M120 862 L900 860 L1800 863", S(1873.72), 0.01, { width: 5 });
      const fac = $("sc011-fac");
      fac.style.webkitMaskImage = ICO("factory"); fac.style.maskImage = ICO("factory");
      gsap.set(fac, { opacity: 0 });
      tl.fromTo(fac, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: C(E.out, 0.6), immediateRender: true }, S(1873.90));
      // axis drawn up as the word lands ("volume" 1876.99)
      ink(svg, "M600 860 L602 520 L600 196", S(1876.95), 1.2, { width: 6 });
      ink(svg, "M574 228 L600 192 L626 230", S(1878.05), 0.2, { width: 6 });
      rise($("sc011-vol").querySelector(".n18-w"), T(1876.93), { dur: 0.6, y: 12 });
      // order tickets drop and stack ("the volume of order they get … the bigger it is")
      const pile = $("sc011-pile"), N = 14, r = FX.rng(1811);
      for (let i = 0; i < N; i++) {
        const tk = div(pile, "n18-tk", "left:" + (700 + (r() - 0.5) * 34).toFixed(0) + "px;top:" + (806 - i * 46) + "px;transform:rotate(" + ((r() - 0.5) * 5).toFixed(2) + "deg)",
          '<i style="left:18px;width:' + (120 + Math.floor(r() * 70)) + 'px"></i><i style="left:18px;top:28px;width:' + (70 + Math.floor(r() * 60)) + 'px;opacity:0.6"></i><b></b>');
        gsap.set(tk, { opacity: 0 });
        const t0 = S(1877.75) + (i < 5 ? i * 0.3 : 1.5 + (i - 5) * 0.2);
        tl.fromTo(tk, { opacity: 0, y: -260 }, { opacity: 1, y: 0, duration: 0.42, ease: C("power2.in", 0.42), immediateRender: true }, t0);
      }
      // "the better it is for that company" → the factory lights volt (the business booms) + an ink rise mark
      tl.to(fac, { backgroundColor: VOLTD, duration: 0.3, ease: "steps(3)" }, S(1880.30));
      const up = pen(svg, S(1880.55), { points: [[1290, 500], [1312, 420], [1340, 330]], jitter: 3, seed: 12, dur: 0.45, width: 8, color: INK, filter: PEN });
      pen(svg, S(1880.95), { points: [[1306, 360], [1342, 322], [1366, 368]], jitter: 2, seed: 13, dur: 0.2, width: 8, color: INK, filter: PEN });
      push("sc011", 1873.72, 1882.3, 1.0, 1.05, { ease: E.cam, origin: "760px 520px" });
    })();

    /* ===== sc012 · the real wafer pulls back; YIELD ===== */
    (function () {
      push("sc012", 1882.20, 1886.60, 2.7, 1.0, { ease: E.cam, origin: "960px 560px" });
      FX.focusHunt(tl, $("sc012-vw"), S(1886.62), { dur: 0.6, a: 2, b: 3 });
      rise($("sc012-ttl").querySelector(".n18-w"), T(1886.69), { dur: 0.6, y: 14 });
    })();

    /* ===== sc013 · wafer chart: 10 × 10 dies, volt = works, graphite = failed (nvs19 continues this geometry) ===== */
    (function () {
      const svg = $("sc013-svg");
      const CX = 960, CY = 560, R = 448, PITCH = 62, DIE = 54, X0 = CX - (9 * PITCH + DIE) / 2, Y0 = CY - (9 * PITCH + DIE) / 2;
      const g0 = el(svg, "defs", {});
      g0.innerHTML = '<radialGradient id="nvs18-wg" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#2c3438"/><stop offset="1" stop-color="#181d20"/></radialGradient>';
      el(svg, "circle", { cx: CX, cy: CY, r: R, fill: "url(#nvs18-wg)", stroke: "#c3c7c8", "stroke-width": 4, "stroke-opacity": 0.75 });
      el(svg, "path", { d: "M" + (CX - 16) + " " + (CY + R - 1) + " L" + CX + " " + (CY + R - 18) + " L" + (CX + 16) + " " + (CY + R - 1), fill: "#0d1012", stroke: "#888e92", "stroke-width": 2, "stroke-opacity": 0.7 });
      const r = FX.rng(1818), dies = [];
      for (let row = 0; row < 10; row++) for (let col = 0; col < 10; col++) {
        const x = X0 + col * PITCH, y = Y0 + row * PITCH, dx = x + DIE / 2 - CX, dy = y + DIE / 2 - CY, d = Math.hypot(dx, dy) / R;
        const good = r() < 0.78 - 0.55 * d * d;
        const rc = el(svg, "rect", { x: x, y: y, width: DIE, height: DIE, rx: 4, fill: "#1c2225", stroke: "#6b7378", "stroke-width": 2, "stroke-dasharray": "6 4" });
        dies.push({ rc, row, col, good });
      }
      // dies show on "100" (diagonal sweep), counter counts with them
      dies.forEach((d) => { gsap.set(d.rc, { opacity: 0 }); tl.fromTo(d.rc, { opacity: 0 }, { opacity: 1, duration: 1 / 12, ease: "steps(1)", immediateRender: true }, T(1889.17) + Math.floor((d.row + d.col) / 3) / 12); });
      const n = $("sc013-n");
      tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(1889.17));
      FX.text.count(tl, n, T(1889.17), 0, 100, 0.6, (v) => String(Math.round(v)));
      rise($("sc013-nc"), T(1889.57), { dur: 0.45, y: 8 });
      // "how many of those chips are actually good?" → test sweep row by row: volt = works, graphite = failed
      dies.forEach((d) => {
        const t = S(1890.20) + d.row * 0.16 + d.col * 0.012;
        if (d.good) {
          tl.to(d.rc, { attr: { fill: VOLT, stroke: VOLTL, "stroke-dasharray": "none" }, duration: 1 / 12, ease: "steps(1)" }, t);
          tl.set(d.rc, { filter: "drop-shadow(0 0 7px rgba(134,194,50,0.6))" }, t);
        } else tl.to(d.rc, { attr: { fill: "#3a4247", stroke: "#2a3034", "stroke-dasharray": "none" }, duration: 1 / 12, ease: "steps(1)" }, t);
      });
      tl.fromTo($("sc013-lg1"), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, T(1892.05));
      tl.fromTo($("sc013-lg2"), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, S(1892.25));
      // "they work properly" → the good dies pulse
      const goods = dies.filter((d) => d.good).map((d) => d.rc);
      tl.fromTo(goods, { attr: { fill: VOLT } }, { attr: { fill: VOLTL }, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, S(1892.80));
      // match dissolve from the real wafer + slow drift
      tl.fromTo($("sc013-shot"), { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "sine.inOut", immediateRender: false }, S(1886.93));
      push("sc013", 1886.93, 1893.917, 1.0, 1.035, { ease: "none", origin: "960px 560px" });
    })();

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
</template>
