    face("sc015", [[462.67, "M"]], 464.93);

    /* ===== sc016 · every chip on the planet is under American law (whip) ===== */
    whip("sc015", "sc016", S(464.93), { dir: 1 });
    (function () {
      const K = 22.7556, P = (lon, lat) => [(lon + 180) * K, (90 - lat) * K];
      const cam = $("sc016-cam"), A = at(4180, 1800, 0.30), B = at(4150, 1760, 0.318);
      gsap.set(cam, A);
      tl.fromTo(cam, A, Object.assign({}, B, { duration: 7.73, ease: "none", immediateRender: false }), S(464.93));
      const svg = $("sc016-map");
      rise($("sc016-tag"), S(465.05), { dur: 0.7 });
      const dc = P(-77.04, 38.9);
      const fabs = [[121.0, 24.8], [127.0, 37.0], [130.7, 32.9], [121.5, 31.2], [103.8, 1.35], [100.3, 5.4], [34.8, 31.6],
        [13.7, 51.05], [-6.5, 53.4], [-112.0, 33.4], [-97.7, 30.3], [-73.8, 43.0]];
      const pins = fabs.map((f, i) => {
        const [x, y] = P(f[0], f[1]);
        const g = el(svg, "g", {});
        const halo = el(g, "circle", { cx: x, cy: y, r: 46, fill: "rgba(134,194,50,0.25)" });
        const dot = el(g, "circle", { cx: x, cy: y, r: 22, fill: VOLT, stroke: "#0f1318", "stroke-width": 6 });
        gsap.set(g, { opacity: 0 });
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none", immediateRender: false }, S(466.37) + Math.floor(i * 1.0) / 12);
        tl.fromTo(halo, { attr: { r: 0 } }, { attr: { r: 46 }, duration: 0.6, ease: C(E.out, 0.6), immediateRender: false }, S(466.37) + i / 12);
        return { x, y, dot, halo, d: Math.hypot(x - dc[0], y - dc[1]) };
      });
      // Washington, D.C.: source of the rings
      const src = el(svg, "circle", { cx: dc[0], cy: dc[1], r: 26, fill: ICE, stroke: ICEL, "stroke-width": 6 });
      gsap.set(src, { opacity: 0 });
      tl.fromTo(src, { opacity: 0, attr: { r: 0 } }, { opacity: 1, attr: { r: 26 }, duration: 0.5, ease: C(E.out, 0.5), immediateRender: false }, S(468.20));
      const lab = $("sc016-dc");
      gsap.set(lab, { left: 960 + (dc[0] - 4150) * 0.318 - 290, top: 540 + (dc[1] - 1760) * 0.318 + 24 });
      rise(lab, S(468.40), { dur: 0.5 });
      // rings spread from Washington over every fab; each pin turns ice as a ring reaches it
      const RMAX = 5200, RD = 2.2;
      [468.45, 468.95, 469.45].forEach((t0, k) => {
        const ring = el(svg, "circle", { cx: dc[0], cy: dc[1], r: 10, fill: "none", stroke: ICEL, "stroke-width": 16 - k * 3 });
        gsap.set(ring, { opacity: 0 });
        tl.fromTo(ring, { attr: { r: 10 }, opacity: 0.95 }, { attr: { r: RMAX }, opacity: 0, duration: RD, ease: "power1.out", immediateRender: false }, S(t0));
      });
      const inv = (f) => { let lo = 0, hi = 1; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; (1 - Math.pow(1 - m, 2)) < f ? lo = m : hi = m; } return lo; };
      pins.forEach((p) => {
        const tt = S(468.45) + inv(p.d / RMAX) * RD;
        tl.to(p.dot, { attr: { fill: ICEL }, duration: 0.15, ease: "none" }, tt);
        tl.to(p.halo, { attr: { fill: "rgba(159,220,240,0.28)" }, duration: 0.15, ease: "none" }, tt);
      });
      // "you kinda need American stuff to make chips": thin ice lines Washington → every fab
      pins.forEach((p, i) => {
        const mx = (dc[0] + p.x) / 2, my = Math.min(dc[1], p.y) - 0.18 * Math.abs(p.x - dc[0]) - 60;
        ink(svg, `M${dc[0]} ${dc[1]} Q${mx} ${my} ${p.x} ${p.y}`, S(469.95) + (i % 6) / 12, 0.9, { width: 7, color: ICEL, opacity: 0.6 });
      });
    })();

    FX.mount(tl, DURATION);
    window.__timelines[SEG] = tl;
  })();
  </script>
