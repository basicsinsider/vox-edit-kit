      FX.text.count(tl, num, T(796.03), 0, 1.5, 0.55, (v) => "$" + v.toFixed(1));
      tl.fromTo($("sc004-n"), { y: 18 }, { y: 0, duration: 0.6, ease: C(E.out, 0.6), immediateRender: true }, T(796.03));
      rise(W("sc004-n")[0], T(796.67), { dur: 0.4, y: 10 });
      rise($("sc004-al"), T(796.67), { dur: 0.4, y: 8 });

    /* ===== sc005 · Pacific map (light-flash whip) ===== */
    whip("sc004", "sc005", S(797.61), { dir: 1, flash: true });
    (function () {
      const cam = $("sc005-cam"), svg = $("sc005-svg");
      const SJ = [6077, 997], P = [572, 1980], CN = [600, 1400], SEO = [1187, 987];

      ink(svg, dR, S(797.72), 1.65, { color: VOLT, width: 9, ease: E.inOut });

      ink(svg, dC, S(803.55), 1.9, { color: REDL, width: 9, ease: C(E.inOut, 1.9) });
      tl.fromTo($("sc005-cn"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: C(E.out, 0.7), immediateRender: true }, S(805.6));
      // the decoy: dotted line to South Korea
      const dD = "M" + (P[0] + 40) + " " + (P[1] - 30) + " Q1150 1720 " + SEO[0] + " " + (SEO[1] + 30);
      const tmp = el(svg, "path", { d: dD, fill: "none" }), L = tmp.getTotalLength();
      for (let i = 0; i < 18; i++) {
        const q = tmp.getPointAtLength(L * (i + 0.5) / 18);

        tl.set(c, { opacity: 0.85 }, S(806.2) + Math.floor(i / 2) / 12);

      tmp.remove();
      // markers + labels (screen-size)
      const usDot = mdot(cam, SJ[0], SJ[1], '<div style="position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:' + VOLT + ';box-shadow:0 0 0 6px rgba(134,194,50,0.25)"></div>');
      const pin = mdot(cam, P[0], P[1], '<div style="position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;background:' + BONE + ';box-shadow:0 0 0 8px rgba(240,239,232,0.22),0 2px 6px rgba(0,0,0,0.6)"></div>');
      const kr = mdot(cam, SEO[0], SEO[1], '<div style="position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:4px dashed ' + BONE + ';box-sizing:border-box"></div>');
      const lUS = mlab(cam, SJ[0], SJ[1], "United States", { size: 46, anchor: "r", gap: 34 });
      const lSEA = mlab(cam, P[0], P[1], "Southeast Asia", { size: 50, anchor: "l", gap: 40, dy: 4 });
      const lCN = mlab(cam, 640, 1060, "China", { size: 76, color: REDL });
      const lKR = mlab(cam, SEO[0], SEO[1], "South Korea", { size: 46, anchor: "l", gap: 36 });
      camDrive(cam, [
        [797.61, 799.55, at(5100, 1180, 0.75), at(1300, 1470, 0.75), E.inOut],
        [799.55, 808.09, at(1300, 1470, 0.75), at(1310, 1440, 0.80), E.cam],
      ], [usDot, pin, kr, lUS, lSEA, lCN, lKR]);
      pop(usDot.inner, S(797.62), { dur: 0.4, from: 0.4 });
      rise(lUS.inner, S(797.62), { dur: 0.5, y: 6 });
      tl.to([usDot.inner, lUS.inner], { opacity: 0, duration: 0.2 }, S(798.9));
      pop(pin.inner, S(799.2), { dur: 0.5, from: 0.3 });
      rise(lSEA.inner, T(799.23), { dur: 0.6, y: 8 });
      rise(lCN.inner, T(805.71), { dur: 0.6, y: 8 });
      pop(kr.inner, S(807.0), { dur: 0.4, from: 0.4 });
      rise(lKR.inner, T(807.15), { dur: 0.35, y: 6 });
    })();

    /* ===== sc006 · FACE C (hard cut on the map drift) ===== */
    face("sc006", 808.09, 815.29, "C");

    /* ===== sc007 · cork board (whip ←) ===== */
    whip("sc006", "sc007", S(815.29), { dir: -1 });
    (function () {
      $("sc007-realic").innerHTML = ICON.server;
      $("sc007-fakeic").innerHTML = ICON.serverHollow;
      const stk = $("sc007-stk"); stk.innerHTML = ICON.barcode;
      const real = $("sc007-real"), fake = $("sc007-fake"), hd = $("sc007-hd"), wh = $("sc007-wh"), svg = $("sc007-svg");
      push("sc007", 815.29, 828.3, 1.04, 1.0, { ease: E.cam });
      // QA fix: the board is never empty — both cards and the face-down polaroid are pinned when the whip lands (frame 1)
      gsap.set([real, fake, stk, hd], { opacity: 1 });
      // "hair dryer": the face-down polaroid flips over (back hidden at the edge-on moment)
      const hdbk = $("sc007-hdbk");
      tl.fromTo(hd, { scaleX: 1 }, { scaleX: 0.02, duration: 0.12, ease: "power2.in", immediateRender: false }, S(820.45));
      tl.set(hdbk, { opacity: 0 }, S(820.57));
      tl.fromTo(hd, { scaleX: 0.02 }, { scaleX: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, S(820.57));
      FX.focusHunt(tl, hd, S(820.7), { dur: 0.6 });
      // twine: hair dryer → real card
      ink(svg, "M420 334 C560 420 760 320 968 366", S(820.95), 0.6, { color: ASHL, width: 4, opacity: 0.9, ease: C(E.inOut, 0.6) });
      // peel: the sticker lifts off the real card …
      tl.to(stk, { rotation: -16, scale: 1.12, boxShadow: "0 18px 26px rgba(0,0,0,0.45)", duration: 0.6, ease: C(E.out, 0.6) }, S(821.6));
      // … and flies over to the fake card
      tl.to(stk, { x: 560, duration: 1.15, ease: C(E.inOut, 1.15) }, S(823.9));
      tl.to(stk, { y: -150, duration: 0.55, ease: C(E.out, 0.55) }, S(823.9));
      tl.to(stk, { y: 10, duration: 0.6, ease: C(E.in, 0.6) }, S(824.45));
      tl.to(stk, { rotation: 3, scale: 1, boxShadow: "0 3px 5px rgba(0,0,0,0.3)", duration: 2 / 12, ease: "steps(2)" }, S(825.05));
      ink(svg, "M968 366 C1120 280 1330 300 1530 378", S(823.95), 1.0, { color: ASHL, width: 4, opacity: 0.9, ease: C(E.inOut, 1.0) });
      const rw = W("sc007-real"), fw = W("sc007-fake");
      [T(823.71), T(824.03)].forEach((c, i) => rise(rw[i], c, { dur: 0.4, y: 8 }));
      [T(825.15), T(825.87), T(826.03), T(826.27)].forEach((c, i) => rise(fw[i], c, { dur: 0.4, y: 8 }));
      // the room full of dummy servers (real indictment still)
      drop(wh, S(828.35), 1.5, { spin: 5, from: 1.2 });
      tl.to(fake, { opacity: 0.5, duration: 0.3 }, S(828.4));
      tl.fromTo($("sc007-vw"), { scale: 1.0 }, { scale: 1.16, duration: 2.94, ease: E.cam, immediateRender: false }, S(828.35));
      gsap.set($("sc007-vw"), { transformOrigin: "960px 560px" });
    })();

    /* ===== sc008 · indictment p16 (paper slides in) ===== */
    slide("sc007", "sc008", S(831.29), { axis: "x" });
    (function () {
      const cam = $("sc008-cam"), hl = $("sc008-hl");
      gsap.set(cam, { y: -290 });
      tl.fromTo(cam, { y: -290 }, { y: -330, duration: 4.0, ease: E.cam, immediateRender: false }, S(831.0));
      gsap.set(hl, { scaleX: 0 });
      tl.fromTo(hl, { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: C(E.inOut, 0.42), immediateRender: true }, S(835.82));
      tl.to(cam, { y: -760, duration: 0.6, ease: E.in }, S(836.16));               // pan down to the stills → cut on action
      push("sc008", 830.84, 836.76, 1.0, 1.04, { ease: E.cam, origin: "800px 600px" });

    /* ===== sc009 · security monitor (hard cut on the pan) ===== */

      ar.forEach((p) => { gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, S(838.8)); });

    whip("sc009", "sc010", S(839.96), { dir: 1, vertical: true });

    /* ===== sc011 · Megaspeed (slides in on the 846.92 join) ===== */

    (function () {

      tl.fromTo(card, { x: 1300, rotationY: -14 }, { x: 0, rotationY: -6, duration: 0.9, ease: C(E.out, 0.9), immediateRender: true }, S(850.22));

    /* ===== sc012 · FACE W (hard cut) ===== */

    /* ===== sc013 · Southeast Asia ? pins (light-flash vertical whip) ===== */
    whip("sc012", "sc013", S(858.92), { dir: -1, vertical: true, flash: true });
    (function () {

      rise(reg.inner, T(863.42), { dur: 0.6, y: 10 });
    })();

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
