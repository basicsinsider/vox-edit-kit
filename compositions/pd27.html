    <div class="p27-shot" id="pd27-sc001">

        <div class="p27-card" id="pd27-c1" style="left:110px; top:150px; width:560px; height:470px"><div class="in"><img src="assets/c4/derived/c4s03/ntu_campus_1960_frame.jpg" alt="" style="filter:url(#pd27-tint)"></div><div class="cap t-label">Students · Taiwan · 1960</div>

  <script>
  (function () {
    const SEG = "pd27", START = 3193.6, DUR = 13.1;
    const T = (s) => +(s - START).toFixed(3);   // TEXT cues (audited): literal = word start − 0.06
    const S = (s) => +(s - START).toFixed(3);   // structural cues
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(SEG + "-" + id);
    const E = FX.ease, C = (e, d) => FX.choppy(e, d, 12), MAG = "#d1307a";
    FX.tintDefs($("defs"), SEG + "-tint", "#12151c", "#e6e7e2");
    const word = (id, t) => tl.fromTo($(id), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: C(E.out, 0.25), immediateRender: true }, t);
    const bar = (id, t) => { const el = $(id);
      gsap.set(el, { clipPath: "inset(0% 100% 0% 0%)", webkitClipPath: "inset(0% 100% 0% 0%)" });
      tl.to(el, { clipPath: "inset(0% 0% 0% 0%)", webkitClipPath: "inset(0% 0% 0% 0%)", duration: 0.3, ease: C(E.out, 0.3) }, t); };

    // ---- frame 0: the campus photo is already landing on the desk ("One of the advertising slogans they had…")
    gsap.set($("c1"), { rotation: -9, x: -130, y: -40 });
    tl.fromTo($("c1"), { rotation: -9, x: -130, y: -40 }, { rotation: -3, x: 0, y: 0, duration: 1.2, ease: C(E.out, 1.2), immediateRender: false }, 0);
    tl.fromTo($("c2"), { opacity: 0, rotation: 11, x: -80, y: 70 }, { opacity: 1, rotation: 4, x: 0, y: 0, duration: 1.0, ease: C(E.out, 1.0), immediateRender: true }, S(3194.5));
    tl.fromTo($("cam"), { scale: 1.04 }, { scale: 1.0, duration: DUR, ease: "sine.out", immediateRender: true }, 0);
    tl.fromTo($("q"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: C(E.out, 0.4), immediateRender: true }, S(3195.5));   // "was like," → opening quote mark

    // ---- the slogan, word by word on the words (a quoted line)
    bar("b1", T(3195.83));
    word("w1", T(3195.83));   // Come
    word("w2", T(3196.15));   // come
    word("w3", T(3196.47));   // come
    bar("b2", T(3196.71));
    word("w4", T(3196.71));   // to
    word("w5", T(3196.87));   // NTU
    tl.fromTo($("ntu"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: C(E.out, 0.4), immediateRender: true }, T(3197.83));   // (Taiwan national university →) National Taiwan University
    bar("b3", T(3200.71));
    word("w6", T(3200.71));   // go
    word("w7", T(3201.03));   // go
    word("w8", T(3201.27));   // go
    bar("b4", T(3201.43));
    word("w9", T(3201.43));   // to
    word("w10", T(3201.59));  // America

    // ---- "you come to your university, you will go to America": pen arrow from the campus to the second half
    const svg = $("mk"); FX.markupDefs(svg, SEG + "-pen", { boil: 4 }); svg.setAttribute("viewBox", "0 0 1920 1080");
    const parts = FX.markup.arrow(tl, svg, S(3205.0), { x1: 690, y1: 600, x2: 768, y2: 770, bend: -70, head: 30, dur: 0.7, color: MAG, width: 8, filter: "url(#" + SEG + "-pen)" });
    parts.forEach((p, i) => { gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, S(3205.0) + (i ? 0.6 : 0)); });

    FX.grain($("grain"), 3); FX.dust($("dust"), 5, 2);
    FX.mount(tl, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
