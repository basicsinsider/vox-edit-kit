<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0f0e0d; }
    #s07-weave { position: absolute; inset: -20px; }
    #s07-wrap { position: absolute; inset: 0; transform-origin: 50% 42%; }
    #s07-a, #s07-b { position: absolute; inset: 0; }
    /* portrait: framed off-centre, soft dark surround */
    #s07-a .bg { position: absolute; inset: -40px; background-size: cover; background-position: center 30%; filter: url(#s07-tint) blur(18px); opacity: 0.7; }
    #s07-a .plate { inset: auto; left: 190px; top: 70px; width: 900px; height: 940px; box-shadow: 0 30px 90px rgba(0,0,0,0.6); }
    #s07-a .plate .img, #s07-a .plate .fringe { object-position: 50% 28%; }
    #s07-b .plate .img, #s07-b .plate .fringe { object-position: 30% 50%; }
    #s07-b .plate { inset: 0; }
    #s07-pano { position: absolute; left: -40px; top: -70px; height: 1220px; width: 4225px; }
    #s07-name { position: absolute; left: 1180px; top: 560px; width: 660px; }
    #s07-name .n { font-size: 30px; color: #e8dccb; }
    #s07-name .c { font-size: 50px; margin-top: 8px; }
    #s07-first { position: absolute; left: 1180px; top: 400px; width: 700px; font-size: 92px; }
    #s07-year-wrap { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
    #s07-founded { font-size: 30px; color: #e8dccb; }
    #s07-year { font-size: 280px; margin-top: 4px; }
    #s07-shade { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 52%, rgba(10,9,8,0.55), rgba(10,9,8,0.15) 70%); }
  </style>
  <div id="root" data-composition-id="s07" data-width="1920" data-height="1080">
    <svg id="s07-svg" width="0" height="0" style="position:absolute"></svg>
    <div id="s07-weave">
      <div id="s07-wrap">
        <div id="s07-a">
          <div class="bg" style="background-image:url('assets/archival/hoover/hoover_young_1898.jpg')"></div>
          <div class="plate"><img class="img" src="assets/archival/hoover/hoover_young_1898.jpg" alt="" /><img class="fringe" src="assets/archival/hoover/hoover_young_1898.jpg" alt="" /></div>
        </div>
        <div id="s07-b">
          <div id="s07-pano">
            <div class="plate"><img class="img" src="assets/archival/hoover/stanford_main_quad_panorama_c1896.jpg" alt="" /><img class="fringe" src="assets/archival/hoover/stanford_main_quad_panorama_c1896.jpg" alt="" /></div>
          </div>
          <div id="s07-shade"></div>
        </div>
      </div>
    </div>
    <div id="s07-name"><div class="n t-label halate">Herbert Hoover</div><div class="c t-serif-i halate">Stanford, Pioneer Class of 1895</div></div>
    <div id="s07-first" class="t-display halate">The first class</div>
    <div id="s07-year-wrap"><div id="s07-founded" class="t-label halate">Stanford University · founded</div><div id="s07-year" class="t-display halate yellow">1891</div></div>
    <div id="s07-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_02_norm.jpg')"></div>
    <div id="s07-dust" class="tx tx-dust" style="background-image:url('assets/textures/dust_01.jpg'); opacity: 0.55"></div>
    <div class="vignette" style="background: radial-gradient(ellipse 72% 68% at 50% 50%, rgba(0,0,0,0) 50%, rgba(8,6,4,0.7) 100%)"></div>
    <audio id="s07-vo" src="vo10.mp3" data-start="0" data-duration="10.0" data-media-start="131.4" data-volume="1"></audio>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const T = (s) => s - 131.4;
    const $ = (id) => document.getElementById(id);
    FX.tintDefs($("s07-svg"), "s07-tint", "#0f0e0d", "#6a6257");
    FX.weave($("s07-weave"), { amp: 1.8, flicker: 0.045, seed: 71 });
    FX.grain($("s07-grain"), 72);
    FX.dust($("s07-dust"), 73, 2);

    // portrait: slow push like a physical photo being filmed
    tl.fromTo("#s07-a .plate", { scale: 1.0 }, { scale: 1.07, duration: 4.6, ease: "none" }, 0);
    tl.fromTo("#s07-a", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
    tl.fromTo("#s07-name", { opacity: 0 }, { opacity: 1, duration: 0.01 }, T(131.85));
    FX.text.random(tl, $("s07-name").querySelector(".n"), T(131.85), { dur: 0.5, seed: 5 });
    FX.text.rise(tl, [$("s07-name").querySelector(".c")], T(132.4), { dur: 0.6 });
    FX.text.fill(tl, $("s07-first"), T(134.1), { per: 0.035, hold: 0.3, settle: 0.45 });
    tl.to("#s07-name, #s07-first", { opacity: 0, duration: 0.2 }, T(135.55));

    // cutting the curve: shared zoom, cut at peak speed into the 1890s quad
    const mid = FX.curveCut(tl, $("s07-wrap"), $("s07-a"), $("s07-b"), T(135.2), 0.9, { from: 1, to: 1.5, ease: "expo.inOut" });
    tl.to("#s07-wrap", { scale: 1.0, duration: 1.3, ease: "power3.out" }, mid + 0.45);
    tl.fromTo("#s07-pano", { x: 0 }, { x: -1950, duration: 10 - mid, ease: "sine.inOut" }, mid);

    // "founded in 1891"
    tl.fromTo("#s07-year-wrap", { opacity: 0 }, { opacity: 1, duration: 0.01 }, T(138.3));
    FX.text.random(tl, $("s07-founded"), T(138.3), { dur: 0.5, seed: 7 });
    FX.text.odometer(tl, $("s07-year"), T(138.95), { dur: 0.8, stagger: 0.07, spins: 8, seed: 18 });
    tl.fromTo("#s07-shade", { opacity: 0 }, { opacity: 1, duration: 0.6 }, T(138.2));

    FX.mount(tl, 10.0);
    window.__timelines["s07"] = tl;
  })();
  </script>
</template>
</body>
</html>
