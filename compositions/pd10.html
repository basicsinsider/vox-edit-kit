      tl.fromTo($("osc"), { opacity: 0, x: 240, rotation: 5 }, { opacity: 1, x: 0, rotation: 1.2, duration: 0.9, ease: C(E.out, 0.9), immediateRender: false }, S(1163.1));
      tl.fromTo($("osctag"), { opacity: 0, scale: 1.25, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: C(E.out, 0.4), immediateRender: true }, T(1163.52));   // audio oscillator
      tl.fromTo($("osci"), { scale: 1.0 }, { scale: 1.06, duration: 1.8, ease: "none", immediateRender: false }, S(1163.1));
    })();

    /* whip sc001 → sc002 */
    (function () {
      const A = $("sc001-shot"), B = $("sc002-shot"), t = S(1164.70), h = 0.16;
      const ba = FX.whipDefs(defs, SEG + "-wa"), bb = FX.whipDefs(defs, SEG + "-wb");
      tl.set(A, { filter: "url(#" + SEG + "-wa)" }, t - h - 0.01); tl.set(A, { filter: "none" }, t + 0.06);
      tl.set(B, { filter: "url(#" + SEG + "-wb)" }, t - 0.001); tl.set(B, { filter: "none" }, t + h + 0.02);
      FX.whip(tl, A, B, t, { dir: 1, dur: 0.32, blurA: ba, blurB: bb });
    })();

    /* ===== sc002 · explainer: oscillator → test tone → audio equipment; frequency low → high ===== */
    (function () {
      const svg = $("s2-svg"), a = S(1164.70), b = S(1174.30);
      tl.fromTo($("sc002-cam"), { scale: 1.0 }, { scale: 1.05, duration: b - a + 0.2, ease: "none", immediateRender: false }, a);
      rise($("s2-l1"), a + 0.3, { dur: 0.5 });     // object label (named in the line before)
      // speaker (audio equipment) drawn in bone
      const g = mk(svg, "g", {});
      const sty = { fill: "none", stroke: BONE, "stroke-width": 5, "stroke-linejoin": "round", "stroke-linecap": "round" };
      const cab = mk(g, "path", Object.assign({ d: "M1350 270 L1710 270 Q1730 270 1730 290 L1730 770 Q1730 790 1710 790 L1350 790 Q1330 790 1330 770 L1330 290 Q1330 270 1350 270 Z" }, sty));
      const tw = mk(g, "circle", Object.assign({ cx: 1530, cy: 372, r: 44 }, sty));
      const wo = mk(g, "circle", Object.assign({ cx: 1530, cy: 600, r: 130 }, sty));
      const cone = mk(g, "circle", { cx: 1530, cy: 600, r: 52, fill: BONE, "fill-opacity": 0.9 });
      const rings = [mk(g, "circle", { cx: 1530, cy: 600, r: 92, fill: "none", stroke: ASHL, "stroke-width": 3, "stroke-opacity": 0.7 })];
      [cab, tw, wo].forEach((p, i) => { const L = p.getTotalLength(); p.setAttribute("stroke-dasharray", L + " " + L);
        gsap.set(p, { attr: { "stroke-dashoffset": L }, opacity: 0 }); tl.set(p, { opacity: 1 }, a + 1.3 + i * 0.25);
        tl.fromTo(p, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: C(E.out, 1.0), immediateRender: false }, a + 1.3 + i * 0.25); });
      gsap.set([cone, rings[0]], { opacity: 0 }); tl.to([cone, rings[0]], { opacity: 1, duration: 0.3 }, a + 2.3);
      // wire stubs
      const w1 = mk(svg, "path", { d: "M700 524 L742 526", fill: "none", stroke: ASHL, "stroke-width": 4, "stroke-linecap": "round" });
      const w2 = mk(svg, "path", { d: "M1284 526 L1326 524", fill: "none", stroke: ASHL, "stroke-width": 4, "stroke-linecap": "round" });
      gsap.set([w1, w2], { opacity: 0 }); tl.to([w1, w2], { opacity: 1, duration: 0.3 }, a + 1.0);
      rise($("s2-l2"), T(1167.68));                // audio equipment
      // the test tone: magenta sine, flows from "test" (1167.42); frequency sweeps on "different frequencies"
      const X0 = 748, X1 = 1278, CY = 525, N = 133;
      const wave = mk(svg, "path", { d: "M" + X0 + " " + CY, fill: "none", stroke: MAG, "stroke-width": 6, "stroke-linecap": "round", "stroke-linejoin": "round" });
      const t0 = S(1167.36), tS = S(1171.30), tE = S(1173.30);
      const smooth = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
      const pr = { t: t0 };
      function drawWave() {
        const t = Math.round(pr.t * 12) / 12;                       // 12 fps
        const k = smooth((t - tS) / (tE - tS)), cyc = 2.5 + 9.5 * k; // cycles across the span
        const grow = Math.min(1, (t - t0) / 0.8), xe = X0 + (X1 - X0) * grow, ph = t * 7.0;
        let d = "";
        for (let i = 0; i <= N; i++) { const x = X0 + (X1 - X0) * i / N; if (x > xe) break;
          const env = Math.min(1, (x - X0) / 40, (X1 - x) / 40 + 0.15);
          const y = CY + Math.sin((x - X0) / (X1 - X0) * cyc * Math.PI * 2 - ph) * 92 * env;
          d += (i ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }
        wave.setAttribute("d", d || ("M" + X0 + " " + CY));
        const pulse = grow > 0.95 ? 1 + 0.07 * Math.sin(ph * (1 + 2 * k)) : 1;
        cone.setAttribute("r", (52 * pulse).toFixed(1)); rings[0].setAttribute("r", (92 * (2 - pulse)).toFixed(1));
        knob.setAttribute("cx", (790 + 440 * k).toFixed(1)); fill.setAttribute("x2", (790 + 440 * k).toFixed(1));
      }
      // frequency gauge
      const gg = mk(svg, "g", {});
      mk(gg, "line", { x1: 790, y1: 812, x2: 1230, y2: 812, stroke: ASHL, "stroke-width": 4, "stroke-linecap": "round", "stroke-opacity": 0.7 });
      for (let i = 0; i <= 8; i++) mk(gg, "line", { x1: 790 + i * 55, y1: 800, x2: 790 + i * 55, y2: 824, stroke: ASHL, "stroke-width": 3, "stroke-opacity": 0.7 });
      const fill = mk(gg, "line", { x1: 790, y1: 812, x2: 790, y2: 812, stroke: MAG, "stroke-width": 7, "stroke-linecap": "round" });
      const knob = mk(gg, "circle", { cx: 790, cy: 812, r: 15, fill: MAG, stroke: BONE, "stroke-width": 3 });
      gsap.set(gg, { opacity: 0 }); gsap.set(wave, { opacity: 0 });
      tl.set(wave, { opacity: 1 }, t0);
      tl.fromTo(pr, { t: t0 }, { t: b, duration: b - t0, ease: "none", immediateRender: false, onUpdate: drawWave }, t0);
      tl.to(gg, { opacity: 1, duration: 0.3 }, T(1171.28));
      rise($("s2-l3"), T(1171.28), { dur: 0.4 });  // frequencies
      rise($("s2-lo"), T(1171.28) + 0.1, { dur: 0.4, y: 8 }); rise($("s2-hi"), T(1171.28) + 0.2, { dur: 0.4, y: 8 });
    })();

    /* ===== sc003 · what Terman gave them (hard cut on the camera move) ===== */
    (function () {
      const svg = $("s3-mk"), pf = FX.markupDefs(svg, SEG + "-pen3", { boil: 4 }), a = S(1174.30), b = S(1193.32);
      tl.fromTo($("sc003-cam"), { scale: 1.06 }, { scale: 1.0, duration: 6, ease: "sine.out", immediateRender: false }, a);
      tl.fromTo($("s3-ter"), { x: -60 }, { x: 0, duration: 1.2, ease: C(E.out, 1.2), immediateRender: false }, a);
      tl.fromTo($("s3-hp"), { x: 80, rotation: 5 }, { x: 0, rotation: 2, duration: 1.2, ease: C(E.out, 1.2), immediateRender: false }, a);
      gsap.set($("s3-hp"), { rotation: 2 });
      // "So he convinces these two students to do this company": long pen arrow Terman → the two
      penArrow(svg, a + 0.25, { x1: 700, y1: 212, x2: 986, y2: 212, bend: -22, dur: 1.0 }, pf);
      // four empty slots from the first frame of the scene (each is covered when its card lands)
      const slotT = [S(1177.95), S(1180.75), S(1186.1), S(1191.6)];
      [126, 552, 978, 1404].forEach((x, i) => {
        const r = mk(svg, "rect", { x: x + 4, y: 396, width: 382, height: 462, fill: "none", stroke: INK, "stroke-width": 3, "stroke-dasharray": "14 12", "stroke-opacity": 0.38 });
        gsap.set(r, { opacity: 0 });
        tl.fromTo(r, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: C(E.out, 0.4), immediateRender: false }, a + 0.04 + i * 0.14);
        tl.to(r, { opacity: 0, duration: 0.3 }, slotT[i] + 0.2);
      });
      // 1 · his personal money
      land($("it1"), S(1177.95), { rot: -1.5, dr: -5 });
      rise($("it1a"), T(1178.47));                 // his (personal money)
      // 2 · a fellowship
      land($("it2"), S(1180.75), { rot: 1, dr: 5 });
      rise($("it2a"), T(1181.43));                 // fellowship
      // 3 · a list of 25 companies that would buy
      land($("it3"), S(1186.1), { rot: -1, dr: -5 });
      gsap.set($("n25t"), { opacity: 0 });
      tl.fromTo($("n25t"), { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: C(E.out, 0.4), immediateRender: false }, T(1186.95));   // twenty five
      tl.fromTo($("n25hl"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: C(E.out, 0.45), immediateRender: false }, S(1187.3));
      const rows = Array.from($("rows").children);
      gsap.set(rows, { scaleX: 0 }); rows.forEach((r, i) => tl.to(r, { scaleX: 1, duration: 0.25, ease: C(E.out, 0.25) }, S(1186.5) + i * 0.09));
      rise($("it3a"), T(1187.51));                 // companies
      rise($("it3b"), T(1187.99));                 // that would buy
      // 4 · connections → their first client
      const ar2 = penArrow(svg, S(1190.6), { x1: 300, y1: 336, x2: 1600, y2: 384, bend: -84, color: MAG, width: 6, head: 26, dur: 1.2 }, pf);
      land($("it4"), S(1191.6), { rot: 1.5, dr: 5, dur: 0.7 });
      rise($("it4a"), T(1192.04), { dur: 0.4 });   // their first client
      tl.fromTo($("sc003-cam"), { scale: 1.0 }, { scale: 1.04, duration: 13.2, ease: "sine.inOut", immediateRender: false }, a + 6);
      // push toward card 4 into the cut on "Disney"
      tl.to($("sc003-cam"), { scale: 1.5, x: -420, y: -60, duration: 0.5, ease: E.in }, b - 0.5);
    })();

    /* ===== sc004 · Disney (cut on the word; hold through the garbled half-sentence) ===== */
    (function () {
      const a = S(1193.32);
      tl.fromTo($("sc004-cam"), { scale: 1.12 }, { scale: 1.0, duration: 1.4, ease: E.out, immediateRender: false }, a);
      tl.fromTo($("dimg"), { scale: 1.0 }, { scale: 1.08, duration: 3.4, ease: "none", immediateRender: false }, a);
      tl.fromTo($("dname"), { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(1193.32));   // Disney
      tl.fromTo($("dname"), { scale: 1.1, transformOrigin: "0% 60%" }, { scale: 1, duration: 0.7, ease: C(E.out, 0.7), immediateRender: false }, T(1193.32));
    })();

    FX.grain($("grain"), 3); FX.dust($("dust"), 5, 2);
    FX.mount(tl, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
