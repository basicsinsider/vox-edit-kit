<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
    .p8-scene { position: absolute; inset: 0; overflow: hidden; }
    .p8-shot { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
    .p8-p1, .p8-p2 { position: absolute; inset: 0; background-size: cover; background-position: center; pointer-events: none; mix-blend-mode: multiply; filter: saturate(0.3); }
    .p8-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
    .p8-abs { position: absolute; }
    .p8-mk { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
    .p8-panel { position: absolute; overflow: hidden; box-shadow: 0 18px 36px rgba(22,26,36,0.28); background: var(--ash-dark); }
    .p8-panel img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    .p8-ht { position: absolute; inset: 0; background-image: url('assets/textures/halftone_01_norm.jpg'); background-size: 520px auto; mix-blend-mode: overlay; opacity: 0.32; pointer-events: none; }
    .p8-block { position: absolute; background: var(--magenta); }
    .p8-block::after, .p8-tape::after { content: ""; position: absolute; inset: 0; background-image: url('assets/textures/paper_fiber_01_norm.jpg'); background-size: 600px auto; mix-blend-mode: overlay; opacity: 0.6; }
    .p8-cap { position: absolute; font-size: 22px; color: var(--ink-soft); white-space: nowrap; }
    .p8-tag { position: absolute; font-size: 34px; white-space: nowrap; opacity: 0; }
    .p8-role { position: absolute; font-size: 26px; color: var(--ink); white-space: nowrap; opacity: 0; }
    .p8-name { position: absolute; font-size: 92px; color: var(--ink); white-space: nowrap; opacity: 0; }
    .p8-credit { position: absolute; right: 96px; bottom: 30px; font-size: 13px; letter-spacing: 0.08em; color: rgba(22,26,36,0.55); z-index: 5; }
    #pd08-slot { position: absolute; left: 1052px; top: 404px; width: 760px; height: 250px; }
    #pd08-ray { position: absolute; left: 1052px; top: 452px; width: 760px; font-size: 150px; color: var(--ink); white-space: nowrap; opacity: 0; }
    #pd08-def { position: absolute; left: 1056px; top: 676px; font-size: 26px; color: var(--ink-soft); white-space: nowrap; opacity: 0; }
    #pd08-grain, #pd08-dust, #pd08-vig { z-index: 8; }
  </style>

  <div id="root" data-composition-id="pd08" data-vo-start="1013.9" data-duration="16.0667" data-width="1920" data-height="1080">
    <svg id="pd08-defs" width="0" height="0" style="position:absolute"></svg>

    <!-- sc001 · 1013.90–1029.97 · Terman's graduate programme under his adviser Vannevar Bush → founder of … Raytheon · paper name card (ref ccc84f71) -->
    <div class="p8-scene" id="pd08-sc001"><div class="p8-shot" id="pd08-sc001-shot">
      <div class="p8-p1" style="background-image:url('assets/textures/paper_graph_01_hires.jpg'); opacity:0.5"></div>
      <div class="p8-p2" style="background-image:url('assets/textures/paper_fiber_01.jpg'); opacity:0.35"></div>
      <div class="p8-cam" id="pd08-cam">
        <!-- left group: MIT + the graduate student -->
        <div class="p8-abs" id="pd08-gL" style="left:0; top:0; width:1920px; height:1080px">
          <div class="p8-panel" id="pd08-mit" style="left:96px; top:132px; width:700px; height:500px; transform:rotate(-1.6deg)">
            <img src="assets/archival/collage/mit_aerial_1925.jpg" alt="" style="filter:url(#pd08-tint)"><div class="p8-ht"></div>
          </div>
          <div class="p8-cap t-label" id="pd08-mitcap" style="left:104px; top:664px">MIT · Cambridge, 1925</div>
          <div class="p8-panel" id="pd08-fred" style="left:520px; top:430px; width:250px; height:420px; transform:rotate(2.4deg); border:10px solid var(--bone); box-sizing:border-box">
            <img src="assets/c1/people/terman_frederick_1920_theta_xi_crop.jpg" alt="" style="filter:url(#pd08-tint); object-position:50% 4%; height:190%"><div class="p8-ht"></div>
          </div>
          <div class="p8-tag" id="pd08-fredtag" style="left:516px; top:884px"><span class="label-box">Frederick Terman</span></div>
          <div class="p8-role t-label" id="pd08-fredrole" style="left:520px; top:940px; font-size:22px; color:var(--ink-soft)">graduate student</div>
        </div>
        <!-- Bush group -->
        <div class="p8-abs" id="pd08-gB" style="left:0; top:0; width:1920px; height:1080px">
          <div class="p8-block" id="pd08-b1" style="left:1000px; top:72px; width:110px; height:560px"></div>
          <div class="p8-block" id="pd08-b2" style="left:1560px; top:470px; width:96px; height:420px"></div>
          <div class="p8-panel" id="pd08-bush" style="left:1050px; top:110px; width:560px; height:740px">
            <img src="assets/podcast/pd08/vannevar_bush_1938_harris_ewing.jpg" alt="" style="object-position:50% 18%; filter:url(#pd08-tintb)"><div class="p8-ht" style="opacity:0.2"></div>
          </div>
          <div class="p8-role t-label" id="pd08-role" style="left:1054px; top:880px">his adviser</div>
          <div class="p8-name t-display" id="pd08-name" style="left:1050px; top:916px">Vannevar Bush</div>
        </div>
        <!-- founder of … -->
        <div class="p8-role t-label" id="pd08-founder" style="left:1056px; top:352px; font-size:30px">founder of</div>
        <svg class="p8-mk" id="pd08-mk"></svg>
        <div id="pd08-def" class="t-label">defense company</div>
        <div id="pd08-ray" class="t-display">Raytheon</div>
      </div>
      <div class="p8-credit t-label">Photos: MIT Museum · Harris &amp; Ewing · Stanford Quad 1921</div>
    </div></div>

    <div id="pd08-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_01_norm.jpg'); opacity:0.3"></div>
    <div id="pd08-dust" class="tx tx-dust" style="background-image:url('assets/textures/dust_02.jpg'); opacity:0.14"></div>
    <div id="pd08-vig" class="vignette" style="opacity:0.28"></div>
  </div>

  <script>
  (function () {
    const SEG = "pd08", START = 1013.9, DUR = 16.0667;
    const T = (s) => +(s - START).toFixed(3);   // TEXT cues (audited): literal = word start − 0.06
    const S = (s) => +(s - START).toFixed(3);   // structural cues
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(SEG + "-" + id);
    const defs = $("defs"), E = FX.ease, C = (e, d) => FX.choppy(e, d, 12);
    const INK = "#161a24", MAG = "#d1307a";
    FX.tintDefs(defs, SEG + "-tint", "#1c1f26", "#d9dad6");
    FX.tintDefs(defs, SEG + "-tintb", "#12151c", "#f0f0ec");
    const rise = (el, t, o) => { o = o || {}; const d = o.dur || 0.6;
      tl.fromTo(el, { opacity: 0, y: o.y == null ? 16 : o.y }, { opacity: 1, y: 0, duration: d, ease: C(E.out, d), immediateRender: true }, t); };

    // frame 0: MIT panel already drifting in, young Terman card settling
    gsap.set($("mit"), { x: -90, opacity: 1 });
    tl.fromTo($("mit"), { x: -90 }, { x: 0, duration: 1.4, ease: C(E.out, 1.4), immediateRender: false }, 0);
    gsap.set($("fred"), { y: 70, rotation: 6, opacity: 1 });
    tl.fromTo($("fred"), { y: 70, rotation: 6 }, { y: 0, rotation: 2.4, duration: 1.2, ease: C(E.out, 1.2), immediateRender: false }, 0.08);
    tl.fromTo($("cam"), { scale: 1.035 }, { scale: 1.0, duration: 9.6, ease: "sine.out", immediateRender: true }, 0);
    gsap.set($("gL"), { x: 400 });
    tl.fromTo($("gL"), { x: 400 }, { x: 0, duration: 1.2, ease: C(E.inOut, 1.2), immediateRender: false }, S(1018.0));
    rise($("fredtag"), T(1015.09));            // Frederick (ASR "Kerman")
    rise($("fredrole"), T(1016.77));           // graduate
    // Bush enters on "who is", name on the name
    gsap.set([$("b1"), $("b2")], { scaleY: 0 });
    gsap.set($("b1"), { transformOrigin: "50% 0%" }); gsap.set($("b2"), { transformOrigin: "50% 100%" });
    gsap.set($("bush"), { opacity: 0 });
    rise($("role"), T(1018.29));               // advisor
    tl.fromTo($("b1"), { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: C(E.out, 0.9), immediateRender: false }, S(1018.7));
    tl.fromTo($("bush"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: C(E.out, 0.9), immediateRender: false }, S(1018.86));
    tl.fromTo($("b2"), { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: C(E.out, 0.9), immediateRender: false }, S(1019.0));
    rise($("name"), T(1019.17), { dur: 0.5, y: 22 });   // Vannevar (ASR "Vanaver Busch")
    // banter 1020.6–1023.6: hold, slow drift (cam scale above) + photo breathing
    tl.fromTo($("bush").querySelector("img"), { scale: 1.0 }, { scale: 1.07, duration: 11, ease: "none", immediateRender: false }, S(1018.86));

    // re-layout on "Vannevar Bush is the founder…": left group leaves, Bush group slides left
    tl.to($("gL"), { x: -900, duration: 1.2, ease: C(E.inOut, 1.2) }, S(1023.55));
    tl.to($("gB"), { x: -690, duration: 1.3, ease: C(E.inOut, 1.3) }, S(1023.6));
    rise($("founder"), T(1025.17));            // founder
    // dashed slot drawn while "a famous defense company that exists to this very day"
    const mk = $("mk"); mk.setAttribute("viewBox", "0 0 1920 1080");
    const NS = "http://www.w3.org/2000/svg";
    const slot = document.createElementNS(NS, "path");
    slot.setAttribute("d", "M1056 408 L1808 404 L1812 652 L1052 656 Z"); slot.setAttribute("fill", "none"); slot.setAttribute("stroke", INK);
    slot.setAttribute("stroke-width", "4"); slot.setAttribute("stroke-dasharray", "18 14"); slot.setAttribute("opacity", "0.55");
    mk.appendChild(slot);
    gsap.set(slot, { opacity: 0 });
    tl.fromTo(slot, { opacity: 0 }, { opacity: 0.55, duration: 0.5, ease: C(E.out, 0.5), immediateRender: false }, S(1026.0));
    rise($("def"), T(1026.61));                // defense
    // RAYTHEON on the word: slot goes, name stamps in, magenta pen underline
    tl.to(slot, { opacity: 0, duration: 0.1 }, T(1028.93));
    tl.fromTo($("ray"), { opacity: 0, scale: 1.12, transformOrigin: "0% 60%" }, { opacity: 1, scale: 1, duration: 0.35, ease: C(E.out, 0.35), immediateRender: true }, T(1028.93));
    const mf = FX.markupDefs(mk, SEG + "-pen", { boil: 4 });
    const ul = FX.markup.pen(tl, mk, S(1029.06), { points: [[1058, 624], [1300, 630], [1560, 620], [1770, 628]], width: 9, color: MAG, dur: 0.3, filter: mf, seed: 5, blend: "multiply" });
    gsap.set(ul, { opacity: 0 }); tl.set(ul, { opacity: 1 }, S(1029.06));
    tl.fromTo($("cam"), { scale: 1.0 }, { scale: 1.03, duration: 6.4, ease: "sine.inOut", immediateRender: false }, S(1023.55));

    FX.grain($("grain"), 3); FX.dust($("dust"), 5, 2);
    FX.mount(tl, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
</template>
</body>
</html>
