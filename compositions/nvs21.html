        const u1 = E.inOut(clamp((t - 2164.30) / 1.8));
        const m = lerp(A, B, u1);
        main.o.style.left = m[0] + "px"; main.o.style.top = m[1] + "px";
        const c1 = arc(SF, m, 0.12), d1 = "M" + SF[0] + " " + SF[1] + " Q" + c1[0].toFixed(1) + " " + c1[1].toFixed(1) + " " + m[0].toFixed(1) + " " + m[1].toFixed(1);
        const on1 = t >= 2164.30 ? 1 : 0;
        line1.setAttribute("d", d1); glow1.setAttribute("d", d1);
        line1.setAttribute("stroke-width", (4 / s).toFixed(2)); glow1.setAttribute("stroke-width", (14 / s).toFixed(2));
        line1.setAttribute("opacity", on1); glow1.setAttribute("opacity", 0.28 * on1);
        // data pulses running the fibre
        pulses.forEach((c, i) => {
          if (t < 2174.0 || t > 2179.2) { c.setAttribute("opacity", 0); return; }
          const u = ((t - 2174.0) / 1.5 + i * 0.5) % 1, q = qpt(SF, c1, m, u);
          c.setAttribute("cx", q[0].toFixed(1)); c.setAttribute("cy", q[1].toFixed(1)); c.setAttribute("r", (6 / s).toFixed(2));
          c.setAttribute("opacity", (Math.min(1, (t - 2174.0) * 3) * Math.sin(Math.PI * u)).toFixed(3));
        });
        // "stretch this argument really far away" — a data center flies out across the Pacific, the line stretching behind it
        const u2 = E.inOut(clamp((t - 2179.20) / 2.8));
        const f = lerp(SEA, FAR, u2);
        far.o.style.left = f[0] + "px"; far.o.style.top = f[1] + "px";
        const c2 = arc(SF, f, -0.13), d2 = "M" + SF[0] + " " + SF[1] + " Q" + c2[0].toFixed(1) + " " + c2[1].toFixed(1) + " " + f[0].toFixed(1) + " " + f[1].toFixed(1);
        const on2 = t >= 2179.20 ? 1 : 0;
        line2.setAttribute("d", d2); glow2.setAttribute("d", d2);
        line2.setAttribute("stroke-width", (4 / s).toFixed(2)); glow2.setAttribute("stroke-width", (14 / s).toFixed(2));
        line2.setAttribute("opacity", on2); glow2.setAttribute("opacity", 0.28 * on2);
        // data keeps flowing out along the stretched line (motion at the cut)
        pulse2.forEach((c, i) => {
          if (t < 2180.40) { c.setAttribute("opacity", 0); return; }
          const u = ((t - 2180.40) / 1.3 + i * 0.5) % 1, q = qpt(SF, c2, f, u);
          c.setAttribute("cx", q[0].toFixed(1)); c.setAttribute("cy", q[1].toFixed(1)); c.setAttribute("r", (7 / s).toFixed(2));
          c.setAttribute("opacity", (Math.min(1, (t - 2180.40) * 3) * Math.sin(Math.PI * u)).toFixed(3));
        });
      }
      draw(2158.02);
      const drv = { t: 2158.02 };
      tl.fromTo(drv, { t: 2158.0 }, { t: SEG_END, duration: DURATION - S(2158.0), ease: "none", immediateRender: false, onUpdate: () => draw(drv.t) }, S(2158.0));
    })();

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
</template>
</body>
