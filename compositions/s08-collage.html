<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); color: var(--ink); }
    #s08-defs { position: absolute; width: 0; height: 0; }
    #s08-cam { position: absolute; inset: 0; }
    .s08-card { position: absolute; background: #f3ecdd; padding: 18px; box-shadow: 0 14px 26px rgba(24,34,47,0.28), 0 2px 4px rgba(24,34,47,0.2); }
    .s08-card .ph { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .s08-card .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: url(#s08-tint); }
    .s08-card .ht { position: absolute; inset: 0; background-size: 520px auto; mix-blend-mode: multiply; opacity: 0.38; }
    .s08-torn { filter: url(#s08-rough); }
    .s08-tag { position: absolute; font-size: 21px; padding: 6px 12px 4px; background: var(--ink); color: var(--paper); white-space: nowrap; }
    .s08-pin { position: absolute; width: 60px; height: 60px; }
    #s08-terman { left: 170px; top: 120px; width: 500px; height: 520px; }
    #s08-stan { left: 860px; top: 150px; width: 820px; height: 500px; }
    #s08-mit { left: 860px; top: 150px; width: 820px; height: 560px; }
    #s08-age { position: absolute; left: 200px; top: 704px; font-size: 54px; color: var(--ink); }
    #s08-age b { font-style: normal; color: var(--vermilion); }
    #s08-big { position: absolute; left: 0; top: 250px; width: 1920px; text-align: center; font-size: 360px; line-height: 1; color: var(--vermilion); }
    #s08-east { position: absolute; left: 1390px; top: 66px; font-size: 76px; color: var(--navy); white-space: nowrap; }
    #s08-doc { position: absolute; left: 870px; top: 752px; font-size: 50px; color: var(--ink); }
    #s08-axis { position: absolute; left: 200px; top: 940px; width: 1520px; height: 3px; background: var(--ink); transform-origin: 0 50%; }
    .s08-tick { position: absolute; top: 930px; width: 3px; height: 22px; background: var(--ink); }
    .s08-yr { position: absolute; top: 966px; width: 120px; margin-left: -60px; text-align: center; font-size: 20px; color: var(--ink-soft); }
    #s08-y24 { color: var(--vermilion); font-size: 24px; top: 892px; }
    #s08-dot { position: absolute; left: 0; top: 929px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: var(--vermilion); box-shadow: 0 0 0 5px rgba(229,72,42,0.22); }
  </style>
  <div id="root" data-composition-id="s08" data-width="1920" data-height="1080">
    <svg id="s08-defs"></svg>
    <div class="paper-ground"></div>
    <div id="s08-cam">
      <div id="s08-terman" class="s08-card s08-torn"><div class="ph"><img src="assets/archival/collage/terman_frederick_1955.jpg" alt="" /><div class="ht" style="background-image:url('assets/textures/halftone_02.png')"></div></div>
        <div class="s08-tag t-label" style="left:24px; bottom:-18px">Frederick Terman</div></div>
      <div id="s08-stan" class="s08-card s08-torn"><div class="ph"><img src="assets/archival/hoover/stanford_main_quad_panorama_c1896_b.jpg" alt="" style="object-position:40% 60%" /><div class="ht" style="background-image:url('assets/textures/halftone_02.png')"></div></div>
        <div class="s08-tag t-label" style="right:30px; bottom:-18px">Stanford · the West</div></div>
      <div id="s08-mit" class="s08-card s08-torn"><div class="ph"><img src="assets/archival/collage/mit_aerial_1925.jpg" alt="" style="object-position:50% 45%" /><div class="ht" style="background-image:url('assets/textures/halftone_02.png')"></div></div>
        <div class="s08-tag t-label" style="right:30px; bottom:-18px; background:var(--navy)">MIT · Cambridge, Massachusetts</div></div>
      <img id="s08-pin1" class="s08-pin" src="assets/icons/pin_vermilion_top.svg" style="left:392px; top:106px" alt="" />
      <img id="s08-pin2" class="s08-pin" src="assets/icons/pin_vermilion_top.svg" style="left:1236px; top:132px" alt="" />
      <img id="s08-pin3" class="s08-pin" src="assets/icons/pin_navy_top.svg" style="left:1236px; top:132px" alt="" />
      <div id="s08-age" class="t-serif-i"><span>by </span><b class="t-display">24 </b><span>years </span><span>old</span></div>
      <div id="s08-doc" class="t-serif-i"><span>doctorate </span><span>degree, </span><span>in </span><span>engineering</span></div>
      <div id="s08-east" class="t-display">East&nbsp;<span id="s08-arrow" style="display:inline-block">→</span></div>
      <div id="s08-axis"></div>
      <div class="s08-tick" style="left:200px"></div><div class="s08-yr t-label" style="left:201px">1900</div>
      <div class="s08-tick" style="left:706px"></div><div class="s08-yr t-label" style="left:707px">1910</div>
      <div class="s08-tick" style="left:1213px"></div><div class="s08-yr t-label" style="left:1214px">1920</div>
      <div class="s08-tick" style="left:1718px"></div><div class="s08-yr t-label" style="left:1719px">1930</div>
      <div id="s08-y24" class="s08-yr t-label" style="left:1416px">1924</div>
      <div id="s08-dot"></div>
      <div id="s08-big" class="t-serif">1924</div>
    </div>
    <div class="paper-tex" style="background-image:url('assets/textures/paper_cream_02.jpg')"></div>
    <div class="folds"></div>
    <div id="s08-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_02_norm.jpg'); opacity:0.3"></div>
    <div class="vignette" style="opacity:0.4"></div>
    <audio id="s08-vo" src="vo10.mp3" data-start="0" data-duration="9.6" data-media-start="325.9" data-volume="1"></audio>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const T = (s) => +(s - 325.9).toFixed(3);
    const S = T;
    const $ = (id) => document.getElementById(id);
    const defs = $("s08-defs");
    FX.tintDefs(defs, "s08-tint", "#18222f", "#efe7d5");    // ink -> paper (collage colour system)
    FX.roughDefs(defs, "s08-rough", { freq: 0.05, scale: 5 }); // torn, boiling edges (12 fps)
    FX.grain($("s08-grain"), 91);
    const X = (yr) => 200 + (yr - 1900) * 50.6;                 // timeline: year -> px

    // stop-motion card placement (12 fps), each card lands with a slight overshoot; pins pop
    const place = (sel, t, { r1, ...from }) => tl.fromTo(sel, from, { x: 0, y: 0, rotation: r1, scale: 1, opacity: 1, duration: 0.42, ease: FX.choppy("back.out(1.4)", 0.42, 12), immediateRender: true }, t);
    place("#s08-terman", S(325.95), { x: -160, y: 40, rotation: -14, scale: 1.08, opacity: 0, r1: -3.5 });
    place("#s08-stan", S(326.2), { x: 180, y: -30, rotation: 9, scale: 1.08, opacity: 0, r1: 2.5 });
    const pop = (sel, t) => tl.fromTo(sel, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: FX.choppy("back.out(3)", 0.25, 12), immediateRender: true }, t);
    pop("#s08-pin1", S(326.45)); pop("#s08-pin2", S(326.65));
    tl.set("#s08-mit, #s08-pin3", { opacity: 0 }, 0);

    // timeline axis + travelling dot: 1900 -> 1924 lands with "1924"
    tl.fromTo("#s08-axis", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: FX.choppy("power2.out", 0.6, 12), immediateRender: true }, S(326.1));
    tl.fromTo(".s08-tick, .s08-yr:not(#s08-y24)", { opacity: 0 }, { opacity: 1, duration: 0.001, stagger: 1 / 12, immediateRender: true }, S(326.3));
    tl.fromTo("#s08-dot", { x: X(1900), scale: 0 }, { x: X(1900), scale: 1, duration: 0.2, immediateRender: true }, S(326.6));
    tl.to("#s08-dot", { x: X(1924), duration: 2.0, ease: FX.choppy("power2.inOut", 2.0, 12) }, S(327.45));

    // "by 24 years old"
    [T(326.65), T(327.37), T(328.01), T(328.25)].forEach((c, i) => tl.fromTo($("s08-age").children[i], { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, c));
    // big serif "1924" + the axis label
    tl.fromTo("#s08-big", { opacity: 0, scale: 0.86, rotation: -3 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.33, ease: FX.choppy("back.out(2)", 0.33, 12), immediateRender: true }, T(329.45));
    tl.fromTo("#s08-y24", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: true }, T(329.45));
    tl.to("#s08-big", { opacity: 0, scale: 1.06, duration: 0.3, ease: "power2.in" }, S(330.7));
    tl.to("#s08-age", { opacity: 0, duration: 0.3 }, S(330.8));

    // "goes east": Stanford card is pulled off, MIT card pinned in its place (navy pin), "East ->"
    tl.to("#s08-stan, #s08-pin2", { x: -260, y: 60, rotation: -12, opacity: 0, duration: 0.33, ease: FX.choppy("power2.in", 0.33, 12) }, S(331.3));
    place("#s08-mit", S(331.55), { x: 240, y: -50, rotation: 10, scale: 1.1, opacity: 0, r1: 1.5 });
    pop("#s08-pin3", S(331.95));
    tl.fromTo("#s08-east", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, ease: FX.choppy("power3.out", 0.25, 12), immediateRender: true }, T(331.77));
    tl.fromTo("#s08-arrow", { x: 0 }, { x: 18, duration: 0.5, yoyo: true, repeat: 3, ease: FX.choppy("sine.inOut", 0.5, 12) }, S(332.0));
    // "doctorate degree, in engineering"
    [T(332.81), T(333.45), T(334.17), T(334.33)].forEach((c, i) => tl.fromTo($("s08-doc").children[i], { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, c));

    // slow drift of the whole board
    tl.fromTo("#s08-cam", { scale: 1, transformOrigin: "50% 45%" }, { scale: 1.035, duration: 9.6, ease: "none" }, 0);

    FX.mount(tl, 9.6);
    window.__timelines["s08"] = tl;
  })();
  </script>
</template>
</body>
</html>
