      tl.fromTo(vw, { scale: s0 }, { scale: s1, duration: S(b) - S(a), ease: o.ease || "none", immediateRender: false }, S(a));
    }

    FX.grain($("grain"), 5501);
    FX.dust($("dust"), 5502, 2);

    /* ===== sc001 · JOB ONE card ===== */
    (function () {
      push("sc001", 472.6667, 476.55, 1.0, 1.045, { ease: E.cam });
      const band = $("sc001-band");
      tl.fromTo(band, { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: C(E.out, 1.0), immediateRender: true }, S(472.75));
      // ice ring, drawn on like a brush stroke
      const ring = $("sc001-ring");
      const pts = []; for (let k = 0; k <= 64; k++) { const a = Math.PI * (0.55 + k / 64 * 1.25); pts.push([410 + Math.cos(a) * 330, 410 + Math.sin(a) * 330]); }
      const rp = pen(ring, pts, S(473.05), 1.1, { color: "var(--ice)", width: 64, jit: 3, seed: 21, ease: C(E.inOut, 1.1) });
      rp.setAttribute("stroke-linecap", "butt"); rp.setAttribute("opacity", "0.82"); rp.style.mixBlendMode = "multiply";
      // ink bar slams in, then the words
      const bar = $("sc001-bar");
      tl.fromTo(bar, { opacity: 0, scale: 1.18, rotation: -3 }, { opacity: 1, scale: 1, rotation: -1.2, duration: 0.55, ease: C(E.out, 0.55), immediateRender: true }, S(474.45));
      [$("sc001-tp1"), $("sc001-tp2")].forEach((tp, i) => tl.fromTo(tp, { opacity: 0, scale: 1.3 }, { opacity: 0.88, scale: 1, duration: 0.4, ease: C(E.out, 0.4), immediateRender: true }, S(474.75 + i * 0.16)));
      const w = W("sc001-ti");
      rise(w[0], T(475.01), { dur: 0.4, y: 20 });
      rise(w[1], T(475.65), { dur: 0.3, y: 20 });
    })();

    /* ===== sc002 · FACE M → W → C, compact scoreboard row 1 ===== */
    whip("sc001", "sc002", S(476.55), { dir: 1 });
    face("sc002", [[476.55, 483.62, "M"], [483.62, 486.35, "W"], [486.35, 488.58, "C"]]);
    const sbc = NV.scoreboard($("sc002-sb"), { prefix: SEG + "-sbc", compact: true, gate: [S(480.2), S(486.6)] });
    (function () {
      const el = $("sc002-sb");
      gsap.set(el, { clipPath: "inset(0% 100% 0% 0%)" });
      tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)", x: -30 }, { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.9, ease: C(E.out, 0.9), immediateRender: false }, S(480.40));
      gsap.set([sbc.rows[1], sbc.rows[2], sbc.rows[3]], { opacity: 0.38 });
      sbc.revealRow(tl, 1, S(481.30), { words: [T(481.76), T(482.16), T(482.24), T(482.72), T(482.88), T(483.04)] });
      tl.to(el, { opacity: 0, x: -24, duration: 0.35, ease: E.in }, S(485.95));
    })();

    /* ===== THE LINE (sc003 · 488.58–518.43, sc010 · 548.33–559.583) ===== */
    slide("sc002", "line", S(488.58), { axis: "y" });
    const ln = NV.line($("ln"), { prefix: SEG + "-ln", lineAt: 0.62, gate: [S(488.0), S(559.5833)], chips: [
      { id: "a100", name: "A100", power: 0.80 }, { id: "h100", name: "H100", power: 0.92 },
      { id: "a800", name: "A800", power: 0.555 }, { id: "h800", name: "H800", power: 0.555 } ] });
    // chart title + product photo cards live inside the camera so they track it
    (function () {
      const cam = ln.cam;
      const tt = document.createElement("div"); tt.id = SEG + "-ln-tt";
      tt.innerHTML = '<div id="' + SEG + '-ln-tk" class="t-label"><span class="n5-w">The ban</span></div><div id="' + SEG + '-ln-yr" class="t-display"><span class="n5-w">2022</span></div>';
      cam.appendChild(tt);
      const cards = [["a100", "assets/nvidia/shared/hardware/cutouts/a100_sxm4_cutout.png", "A100", 1010, 205, -2.5], ["h100", "assets/nvidia/shared/hardware/cutouts/h100_sxm_cutout.png", "H100", 1376, 205, 2]];
      cards.forEach((c) => {
        const d = document.createElement("div"); d.className = "n5-pc"; d.id = SEG + "-pc-" + c[0];
        d.style.left = c[3] + "px"; d.style.top = c[4] + "px"; d.style.transform = "rotate(" + c[5] + "deg)";
        d.innerHTML = '<div class="im"><img src="' + c[1] + '" alt="" /></div><div class="lb t-label">NVIDIA ' + c[2] + '</div>';
        cam.appendChild(d);
      });
      gsap.set([$("pc-a100"), $("pc-h100"), $("line-cr")], { opacity: 0 });
    })();
    (function () {
      const cam = ln.cam;
      gsap.set(cam, { x: 0, y: 0, scale: 1 });
      tl.fromTo(cam, { x: 0, y: 0, scale: 1 }, { x: 0, y: 0, scale: 1.012, duration: S(509.3) - S(488.58), ease: "none", immediateRender: false }, S(488.58));
      const tw = W("ln-tt");
      rise(tw[0], T(489.60), { dur: 0.5 });
      rise(tw[1], T(490.40), { dur: 0.7, y: 22 });
      ln.drawAxis(tl, S(494.60), { bottom: T(498.48), top: T(499.52) });
      ln.drawLine(tl, S(501.20), { dur: 1.1, tag: T(501.52), cant: T(503.20), can: T(505.12) });
      // "Now, at the time…" — title steps aside, the camera drifts back out (the motif fills the safe area: no push here)
      tl.to($("ln-tt"), { opacity: 0, duration: 0.4, ease: E.in }, S(509.15));
      tl.fromTo(cam, { scale: 1.012 }, { scale: 1.0, duration: S(518.43) - S(509.30), ease: "none", immediateRender: false }, S(509.30));
      ln.addChip(tl, "a100", S(513.36)); ln.addChip(tl, "h100", S(513.68));
      ln.ban(tl, "a100", S(514.24)); ln.ban(tl, "h100", S(514.54));
      [["pc-a100", 515.70], ["pc-h100", 516.50]].forEach((p) => {
        tl.fromTo($(p[0]), { opacity: 0, y: -40, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: C(E.out, 0.8), immediateRender: false }, S(p[1]));
      });
      tl.fromTo($("line-cr"), { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, S(515.70));
      // leaving for the face cam: cards and credit go, camera resets for the second visit
      tl.set([$("pc-a100"), $("pc-h100"), $("line-cr")], { opacity: 0 }, S(518.50));
      tl.set(cam, { x: 0, y: 0, scale: 1 }, S(548.0));
      // ln.addChip/ban calls continue in sc010 below (chronological per instance)
    })();

    /* ===== sc004 · FACE C ===== */
    face("sc004", [[518.43, 523.13, "C"]]);

    /* ===== sc005 · waffle: China = a quarter of sales ===== */
    whip("sc004", "sc005", S(523.13), { dir: 1, flash: true });
    (function () {
      push("sc005", 523.13, 527.50, 1.0, 1.04, { ease: E.cam, origin: "960px 540px" });
      const g = $("sc005-grid"), sq = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) {
        const d = document.createElement("div"); d.className = "n5-sq";
        d.style.left = (640 + c * 132) + "px"; d.style.top = (296 + r * 132) + "px"; d.style.backgroundPosition = (-c * 70) + "px " + (-r * 60) + "px";
        g.appendChild(d); sq.push(d);
      }
      tl.fromTo($("sc005-rulev"), { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, S(523.20));
      tl.fromTo($("sc005-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: C(E.out, 0.7), immediateRender: true }, S(523.25));
      rise($("sc005-ti"), S(523.30), { dur: 0.6 });
      sq.forEach((d, i) => tl.fromTo(d, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, S(523.30 + (i % 5) * 0.06 + Math.floor(i / 5) * 0.12)));
      rise(W("sc005-lg")[0], T(523.12), { dur: 0.5 });
      // the bottom row (5 of 20) turns China red on "quarter", left to right at 12 fps
      sq.slice(15).forEach((d, i) => tl.to(d, { backgroundColor: "#dc2f3c", duration: 0.25, ease: C(E.out, 0.25) }, S(525.14 + i * 0.125)));
      const mk = $("sc005-mk");
      pen(mk, [[1300, 758], [1340, 758], [1372, 712]], S(525.30), 0.45, { color: INK, width: 3, dash: "8 7", seed: 5 });
      const cw = W("sc005-co");
      gsap.set($("sc005-co"), { opacity: 0 });
      tl.fromTo($("sc005-co"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: C(E.out, 0.4), immediateRender: false }, T(524.96));
      rise(cw[0], T(524.96), { dur: 0.3, y: 10 });
      rise(cw[1], T(525.12), { dur: 0.4, y: 10 });
    })();

    /* ===== sc006 · FACE W ===== */
    face("sc006", [[527.50, 531.02, "W"]]);

    /* ===== sc007 · demand exploding all around the world ===== */
    whip("sc006", "sc007", S(531.02), { dir: -1 });
    (function () {
      push("sc007", 531.02, 536.25, 1.0, 1.06, { ease: E.cam, origin: "1300px 400px" });
      const mk = $("sc007-mk");
      // axes (bone, light)
      pen(mk, [[300, 870], [300, 520], [301, 200]], S(531.15), 0.7, { color: "rgba(240,239,232,0.75)", width: 3, seed: 3 });
      pen(mk, [[300, 870], [1000, 869], [1680, 871]], S(531.25), 0.8, { color: "rgba(240,239,232,0.75)", width: 3, seed: 4 });
      rise(W("sc007-yl")[0], T(532.40), { dur: 0.5 });
      // exponential curve: flat for a while, then it shoots up on "exploding"
      const N = 60, k = 4.2, pts = [];
      for (let i = 0; i <= N; i++) { const u = i / N; pts.push([300 + u * 1360, 860 - 650 * (Math.exp(k * u) - 1) / (Math.exp(k) - 1)]); }
      const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      const L = cum[cum.length - 1];
      const cv = svg(mk, "path", { d: "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L"), fill: "none", stroke: "#86c232", "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round",
        "stroke-dasharray": L + " " + L, "stroke-dashoffset": L });
      cv.style.filter = "drop-shadow(0 0 10px rgba(134,194,50,0.65))";
      const head = $("sc007-head");
      const at = (len) => { let i = 1; while (i < cum.length - 1 && cum[i] < len) i++; const f = (len - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]; };
      const pr = { v: 0 };
      const upd = () => { const l = pr.v * L; cv.setAttribute("stroke-dashoffset", (L - l).toFixed(1)); const p = at(l); head.style.left = p[0] + "px"; head.style.top = p[1] + "px"; };
      upd();
      gsap.set(head, { opacity: 0 });
      tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, S(531.70));
      tl.fromTo(pr, { v: 0 }, { v: 0.42, duration: S(533.80) - S(531.70), ease: C("none", 2.1), immediateRender: false, onUpdate: upd }, S(531.70));
      tl.to(pr, { v: 1, duration: 1.2, ease: C(E.in, 1.2), onUpdate: upd }, S(533.86));
      // data-centre hubs light up around the world (no China — it is the market NVIDIA is losing)
      const hubs = [[-122.0, 37.4], [-77.5, 39.0], [-96.8, 32.8], [-6.3, 53.3], [8.7, 50.1], [103.8, 1.35], [139.7, 35.7], [127.0, 37.5], [72.9, 19.1], [-46.6, -23.5], [55.3, 25.2], [-79.4, 43.7]];
      const dots = $("sc007-dots");
      hubs.forEach((h, i) => {
        const d = document.createElement("div"); d.className = "n5-dot";
        d.style.left = (-120 + (h[0] + 180) / 360 * 2160) + "px"; d.style.top = ((90 - h[1]) / 180 * 1080) + "px";
        dots.appendChild(d);
        tl.fromTo(d, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, S(534.66 + (i % 6) * 0.1 + Math.floor(i / 6) * 0.05));
      });
    })();

    /* ===== sc008 · FACE M → C on the aside ===== */
    face("sc008", [[536.25, 542.45, "M"], [542.45, 543.61, "C"]]);

    /* ===== sc009 · the new chip, drawn to sit just under the law ===== */
    slide("sc008", "sc009", S(543.61), { axis: "y" });
    (function () {
      push("sc009", 543.61, 548.33, 1.0, 1.05, { ease: E.cam, origin: "960px 520px" });
      const mk = $("sc009-mk");
      const t0 = 543.62;
      pen(mk, rect(730, 330, 460, 460), S(t0), 0.75, { width: 4, seed: 11 });
      // pins on all four sides
      const pins = [];
      for (let k = 0; k < 12; k++) { const p = 760 + k * 36; pins.push([[p, 330], [p, 304]], [[p, 790], [p, 816]], [[730, 360 + k * 36], [704, 360 + k * 36]], [[1190, 360 + k * 36], [1216, 360 + k * 36]]); }
      pins.forEach((pp, i) => pen(mk, pp, S(t0 + 0.55 + (i % 12) * 0.03), 0.2, { width: 3, seed: 30 + i, jit: 0.8 }));
      pen(mk, rect(850, 450, 220, 220), S(t0 + 0.75), 0.5, { width: 4, seed: 12 });
      tl.fromTo($("sc009-die"), { opacity: 0 }, { opacity: 0.88, duration: 0.5, ease: C(E.out, 0.5), immediateRender: true }, S(t0 + 1.1));
      // memory stacks beside the die
      [[772, 452], [772, 532], [772, 612], [1090, 452], [1090, 532], [1090, 612]].forEach((h, i) => pen(mk, rect(h[0], h[1], 58, 62), S(t0 + 1.0 + i * 0.09), 0.3, { width: 3, seed: 40 + i }));
      // dimension line (height of the package)
      pen(mk, [[1290, 330], [1291, 560], [1290, 790]], S(t0 + 1.6), 0.5, { width: 3, seed: 50, color: "rgba(240,239,232,0.8)" });
      pen(mk, [[1272, 330], [1308, 330]], S(t0 + 1.6), 0.2, { width: 3, seed: 51, color: "rgba(240,239,232,0.8)" });
      pen(mk, [[1272, 790], [1308, 791]], S(t0 + 2.0), 0.2, { width: 3, seed: 52, color: "rgba(240,239,232,0.8)" });
      // title block
      pen(mk, rect(1424, 856, 400, 152), S(t0 + 0.4), 0.6, { width: 3, seed: 60, color: "rgba(240,239,232,0.8)" });
      pen(mk, [[1424, 924], [1824, 925]], S(t0 + 0.8), 0.3, { width: 3, seed: 61, color: "rgba(240,239,232,0.8)" });
      tl.fromTo($("sc009-logo"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: C(E.out, 0.4), immediateRender: true }, S(t0 + 0.9));
      rise(W("sc009-tb")[0], S(544.59), { dur: 0.5 });
      // "…to get around this law": the limit drawn just above the chip's top edge
      pen(mk, [[560, 296], [960, 295], [1360, 297]], S(547.00), 0.6, { color: "#9fdcf0", width: 6, dash: "18 12", seed: 70, jit: 1.2 });
    })();

    /* ===== sc010 · back on THE LINE: A800 / H800 right under it ===== */
    whip("sc009", "line", S(548.33), { dir: -1 });
    (function () {
      const cam = ln.cam;
      // push into the gap between the line and where the new chips will land
      const s1 = 1.32, cx = 690, cy = 528;   // framed so no label is cut by the frame edge (tag in, zone labels / axis labels out)
      tl.to(cam, { x: -(cx - 960) * s1, y: -(cy - 540) * s1, scale: s1, duration: 1.4, ease: E.cam }, S(550.20));
      FX.focusHunt(tl, ln.el, S(551.62), { dur: 0.8 });
      ln.addChip(tl, "a800", S(552.70)); ln.addChip(tl, "h800", S(553.10));
      // slow pull-back through the end (cut on action into nvs06)
      tl.to(cam, { x: 0, y: 0, scale: 1.0, duration: S(559.5833) - S(556.40), ease: "sine.inOut" }, S(556.40));
    })();
    // A100/H100 stay banned from sc003; the ban tweens ran there (chronological per instance).

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
</template>
