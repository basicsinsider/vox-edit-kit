    // ===================== maps: sc009 (flight) + sc013 (north to Washington) =====================

      CT.credit($("sc013-cr"), "Map: AWS Terrain Tiles · Natural Earth");
    })();

    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
