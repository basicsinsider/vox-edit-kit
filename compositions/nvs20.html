  <script>

    const INK = "#14181b", BONE = "#f0efe8", ASH = "#888e92", ASHL = "#c3c7c8", VOLT = "#86c232", VOLTL = "#c9ec8f", VOLTD = "#3f6410",
          RED = "#dc2f3c", REDL = "#f6a4a9", REDD = "#7e151e", ICE = "#2a9fc9", ICED = "#115973", ICEL = "#9fdcf0", YEL = "#f5d033";

    function words(id, cues, o) { const ws = W(id); cues.forEach((c, i) => rise(ws[i], c, o)); }
    function pen(svg, t, pts, o) {
      o = Object.assign({ color: INK, width: 6, dur: 0.6, seed: 3, blend: "normal" }, o);
      const p = FX.markup.pen(tl, svg, t, { points: pts, color: o.color, width: o.width, dur: o.dur, filter: o.filter || PEN, blend: o.blend, seed: o.seed, ease: o.ease || "sine.inOut" });
      gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, t);
      return p;
    }
    const whipN = { n: 0 };
    function whip(a, b, t, o) {
      o = Object.assign({ dir: 1, vertical: false, flash: false, dur: 0.32 }, o);
      const k = ++whipN.n, ba = FX.whipDefs(defs, SEG + "-wa" + k), bb = FX.whipDefs(defs, SEG + "-wb" + k), h = o.dur / 2;
      const A = $(a + "-shot"), B = $(b + "-shot");
      tl.set(A, { filter: "url(#" + SEG + "-wa" + k + ")" }, t - h - 0.01); tl.set(A, { filter: "none" }, t + 0.06);
      tl.set(B, { filter: "url(#" + SEG + "-wb" + k + ")" }, t - 0.001); tl.set(B, { filter: "none" }, t + h + 0.02);
      FX.whip(tl, A, B, t, { dir: o.dir, vertical: o.vertical, dur: o.dur, blurA: ba, blurB: bb });

    }
    function slide(a, b, t, o) {
      o = Object.assign({ axis: "x", from: 1, d: 0.45 }, o);
      const A = $(a + "-shot"), B = $(b + "-shot"), dist = (o.axis === "x" ? 1980 : 1140) * o.from;
      tl.fromTo(B, { [o.axis]: dist, boxShadow: "0 0 80px rgba(0,0,0,0.5)" }, { [o.axis]: 0, duration: o.d, ease: C(E.inOut, o.d), immediateRender: false }, t - o.d);
      tl.set(B, { boxShadow: "none" }, t);
      tl.fromTo(A, { [o.axis]: 0 }, { [o.axis]: -dist * 0.12, duration: o.d, ease: E.in, immediateRender: false }, t - o.d);
    }
    function push(id, a, b, s0, s1, o) {
      o = o || {};

      if (o.origin) gsap.set(vw, { transformOrigin: o.origin });
      gsap.set(vw, { scale: s0 });
      tl.fromTo(vw, { scale: s0 }, { scale: s1, duration: b - a, ease: o.ease || "none", immediateRender: false }, S(a));

    function icon(parent, name, x, y, size, color, o) {

      const a = f * Math.PI * 2, x = 300 + 300 * Math.sin(a), y = 300 - 300 * Math.cos(a);
