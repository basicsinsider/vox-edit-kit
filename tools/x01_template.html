  <div id="root" data-composition-id="x01" data-duration="18" data-width="1920" data-height="1080">

    <div class="x01-scene" id="x01-map">
      <div id="x01-stage"><div id="x01-plane">
        <div id="x01-cam">

              <filter id="x01-rus-glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="9"/></filter>

        <div class="x01-blab t-label" style="left: 960px" id="x01-labB">Still have a home</div>

    <div id="x01-grain" class="tx tx-grain" style="background-image:url('assets/textures/grain_02_norm.jpg')"></div>

  <script>
  (function () {
    const DUR = 18;
    const tl = gsap.timeline({ paused: true });
    // No voiceover yet: cues are scene seconds. When narration exists, rewrite as T(vo) on the spoken words.
    const T = (s) => s, S = (s) => s;
    const $ = (id) => document.getElementById(id);
    const C = (d, e) => FX.choppy(e || "power3.out", d, 12);
    const GEO = __GEO_JSON__;
    FX.grain($("x01-grain"), 41);
    FX.dust($("x01-dust"), 13, 2);

    // ================= scene windows =================
    const MAP_END = S(11.85), CHART_IN = S(11.4);
    tl.set("#x01-chart", { x: 1960 }, 0);
    tl.set("#x01-map", { display: "none" }, MAP_END);

    // ================= camera (pure function of t: drawn canvases + DOM share it) =================
    const PW = 2400, PH = 1500, TILT = 20;
    gsap.set("#x01-plane", { rotationX: TILT });
    const mid = GEO.mid.in_wide, det = GEO.detail.in_wide;
    gsap.set("#x01-mid", { left: mid.left, top: mid.top, scale: mid.scale });
    gsap.set("#x01-det", { left: det.left, top: det.top, scale: det.scale });
    const SPBW = GEO.spb_wide, SPBD = GEO.spb_detail;
    gsap.set("#x01-russia-lbl", { left: 2620, top: 1320 });
    const easeIO = gsap.parseEase("power2.inOut"), easeS = gsap.parseEase("sine.inOut");
    const C0 = [2600, 1360], S0 = 0.40, S0b = 0.435;
    const C1 = [SPBW[0] - 3, SPBW[1] + 2], S1 = 40, S2 = 47;
    const ZA = 2.7, ZB = 5.9;
    const lerp = (a, b, u) => a + (b - a) * u;
    const R = FX.rng(2026);

    // ---- drone plan (deterministic) ----
    const urban = new Path2D(GEO.urban_d);
    const probe = document.createElement("canvas").getContext("2d");
    const ub = GEO.urban_bbox;
    function urbanPoint(rr) {
      for (let k = 0; k < 60; k++) {
        const x = lerp(ub[0], ub[2], rr()), y = lerp(ub[1], ub[3], rr());
        const dx = x - SPBD[0], dy = y - SPBD[1];
        if (Math.hypot(dx, dy * 1.2) > 420) continue; // keep strikes on the dense city
        if (probe.isPointInPath(urban, x, y)) return [x, y];
      }
      return [SPBD[0], SPBD[1]];
    }
    // air-defence sites ring the city
    const AD = [];
    for (let k = 0; k < 7; k++) { const a = Math.PI * (0.55 + k * 0.17); AD.push([SPBD[0] + Math.cos(a) * 520 - 120, SPBD[1] + Math.sin(a) * 430 - 40]); }
    const ND = 300, drones = [], impacts = [];
    for (let i = 0; i < ND; i++) {
      const u = i / ND;
      const t0 = 5.0 + 3.6 * Math.pow(u, 0.85) + (R() - 0.5) * 0.25;
      const ang = Math.PI * (0.62 + R() * 0.55);       // from west / south-west / over the gulf
      const rad = 1050 + R() * 350;
      const sx = SPBD[0] + Math.cos(ang) * rad, sy = SPBD[1] + Math.sin(ang) * rad * 0.8;
      const tgt = urbanPoint(R);
      const speed = 520 + R() * 160;
      const len = Math.hypot(tgt[0] - sx, tgt[1] - sy);
      const dur = len / speed;
      const bend = (R() - 0.5) * 220;
      const shot = R() < 0.72;
      const pHit = shot ? 0.5 + R() * 0.38 : 1;
      const d = { t0, sx, sy, tx: tgt[0], ty: tgt[1], dur, bend, shot, pHit, tEnd: t0 + dur * pHit, seed: i };
      if (shot) { let best = 0, bd = 1e9; const p = dronePos(d, pHit); AD.forEach((a, k) => { const q = Math.hypot(a[0] - p[0], a[1] - p[1]); if (q < bd) { bd = q; best = k; } }); d.ad = best; }
      else impacts.push({ t: d.tEnd, x: tgt[0], y: tgt[1], r: 70 + R() * 110, seed: i });
      drones.push(d);
    }
    function dronePos(d, p) {
      const mx = (d.sx + d.tx) / 2, my = (d.sy + d.ty) / 2, dx = d.tx - d.sx, dy = d.ty - d.sy, L = Math.hypot(dx, dy) || 1;
      const cx = mx - (dy / L) * d.bend, cy = my + (dx / L) * d.bend;
      const a = (1 - p) * (1 - p), b = 2 * (1 - p) * p, c = p * p;
      return [a * d.sx + b * cx + c * d.tx, a * d.sy + b * cy + c * d.ty, 2 * (1 - p) * (cx - d.sx) + 2 * p * (d.tx - cx), 2 * (1 - p) * (cy - d.sy) + 2 * p * (d.ty - cy)];
    }

    function cam(t) {
      let cx, cy, s;
      if (t < ZA) { const u = t / ZA; s = lerp(S0, S0b, u); cx = lerp(C0[0], C0[0] - 60, u); cy = C0[1]; }
      else if (t < ZB) {
        const u = easeIO((t - ZA) / (ZB - ZA));
        s = Math.exp(lerp(Math.log(S0b), Math.log(S1), u));
        const f = (1 / S0b - 1 / s) / (1 / S0b - 1 / S1);
        cx = lerp(C0[0] - 60, C1[0], f); cy = lerp(C0[1], C1[1], f);
      } else { const u = easeS(Math.min(1, (t - ZB) / (MAP_END - ZB))); s = lerp(S1, S2, u); cx = lerp(C1[0], C1[0] + 2, u); cy = lerp(C1[1], C1[1] - 1.5, u); }
      // impact shake (screen px)
      let shx = 0, shy = 0;
      for (const im of impacts) { const a = t - im.t; if (a > 0 && a < 0.45) { const k = (1 - a / 0.45); shx += Math.sin(a * 70 + im.seed) * 3.2 * k; shy += Math.cos(a * 61 + im.seed) * 2.6 * k; } }
      shx = Math.max(-9, Math.min(9, shx)); shy = Math.max(-9, Math.min(9, shy));
      return { s, tx: PW / 2 - s * cx + shx, ty: PH / 2 - s * cy + shy };
    }
    // detail-map px -> plane px
    const D2P = (c, x, y) => [c.tx + c.s * (det.left + x * det.scale), c.ty + c.s * (det.top + y * det.scale)];
    const ds = (c) => c.s * det.scale; // detail px -> plane px scale

    // ================= R12 fill: Russia wipes in red from the centre, glowing edge =================
    tl.fromTo("#x01-cam", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out", immediateRender: true }, 0);
    gsap.set("#x01-rus-wipec", { attr: { cx: 2620, cy: 1300 } });
    tl.fromTo("#x01-rus-wipec", { attr: { r: 0 } }, { attr: { r: 3400 }, duration: 1.0, ease: C(1.0, "power2.out"), immediateRender: true }, S(0.35));
    gsap.set("#x01-russia-lbl", { opacity: 0 });
    FX.text.rise(tl, [$("x01-russia-lbl")], T(0.85), { dur: 0.6, y: 40, blur: 14 });
    tl.to("#x01-russia-lbl", { opacity: 0, duration: 0.35, ease: "power1.in" }, S(ZA + 0.25));

    // ================= Saint Petersburg pin + label =================
    gsap.set("#x01-pin, #x01-spb-lbl", { opacity: 0 });
    tl.fromTo("#x01-pin", { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: C(0.25, "back.out(2)"), immediateRender: false }, S(5.15));
    tl.fromTo("#x01-pin .ring", { scale: 1, opacity: 1 }, { scale: 1.9, opacity: 0, duration: 0.9, repeat: 3, ease: "power1.out", immediateRender: false }, S(5.4));
    tl.fromTo("#x01-spb-lbl", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, T(5.3));
    FX.text.random(tl, $("x01-spb-txt"), T(5.3), { dur: 0.55, seed: 8 });
    tl.to("#x01-pin", { opacity: 0, duration: 0.3 }, S(8.6));
    tl.to("#x01-spb-lbl", { opacity: 0, duration: 0.4 }, S(10.9));

    // ================= canvases =================
    const cvB = $("x01-burn"), cvS = $("x01-smoke"), cvF = $("x01-fx");
    [cvB, cvS, cvF].forEach((c) => { c.width = PW; c.height = PH; });
    const gB = cvB.getContext("2d"), gS = cvS.getContext("2d"), gF = cvF.getContext("2d");
    // halftone tile for the burnt city
    const tile = document.createElement("canvas"); tile.width = tile.height = 12;
    { const g = tile.getContext("2d"); g.fillStyle = "rgba(90,18,8,0.55)"; g.beginPath(); g.arc(6, 6, 2.6, 0, 7); g.fill(); }
    const dots = gB.createPattern(tile, "repeat");
    let smokeSprite = null;
    function getSmoke() {
      if (smokeSprite) return smokeSprite;
      const im = $("x01-smokeimg");
      if (!im.complete || !im.naturalWidth) return null;
      const c = document.createElement("canvas"); c.width = 512; c.height = Math.round(512 * im.naturalHeight / im.naturalWidth);
      const g = c.getContext("2d"); g.filter = "grayscale(1) brightness(0.42) contrast(1.15)"; g.drawImage(im, 0, 0, c.width, c.height);
      return (smokeSprite = c);
    }
    function blob(g, x, y, r, seed, t) {
      g.beginPath();
      for (let k = 0; k <= 28; k++) {
        const a = (k / 28) * Math.PI * 2;
        const n = FX.noise2(Math.cos(a) * 1.6 + seed, Math.sin(a) * 1.6 + Math.floor(t * 12) * 0.03, seed);
        const rr = r * (0.72 + 0.5 * n);
        k ? g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      g.closePath();
    }

    // ================= per-frame: camera, layer handoffs, drones, burn, smoke =================
    FX.onFrame(FX.gate(0, MAP_END, (t) => {
      const c = cam(t);
      const camEl = $("x01-cam");
      camEl.style.transform = `translate(${c.tx.toFixed(2)}px, ${c.ty.toFixed(2)}px) scale(${c.s.toFixed(5)})`;
      // layer hand-offs by zoom level (hide what is covered → cheap renders)
      const midA = Math.min(1, Math.max(0, (c.s - 4.2) / 1.8)), detA = Math.min(1, Math.max(0, (c.s - 26) / 8));
      const rusA = 1 - Math.min(1, Math.max(0, (c.s - 0.9) / 1.6));
      $("x01-mid").style.opacity = midA; $("x01-mid").style.visibility = midA > 0 && detA < 1 ? "visible" : "hidden";
      $("x01-det").style.opacity = detA; $("x01-det").style.visibility = detA > 0 ? "visible" : "hidden";
      $("x01-wide").style.visibility = midA < 1 ? "visible" : "hidden";
      $("x01-rus").style.opacity = rusA; $("x01-rus").style.visibility = rusA > 0 ? "visible" : "hidden";
      // pin + label ride the map
      const p = D2P(c, SPBD[0], SPBD[1]);
      const pin = $("x01-pin"); pin.style.left = p[0] + "px"; pin.style.top = p[1] + "px";
      const lb = $("x01-spb-lbl"); lb.style.left = (p[0] + 70) + "px"; lb.style.top = (p[1] - 92) + "px";

      gB.clearRect(0, 0, PW, PH); gS.clearRect(0, 0, PW, PH); gF.clearRect(0, 0, PW, PH);
      if (t < 5.4) return;
      const k = ds(c);
      // --- burn: city fills red where strikes land (clipped to the urban area), halftone + charred cores
      gB.save();
      gB.setTransform(k, 0, 0, k, c.tx + c.s * det.left, c.ty + c.s * det.top);
      gB.clip(urban);
      let any = false;
      for (const im of impacts) {
        const a = t - im.t; if (a <= 0) continue; any = true;
        const r = im.r * (1 - Math.pow(1 - Math.min(1, a / 1.5), 3));
        gB.fillStyle = "#e5482a"; blob(gB, im.x, im.y, r, im.seed, t); gB.fill();
      }
      if (any) {
        gB.globalCompositeOperation = "source-atop";
        gB.setTransform(1, 0, 0, 1, 0, 0); gB.fillStyle = dots; gB.fillRect(0, 0, PW, PH);
        gB.setTransform(k, 0, 0, k, c.tx + c.s * det.left, c.ty + c.s * det.top);
        for (const im of impacts) {
          const a = t - im.t; if (a <= 0.25) continue;
          const r = im.r * 0.42 * Math.min(1, (a - 0.25) / 1.2);
          gB.fillStyle = "rgba(52,30,24,0.78)"; blob(gB, im.x + 6, im.y - 4, r, im.seed + 50, t); gB.fill();
        }
      }
      gB.restore();

      // --- smoke: dark plumes drift east from every strike
      const sp = getSmoke();
      if (sp) for (const im of impacts) {
        const a = t - im.t; if (a <= 0.1) continue;
        for (let j = 0; j < 2; j++) {
          const aa = a - j * 0.5; if (aa <= 0) continue;
          const q = D2P(c, im.x + aa * 46 + j * 30, im.y - aa * 20 - j * 18);
          const w = (60 + aa * 70) * k * 1.6 + 40;
          gS.globalAlpha = Math.min(0.45, aa * 0.5) * Math.max(0, 1 - aa / 7);
          gS.drawImage(sp, q[0] - w / 2, q[1] - w * 0.4, w, w * sp.height / sp.width);
        }
      }
      gS.globalAlpha = 1;

      // --- fires: flickering embers inside the burnt area
      gF.globalCompositeOperation = "lighter";
      for (const im of impacts) {
        const a = t - im.t; if (a <= 0.15) continue;
        const q = D2P(c, im.x, im.y);
        const fl = 0.65 + 0.35 * FX.noise1(t * 14 + im.seed, im.seed);
        const rr = (10 + im.r * 0.09 * Math.min(1, a)) * k * 1.4 * fl;
        const gr = gF.createRadialGradient(q[0], q[1], 0, q[0], q[1], rr);
        gr.addColorStop(0, "rgba(255,214,140,0.7)"); gr.addColorStop(0.35, "rgba(255,120,50,0.4)"); gr.addColorStop(1, "rgba(229,72,42,0)");
        gF.fillStyle = gr; gF.beginPath(); gF.arc(q[0], q[1], rr, 0, 7); gF.fill();
      }
      gF.globalCompositeOperation = "source-over";

      // --- drones, interceptor streaks, flashes
      for (const d of drones) {
        if (t < d.t0) continue;
        const pNow = (t - d.t0) / d.dur;
        if (pNow < d.pHit) {
          const [x, y, vx, vy] = dronePos(d, pNow);
          const q = D2P(c, x, y);
          if (q[0] < -60 || q[0] > PW + 60 || q[1] < -60 || q[1] > PH + 60) continue;
          const ang = Math.atan2(vy, vx);
          // trail
          gF.strokeStyle = "rgba(244,238,226,0.3)"; gF.lineWidth = 2.4;
          gF.beginPath(); gF.moveTo(q[0], q[1]); gF.lineTo(q[0] - Math.cos(ang) * 70, q[1] - Math.sin(ang) * 70); gF.stroke();
          // delta-wing glyph
          gF.save(); gF.translate(q[0], q[1]); gF.rotate(ang);
          gF.fillStyle = "#141a22"; gF.strokeStyle = "rgba(244,238,226,0.85)"; gF.lineWidth = 1.8;
          gF.beginPath(); gF.moveTo(17, 0); gF.lineTo(-11, -14); gF.lineTo(-5, 0); gF.lineTo(-11, 14); gF.closePath(); gF.fill(); gF.stroke();
          gF.restore();
          // interceptor streak climbs toward it just before the kill
          if (d.shot) {
            const lead = d.tEnd - t;
            if (lead < 0.42) {
              const a = AD[d.ad], u = 1 - lead / 0.42;
              const [hx, hy] = dronePos(d, d.pHit);
              const s0 = D2P(c, a[0], a[1]), s1 = D2P(c, lerp(a[0], hx, u), lerp(a[1], hy, u));
              gF.strokeStyle = "rgba(255,236,200,0.75)"; gF.lineWidth = 2.2;
              gF.beginPath(); gF.moveTo(lerp(s0[0], s1[0], Math.max(0, u - 0.45)), lerp(s0[1], s1[1], Math.max(0, u - 0.45))); gF.lineTo(s1[0], s1[1]); gF.stroke();
            }
          }
        } else {
          const a = t - d.tEnd;
          const [x, y] = dronePos(d, d.pHit);
          const q = D2P(c, x, y);
          if (d.shot) {
            if (a > 1.4) continue;
            // air burst: white-hot flash, then a grey puff
            if (a < 0.28) {
              const rr = 10 + a * 120, gr = gF.createRadialGradient(q[0], q[1], 0, q[0], q[1], rr);
              gr.addColorStop(0, `rgba(255,248,230,${0.95 * (1 - a / 0.28)})`); gr.addColorStop(0.4, `rgba(255,170,80,${0.7 * (1 - a / 0.28)})`); gr.addColorStop(1, "rgba(255,120,50,0)");
              gF.fillStyle = gr; gF.beginPath(); gF.arc(q[0], q[1], rr, 0, 7); gF.fill();
            }
            gF.fillStyle = `rgba(60,58,56,${0.35 * Math.max(0, 1 - a / 1.4)})`;
            gF.beginPath(); gF.arc(q[0] + a * 14, q[1] - a * 8, 8 + a * 16, 0, 7); gF.fill();
          } else {
            if (a > 0.7) continue;
            // ground strike: big flash + shock ring
            if (a < 0.35) {
              const rr = 20 + a * 260, gr = gF.createRadialGradient(q[0], q[1], 0, q[0], q[1], rr);
              gr.addColorStop(0, `rgba(255,250,235,${1 - a / 0.35})`); gr.addColorStop(0.3, `rgba(255,170,70,${0.85 * (1 - a / 0.35)})`); gr.addColorStop(1, "rgba(229,72,42,0)");
              gF.fillStyle = gr; gF.beginPath(); gF.arc(q[0], q[1], rr, 0, 7); gF.fill();
            }
            gF.strokeStyle = `rgba(244,238,226,${0.6 * (1 - a / 0.7)})`; gF.lineWidth = 3;
            gF.beginPath(); gF.arc(q[0], q[1], 16 + a * 230, 0, 7); gF.stroke();
          }
        }
      }
    }));

    // ================= transition: paper sheet slams in (12 fps), torn leading edge =================
    {
      const NS = "http://www.w3.org/2000/svg", rr = FX.rng(77);
      let d = "M70 0 L30 0";
      for (let y = 0; y <= 1120; y += 22) d += ` L${(14 + rr() * 34).toFixed(1)} ${y}`;
      d += " L30 1120 L70 1120 Z";
      const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("fill", "#efe7d5");
      $("x01-edge").appendChild(p);
      $("x01-edge").style.filter = "drop-shadow(-10px 0 14px rgba(0,0,0,0.35))";
    }
    tl.fromTo("#x01-chart", { x: 1990 }, { x: 0, duration: 0.42, ease: C(0.42, "power3.inOut"), immediateRender: false }, CHART_IN);
    tl.fromTo("#x01-map", { x: 0, filter: "blur(0px)" }, { x: -520, filter: "blur(6px)", duration: 0.42, ease: C(0.42, "power3.in"), immediateRender: false }, CHART_IN);

    // ================= chart =================
    const c0 = S(11.85);
    tl.fromTo("#x01-cstage", { scale: 1.0 }, { scale: 1.035, duration: DUR - CHART_IN, ease: "none" }, CHART_IN);
    gsap.set("#x01-kicker, #x01-title, .x01-tick, .x01-blab, #x01-boxA, #x01-valB, #x01-note", { opacity: 0 });
    tl.set("#x01-kicker", { opacity: 1 }, T(c0));
    FX.text.random(tl, $("x01-kicker"), T(c0), { dur: 0.45, seed: 5 });
    FX.text.rise(tl, [$("x01-title")], T(c0 + 0.25), { dur: 0.55, y: 22 });
    // axis: baseline + dashed gridlines draw on left → right
    const ax = $("x01-axis"), NS = "http://www.w3.org/2000/svg";
    const lines = [[940, false], [790, true], [640, true], [490, true], [340, true]];
    lines.forEach(([y, dash], i) => {
      const l = document.createElementNS(NS, "line");
      l.setAttribute("x1", 290); l.setAttribute("x2", 1380); l.setAttribute("y1", y); l.setAttribute("y2", y);
      l.setAttribute("stroke", dash ? "rgba(24,34,47,0.32)" : "#18222f"); l.setAttribute("stroke-width", dash ? 2 : 4);
      if (dash) l.setAttribute("stroke-dasharray", "10 10");
      ax.appendChild(l);
      tl.fromTo(l, { attr: { x2: 290 } }, { attr: { x2: 1380 }, duration: 0.5, ease: C(0.5, "power2.out"), immediateRender: true }, S(c0 + 0.35 + i * 0.06));
    });
    tl.to(".x01-tick", { opacity: 1, duration: 0.01, stagger: 1 / 12 }, S(c0 + 0.45));
    // bar A rises to 90% (12 fps), label box counts with it
    const tA = S(12.75), dA = 1.0;
    tl.fromTo("#x01-barA", { scaleY: 0 }, { scaleY: 1, duration: dA, ease: C(dA, "power3.out"), immediateRender: true }, tA);
    tl.fromTo("#x01-boxA", { opacity: 0, y: 540 }, { opacity: 1, y: 0, duration: dA, ease: C(dA, "power3.out"), immediateRender: false }, tA);
    FX.text.count(tl, $("x01-pct"), tA, 0, 90, dA, (v) => Math.round(v) + "%");
    tl.fromTo("#x01-boxA", { scale: 1 }, { scale: 1.12, duration: 1 / 12, yoyo: true, repeat: 1, ease: "none", immediateRender: false }, tA + dA);
    tl.to("#x01-labA", { opacity: 1, duration: 0.01 }, T(tA + 0.1));
    FX.text.random(tl, $("x01-labA"), T(tA + 0.1), { dur: 0.4, seed: 21 });
    // bar B stays small
    const tB = S(13.85);
    tl.fromTo("#x01-barB", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: C(0.4, "back.out(2)"), immediateRender: true }, tB);
    tl.fromTo("#x01-valB", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: C(0.3), immediateRender: false }, tB + 0.1);
    tl.to("#x01-labB", { opacity: 1, duration: 0.01 }, T(tB + 0.15));
    FX.text.random(tl, $("x01-labB"), T(tB + 0.15), { dur: 0.4, seed: 22 });
    // Vox markup: "nine in ten" + hand-drawn arrow to bar A, rough circle on the box
    const mk = $("x01-mk"), mf = FX.markupDefs(mk, "x01-mkf");
    tl.fromTo("#x01-note", { opacity: 0, y: 16, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0.45px)", duration: 0.5, ease: "power3.out", immediateRender: false }, T(14.75));
    FX.markup.arrow(tl, mk, S(15.0), { x1: 1410, y1: 540, x2: 835, y2: 330, bend: -70, head: 34, dur: 0.55, color: "#18222f", width: 6, filter: mf });
    FX.markup.circle(tl, mk, S(15.6), { cx: 610, cy: 318, rx: 230, ry: 92, rot: -4, dur: 0.6, color: "#e5482a", width: 7, filter: mf });

    FX.mount(tl, DUR);
    window.__timelines["x01"] = tl;
  })();
  </script>
</template>
