    function catmull(pts) {

        d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;

      return d;

    function marker(svg, d, w) {

      p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#f2d33b"); p.setAttribute("stroke-width", w);
      p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round"); p.setAttribute("filter", "url(#seg04-roughmk)");
      p.style.mixBlendMode = "multiply"; p.setAttribute("opacity", "0.92");
      svg.appendChild(p);
      const L = p.getTotalLength();
      p.setAttribute("stroke-dasharray", `${L} ${L}`); p.setAttribute("stroke-dashoffset", L);
      const lut = []; for (let i = 0; i <= 300; i++) { const q = p.getPointAtLength((i / 300) * L); lut.push([q.x, q.y]); }
      return { p, L, at: (k) => { const f = clamp(k, 0, 1) * 300, i = Math.floor(f), j = Math.min(300, i + 1), r = f - i; return [lerp(lut[i][0], lut[j][0], r), lerp(lut[i][1], lut[j][1], r)]; } };
    }
    function ellipsePath(cx, cy, rx, ry, rot, turns, seed) {
      const r = FX.rng(seed), pts = [], N = 72, a0 = -2.4;
      const c = Math.cos(rot * Math.PI / 180), s = Math.sin(rot * Math.PI / 180);
      for (let i = 0; i <= N; i++) {
        const k = i / N, a = a0 + k * Math.PI * 2 * turns, wob = 1 + (k - 0.5) * 0.09 + (r() - 0.5) * 0.012;
        const x = Math.cos(a) * rx * wob, y = Math.sin(a) * ry * wob;
        pts.push([+(cx + x * c - y * s).toFixed(1), +(cy + x * s + y * c).toFixed(1)]);
      }
      return "M" + pts.map((q) => q[0] + " " + q[1]).join(" L");
    }
    function setCam(cam, tilt, cx, cy, z, k) {

    // =====================================================================
    // SC053 · 330.63–337.19 · R10-A: 1920 Rand McNally railroad map, yellow marker Palo Alto -> Boston
    // =====================================================================
    scene("sc053", 330.63, 337.19);
    const cam53 = $("sc053-cam"), tilt53 = $("sc053-tilt"), svg53 = $("sc053-svg");
    const route = [[382, 1813], [358, 1797], [450, 1735], [497, 1677], [912, 1488], [1920, 1488], [2414, 1473], [2900, 1500], [3365, 1551], [3402, 1434]];

    circ53.setAttribute("d", ellipsePath(3402, 1434, 120, 96, -8, 1.12, 53));
    ["fill:none", "stroke:#f2d33b", "stroke-width:26", "stroke-linecap:round", "mix-blend-mode:multiply"].forEach((s) => { const [k, v] = s.split(":"); circ53.style.setProperty(k, v); });

    const L0 = T(331.83) - 0.04, L1 = T(335.43) + 0.07, E0 = T(335.43) + 0.19, E1 = T(337.19);
    const eIO = gsap.parseEase("power1.inOut"), eS = gsap.parseEase("sine.inOut"), eP = gsap.parseEase("power2.in");
    function cam53At(t) {
      if (t <= L0) {
        const k = eS(clamp((t - T(330.63)) / (L0 - T(330.63)), 0, 1));
        return { cx: lerp(A0.cx, A1.cx, k), cy: lerp(A0.cy, A1.cy, k), z: lerp(A0.z, A1.z, k), tk: k };

      }
      const s = cam53At(E0 - 0.0001), k = eP(clamp((t - E0) / (E1 - E0), 0, 1)), k2 = eS(clamp((t - E0) / 0.9, 0, 1));
      return { cx: lerp(s.cx, 3402, k2), cy: lerp(s.cy, 1434, k2), z: lerp(s.z, 1.75, k), tk: 1 };
    }
    gate(T(330.63), T(337.19), () => FX.onFrame((t) => {
      const c = cam53At(t);
