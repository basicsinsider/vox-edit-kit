  <script>
  (function () {
    const SEG = "seg06", SEG_START = 496.92, SEG_END = 600.00, DURATION = +(SEG_END - SEG_START).toFixed(2);
    const T = (s) => +(s - SEG_START).toFixed(3);
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById("seg06-" + id);
    const C = (d, e) => FX.choppy(e || "power3.out", d, 12);
    const NS = "http://www.w3.org/2000/svg";
    const defs = $("defs");

    // run per-frame effects only inside [a, b] (local seconds)
    const gate = (a, b, fn) => {
      const orig = FX.onFrame;
      FX.onFrame = (f) => orig((t) => { if (t >= a - 0.05 && t <= b + 0.05) f(t); });
      try { return fn(); } finally { FX.onFrame = orig; }
    };
    // scene visibility windows + per-ground texture levels
    const scene = (id, a, b, ground) => {
      tl.set($(id), { display: "block", autoAlpha: 1 }, a);
      tl.set($(id), { display: "none", autoAlpha: 0 }, b);
      tl.set($("grain"), { opacity: ground === "paper" ? 0.24 : 0.36 }, a);
      tl.set($("dust"), { opacity: ground === "paper" ? 0.12 : 0.42 }, a);
    };
    // dashoffset draw-on for any path ("trim paths"), optional 12 fps
    const drawPath = (svg, d, o, t, dur, ease) => {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d); p.setAttribute("fill", "none");
      p.setAttribute("stroke", o.color || "#18222f"); p.setAttribute("stroke-width", o.width || 5);
      p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
      if (o.filter) p.setAttribute("filter", o.filter);
      if (o.blend) p.style.mixBlendMode = o.blend;
      if (o.opacity) p.setAttribute("opacity", o.opacity);
      svg.appendChild(p);
      const len = p.getTotalLength();
      if (o.dash) {
        // dashed line revealed by a mask-like second dasharray is complex; reveal dashed lines by clip width instead
        p.setAttribute("stroke-dasharray", o.dash);
      } else {
        p.setAttribute("stroke-dasharray", `${len} ${len}`);
        p.setAttribute("stroke-dashoffset", len);
        tl.fromTo(p, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: ease || "power2.inOut", immediateRender: true }, t);
      }
      return p;
    };
    const ICON = '<svg viewBox="0 0 64 64" fill="currentColor"><path d="M32 3 L57 12 L32 21 L7 12 Z"/><path d="M49 15 L49 25 L51 25 L51 14.3 Z"/><path d="M51.5 25 a2.2 2.2 0 1 1 -4.4 0 a2.2 2.2 0 1 1 4.4 0 Z"/><path d="M19 15.5 L32 20.2 L45 15.5 L45 21 C45 23 39 25 32 25 C25 25 19 23 19 21 Z"/><circle cx="32" cy="31" r="8"/><path d="M16 62 L18 47 C19 42 24 40 28 40 L32 46 L36 40 C40 40 45 42 46 47 L48 62 Z"/></svg>';

    // shared filters
    FX.tintDefs(defs, "seg06-tint-paper", "#18222f", "#efe7d5");
    FX.tintDefs(defs, "seg06-tint-night", "#1b1a18", "#7b756b");
    FX.tintDefs(defs, "seg06-tint-money", "#1d1b18", "#a39a88");
    gate(0, DURATION, () => {
      FX.roughDefs(defs, "seg06-rough", { freq: 0.04, scale: 6 });
      FX.roughDefs(defs, "seg06-rough9", { freq: 0.03, scale: 7 });
      FX.roughDefs(defs, "seg06-roughhl", { freq: 0.04, scale: 9 });
      FX.grain($("grain"), 601);
      FX.dust($("dust"), 602, 2);
    });
    const iris = FX.iris($("iris"), { blades: 7, close: 0.15, hold: 2 / 24, open: 0.2 });

    // =====================================================================
    // SC078 · 496.92–504.92 · R5 isotype — the smartest students go East
    // =====================================================================
    scene("sc078", T(496.92), T(504.92), "paper");
    {
      const row = $("sc078-row"), icons = [];
      for (let i = 0; i < 12; i++) {
        const d = document.createElement("div");
        d.className = "seg06-ico"; d.innerHTML = ICON;
        d.style.left = (470 + i * 84) + "px"; d.style.top = "560px";
        row.appendChild(d); icons.push(d);
      }
      const smart = [1, 4, 7, 10].map((i) => icons[i]);
      const rest = icons.filter((x) => !smart.includes(x));
      // dashed lane + arrow toward the East
      const lane = $("sc078-lane");
      const laneLine = drawPath(lane, "M430 468 L1550 468", { color: "#18222f", width: 3, dash: "14 12", opacity: 0.55 }, 0, 0);
      const head = drawPath(lane, "M1530 452 L1556 468 L1530 484", { color: "#18222f", width: 3, opacity: 0.55 }, 0, 0);
      tl.fromTo(laneLine, { attr: { "stroke-dashoffset": 0 }, opacity: 0 }, { opacity: 0.55, duration: 0.3, immediateRender: true }, T(499.48) - 0.1);
      tl.fromTo(head, { opacity: 0 }, { opacity: 0.55, duration: 0.3, immediateRender: true }, T(499.48) - 0.1);
      tl.to(laneLine, { attr: { "stroke-dashoffset": -104 }, duration: 4.0, ease: "none" }, T(499.48));

      tl.fromTo("#seg06-sc078-cam", { scale: 1.0 }, { scale: 1.05, duration: 8.0, ease: "none" }, T(496.92));
      tl.fromTo("#seg06-sc078-seal", { rotation: -6 }, { rotation: 4, duration: 8.0, ease: "none" }, T(496.92));
      // icons pop in (12 fps), first one already there to match SC077's frozen graduate
      // icon 0 = SC077's frozen graduate (192 px, frame centre) settling into its slot
      tl.fromTo(icons[0], { x: 462, y: -48, scale: 2.36 }, { x: 0, y: 0, scale: 1, duration: 0.38, ease: "power3.inOut", immediateRender: true }, T(496.92));
      icons.slice(1).forEach((ic, i) => tl.fromTo(ic, { scale: 0 }, { scale: 1, duration: 0.18, ease: C(0.18, "back.out(3)"), immediateRender: true }, T(496.92) + 0.12 + Math.floor(i * 0.42) / 12));
      // "his smartest students"
      FX.text.rise(tl, [$("sc078-title")], T(497.32) - 0.06, { dur: 0.6 });
      smart.forEach((ic, j) => {
        tl.to(ic, { color: "#e5482a", duration: 0.001 }, T(497.32) + j * 0.08);
        tl.fromTo(ic, { scale: 1.35 }, { scale: 1, duration: 0.3, ease: C(0.3, "back.out(2)"), immediateRender: false }, T(497.32) + j * 0.08);

      // the rest settle to grey ("they stay")
      tl.to(rest, { color: "#9a968c", duration: 0.4, ease: "power1.inOut" }, T(499.96));
      // the four hop up to the lane, then walk right in 8 fps steps
      smart.forEach((ic, j) => {
        tl.to(ic, { y: -120, duration: 0.3, ease: C(0.3, "power2.out") }, T(499.48) + j * 0.05);

      smart.forEach((ic, j) => tl.to(ic, { x: 1150 + j * 84 - (470 + [1, 4, 7, 10][j] * 84) + 640, duration: 0.7, ease: FX.choppy("power2.in", 0.7, 8) }, T(503.64) + 0.36 + j * 0.06));

    // =====================================================================

    {
      gate(T(504.92), T(513.08), () => FX.streaks($("sc079-streaks"), { seed: 79, speed: 0.95, xfreq: 0.15, lo: 0.44, hi: 0.86, gamma: 2.1, tint: [255, 196, 140], gain: 1.25 }));

      tl.fromTo("#seg06-sc079-glow", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1.06, duration: 8.16, ease: "sine.inOut" }, T(504.92));
      tl.fromTo("#seg06-sc079-stage", { scale: 1.0 }, { scale: 1.05, duration: 8.16, ease: "none" }, T(504.92));

      tl.fromTo(".seg06-sc079-stu", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.14, ease: C(0.45) }, T(511.08) - 0.04);

    // =====================================================================

    {

      FX.markup.circle(tl, marks, T(524.12) - 0.04, { cx: 425, cy: 660, rx: 225, ry: 245, rot: -8, color: "#e5482a", width: 9, filter: rough, dur: 0.6, seed: 81 });

      FX.markup.arrow(tl, marks, T(525.96) - 0.04, { x1: 640, y1: 610, x2: 1830, y2: 520, bend: -110, color: "#23415e", width: 9, head: 34, filter: rough, dur: 0.5 });
      tl.to("#seg06-sc081-mover", { x: 1700, y: -110, rotation: 6, duration: 0.65, ease: C(0.65, "power2.in") }, T(525.96) + 0.12);
      FX.text.rise(tl, [$("sc081-gone")], T(526.92) - 0.06, { dur: 0.35, y: 18, blur: 6 });
    }

    // =====================================================================
    // SC082 · 527.32–531.00 · GE Schenectady, around $100 a month
    // =====================================================================
    scene("sc082", T(527.32), T(531.00), "night");
    {
      tl.fromTo("#seg06-sc082-cam", { scale: 1.02, x: 0 }, { scale: 1.12, x: -30, duration: 3.68, ease: "none" }, T(527.32));
      tl.fromTo("#seg06-sc082-ge", { opacity: 0, scale: 0.85 }, { opacity: 0.9, scale: 1, duration: 0.35, ease: C(0.35), immediateRender: true }, T(528.12) - 0.1);

    // =====================================================================
    // SC083 · 531.00–536.92 · collage fork: Bill Hewlett — studies, or ... ?
    // =====================================================================
    scene("sc083", T(531.00), T(536.92), "paper");
    {
      const marks = $("sc083-marks");
      const rough = gate(T(531.00), T(536.92), () => FX.markupDefs(marks, "seg06-sc083-rough"));
      tl.fromTo("#seg06-sc083-hew", { x: 180, rotation: 3, opacity: 1 }, { x: 0, rotation: -3, duration: 0.3, ease: C(0.3) }, T(531.00));
      tl.fromTo("#seg06-sc083-htag", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, ease: C(0.25), immediateRender: true }, T(531.16) - 0.05);
      tl.fromTo("#seg06-sc083-board", { scale: 1.0 }, { scale: 1.03, duration: 5.5, ease: "none" }, T(531.00));
      // the fork grows ("planning on going to do something")
      FX.markup.arrow(tl, marks, T(533.24) - 0.05, { x1: 600, y1: 500, x2: 1215, y2: 290, bend: -70, color: "#18222f", width: 7, head: 30, filter: rough, dur: 0.6 });
      FX.markup.arrow(tl, marks, T(534.20) - 0.05, { x1: 600, y1: 520, x2: 1215, y2: 760, bend: 70, color: "#18222f", width: 7, head: 30, filter: rough, dur: 0.6 });
      // "next part in his studies"
      tl.fromTo("#seg06-sc083-uni", { y: -70, rotation: 7, opacity: 0 }, { y: 0, rotation: 2.5, opacity: 1, duration: 0.45, ease: C(0.45), immediateRender: true }, T(535.40) - 0.05);
      tl.fromTo("#seg06-sc083-utag", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.25, ease: C(0.25), immediateRender: true }, T(536.04) - 0.06);
      tl.fromTo("#seg06-sc083-blank", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: true }, T(534.20) + 0.5);
      // "... or take up a job" — camera follows the lower branch into the shutter
      tl.to("#seg06-sc083-board", { scale: 1.35, x: -60, y: -40, duration: 0.5, ease: "power2.in" }, T(536.68) - 0.26);
      iris.at(tl, T(536.92));
    }

    // =====================================================================
    // SC084 · 536.92–542.47 · shutter montage of Eastern companies (faster callback)
    // =====================================================================
    scene("sc084", T(536.92), T(542.47), "night");
    {
      gate(T(536.92), T(542.47), () => FX.weave($("sc084-weave"), { amp: 1.4, flicker: 0.035, seed: 84 }));
      const cuts = [T(536.92), T(538.92) - 0.3, T(540.36) - 0.04, T(541.56), T(542.47)];
      for (let k = 1; k <= 4; k++) {
        const a = cuts[k - 1], b = cuts[k];
        tl.set(`#seg06-sc084-sh${k}`, { opacity: 1 }, a);
        if (k < 4) tl.set(`#seg06-sc084-sh${k}`, { opacity: 0 }, b);
        if (k !== 2) tl.fromTo(`#seg06-sc084-sh${k} .plate`, { scale: 1.0 }, { scale: 1.08, duration: b - a + 0.25, ease: "none" }, a);
        if (k > 1) iris.at(tl, a);
      }
      tl.fromTo("#seg06-sc084-pano", { x: -300 }, { x: -1900, duration: cuts[2] - cuts[1] + 0.2, ease: "none" }, cuts[1]);
      FX.text.rise(tl, [$("sc084-job")], T(537.40) - 0.06, { dur: 0.5 });
      tl.set("#seg06-sc084-job", { opacity: 0 }, cuts[1]);
      iris.at(tl, T(542.47));
    }

    // =====================================================================
    // SC085 · 542.47–549.03 · R10 old Palo Alto map: the plan
    // =====================================================================
    scene("sc085", T(542.47), T(549.03), "paper");
    {
      const svg = $("sc085-route");
      const rough = gate(T(542.47), T(549.03), () => FX.markupDefs(svg, "seg06-sc085-rough"));
      svg.setAttribute("viewBox", "0 0 1500 1200");
      const cam = (cx, cy, z) => ({ x: 960 - cx * z, y: 540 - cy * z, scale: z });
      // Stanford Main Quad -> Palm Drive -> University Ave -> Waverley -> 367 Addison
      const route = "M542 842 L540 760 L541 690 L548 650 L578 575 L600 522 L622 478 L672 437 L721 397 L756 440 L790 481";
      const marker = drawPath(svg, route, { color: "#f2d33b", width: 20, filter: rough, blend: "multiply" }, T(545.35) + 0.15, 2.45, FX.choppy("none", 2.45, 12));
      tl.set("#seg06-sc085-cam", cam(720, 650, 1.35), T(542.47));
      tl.to("#seg06-sc085-cam", Object.assign(cam(560, 790, 1.55), { duration: 2.9, ease: "power2.inOut" }), T(542.47) + 0.1);
      tl.to("#seg06-sc085-cam", Object.assign(cam(612, 520, 1.7), { duration: 1.5, ease: "sine.inOut" }), T(545.35) + 0.15);
      tl.to("#seg06-sc085-cam", Object.assign(cam(760, 470, 1.85), { duration: 1.1, ease: "sine.inOut" }), T(546.87) + 0.1);
      const ring = FX.markup.circle(tl, svg, T(548.15) - 0.06, { cx: 790, cy: 470, rx: 52, ry: 46, rot: -10, color: "#f2d33b", width: 9, filter: rough, dur: 0.4, seed: 85 });
      ring.style.mixBlendMode = "multiply";
      tl.fromTo("#seg06-sc085-pin", { scale: 0, y: -30 }, { scale: 1, y: 0, duration: 0.3, ease: C(0.3, "back.out(3)"), immediateRender: true }, T(548.15) - 0.04);
      // "THE PLAN" kicker, "a company"
      tl.fromTo("#seg06-sc085-kick", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, ease: C(0.25), immediateRender: true }, T(544.39) - 0.06);
      FX.text.rise(tl, [$("sc085-co")], T(548.15) - 0.06, { dur: 0.4, y: 16, blur: 6 });
      tl.to("#seg06-sc085-kick, #seg06-sc085-co", { opacity: 0, duration: 0.2 }, T(548.79) + 0.05);
      // dive into the pin -> the garage world
      tl.to("#seg06-sc085-cam", Object.assign(cam(790, 470, 6.0), { duration: 0.32, ease: "expo.in" }), T(548.79) - 0.08);
      tl.to("#seg06-sc085-stage", { filter: "blur(10px)", duration: 0.16, ease: "power1.in" }, T(549.03) - 0.16);
    }

    // =====================================================================
    // SC086 · 549.03–556.31 · 2.5D garage (approved s10, re-timed)
    // =====================================================================
    scene("sc086", T(549.03), T(556.31), "night");
    {
      const choke = gate(T(549.03), T(556.31), () => FX.roughDefs(defs, "seg06-choke86", { freq: 0.03, scale: 6, choke: 0 }));
      const P = 1200;
      [["#seg06-sc086-L0", -900], ["#seg06-sc086-L1", -420], ["#seg06-sc086-Lh", -200], ["#seg06-sc086-L2", 0], ["#seg06-sc086-L3", 320]].forEach(([sel, z]) =>
        gsap.set(sel, { z, scale: (P - z) / P }));
      const d = 7.28;
      tl.fromTo("#seg06-sc086-stage", { scale: 1.14, filter: "blur(9px)" }, { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, T(549.03));
      tl.fromTo("#seg06-sc086-rays", { opacity: 0.35, x: 0 }, { opacity: 0.6, x: -80, duration: d, ease: "none" }, T(549.03));
      tl.fromTo("#seg06-sc086-world", { x: 150, z: -80, rotationY: -3 }, { x: -150, z: 150, rotationY: 3, duration: d, ease: "sine.inOut" }, T(549.03));
      // "here in California, in Palo Alto" — title tucked behind the roof
      FX.text.random(tl, $("sc086-ca"), T(549.03) - 0.04, { dur: 0.45, seed: 86 });
      tl.fromTo("#seg06-sc086-pa", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(549.91) - 0.06);
      FX.choke(tl, choke, T(549.91) - 0.06, 18, 0.6);
    }

    // =====================================================================
    // SC087 · 556.31–561.59 · Hewlett's thesis title page + highlighter
    // =====================================================================
    scene("sc087", T(556.31), T(561.59), "paper");
    {
      const cam = (cx, cy, z, sx) => ({ x: (sx || 760) - cx * z, y: 540 - cy * z, scale: z });
      tl.fromTo("#seg06-sc087-cam", cam(425, 560, 0.86), Object.assign(cam(425, 470, 0.98), { duration: 4.0, ease: "sine.inOut" }), T(556.31));
      tl.fromTo("#seg06-sc087-page", { y: 140, rotationX: 16, rotationY: -12, rotation: -5, transformPerspective: 2400 },
        { y: 0, rotationX: 7, rotationY: -6, rotation: -2.5, duration: 4.5, ease: "power2.out" }, T(556.31));
      tl.fromTo("#seg06-sc087-bg", { x: 0 }, { x: -50, duration: 5.3, ease: "none" }, T(556.31));
      tl.fromTo("#seg06-sc087-tag", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.25, ease: C(0.25), immediateRender: true }, T(560.31) - 0.06);
      tl.fromTo("#seg06-sc087-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: C(0.45, "power2.inOut"), immediateRender: true }, T(561.11) - 0.12);
      // push into "Oscillator"
      tl.to("#seg06-sc087-tag", { opacity: 0, duration: 0.15 }, T(561.11) + 0.15);
      tl.to("#seg06-sc087-cam", Object.assign(cam(427, 376, 2.6, 960), { duration: 0.42, ease: "expo.in" }), T(561.11) + 0.06);
    }

    // =====================================================================
    // SC088 · 561.59–567.03 · HP 200A audio oscillator, HQ photo + circle
    // =====================================================================
    scene("sc088", T(561.59), T(567.03), "night");
    {
      const marks = $("sc088-marks");
      const rough = gate(T(561.59), T(567.03), () => FX.markupDefs(marks, "seg06-sc088-rough"));
      tl.fromTo("#seg06-sc088-cam", { scale: 1.16 }, { scale: 1.0, duration: 0.5, ease: "expo.out" }, T(561.59));
      tl.to("#seg06-sc088-cam", { scale: 1.2, duration: 4.94, ease: "sine.inOut" }, T(561.59) + 0.5);
      FX.text.odometer(tl, $("sc088-name"), T(563.43) - 0.06, { dur: 0.6, stagger: 0.03, spins: 5, seed: 88 });
      FX.markup.circle(tl, marks, T(565.27) - 0.04, { cx: 930, cy: 588, rx: 250, ry: 232, rot: -6, color: "#e5482a", width: 9, filter: rough, dur: 0.55, seed: 88 });
    }

    // =====================================================================
    // SC089 · 567.03–573.91 · signal diagram: oscillator -> audio equipment makers
    // =====================================================================
    scene("sc089", T(567.03), T(573.91), "paper");
    {
      const marks = $("sc089-marks");
      const rough = gate(T(567.03), T(573.91), () => FX.markupDefs(marks, "seg06-sc089-rough"));
      tl.fromTo("#seg06-sc089-n1", { scale: 0.55, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.35, ease: C(0.35, "back.out(2)"), immediateRender: true }, T(567.03));
      tl.fromTo("#seg06-sc089-l1", { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: true }, T(567.03) + 0.2);
      FX.markup.arrow(tl, marks, T(567.27), { x1: 660, y1: 520, x2: 1262, y2: 520, bend: 0.01, color: "#18222f", width: 7, head: 28, filter: rough, dur: 0.6 });
      tl.fromTo("#seg06-sc089-n2", { scale: 0, rotation: 8 }, { scale: 1, rotation: 0, duration: 0.35, ease: C(0.35, "back.out(2)"), immediateRender: true }, T(567.99) - 0.1);
      tl.fromTo("#seg06-sc089-l2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: C(0.25), immediateRender: true }, T(567.99) - 0.06);
      FX.text.rise(tl, [$("sc089-cons")], T(571.67) - 0.06, { dur: 0.55 });
      // a clean sine wave runs along the signal line
      let d = "M680 520";
      for (let x = 680; x <= 1236; x += 4) d += ` L${x} ${(520 - 46 * Math.sin(((x - 680) / 556) * Math.PI * 2 * 4)).toFixed(1)}`;
      drawPath(marks, d, { color: "#e5482a", width: 6, filter: rough }, T(572.31) - 0.02, 1.5, FX.choppy("none", 1.5, 12));
    }

    // =====================================================================
    // SC090 · 573.91–578.79 · 1940 sound testing footage, weave + sine overlay
    // =====================================================================
    scene("sc090", T(573.91), T(578.79), "night");
    {
      const a = T(573.91), b = T(578.79), wob0 = T(574.87) + 0.43, clean = T(577.75);
      const sine = $("sc090-sine");
      gate(a, b, () => {
        FX.weave($("sc090-weave"), { amp: 1.8, flicker: 0.05, seed: 90 });
        FX.onFrame((t) => {
          const k = t - a;
          const wob = t < wob0 ? 0.15 : t < clean ? 1 : 0;
          let dd = "";
          for (let x = 0; x <= 1920; x += 8) {
            const ph = (x / 1920) * Math.PI * 2 * 5 - k * 6;
            const amp = 48 * (1 + wob * (FX.noise2(x * 0.004, k * 3, 90) - 0.5) * 1.8);
            const jit = wob * (FX.noise2(x * 0.05, k * 12, 91) - 0.5) * 26;
            dd += (x ? " L" : "M") + x + " " + (300 - amp * Math.sin(ph + wob * 2 * FX.noise2(x * 0.01, k, 92)) + jit).toFixed(1);
          }
          sine.setAttribute("d", dd);
        });
      });
      tl.fromTo("#seg06-sc090-wave", { opacity: 0 }, { opacity: 0.75, duration: 0.5 }, a + 0.2);
      tl.fromTo("#seg06-sc090-test", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.25, ease: C(0.25), immediateRender: true }, T(573.91));
      tl.to("#seg06-sc090-test", { opacity: 0.4, duration: 0.3 }, T(577.75) - 0.2);
      FX.text.rise(tl, [$("sc090-good")], T(577.75) - 0.06, { dur: 0.5 });
      tl.fromTo("#seg06-sc090-wave", { scale: 1 }, { scale: 1.02, duration: 0.12, yoyo: true, repeat: 1 }, clean);
    }

    // =====================================================================
    // SC091 · 578.79–588.15 · collage: thesis -> product -> commercialize
    // =====================================================================
    scene("sc091", T(578.79), T(588.15), "paper");
    {
      const marks = $("sc091-marks");
      const rough = gate(T(578.79), T(588.15), () => FX.markupDefs(marks, "seg06-sc091-rough"));
      // own-made price tag card: blank tag with a "$"
      const tag = $("sc091-c");
      tag.innerHTML = `<g filter="url(#seg06-rough)">
          <path d="M40 90 L165 20 L290 90 L290 400 L40 400 Z" fill="#f3ecdc" stroke="#18222f" stroke-width="6" stroke-linejoin="round"/>
          <circle cx="165" cy="80" r="16" fill="none" stroke="#18222f" stroke-width="6"/>
          <path d="M165 64 C150 20 120 0 90 4" fill="none" stroke="#18222f" stroke-width="4"/>
          <text x="165" y="320" text-anchor="middle" class="t-display" font-size="230" fill="#18222f">$</text>
        </g>`;
      tl.fromTo("#seg06-sc091-board", { scale: 1.0 }, { scale: 1.035, duration: 9.36, ease: "none" }, T(578.79));
      tl.fromTo("#seg06-sc091-a", { y: 80, rotation: -9, opacity: 1 }, { y: 0, rotation: -3.5, opacity: 1, duration: 0.45, ease: C(0.45), immediateRender: true }, T(578.79));
      tl.fromTo("#seg06-sc091-ptag", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, ease: C(0.25), immediateRender: true }, T(580.39) - 0.06);
      tl.fromTo("#seg06-sc091-thesis", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: C(0.3), immediateRender: true }, T(581.27) - 0.06);
      // "do an idea, something similar"
      FX.markup.arrow(tl, marks, T(583.11) - 0.1, { x1: 528, y1: 380, x2: 664, y2: 400, bend: -40, color: "#18222f", width: 6, head: 26, filter: rough, dur: 0.4 });
      tl.fromTo("#seg06-sc091-b", { y: -70, rotation: 8, opacity: 0 }, { y: 0, rotation: 2, opacity: 1, duration: 0.45, ease: C(0.45), immediateRender: true }, T(583.11) + 0.2);
      // "commercialize"
      FX.markup.arrow(tl, marks, T(585.03) - 0.25, { x1: 1240, y1: 400, x2: 1385, y2: 392, bend: -40, color: "#18222f", width: 6, head: 26, filter: rough, dur: 0.35 });
      tl.fromTo("#seg06-sc091-c", { scale: 0.6, rotation: -14, opacity: 0 }, { scale: 1, rotation: -4, opacity: 1, duration: 0.35, ease: C(0.35, "back.out(2)"), immediateRender: true }, T(585.03) - 0.06);
      tl.fromTo("#seg06-sc091-comm", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(585.03) - 0.06);
      FX.text.fill(tl, $("sc091-comm"), T(585.03) - 0.06, { per: 0.03, hold: 0.3, settle: 0.5, cool: "#18222f" });
      FX.text.rise(tl, [$("sc091-res")], T(587.27) - 0.06, { dur: 0.5 });
      // the $ tag flips -> banknotes
      tl.to("#seg06-sc091-c", { rotationY: 90, transformPerspective: 1200, duration: 0.25, ease: "power2.in" }, T(587.75) + 0.15);
    }

    // =====================================================================
    // SC092 · 588.15–594.15 · banknotes rise, MONEY chokes in
    // =====================================================================
    scene("sc092", T(588.15), T(594.15), "night");
    {
      const choke = gate(T(588.15), T(594.15), () => {
        FX.streaks($("sc092-streaks"), { seed: 92, speed: 0.4, xfreq: 0.13, lo: 0.5, hi: 0.9, gamma: 2.4, tint: [255, 214, 170], gain: 1.0 });
        return FX.roughDefs(defs, "seg06-choke92", { freq: 0.05, scale: 5, choke: 0 });
      });
      const notes = [["n1", 260, -340, -8, -4], ["n2", 300, -380, 7, 3], ["n3", 160, -220, 5, 9], ["n4", 180, -240, -6, -10]];
      notes.forEach(([n, y0, y1, r0, r1]) => tl.fromTo(`#seg06-sc092-${n}`, { y: y0, rotation: r0 }, { y: y1, rotation: r1, duration: 6.0, ease: FX.choppy("none", 6.0, 12) }, T(588.15)));
      tl.fromTo("#seg06-sc092-dim", { opacity: 0.4 }, { opacity: 1, duration: 0.8 }, T(591.59) - 0.8);
      tl.fromTo("#seg06-sc092-money", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(591.59) - 0.06);
      FX.choke(tl, choke, T(591.59) - 0.06, 16, 0.6);
      FX.text.rise(tl, [$("sc092-off")], T(592.47) - 0.06, { dur: 0.6 });
      // a note flips over -> the fellowship letter
      tl.to("#seg06-sc092-n2", { rotationY: 90, transformPerspective: 1400, duration: 0.3, ease: "power2.in" }, T(593.67) + 0.15);
    }

    // =====================================================================
    // SC093 · 594.15–598.87 · fellowship letter, random letters + underline
    // =====================================================================
    scene("sc093", T(594.15), T(598.87) + 0.55, "paper");
    {
      const marks = $("sc093-marks");
      const rough = gate(T(594.15), T(598.87) + 0.55, () => FX.markupDefs(marks, "seg06-sc093-rough"));
      tl.fromTo("#seg06-sc093-letter", { rotationY: -80, transformPerspective: 1400, x: 120 }, { rotationY: 0, x: 0, duration: 0.4, ease: C(0.4) }, T(594.15));
      tl.fromTo("#seg06-sc093-pin", { scale: 0 }, { scale: 1, duration: 0.2, ease: C(0.2, "back.out(3)"), immediateRender: true }, T(594.15) + 0.35);
      tl.fromTo("#seg06-sc093-ph1, #seg06-sc093-ph2, #seg06-sc093-clip", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.12, ease: C(0.3), immediateRender: true }, T(594.15) + 0.45);
      tl.fromTo("#seg06-sc093-board", { scale: 1.0 }, { scale: 1.06, duration: 5.3, ease: "none" }, T(594.15));
      FX.text.random(tl, $("sc093-fel"), T(594.71) - 0.06, { dur: 0.6, seed: 93 });
      FX.text.rise(tl, [$("sc093-makes")], T(597.27) - 0.06, { dur: 0.55 });
      FX.markup.underline(tl, marks, T(598.23) - 0.06, { x1: 960, x2: 1780, y: 572, color: "#e5482a", width: 10, filter: rough, dur: 0.4 });
    }

    // =====================================================================
    // SC094 · 598.87–600.00 · dissolve to the garage, light leak, fade to black
    // =====================================================================
    {
      const a = T(598.87);
      tl.set($("sc094"), { display: "block", visibility: "visible" }, a);
      tl.fromTo($("sc094"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.inOut", immediateRender: false }, a);
      tl.set($("grain"), { opacity: 0.4 }, a + 0.45);
      tl.set($("dust"), { opacity: 0.5 }, a + 0.45);
      document.querySelectorAll("#seg06-sc094-world > .seg06-g-layer").forEach((el, i) => { const z = [-900, -200, 0, 320][i]; gsap.set(el, { z, scale: (1200 - z) / 1200 }); });
      gate(a, DURATION, () => FX.weave($("sc094-flick"), { amp: 0.8, flicker: 0.07, seed: 94 }));
      tl.fromTo("#seg06-sc094-world", { x: -150, z: 150, rotationY: 3, scale: 1.0 }, { x: -175, z: 185, rotationY: 3.4, scale: 1.0, duration: DURATION - a, ease: "none" }, a);
      tl.fromTo("#seg06-sc094-leak", { opacity: 0, x: -80 }, { opacity: 0.38, x: 40, duration: DURATION - a, ease: "sine.inOut" }, a);
      tl.fromTo("#seg06-black", { opacity: 0 }, { opacity: 1, duration: DURATION - T(599.43) - 0.06, ease: "power1.inOut" }, T(599.43));
    }

    // scenes stay out of the render tree outside their windows (built while laid out, hidden now)
    gsap.set(".seg06-scene", { display: "none" });
    FX.mount(tl, DURATION);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
