          tl.fromTo(st, { r: 0 }, { r: R, duration: open, ease: "power2.out", onUpdate: draw, immediateRender: false }, tMid + hold / 2);

      tl.fromTo("#seg02-sc032-cam", cam(3150, 1560, 0.31), Object.assign(cam(3250, 1420, 0.345), { duration: 5.2, ease: "sine.inOut" }), S(186.25));

      tl.fromTo("#seg02-sc032-west", { opacity: 0.2 }, { opacity: 0.6, duration: 1.0, ease: "power1.inOut" }, S(189.9));
      tl.fromTo("#seg02-sc032-bd", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(188.45));
      FX.choke(tl, choke32, T(188.45), 12, 0.5);
      tl.fromTo("#seg02-sc032-wus", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: C(0.35) }, T(190.21));

      const mx = (y) => { const i = Math.max(0, Math.min(missX.length - 2, Math.floor(y / 100))); const f = y / 100 - i; return missX[i] + (missX[i + 1] - missX[i]) * f; };
      const g = $("sc032-dots"), rnd = FX.rng(3201), dots = [];

      FX.onFrame((t) => {
        if (!win(186.25, 191.39)(t)) return;

          if (u <= 0) { d.c.setAttribute("opacity", 0); return; }
          const k = Math.min(1, u), e = 1 - Math.pow(1 - k, 2);
          const x = (1 - e) * (1 - e) * d.x0 + 2 * (1 - e) * e * d.cx + e * e * d.x1, y = (1 - e) * (1 - e) * d.y0 + 2 * (1 - e) * e * d.cy + e * e * d.y1;

          d.c.setAttribute("stroke", east ? "#a9c8de" : "rgba(244,238,226,0.35)");

    scene("sc033", 191.39, 199.07);

    (function () {

      // placeholders appear, rows fill vermilion on "smart people"

      const A = movers.filter((o) => o.r < 3), B = movers.filter((o) => o.r >= 3);
      const slot = (list, x0) => list.forEach((o, k) => { o.tx = x0 + (k % 5) * 66; o.ty = 360 + Math.floor(k / 5) * 72; });
      slot(A, 1110); slot(B, 1500);
      const plan = (list, t0) => list.forEach((o) => { o.t0 = t0 + o.r % 3 * 0.32 + (9 - o.c) * 0.035; o.dur = 1.0; });
      plan(A, S(194.91)); plan(B, S(196.55));
      const ease = gsap.parseEase("power2.inOut");
      FX.onFrame((t) => {
        if (!win(191.39, 199.07)(t)) return;
        const tt = Math.floor(t * 12) / 12;
        movers.forEach((o) => {
          const u = Math.max(0, Math.min(1, (tt - o.t0) / o.dur)), e = ease(u);
          const x = o.x + (o.tx - o.x) * e, y = o.y + (o.ty - o.y) * e - Math.sin(e * Math.PI) * 40;
          o.d.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
          const east = x + 28 > 1005;
          o.d.querySelector(".n").style.opacity = east ? 1 : 0;
        });
      });
      tl.fromTo("#seg02-sc033-h1", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.25, ease: C(0.25) }, T(196.21));
      tl.fromTo("#seg02-sc033-h2", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.25, ease: C(0.25) }, T(198.05));
      // the one that stayed: zoom into it
      const k = icons[KEEP];
      tl.to("#seg02-sc033-stage", { scale: 7, transformOrigin: `${k.x + 28}px ${k.y + 28}px`, duration: 0.5, ease: C(0.5, "power3.in") }, S(198.57));
    })();

    /* =================== SC034 · 199.07–206.27 Hoover 1928 → Stanford today =================== */
    scene("sc034", 199.07, SEG_END);
    ground("night", S(199.07));
    FX.weave($("sc034-weave"), { amp: 1.2, flicker: 0.03, seed: 3401, from: S(199.0), to: S(204.0) });
    tl.fromTo("#seg02-sc034-a .plate", { scale: 1.0 }, { scale: 1.06, duration: 5.0, ease: "none" }, S(199.07));
    tl.fromTo("#seg02-sc034-a", { opacity: 0 }, { opacity: 1, duration: 0.3 }, S(199.07));
    tl.set("#seg02-sc034-b", { opacity: 0 }, S(199.07));
