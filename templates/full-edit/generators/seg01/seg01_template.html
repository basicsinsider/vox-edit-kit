      <div id="seg01-cr-c" class="s1-credit t-label">Photo: Paul Sableman, CC BY 2.0 · Basemap: NASA Blue Marble · Terrain: Mapzen (SRTM/USGS)</div>
      <div id="seg01-cr-d" class="s1-credit ink t-label">Apple: robin_24, CC BY 2.0 · Orange: freestock.ca, CC BY-SA 3.0</div>

    <audio id="seg01-vo" class="temp-vo" src="vo10.mp3" data-start="0" data-duration="100.25" data-media-start="0" data-volume="1"></audio>
  </div>
  <script>
  (function () {
    const SEG = "seg01", SEG_START = 0, SEG_END = 100.25, DURATION = +(SEG_END - SEG_START).toFixed(2);
    const T = (s) => +(s - SEG_START).toFixed(3);   // TEXT cues (audited by tools/sync_audit.py): word start - 0.06
    const S = (s) => +(s - SEG_START).toFixed(3);   // structural cues (camera, exits, transitions) — also VO seconds
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    // 12 fps "posterize time"; ceil-stepped so the first step lands on the cue frame (text never appears late)
    const C = (d, e) => { const f = gsap.parseEase(e || "power3.out"), n = Math.max(1, Math.round(d * 12)); return (t) => (t >= 1 ? 1 : t <= 0 ? 0 : f(Math.ceil(t * n) / n)); };
    const defs = $("seg01-defs");
    // gate FX helpers that register per-frame work to a time window (keeps 17 scenes cheap)
    const gated = (a, b, build) => {
      const orig = FX.onFrame;
      FX.onFrame = (fn) => orig((t) => { if (typeof a === "function" ? a(t) : (t >= a && t <= b)) fn(t); });
      try { return build(); } finally { FX.onFrame = orig; }
    };
    const on = (a, b, fn) => FX.onFrame((t) => { if (t >= a && t <= b) fn(t); });
    const scene = (id, a, b) => {
      const el = $(id);
      gsap.set(el, { autoAlpha: 0 });
      tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.001, immediateRender: false }, a);
      tl.to(el, { autoAlpha: 0, duration: 0.001 }, b);
    };
    const pop = (sel, t) => tl.fromTo(sel, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.001, immediateRender: false }, t);
    const hide = (sel, t, d) => tl.to(sel, { autoAlpha: 0, duration: d || 0.001 }, t);

    // ---------------- shared defs ----------------
    FX.tintDefs(defs, "seg01-tint-vox", "#1a1917", "#8a8377");
    FX.tintDefs(defs, "seg01-tint-sep", "#141312", "#8d7f6b");
    FX.tintDefs(defs, "seg01-tint-apple", "#c23a20", "#f3ecdc");
    FX.tintDefs(defs, "seg01-tint-orange", "#1d3550", "#f3ecdc");
    FX.tintDefs(defs, "seg01-tint-sepia", "#2a2622", "#ede3cf");
    FX.tintDefs(defs, "seg01-tint-tv", "#121110", "#5c564d");
    gated(S(51.0), S(54.5), () => FX.roughDefs(defs, "seg01-rough-card", { freq: 0.04, scale: 6 }));
    gated(S(63.0), S(64.2), () => FX.roughDefs(defs, "seg01-rough-stamp", { freq: 0.05, scale: 5 }));
    gated(S(84.4), S(93.6), () => FX.roughDefs(defs, "seg01-rough-ticket", { freq: 0.03, scale: 7 }));
    const chokeScarce = gated(S(81), S(84.5), () => FX.roughDefs(defs, "seg01-choke-scarce", { freq: 0.05, scale: 5, choke: 0 }));
    const chokeS1 = gated(S(89.5), S(93.6), () => FX.roughDefs(defs, "seg01-choke-s1", { freq: 0.05, scale: 4, choke: 0 }));
    const chokeS2 = gated(S(92.5), S(93.6), () => FX.roughDefs(defs, "seg01-choke-s2", { freq: 0.05, scale: 4, choke: 0 }));

    // ---------------- texture stack by ground ----------------
    FX.grain($("seg01-grain"), 101);
    FX.dust($("seg01-dust"), 102, 2);
    const NIGHT = { g: 0.38, d: 0.42, v: 1, p: 0, f: 0 }, PAPER = { g: 0.25, d: 0.0, v: 0, p: 0.55, f: 0.5 };
    const grounds = [[0, NIGHT], [13.2, PAPER], [17.52, NIGHT], [21.6, PAPER], [32.88, NIGHT], [46.3, PAPER], [54.48, NIGHT], [58.6, PAPER],
      [69.77, NIGHT], [84.49, PAPER], [100.25, PAPER]];
    gsap.set("#seg01-grain", { opacity: NIGHT.g }); gsap.set("#seg01-dust", { opacity: NIGHT.d }); gsap.set("#seg01-vig", { opacity: 1 });
    gsap.set("#seg01-ptex", { opacity: 0 }); gsap.set("#seg01-folds", { opacity: 0 });
    grounds.forEach(([t, g], i) => {
      if (!i) return;
      tl.set("#seg01-grain", { opacity: g.g }, S(t)); tl.set("#seg01-dust", { opacity: g.d }, S(t)); tl.set("#seg01-vig", { opacity: g.v }, S(t));
      tl.set("#seg01-ptex", { opacity: g.p }, S(t)); tl.set("#seg01-folds", { opacity: g.f }, S(t));
    });
    // SC004 / SC012 sheets carry their own paper texture while they slide; the global paper layer waits for them to land
    tl.set("#seg01-ptex, #seg01-folds", { opacity: 0 }, S(58.6)); tl.set("#seg01-ptex", { opacity: 0.55 }, S(58.82)); tl.set("#seg01-folds", { opacity: 0.5 }, S(58.82));
    tl.set("#seg01-ptex, #seg01-folds", { opacity: 0 }, S(13.2));
    const credit = (id, a, b) => { tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, a); tl.to("#" + id, { opacity: 0, duration: 0.001 }, b); };

    // ================= SC001 + SC002 + SC005 streaks (one canvas, two windows) =================
    gated((t) => (t >= 0 && t <= S(8.4)) || (t >= S(17.4) && t <= S(21.8)), 0, () =>
      FX.streaks($("seg01-streaks"), { seed: 21, speed: 0.45, xfreq: 0.17, lo: 0.47, hi: 0.86, gamma: 2.3, tint: [255, 214, 178], gain: 1.15 }));
    tl.fromTo("#seg01-streaks", { opacity: 0, y: 0 }, { opacity: 0.38, y: -30, duration: 4.0, ease: "power1.out" }, 0);
    tl.to("#seg01-streaks", { opacity: 0.55, y: -60, duration: 3.8, ease: "none" }, S(4.32));
    tl.to("#seg01-streaks", { opacity: 0, duration: 0.3 }, S(8.0));
    tl.fromTo("#seg01-streaks", { opacity: 0 }, { opacity: 0.7, y: 0, duration: 1.2, ease: "power2.out", immediateRender: false }, S(17.52));
    tl.to("#seg01-streaks", { opacity: 0, duration: 0.2 }, S(21.6));

    // ================= SC001 · 0.00–4.32 =================
    scene("seg01-sc001", 0, S(4.4));
    tl.fromTo("#seg01-sc001-leak", { opacity: 0, scale: 1.0 }, { opacity: 0.15, scale: 1.06, duration: 1.2, ease: "sine.inOut" }, S(1.9));
    tl.to("#seg01-sc001-leak", { opacity: 0, duration: 1.4, ease: "sine.inOut" }, S(3.1));

    // ================= SC002 · 4.32–8.16 · SILICON VALLEY =================
    scene("seg01-sc002", S(4.2), S(8.2));
    scene("seg01-sc003", S(4.2), S(13.2));
    // the aerial starts as SC002's full-frame background, then becomes panel 1 of SC003
    gsap.set("#seg01-sc003-p1", { x: -570, y: 160, scale: 2.2, rotation: 0, opacity: 0 });
    gsap.set("#seg01-sc003-p1b", { filter: "blur(8px)" });
    tl.fromTo("#seg01-sc003-p1", { opacity: 0 }, { opacity: 0.35, duration: 0.6, ease: "power1.out", immediateRender: false }, S(4.25));
    tl.fromTo("#seg01-sc003-p1", { scale: 2.2 }, { scale: 2.33, duration: 3.6, ease: "none", immediateRender: false }, S(4.25));
    FX.text.random(tl, $("seg01-sc002-w1"), T(4.26), { dur: 0.6, seed: 3 });
    FX.text.random(tl, $("seg01-sc002-w2"), T(5.06), { dur: 0.5, seed: 8 });
    tl.fromTo("#seg01-sc002-title", { scale: 1 }, { scale: 1.04, duration: 3.6, ease: "none" }, S(4.3));
    tl.to("#seg01-sc002-title", { opacity: 0, y: -90, filter: "blur(12px)", duration: 0.4, ease: "power2.in" }, S(7.78));
    tl.to("#seg01-sc003-p1", { x: 0, y: 0, scale: 1, rotation: 3, opacity: 1, duration: 0.5, ease: "power3.inOut" }, S(7.85));
    tl.to("#seg01-sc003-p1b", { filter: "blur(0px)", duration: 0.5, ease: "power2.inOut" }, S(7.85));
    tl.to("#seg01-sc003-p1s", { opacity: 0, duration: 0.5 }, S(7.85));
    tl.to("#seg01-sc003-p1v", { opacity: 1, duration: 0.5 }, S(7.85));

    // ================= SC003 · 8.16–13.20 · Vox layered backgrounds =================
    credit("seg01-cr-a", S(4.3), S(13.2));
    tl.fromTo("#seg01-sc003-base", { opacity: 0 }, { opacity: 0.8, duration: 0.4, immediateRender: false }, S(7.95));
    tl.fromTo("#seg01-sc003-news", { opacity: 0 }, { opacity: 0.45, duration: 0.4, immediateRender: false }, S(7.95));
    tl.fromTo("#seg01-sc003-p2", { x: -700, rotation: -8, opacity: 0 }, { x: 0, rotation: -3, opacity: 1, duration: 0.45, ease: C(0.45), immediateRender: true }, S(8.12));
    tl.fromTo("#seg01-sc003-p3", { y: -560, rotation: 4, opacity: 0 }, { y: 0, rotation: -2, opacity: 1, duration: 0.45, ease: C(0.45), immediateRender: true }, S(9.55));
    // each layer drifts at its own speed (camera drifts right)
    tl.fromTo("#seg01-sc003-base", { x: 0 }, { x: -60, duration: 5.2, ease: "none" }, S(8.0));
    tl.to("#seg01-sc003-p1", { x: -150, y: 12, duration: 4.9, ease: "none" }, S(8.35));
    tl.fromTo("#seg01-sc003-p2 .im", { x: 0 }, { x: -40, duration: 4.6, ease: "none" }, S(8.6));
    tl.to("#seg01-sc003-p2", { x: -110, duration: 4.6, ease: "none" }, S(8.6));
    tl.to("#seg01-sc003-p3", { x: -80, y: 6, duration: 3.6, ease: "none" }, S(10.0));
    tl.fromTo("#seg01-sc003-shade", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, S(7.95));
    FX.text.rise(tl, [$("seg01-sc003-pow")], T(8.10), { dur: 0.55, y: 22 });
    tl.to("#seg01-sc003-pow", { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, S(10.22));
    tl.fromTo("#seg01-sc003-suc", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(10.42));
    FX.text.fill(tl, $("seg01-sc003-suc"), T(10.42), { per: 0.03, hold: 0.3, settle: 0.5 });
    FX.text.random(tl, $("seg01-sc003-kick"), T(11.06), { dur: 0.5, seed: 33 });

    // ================= SC004 · 13.20–17.52 · STATS / NUMBERS (paper) =================
    scene("seg01-sc004", S(13.2), S(17.55));
    {
      const reels = $("seg01-sc004-reels"), r = FX.rng(404), cols = [];
      for (let i = 0; i < 14; i++) {
        const c = document.createElement("div");
        c.className = "s1-dcol t-display";
        c.style.left = 40 + i * 136 + "px";
        let s = ""; for (let k = 0; k < 18; k++) s += Math.floor(r() * 10) + "<br/>";
        c.innerHTML = s; reels.appendChild(c); cols.push([c, r()]);
      }
      cols.forEach(([c, k], i) => tl.fromTo(c, { y: -1500 - k * 600 }, { y: -150 * Math.floor(2 + k * 4), duration: 2.2 + k * 0.6, ease: C(2.2 + k * 0.6, "power2.out") }, S(14.6) + i * 0.04));
    }
    FX.text.odometer(tl, $("seg01-sc004-stats"), T(14.74), { dur: 0.7, stagger: 0.05, spins: 8, seed: 41 });
    FX.text.odometer(tl, $("seg01-sc004-nums"), T(15.86), { dur: 0.7, stagger: 0.045, spins: 8, seed: 42 });
    tl.fromTo("#seg01-sc004-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: C(0.6) }, S(16.35));
    tl.fromTo("#seg01-sc004-sheet", { y: 0 }, { y: -1100, duration: 0.33, ease: C(0.33, "power2.in"), immediateRender: false }, S(17.2));

    // ================= SC005 · 17.52–21.76 · October 2026 / 12 =================
    scene("seg01-sc005", S(17.2), S(21.8));
    tl.fromTo("#seg01-sc005-glow", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1.05, duration: 4.2, ease: "sine.inOut" }, S(17.4));
    FX.text.random(tl, $("seg01-sc005-date"), T(19.06), { dur: 0.55, seed: 3 });
    tl.fromTo("#seg01-sc005-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: C(0.6) }, S(19.4));
    gsap.set("#seg01-fly12", { x: 960, y: 560, scale: 1, opacity: 0 });
    tl.fromTo("#seg01-fly12", { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: false }, T(21.14));
    FX.text.count(tl, $("seg01-fly12"), T(21.14), 0, 12, 0.4, (v) => String(Math.round(v)));
    tl.to("#seg01-sc005-date, #seg01-sc005-rule", { opacity: 0, duration: 0.15 }, S(21.5));
    tl.to("#seg01-fly12", { x: 170, y: 126, scale: 0.19, duration: 0.3, ease: C(0.3, "power3.inOut") }, S(21.52));
    // 6-frame paper wipe from the bottom
    tl.fromTo("#seg01-sc006", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.25, ease: "power2.out", immediateRender: false }, S(21.55));

    // ================= SC006 · 21.76–32.88 · ranked bars =================
    scene("seg01-sc006", S(21.55), S(32.9));
    credit("seg01-cr-b", S(22.0), S(32.88));
    tl.fromTo("#seg01-sc006-kbox", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: C(0.2), immediateRender: true }, S(21.7));
    FX.text.fill(tl, $("seg01-sc006-k1"), T(21.70), { per: 0.03, hold: 0.25, settle: 0.4 });
    FX.text.rise(tl, [$("seg01-sc006-k2")], T(22.42), { dur: 0.5, y: 14, blur: 6 });
    tl.fromTo("#seg01-sc006-base", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: C(0.5) }, S(21.8));
    tl.fromTo("#seg01-sc006-src", { opacity: 0 }, { opacity: 1, duration: 0.3 }, S(22.0));
    tl.fromTo("#seg01-sc006-ghost", { y: 120, opacity: 0 }, { y: 0, opacity: 0.13, duration: 0.8, ease: C(0.8) }, S(22.0));
    const COMP = [["nvidia", 5.16], ["apple", 5.09], ["microsoft", 3.94], ["alphabet_google", 3.45], ["amazon", 2.63], ["spacex", 1.95],
      ["broadcom", 1.65], ["meta", 1.60], ["tesla", 1.59], ["lilly", 1.22], ["berkshire_hathaway", 1.16], ["micron", 1.06]];
    const HMAX = 560, BASE = 930, X0 = 200, DX = 106, lineH = HMAX / 5.16;
    const bars = [];
    COMP.forEach(([k, v], i) => {
      const col = document.createElement("div"); col.className = "s1-col"; col.style.left = X0 + i * DX + "px";
      const src = k === "lilly" ? "assets/maps/eli_lilly_logo.svg" : k === "amazon" ? "assets/seg01/logos/amazon_mark.svg" : `assets/logos/${k}.svg`;
      const wide = ["micron", "broadcom", "berkshire_hathaway", "lilly"].includes(k);
      col.innerHTML = `<div class="s1-bar${k === "lilly" ? " east" : ""}"></div><div class="s1-badge"><img src="${src}" alt=""${wide ? ' style="left:8px;width:74px"' : ""}/></div><div class="s1-rank t-label">${i + 1}</div>`;
      $("seg01-sc006-cols").appendChild(col);
      bars.push({ bar: col.children[0], badge: col.children[1], h: (HMAX * v) / 5.16, t0: S(22.0) + i * 0.08, i });
    });
    gsap.set(".s1-rank", { opacity: 0 });
    tl.fromTo(".s1-rank", { opacity: 0 }, { opacity: 1, duration: 0.001, stagger: 0.08, immediateRender: false }, S(22.0));
    $("seg01-sc006-line").style.top = BASE - lineH - 6 + "px";
    $("seg01-sc006-tbox").style.top = BASE - lineH - 86 + "px";
    const g13 = $("seg01-sc006-g13"); g13.style.left = X0 + 12 * DX + "px"; g13.style.height = lineH * 1.08 + "px";
    const rise = C(0.5, "power3.out"), dipE = gsap.parseEase("power2.inOut");
    on(S(21.5), S(32.9), (t) => {
      bars.forEach((b) => {
        const p = Math.max(0, Math.min(1, (t - b.t0) / 0.5));
        let h = b.h * (p > 0 ? rise(p) : 0);
        if (t >= S(27.28)) {   // the market "breathes" (12 fps)
          const f = Math.floor(t * 12);
          h *= 1 + (FX.noise1(f * 0.35, 600 + b.i) - 0.5) * 0.06;
        }
        if (b.i === 11) {      // Micron dips to touch the $1T line on "less", back on "more"
          const d = t < S(31.62) ? 0 : t < S(31.92) ? dipE((t - S(31.62)) / 0.3) : t < S(32.2) ? 1 : t < S(32.5) ? 1 - dipE((t - S(32.2)) / 0.3) : 0;
          h = h + (lineH - h) * d;
        }
        b.bar.style.height = h.toFixed(1) + "px";
        b.badge.style.transform = `translateY(${(-h + 40).toFixed(1)}px) scale(${p > 0 ? Math.min(1, 0.4 + rise(p) * 0.6) : 0})`;
      });
      // dashed ghost 13th bar flickers on "more"
      const f = Math.floor(t * 12);
      g13.style.opacity = t >= S(32.18) && t < S(32.75) && f % 2 === 0 ? 0.8 : 0;
    });
    tl.fromTo("#seg01-sc006-line", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: C(0.5), immediateRender: true }, S(24.2));
    tl.fromTo("#seg01-sc006-tbox", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.2, ease: C(0.2, "back.out(2)"), immediateRender: true }, T(24.26));
    FX.text.rise(tl, [$("seg01-sc006-changes")], T(27.22), { dur: 0.5, y: 14, blur: 6 });
    tl.to("#seg01-fly12", { scale: 0.26, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, T(29.54));
    // camera tilts down onto the baseline (becomes the Mississippi of SC007)
    tl.to("#seg01-sc006-stage", { scale: 1.7, y: -200, duration: 0.45, ease: "power2.in" }, S(32.45));
    tl.to("#seg01-fly12", { opacity: 0, duration: 0.15 }, S(32.5));

    // ================= SC007 · 32.88–41.52 · map (s02, retimed) =================
    scene("seg01-sc007", S(32.88), S(46.5));
    const cam = (cx, cy, z) => ({ x: 960 - cx * z, y: 540 - cy * z, scale: z });
