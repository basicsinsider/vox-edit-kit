  <script>
  (function () {
    const SEG = "c1s01", SEG_START = 0.00, SEG_END = 208.43, DURATION = +(SEG_END - SEG_START).toFixed(2);
    const T = (s) => +(s - 0.00).toFixed(3);   // TEXT cues (audited): literal word start − 0.06, LOCAL c1 seconds
    const S = (s) => +(s - 0.00).toFixed(3);   // STRUCTURAL cues (cuts, camera, objects)
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(SEG + "-" + id);
    const NS = "http://www.w3.org/2000/svg";
    const defs = $("defs");
    const E = FX.ease;
    const C = (e, d) => FX.choppy(e, d, 12);           // Vox long-tail ease, posterized to 12 fps
    const BONE = "#f2ede3", INK = "#141b24", NAVY = "#1d5c9e", SKY = "#9fc3e3", VER = "#e03f2c", YEL = "#f2d33b";

    function gated(a, b, fn) { const on = FX.onFrame; FX.onFrame = (f) => on(FX.gate(S(a) - 0.1, S(b) + 0.1, f)); try { return fn(); } finally { FX.onFrame = on; } }
    // scenes are display:none outside their window (keeps the render's heavy-overlay count low, MANUAL §4.4)
    const hideAtEnd = [];   // display:none is applied after every scene is built (odometers/fills measure text at build time)
    function scene(id, a, b) {
      if (a <= 0) gsap.set($(id), { autoAlpha: 1, display: "block" });
      else { hideAtEnd.push($(id)); tl.fromTo($(id), { autoAlpha: 0, display: "none" }, { autoAlpha: 1, display: "block", duration: 0.001, immediateRender: false }, S(a)); }
      if (b < SEG_END) tl.set($(id), { autoAlpha: 0, display: "none" }, S(b));
    }
    function ground(kind, t) {
      const v = kind === "paper" ? [0.32, 0.14, 0.26] : [1, 0.42, 0.36];
      if (t <= 0) gsap.set([$("vig"), $("dust"), $("grain")], { opacity: (i) => v[i] });
      else tl.set([$("vig"), $("dust"), $("grain")], { opacity: (i) => v[i] }, t);
    }
    const show = (el, t) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, t);
    const rise = (el, t, o) => { o = o || {}; const d = o.dur || 1.0;
      tl.fromTo(el, { opacity: 0, y: o.y == null ? 22 : o.y }, { opacity: 1, y: 0, duration: d, ease: C(E.out, d), immediateRender: true }, t); };
    const fade = (el, t, d) => tl.to(el, { opacity: 0, duration: d || 0.3, ease: "power1.in" }, t);
    // word-by-word: each child .c1-w rises on its own literal cue
    const words = (el, cues, o) => { const w = el.querySelectorAll(".c1-w"); cues.forEach((c, i) => rise(w[i], c, Object.assign({ dur: 0.45, y: 12 }, o))); };
    const whipN = { n: 0 };
    function whip(a, b, t, o) {
      o = Object.assign({ dir: 1, vertical: false, flash: false, dur: 0.32 }, o);
      const k = ++whipN.n, ba = FX.whipDefs(defs, `${SEG}-wa${k}`), bb = FX.whipDefs(defs, `${SEG}-wb${k}`), h = o.dur / 2;
      tl.set(a, { filter: `url(#${SEG}-wa${k})` }, t - h - 0.01); tl.set(a, { filter: "none" }, t + 0.06);
      tl.set(b, { filter: `url(#${SEG}-wb${k})` }, t - 0.001); tl.set(b, { filter: "none" }, t + h + 0.02);
      FX.whip(tl, a, b, t, { dir: o.dir, vertical: o.vertical, dur: o.dur, blurA: ba, blurB: bb });
      if (o.flash) tl.fromTo($("flash"), { opacity: 0 }, { opacity: 0.85, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, t - 0.08);
    }
    // push-through (PT): the outgoing shot rushes into the lens with a blur smear; the next shot cuts in at t
    function pushThrough(shot, t) {
      tl.fromTo(shot, { scale: 1, filter: "blur(0px)" }, { scale: 1.55, filter: "blur(10px)", duration: 0.26, ease: E.in, immediateRender: false }, t - 0.26);
    }
    function ink(parent, d, t, dur, o) {
      o = o || {};
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d); p.setAttribute("fill", o.fill || "none");
      p.setAttribute("stroke", o.color || INK); p.setAttribute("stroke-width", o.width || 6);
      p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
      if (o.filter) p.setAttribute("filter", o.filter);
      parent.appendChild(p);
      const len = p.getTotalLength() || 1;
      p.setAttribute("stroke-dasharray", `${len} ${len}`); p.setAttribute("stroke-dashoffset", len);
      tl.fromTo(p, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: o.ease || C(E.out, dur), immediateRender: true }, t);
      p._len = len; return p;
    }
    function stamp(el, t, morph, o) {
      o = o || {};
      show(el, t);
      tl.fromTo(el, { scale: o.from || 1.4 }, { scale: 1, duration: 0.25, ease: "power2.in", immediateRender: true }, t);
      FX.chokeSettle(tl, morph, el, t, 9, 0.5, "none");
    }

    // shared filters
    FX.tintDefs(defs, "c1s01-tint-bp", "#1f4f86", "#eef3f6");
    FX.tintDefs(defs, "c1s01-tint-ink", "#1b2230", "#ece4d2");
    FX.tintDefs(defs, "c1s01-tint-night", "#16181b", "#bdb5a6");
    FX.tintDefs(defs, "c1s01-tint-sep", "#24221f", "#ece3d0");
    FX.tintDefs(defs, "c1s01-tint-np", "#26231f", "#e8dfca");
    FX.tintDefs(defs, "c1s01-tint-pp", "#8a8172", "#efe7d5");
    FX.grain($("grain"), 1101);
    FX.dust($("dust"), 1102, 2);

    /* =================== C1S001 · 0.00–7.20 · the quote over the orchard painting (§10.7 A) =================== */
    scene("sc001", 0, 7.20);
    ground("night", 0);
    gsap.set($("flash"), { opacity: 1 });
    tl.fromTo($("flash"), { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "sine.out", immediateRender: false }, 0.001);   // hand-off: intro IS066's bone flash
    tl.fromTo($("sc001-cam"), { y: 0, scale: 1.0 }, { y: 120, scale: 1.04, duration: 7.0, ease: E.cam, immediateRender: true }, 0);
    words($("sc001-q"), [T(1.38), T(1.54), T(2.02), T(2.26), T(2.82), T(3.38), T(3.62), T(4.42), T(5.22), T(5.46), T(6.10), T(6.42)], { dur: 0.4, y: 10 });
    pushThrough($("sc001-shot"), S(7.20));

    /* =================== C1S002 · 7.20–12.96 · "the rest of the world looked awfully big … is here" (painted globe → valley) =================== */
    scene("sc002", 7.20, 12.96);
    (function () {
      tl.fromTo($("sc002-map"), { x: 140, y: -150 }, { x: -160, y: -160, duration: 1.7, ease: E.cam, immediateRender: true }, S(7.20));
      tl.fromTo($("sc002-a"), { scale: 0.9 }, { scale: 1.0, duration: 1.7, ease: E.cam, immediateRender: true }, S(7.20));
      tl.fromTo($("sc002-dot"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.6, ease: C(E.out, 0.6), immediateRender: true }, S(8.40));
      tl.set($("sc002-b"), { opacity: 0 }, S(7.20));
      const mid = FX.curveCut(tl, $("sc002-wrap"), $("sc002-a"), $("sc002-b"), S(9.00), 1.1, { from: 1, to: 6, ease: "expo.inOut" });
      tl.to($("sc002-wrap"), { scale: 7.0, duration: 12.96 - (mid + 0.55), ease: "none" }, mid + 0.55);
      FX.focusHunt(tl, $("sc002-bin"), S(10.35), { dur: 0.8 });
    })();
    words($("sc002-big"), [T(8.82), T(9.38)], { dur: 0.5 });
    fade($("sc002-big"), S(9.55), 0.15);
    words($("sc002-here"), [T(12.02), T(12.34)], { dur: 0.35, y: 14 });

    /* =================== C1S003 · 12.96–21.84 · "a quote from Fred Terman, the father of Silicon Valley … in 1974" (§10.7 B column) =================== */
    scene("sc003", 12.96, 22.00);
    ground("paper", S(12.96));
    (function () {
      const cam = $("sc003-cam");
      const at = (cx, cy, z) => ({ x: 960 - cx * z, y: 540 - cy * z, scale: z });
      // the printed picture fills the frame (continues the aerial), then the eased pull-back + upward pan reveals the column
      tl.fromTo(cam, at(560, 760, 2.05), Object.assign(at(930, 640, 0.74), { duration: 1.3, ease: E.cam, immediateRender: true }), S(12.96));
      tl.to(cam, Object.assign(at(1180, 790, 1.3), { duration: 1.6, ease: E.cam }), S(14.30));
      tl.to(cam, Object.assign(at(1175, 880, 1.34), { duration: 5.9, ease: "none" }), S(15.90));
      const mk = $("sc003-mk"), f = FX.markupDefs(mk, "c1s01-mk3", { boil: 4 }); mk.setAttribute("viewBox", "0 0 1920 1500");
      // pen underline per word (vermilion = Terman's Silicon Valley)
      const U = [[1136, 1258, 1134], [1240, 1440, 1134], [1452, 1520, 1134], [1136, 1380, 1201], [1392, 1640, 1201]];
      [S(15.90), S(16.06), S(16.54), S(16.78), S(17.58)].forEach((t, i) => {
        const [x1, x2, y] = U[i];
        FX.markup.pen(tl, mk, t, { points: [[x1, y], [x2, y + 3]], dur: 0.35, width: 6, color: VER, filter: f, seed: 30 + i, jitter: 3 });
      });
      const ch = FX.roughDefs(defs, "c1s01-ch3", { freq: 0.045, scale: 7, choke: 0 });
      $("sc003-stamp").style.filter = "url(#c1s01-ch3)";
      stamp($("sc003-stamp"), T(20.18), ch);
    })();
    words($("sc003-name"), [T(14.26), T(14.82)], { dur: 0.45, y: 8 });
    [T(15.86), T(16.02), T(16.50), T(16.74), T(17.54)].forEach((c, i) => rise($("sc003-w" + i), c, { dur: 0.4, y: 10 }));
    whip($("sc003-shot"), $("sc004-shot"), S(21.84), { dir: 1, vertical: true });

    /* =================== C1S004 · 21.84–28.88 · "one of the greatest human feat anyone has ever achieved" =================== */
    scene("sc004", 21.68, 28.88);
    ground("night", S(21.84));
    gated(21.7, 29.0, () => FX.streaks($("sc004-streaks"), { seed: 404, speed: 0.45, tint: [255, 196, 150], lo: 0.42, gain: 1.0 }));
    tl.fromTo($("sc004-streaks"), { opacity: 0 }, { opacity: 0.55, duration: 1.4, ease: "power1.out", immediateRender: true }, S(22.0));
    tl.fromTo($("sc004-cam"), { scale: 1.0 }, { scale: 1.07, duration: 6.7, ease: "none", immediateRender: true }, S(21.84));
    tl.to($("sc004-cam"), { scale: 1.16, duration: 0.3, ease: E.in }, S(28.58));
    tl.fromTo($("sc004-g"), { opacity: 0, scale: 1.08, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0.45px)", duration: 1.1, ease: C(E.out, 1.1), immediateRender: true }, T(24.66));
    words($("sc004-hf"), [T(25.54), T(26.10)], { dur: 0.6 });
    words($("sc004-ea"), [T(27.70), T(27.94)], { dur: 0.45, y: 8 });

    /* =================== C1S005 · 28.88–34.13 · "put claim to building the Silicon Valley" (blueprint drafting) =================== */
    scene("sc005", 28.88, 34.40);
    gsap.set($("sc005"), { zIndex: 3 });
    ground("paper", S(28.88));
    tl.fromTo($("sc005-plane"), { x: 0, rotationX: 10 }, { x: -60, rotationX: 7, duration: 5.3, ease: "none", immediateRender: true }, S(28.88));
    tl.fromTo($("sc005-terman"), { opacity: 0, x: -40 }, { opacity: 0.92, x: 0, duration: 1.4, ease: C(E.out, 1.4), immediateRender: true }, S(29.0));
    (function () {
      const svg = $("sc005-svg"), f = FX.markupDefs(svg, "c1s01-mk5", { boil: 4 }); svg.setAttribute("viewBox", "0 0 2160 1240");
      const L = (pts, t, d, s, w) => FX.markup.pen(tl, svg, t, { points: pts, dur: d, width: w || 3, color: "#eef3f6", filter: f, seed: s, jitter: 2, blend: "normal" });
      // construction lines: baselines, margins, a centre line and two compass arcs
      L([[880, 395], [2100, 398]], S(29.4), 1.0, 51); L([[880, 585], [2100, 588]], S(29.8), 1.0, 52);
      L([[880, 780], [2100, 783]], S(30.2), 1.0, 53); L([[905, 330], [902, 830]], S(30.6), 0.8, 54);
      L([[1980, 330], [1983, 830]], S(31.0), 0.8, 55); L([[880, 690], [2100, 692]], S(31.4), 1.0, 56);
      ink(svg, "M1500 860 A120 120 0 0 1 1740 860", S(31.8), 0.6, { color: "#eef3f6", width: 3, filter: f });
      ink(svg, "M1440 900 L1800 900 M1440 890 L1440 910 M1800 890 L1800 910", S(32.2), 0.6, { color: "#eef3f6", width: 3, filter: f });
    })();
    rise($("sc005-bld"), T(32.39), { dur: 0.5, y: 8 });
    (function () {
      const ch1 = FX.roughDefs(defs, "c1s01-ch5a", { freq: 0.04, scale: 6, choke: 0 }), ch2 = FX.roughDefs(defs, "c1s01-ch5b", { freq: 0.04, scale: 6, choke: 0 });
      $("sc005-s1").style.filter = "url(#c1s01-ch5a)"; $("sc005-s2").style.filter = "url(#c1s01-ch5b)";
      show($("sc005-s1"), T(32.95)); FX.chokeSettle(tl, ch1, $("sc005-s1"), T(32.95), 10, 0.4, "none");
      show($("sc005-s2"), T(33.51)); FX.chokeSettle(tl, ch2, $("sc005-s2"), T(33.51), 10, 0.25, "none");
    })();
    tl.to($("sc005-shot"), { y: -1140, duration: 0.34, ease: E.in }, S(34.05));   // paper slide (PS): the blueprint lifts away, the map is under it

    /* =================== C1S006 · 34.13–38.61 · "before him … not much technical industry in the West" (pictorial map) =================== */
    scene("sc006", 33.95, 38.61);
    (function () {
      const cam = $("sc006-cam");
      const at = (cx, cy, z) => ({ x: 1260 - 300 - cx * z, y: 810 - 260 - cy * z, scale: z });
      tl.fromTo(cam, at(1900, 1300, 0.62), Object.assign(at(1880, 1250, 0.66), { duration: 2.7, ease: "none", immediateRender: true }), S(33.95));
      tl.to(cam, Object.assign(at(1700, 1250, 0.80), { duration: 1.3, ease: E.in }), S(36.70));            // ease-in push: contrast call-out cuts at its peak
      tl.to(cam, Object.assign(at(1680, 1250, 0.86), { duration: 0.6, ease: "none" }), S(38.0));
      FX.contrastCallout(tl, $("sc006-veil"), S(37.62), { w: 3840, h: 2469, ellipse: [1640, 1260, 1050, 560], feather: 70, strength: 0.62, color: "rgba(235,228,214,1)" });
    })();
    words($("sc006-bh"), [T(34.63), T(35.11)], { dur: 0.5, y: 10 });
    words($("sc006-ti"), [T(36.31), T(36.87)], { dur: 0.6 });
    rise($("sc006-west"), T(37.51), { dur: 0.3, y: 10 });
    words($("sc006-west"), [T(37.51), T(37.67)], { dur: 0.3, y: 0 });

    /* =================== C1S007 · 38.61–46.13 · "after him … so powerful that countries around the world want to copy it" =================== */
    scene("sc007", 38.61, 46.30);
    ground("night", S(38.61));
    (function () {
      const cam = $("sc007-cam");
      const at = (cx, cy, z) => ({ x: 960 - cx * z, y: 540 - cy * z, scale: z });
      tl.fromTo(cam, at(1500, 1150, 0.9), Object.assign(at(1700, 1200, 0.62), { duration: 3.6, ease: E.cam, immediateRender: true }), S(38.61));
      tl.to(cam, Object.assign(at(3780, 1920, 0.284), { duration: 2.4, ease: E.cam }), S(42.30));
      tl.to(cam, Object.assign(at(3840, 1920, 0.282), { duration: 1.5, ease: "none" }), S(44.70));
      tl.fromTo($("sc007-glow"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 1.4, ease: C(E.out, 1.4), immediateRender: true }, S(39.0));
      tl.fromTo($("sc007-core"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: C(E.out, 0.6), immediateRender: true }, S(39.1));
      tl.to($("sc007-glow"), { scale: 1.35, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, S(40.6));
      // blueprint copies fly from the valley to 9 countries (no names) at 12 fps, each lands with a small stamp
      const P = (lon, lat) => [(lon + 180) * 21.333, (90 - lat) * 21.333];
      const src = P(-122.1, 37.4);
      const dst = [P(-0.1, 51.5), P(2.3, 48.9), P(13.4, 52.5), P(34.8, 32.1), P(77.6, 13.0), P(116.4, 39.9), P(139.7, 35.7), P(127.0, 37.6), P(103.8, 1.35)];
      const box = $("sc007-copies");
      dst.forEach((d, i) => {
        box.insertAdjacentHTML("beforeend", `<div class="c1-copy" id="c1s01-sc007-c${i}" style="left:${src[0].toFixed(0)}px; top:${src[1].toFixed(0)}px"><b class="t-label">SILICON VALLEY</b></div>`);
        const el = document.getElementById("c1s01-sc007-c" + i), t0 = S(42.55) + i * 0.17, dur = 1.3;
        tl.fromTo(el, { x: 0, y: 0, opacity: 0, scale: 0.6, rotation: 0 }, { opacity: 1, scale: 1.6, duration: 0.2, ease: C(E.out, 0.2), immediateRender: true }, t0);
        tl.to(el, { x: d[0] - src[0], y: d[1] - src[1], rotation: (i % 2 ? 6 : -6), duration: dur, ease: C(E.inOut, dur) }, t0 + 0.05);
        tl.to(el, { scale: 2.6, duration: 0.12, ease: "power2.in" }, t0 + 0.05 + dur);
        tl.to(el, { scale: 2.3, duration: 0.2, ease: C(E.out, 0.2) }, t0 + 0.17 + dur);
      });
    })();
    words($("sc007-ah"), [T(38.87), T(39.27)], { dur: 0.5, y: 8 });
    fade($("sc007-ah"), S(40.85), 0.25);
    words($("sc007-pw"), [T(41.03), T(41.35)], { dur: 0.5, y: 14 });
    fade($("sc007-pw"), S(42.35), 0.25);
    words($("sc007-cw"), [T(42.55), T(43.27), T(43.75), T(43.91)], { dur: 0.45, y: 10 });
    fade($("sc007-cw"), S(44.75), 0.2);
    words($("sc007-ci"), [T(44.87), T(45.43)], { dur: 0.35, y: 14 });
    whip($("sc007-shot"), $("sc008-shot"), S(46.13), { dir: 1 });

    /* =================== C1S008 · 46.13–52.45 · "let me just paint you a picture … in October 2026" =================== */
    scene("sc008", 46.13, 52.45);
    ground("paper", S(46.13));
    tl.fromTo($("sc008-stroke"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.1, ease: C(E.out, 1.1), immediateRender: true }, S(47.10));
    tl.fromTo($("sc008-stroke2"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.0, ease: C(E.out, 1.0), immediateRender: true }, S(47.55));
    words($("sc008-pp"), [T(47.19), T(47.59), T(47.75), T(47.83)], { dur: 0.5 });
    FX.text.odometer(tl, $("sc008-oct"), T(50.87), { dur: 0.5, stagger: 0.03, seed: 8 });
    FX.text.odometer(tl, $("sc008-yr"), T(51.35), { dur: 0.45, stagger: 0.04, seed: 2026 });
    tl.fromTo($("sc008-shot"), { scale: 1 }, { scale: 1.04, duration: 6.0, ease: "none", immediateRender: false }, S(46.13));
    tl.to($("sc008-shot"), { scale: 1.12, duration: 0.28, ease: E.in }, S(52.17));   // CA: push into the date

    /* =================== C1S009 · 52.45–56.69 · "12 companies in the United States … worth more than a trillion dollars" (s01) =================== */
    scene("sc009", 52.45, 56.69);
    ground("night", S(52.45));
    gated(52.4, 56.8, () => FX.streaks($("sc009-streaks"), { seed: 31, speed: 0.5, tint: [255, 206, 158], lo: 0.4, gain: 1.05 }));
    tl.fromTo($("sc009-streaks"), { opacity: 0 }, { opacity: 0.6, duration: 1.0, ease: "power1.out", immediateRender: true }, S(52.45));
    tl.fromTo($("sc009-leak"), { opacity: 0 }, { opacity: 0.16, duration: 1.2, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, S(53.6));
    tl.fromTo($("sc009-block"), { scale: 0.97 }, { scale: 1.01, duration: 3.9, ease: "none", immediateRender: true }, S(52.45));
    FX.text.odometer(tl, $("sc009-12"), T(52.39), { dur: 0.6, stagger: 0.08, seed: 12 });
    tl.fromTo($("sc009-co"), { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(52.95));
    FX.text.fill(tl, $("sc009-co"), T(52.95), { per: 0.03, hold: 0.3, settle: 0.5, cool: BONE });
    words($("sc009-us"), [T(53.35), T(53.43), T(53.59), T(53.91)], { dur: 0.4, y: 10 });
    words($("sc009-wm"), [T(54.55), T(54.87), T(55.03)], { dur: 0.35, y: 8 });
    words($("sc009-tr"), [T(55.19), T(55.35), T(55.91)], { dur: 0.35, y: 10 });
    // MC: the 12 flies to the kicker position of the chart
    tl.to($("sc009-right"), { opacity: 0, duration: 0.2 }, S(56.40));
    tl.to($("sc009-12"), { x: -190, y: -255, scale: 0.36, duration: 0.3, ease: E.inOut }, S(56.39));

    /* =================== C1S010 · 56.69–64.13 · "That number changes … some days less, some days more" (R4 horizontal bars) =================== */
    scene("sc010", 56.69, 64.13);
    ground("paper", S(56.69));
    (function () {
      const co = [["nvidia", 5.16], ["apple", 5.09], ["microsoft", 3.94], ["alphabet_google", 3.45], ["amazon", 2.63], ["spacex", 1.95], ["broadcom", 1.65], ["meta", 1.60], ["tesla", 1.59], ["LLY", 1.22], ["berkshire_hathaway", 1.16], ["micron", 1.06]];
      const K = 1250 / 5.16, rows = $("sc010-rows");
