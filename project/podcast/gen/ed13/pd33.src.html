    others.forEach((p, i) => tl.fromTo(p, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: C(E.out, 0.4), immediateRender: false }, S(4072.55) + [0.18, 0, 0.06, 0.24][i]));
    tl.fromTo($("veto"), { opacity: 0, scale: 1.7, rotation: -4 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.35, ease: C(E.out, 0.35), immediateRender: false }, T(4073.31));
    tl.to($("scam"), { scale: 0.53, duration: S(4077.4) - S(4073.75), ease: "none" }, S(4073.75));

    // ================= S6 · 4077.35 recognition collapses (whip ←) =================
    whip("s5", "s6", S(4077.35), { dir: -1 });
    const WD = /*WORLDSUB*/;
    const K = 17.0667, mx = (lon) => (lon + 180) * K, my = (lat) => (90 - lat) * K;
    const KEYS = /*KEYS*/{
      days: ["belgium", "peru", "lebanon", "rwanda", "senegal", "turkey"],
      more1: ["mexico", "argentina", "greece", "germany", "luxembourg", "cyprus", "madagascar", "togo", "chad", "benin", "australia", "new_zealand", "malta"],
      more2: ["malaysia", "spain", "brazil", "venezuela", "gambia", "niger", "gabon", "botswana", "thailand", "philippines", "portugal", "jamaica", "c_te_d_ivoire", "cameroon", "liberia", "jordan", "kuwait", "libya", "colombia", "ecuador", "chile", "bolivia", "uruguay", "burkina_faso", "sierra_leone", "dem_rep_congo", "iran", "italy", "austria", "canada"],
      stay: ["south_korea", "saudi_arabia", "south_africa", "paraguay", "guatemala", "haiti", "honduras", "el_salvador", "nicaragua", "costa_rica", "panama", "dominican_rep", "malawi", "lesotho", "eswatini", "central_african_rep"],
      japan: ["japan"], us: ["united_states_of_america"], tw: ["taiwan"]
    }/*ENDKEYS*/;
    const mk = (g, key, fill, op) => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", WD[key]); p.setAttribute("fill", fill); p.setAttribute("opacity", op); g.appendChild(p); return p; };
    const country = {};   // key -> { on: [green, dots], off: [grey, hatch] }
    ["days", "more1", "more2", "stay", "japan"].forEach((grp) => KEYS[grp].forEach((k) => {
      if (!WD[k]) return;
      country[k] = { off: [mk($("gfill"), k, "#878c96", 0), mk($("gfill"), k, "url(#pd33-hatch)", 0)], on: [mk($("gfill"), k, "#2f9e5b", 0.66), mk($("gfill"), k, "url(#pd33-dots)", 1)] };
    }));
    const usFill = mk($("gfill"), "united_states_of_america", "#c2c5ca", 0.62);
    const twFill = mk($("gtw"), "taiwan", "#2f9e5b", 1); twFill.setAttribute("stroke", "#eaf7ee"); twFill.setAttribute("stroke-width", "3");
    const flip = (keys, t, stag) => keys.forEach((k, i) => { const c = country[k]; if (!c) return; const tt = t + i * stag;
      tl.to(c.on, { opacity: 0, duration: 0.3, ease: C("power1.out", 0.3) }, tt);
      tl.to(c.off[0], { opacity: 0.16, duration: 0.3, ease: C("power1.out", 0.3) }, tt); tl.to(c.off[1], { opacity: 1, duration: 0.3, ease: C("power1.out", 0.3) }, tt); });
    const TW = [mx(121), my(23.7)], JP = [mx(139.5), my(36)];
    const arc = (x1, y1, lift, col, w) => {
      const x2 = TW[0], y2 = TW[1], p = document.createElementNS(NS, "path");
      p.setAttribute("d", "M" + x1.toFixed(0) + " " + y1.toFixed(0) + " Q" + ((x1 + x2) / 2).toFixed(0) + " " + (Math.min(y1, y2) - lift).toFixed(0) + " " + x2.toFixed(0) + " " + y2.toFixed(0));
      p.setAttribute("stroke", col); p.setAttribute("stroke-width", w); $("garcs").appendChild(p);
      const len = p.getTotalLength(); p.setAttribute("stroke-dasharray", len + " " + len); p.setAttribute("stroke-dashoffset", 0);
      return { p, len };
    };
    const aUS = arc(mx(-98), my(40), 620, "#eeeee8", 9), aJP = arc(JP[0], JP[1], 140, "#9bd8b0", 7);
    // camera + screen-space labels (as pd23)
    const cam = { s: 0.40, lon: 10.5, lat: 10 };
    const labs = Array.from($("s6").querySelectorAll("[data-ll]")).map((el) => { const m = el.getAttribute("data-ll").split(","); return { el, x: mx(+m[0]), y: my(+m[1]), a: el.getAttribute("data-a") || "l" }; });
    const mplace = () => {
      const ox = 960 - mx(cam.lon) * cam.s, oy = 540 - my(cam.lat) * cam.s;
      $("mcam").style.transform = "translate(" + ox.toFixed(2) + "px," + oy.toFixed(2) + "px) scale(" + cam.s.toFixed(4) + ")";
      for (const l of labs) {
        const x = l.x * cam.s + ox, y = l.y * cam.s + oy;
        l.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) " + (l.a === "c" ? "translate(-50%,-50%)" : l.a === "r" ? "translate(-100%,-50%)" : "translate(0,-50%)");
      }
      const tx = TW[0] * cam.s + ox, ty = TW[1] * cam.s + oy, jx = JP[0] * cam.s + ox, jy = JP[1] * cam.s + oy;
      ["mpin", "mring"].forEach((id) => { $(id).setAttribute("cx", tx.toFixed(1)); $(id).setAttribute("cy", ty.toFixed(1)); });
      $("mjring").setAttribute("cx", jx.toFixed(1)); $("mjring").setAttribute("cy", jy.toFixed(1));
    };
    mplace();
    const mmove = (t, d, s, lon, lat, ease) => tl.to(cam, { s: s, lon: lon, lat: lat, duration: d, ease: ease || E.cam, onUpdate: mplace }, t);
    gsap.set([$("m7a"), $("m7b"), $("mus"), $("m79"), $("mct"), $("mctl"), $("mjp"), $("mb1"), $("mb2"), $("mb3"), $("mjring")], { opacity: 0 });
    const show = (el, t) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: C(E.out, 0.3), immediateRender: false }, t);   // map labels: opacity only (mplace owns transform)
    // frame 0 (after the whip): the map as pd23 left it — every ally green, every arc to Taiwan; slow drift
    mmove(S(4077.35), S(4090.70) - S(4077.35), 0.415, 10.5, 12, "none");
    tl.fromTo($("mring"), { attr: { r: 8 }, opacity: 0.95 }, { attr: { r: 34 }, opacity: 0, duration: 1.0, ease: "power2.out", repeat: 1, repeatDelay: 0.3, immediateRender: true }, 0.0 + S(4077.5));
    // 4080.81 "the United States does not pull the recognition until like 1979. So until Carter"
    show($("mus"), T(4080.75));
    tl.fromTo(usFill, { opacity: 0.62 }, { opacity: 0.9, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, S(4080.85));
    tl.fromTo(aUS.p, { attr: { "stroke-width": 9 } }, { attr: { "stroke-width": 14 }, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, S(4080.85));
    show($("m79"), S(4082.6)); land($("m7a"), T(4082.67), 0.35, 6); land($("m7b"), T(4083.23), 0.4, 6);
    show($("mct"), S(4084.40)); pop($("mcti"), S(4084.40), 0.55, 0.7);
    show($("mctl"), T(4084.67));
    // 4086.73 "But other countries, other American allies basically start pulling recognition within days"
    fade([$("mus"), $("m79"), $("mct"), $("mctl")], S(4089.0), 0.4);
    flip(KEYS.days, S(4089.55), 0.12);
    // 4091.61 "Japan, which was the biggest trading partner that Taiwan had"
    mmove(S(4090.70), 1.7, 0.65, 93, 30);
    show($("mjp"), T(4091.55));
    tl.fromTo($("mjring"), { attr: { r: 10 }, opacity: 0.95 }, { attr: { r: 44 }, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, S(4091.65));
    tl.fromTo(aJP.p, { attr: { "stroke-width": 7 } }, { attr: { "stroke-width": 12 }, duration: 0.35, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, S(4092.3));
    land($("mb1"), T(4092.43), 0.35, 6); land($("mb2"), T(4092.83), 0.35, 6); land($("mb3"), T(4093.15), 0.35, 6);
    mmove(S(4092.40), S(4101.20) - S(4092.40), 0.68, 96, 30, "none");
    // 4101.29 "Japan pulls recognition like the day after the UN vote"
    tl.to(aJP.p, { attr: { "stroke-dashoffset": aJP.len }, duration: 0.8, ease: C(E.in, 0.8) }, S(4101.35));
    flip(["japan"], S(4101.55), 0);
    const penM = gated(S(4077), S(4109.5), () => FX.markupDefs($("mmk"), "pd33-penm", { boil: 4 }));
    const xJ = FX.markup.cross(tl, $("mmk"), S(4101.45), { x: 0, y: 0, s: 22, dur: 0.14, color: "#d1307a", width: 7, filter: penM });
    // the cross sits on the Japan–Taiwan arc's midpoint in screen space (camera is at s 0.68 then)
    const xjOx = 960 - mx(96) * 0.68, xjOy = 540 - my(30) * 0.68;
    const xjX = ((JP[0] + TW[0]) / 2) * 0.68 + xjOx, xjY = ((JP[1] + 2 * (Math.min(JP[1], TW[1]) - 140) + TW[1]) / 4) * 0.68 + xjOy;
    xJ.forEach((p) => { p.setAttribute("transform", "translate(" + xjX.toFixed(1) + "," + xjY.toFixed(1) + ")"); });
    gsap.set(xJ, { opacity: 0 }); tl.set(xJ, { opacity: 1 }, S(4101.45));
    // 4104.49 "and more and more countries are pulling recognition"
    fade([$("mjp"), $("mbtp")].concat(xJ), S(4103.7), 0.35);
    mmove(S(4103.80), 2.2, 0.40, 10.5, 10);
    flip(KEYS.more1, S(4104.55), 0.09);
    flip(KEYS.more2, S(4105.55), 0.05);
    mmove(S(4106.00), S(4109.45) - S(4106.00), 0.41, 10.5, 9, "none");
    // 4108.17 "the country is like disappearing from the map"
    tl.to(twFill, { opacity: 0.18, duration: 0.95, ease: "sine.inOut" }, S(4107.80));
    tl.to([$("mpin"), $("mtw")], { opacity: 0.3, duration: 0.95, ease: "sine.inOut" }, S(4107.80));
    

    // ================= S7 · 4109.40 Chiang Kai-shek (hard cut on the drift) =================
    cut("s6", "s7", S(4109.40));
    gsap.set([$("kkick"), $("kn1"), $("kn2"), $("ksm")], { opacity: 0 });
    gsap.set($("krule"), { scaleX: 0 });
    tl.fromTo($("kblock"), { scaleY: 0.55 }, { scaleY: 1, duration: 1.1, ease: C(E.out, 1.1), immediateRender: false }, S(4109.40));
    tl.fromTo($("kph"), { x: 90 }, { x: 0, duration: 1.1, ease: C(E.out, 1.1), immediateRender: false }, S(4109.40));
    tl.fromTo($("kph").querySelector("img"), { scale: 1.0 }, { scale: 1.1, duration: S(4120.6) - S(4109.4), ease: "none", immediateRender: false }, S(4109.40));
    land($("kkick"), T(4110.03), 0.5, 12);
    land($("kn1"), T(4112.03), 0.5, 24); land($("kn2"), T(4112.43), 0.55, 24);
    tl.to($("krule"), { scaleX: 1, duration: 0.9, ease: C(E.out, 0.9) }, S(4112.9));
    tl.fromTo($("ksm"), { opacity: 0, y: 60, rotation: 7 }, { opacity: 1, y: 0, rotation: 2.5, duration: 0.8, ease: C(E.out, 0.8), immediateRender: false }, S(4114.2));
    tl.fromTo($("kblock"), { x: 0 }, { x: -24, duration: 6.0, ease: "none", immediateRender: false }, S(4114.5));

    // ================= S8a · 4120.55 the speech, on a Taiwanese TV at night (whip ←) =================
    whip("s7", "s8", S(4120.55), { dir: -1 });
    tl.fromTo($("tcam"), { scale: 1.0 }, { scale: 1.26, duration: S(4124.12) - S(4120.55), ease: E.cam, immediateRender: false }, S(4120.55));
    tl.fromTo($("tglow"), { opacity: 0.6 }, { opacity: 1, duration: 0.2, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, S(4120.6));
    gated(S(4120.5), S(4124.2), () => FX.weave($("tscr"), { amp: 0.8, flicker: 0.05, seed: 61 }));

    // ================= S8b · 4124.10 the quoted line (hard cut on the push) =================
    cut("s8", "s9", S(4124.10));
    const qw = [1, 2, 3, 4, 5].map((i) => $("q" + i));
    gsap.set(qw.concat([$("qattr"), $("qmark")]), { opacity: 0 });
    tl.fromTo($("qwall"), { y: -40, rotation: -4 }, { y: 0, rotation: -1.5, duration: 1.0, ease: C(E.out, 1.0), immediateRender: false }, S(4124.10));
    tl.fromTo($("qcut"), { x: 80 }, { x: 0, duration: 1.2, ease: C(E.out, 1.2), immediateRender: false }, S(4124.10));
    tl.fromTo($("qblock"), { scaleY: 0.6 }, { scaleY: 1, duration: 1.0, ease: C(E.out, 1.0), immediateRender: false }, S(4124.10));
    tl.fromTo($("qcam"), { scale: 1.0 }, { scale: 1.03, duration: DUR - S(4124.10), ease: "none", immediateRender: false }, S(4124.10));
    // 4125.61 "the goal of the nation from now on is to" — the wall slogan is circled
    const penQ = gated(S(4124), DUR, () => FX.markupDefs($("qmk"), "pd33-penq", { boil: 4 }));
    const cQ = FX.markup.circle(tl, $("qmk"), S(4125.7), { cx: 358, cy: 268, rx: 180, ry: 70, rot: -3, dur: 0.8, color: "#2f9e5b", width: 7, filter: penQ, seed: 7 });
    gsap.set(cQ, { opacity: 0 }); tl.set(cQ, { opacity: 1 }, S(4125.7));
    pop($("qmark"), S(4126.8), 0.4, 0.7);
    // "stay dignified and strengthen ourselves" — word by word
    land(qw[0], T(4127.31), 0.4, 18); land(qw[1], T(4127.63), 0.45, 18); land(qw[2], T(4128.27), 0.35, 18);
    land(qw[3], T(4128.51), 0.45, 18); land(qw[4], T(4129.15), 0.5, 18);
    land($("qattr"), S(4129.9), 0.5, 8);

    // ---- display windows (after all measuring helpers ran; MANUAL §4.2) ----
    SC.forEach((el, i) => {
      const a = W[i][0], b = W[i][1];
      if (i > 0) { gsap.set(el, { display: "none" }); tl.set(el, { display: "block" }, Math.max(0, a - 0.4)); }
      if (i < SC.length - 1) tl.set(el, { display: "none" }, b + 0.2);
    });
    FX.mount(tl, DUR);
    window.__timelines["pd33"] = tl;
  })();
  </script>
</template>
