  <script>
  (function () {
    const SEG = "pd20", START = 2465.8, END = 2501.8, DUR = 36;
    const T = (s) => +(s - START).toFixed(3);   // TEXT cues (audited): literal = word start − 0.06
    const S = (s) => +(s - START).toFixed(3);   // structural cues
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(SEG + "-" + id);
    const NS = "http://www.w3.org/2000/svg";
    const defs = $("defs"), E = FX.ease, C = (e, d) => FX.choppy(e, d, 12);
    const BONE = "#eeeee8", MAG = "#d1307a", MAGL = "#f3a6c8", ASH = "#878c96", ASHL = "#c2c5ca", GRN = "#2f9e5b", GRNL = "#9bd8b0";
    function mk(parent, tag, attrs) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; }
    const CHINA = /*CHINA*/, TAIWAN = /*TAIWAN*/;

    // ---------- scenes ----------
    const C1 = 2469.25, C2 = 2483.10;
    const SC = [["sc001", START, C1], ["sc002", C1, C2], ["sc003", C2, END]];
    SC.forEach((s, i) => {
      const el = $(s[0]);
      if (i === 0) gsap.set(el, { autoAlpha: 1 });
      else tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.001, immediateRender: false }, S(s[1]) - 0.02);
      if (s[2] < END) tl.set(el, { autoAlpha: 0 }, S(s[2]) + 0.06);
    });
    gsap.set([$("vig"), $("dust"), $("grain")], { opacity: (i) => [0.9, 0.34, 0.36][i] });
    function whip(a, b, t, o) {
      const A = $(a + "-shot"), B = $(b + "-shot"), h = 0.16, id = SEG + "-w" + a.slice(-1);
      const ba = FX.whipDefs(defs, id + "a"), bb = FX.whipDefs(defs, id + "b");
      tl.set(A, { filter: "url(#" + id + "a)" }, t - h - 0.01); tl.set(A, { filter: "none" }, t + 0.06);
      tl.set(B, { filter: "url(#" + id + "b)" }, t - 0.001); tl.set(B, { filter: "none" }, t + h + 0.02);
      FX.whip(tl, A, B, t, Object.assign({ dir: 1, dur: 0.32, blurA: ba, blurB: bb }, o));
    }
    const rise = (el, t, o) => { o = o || {}; const d = o.dur || 0.5;
      tl.fromTo(el, { opacity: 0, y: o.y == null ? 16 : o.y }, { opacity: 1, y: 0, duration: d, ease: C(E.out, d), immediateRender: true }, t); };

    /* ===== sc001 · Taiwan (board green) → 1971 ===== */
    (function () {
      const tw = $("tw");
      tw.insertAdjacentHTML("beforeend", '<defs><pattern id="pd20-dots" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.6" cy="1.6" r="0.62" fill="#0c2a18" fill-opacity="0.4"/></pattern></defs>');
      mk(tw, "path", { d: TAIWAN, fill: GRN }); mk(tw, "path", { d: TAIWAN, fill: "url(#pd20-dots)", stroke: GRNL, "stroke-width": 1.2, "stroke-linejoin": "round" });
      gsap.set(tw, { scale: 1.12, x: 40, transformOrigin: "50% 50%" });
      tl.fromTo(tw, { scale: 1.12, x: 40 }, { scale: 1.0, x: 0, duration: 1.4, ease: C(E.out, 1.4), immediateRender: false }, 0);
      tl.fromTo($("sc001-cam"), { scale: 1.0 }, { scale: 1.05, duration: S(C1) + 0.2, ease: "none", immediateRender: false }, 0);
      rise($("twl"), T(2466.75), { dur: 0.4 });                         // Taiwan (part of the story)
      tl.fromTo([$("yr"), $("yrs")], { opacity: 0 }, { opacity: 1, duration: 0.001, immediateRender: true }, T(2467.95));   // nineteen seventy one
      tl.fromTo([$("yr"), $("yrs")], { scale: 1.12 }, { scale: 1, duration: 0.9, ease: C(E.out, 0.9), immediateRender: false }, T(2467.95));
      tl.fromTo($("yr"), { backgroundPosition: "50% 42%" }, { backgroundPosition: "44% 46%", duration: 1.4, ease: "none", immediateRender: false }, T(2467.95));
    })();

    whip("sc001", "sc002", S(C1), { dir: 1 });

    /* ===== sc002 · the UN, 1971 → the leaders in Taipei ===== */
    (function () {
      const a = S(C1), b = S(C2), strip = $("strip"), cards = [$("c1"), $("c2"), $("c3")];
      const blur = (el, on, t) => tl.to(el, { filter: on ? "blur(7px) brightness(0.45)" : "blur(0px) brightness(1)", duration: 0.7, ease: "power2.out" }, t);
      gsap.set(cards[0], { filter: "blur(0px) brightness(1)" }); gsap.set([cards[1], cards[2]], { filter: "blur(7px) brightness(0.45)" });
      tl.fromTo($("sc002-cam"), { scale: 1.0 }, { scale: 1.06, duration: b - a + 0.2, ease: "none", immediateRender: false }, a);
      // "kicked out of the UN": slide to the vote board
      tl.to(strip, { x: -960, duration: 1.0, ease: C(E.inOut, 1.0) }, S(2471.0)); blur(cards[0], true, S(2471.0)); blur(cards[1], false, S(2471.0));
      rise($("cap1"), T(2472.36), { dur: 0.4, y: 10 });                 // UN
      tl.to($("cap1"), { opacity: 0, duration: 0.3 }, S(2473.0));
      // "And for Taiwanese leaders at that point …": slide to Taipei, hold with the slow push
      tl.to(strip, { x: -1920, duration: 1.1, ease: C(E.inOut, 1.1) }, S(2473.1)); blur(cards[1], true, S(2473.1)); blur(cards[2], false, S(2473.1));
      rise($("cap2"), S(2474.3), { dur: 0.4, y: 10 });
    })();

    whip("sc002", "sc003", S(C2), { dir: 1 });

    /* ===== sc003 · Taiwan and China ===== */
    (function () {
      const a = S(C2), cam = $("mapcam"), svg = $("mapsvg");
      svg.insertAdjacentHTML("beforeend", '<defs><pattern id="pd20-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect x="0" y="0" width="4" height="16" fill="#c2c5ca" fill-opacity="0.16"/></pattern></defs>');
      const chf = mk(svg, "path", { d: CHINA, fill: ASH, "fill-opacity": 0.3 }), chh = mk(svg, "path", { d: CHINA, fill: "url(#pd20-hatch)" });
      const cho = mk(svg, "path", { d: CHINA, fill: "none", stroke: ASHL, "stroke-width": 5, "stroke-linejoin": "round", "stroke-opacity": 0.75 });
      const twf = mk(svg, "path", { d: TAIWAN, fill: GRN, "fill-opacity": 0.85 });
      const two = mk(svg, "path", { d: TAIWAN, fill: "none", stroke: GRNL, "stroke-width": 3.5, "stroke-linejoin": "round" });
      gsap.set([chf, chh, cho], { opacity: 0 });
      // camera: close on Taiwan → pull back to China → push into the Strait
      gsap.set(cam, { scale: 1.6, x: -1200, y: -2388 });
      tl.fromTo(cam, { scale: 1.6, x: -1200, y: -2388 }, { scale: 1.5, x: -1060, y: -2200, duration: S(2487.5) - a, ease: "sine.out", immediateRender: false }, a);
      tl.to(cam, { scale: 0.62, x: -30, y: -250, duration: 2.0, ease: E.cam }, S(2487.5));
      tl.to(cam, { scale: 1.3, x: -777, y: -1780, duration: 1.6, ease: E.cam }, S(2492.75));
      tl.to(cam, { scale: 1.36, x: -850, y: -1880, duration: DUR - S(2494.35), ease: "sine.out" }, S(2494.35));
      rise($("twA"), T(2483.80), { dur: 0.4 });                          // Taiwan
      // "basically not a country anymore": the fill drains, the border breaks into dashes
      tl.to(twf, { attr: { "fill-opacity": 0.22 }, duration: 0.6, ease: C(E.out, 0.6) }, S(2484.92));
      tl.set(two, { attr: { "stroke-dasharray": "9 7" } }, S(2485.16));
      tl.to($("twA"), { opacity: 0, duration: 0.3 }, S(2487.4));
      // "CCP that controls China … so much bigger than Taiwan … is a country"
      tl.to([chf, chh, cho], { opacity: 1, duration: 0.8, ease: C(E.out, 0.8) }, S(2487.7));
      rise($("ccp"), T(2488.04), { dur: 0.4, y: 24 });                   // CCP
      rise($("chn"), T(2489.32), { dur: 0.5, y: 30 });                   // China
      rise($("twB"), T(2491.08), { dur: 0.4, y: 20 });                   // Taiwan
      tl.to(chf, { attr: { "fill-opacity": 0.5 }, duration: 0.5, ease: C(E.out, 0.5) }, S(2491.96));
      tl.to(cho, { attr: { "stroke-width": 8, "stroke-opacity": 1 }, duration: 0.5 }, S(2491.96));
      // "already tried invading Taiwan two times": two magenta arrows across the Strait (markup emphasis)
      const mkv = mk(svg, "g", {});
      const arrow = (t, o) => { const ps = FX.markup.arrow(tl, mkv, t, Object.assign({ color: MAGL, width: 8, head: 22, dur: 0.55 }, o));
        ps.forEach((p, i) => { gsap.set(p, { opacity: 0 }); tl.set(p, { opacity: 1 }, t + (i ? 0.46 : 0)); tl.to(p, { opacity: 0, duration: 0.4 }, S(2497.0) + 0.1 * i); }); };
      arrow(S(2494.28), { x1: 1236, y1: 1668, x2: 1336, y2: 1752, bend: -18 });
      arrow(S(2495.32), { x1: 1172, y1: 1772, x2: 1318, y2: 1828, bend: 16 });
      // "because of the United States. We would just send a aircraft carrier"
      const cv = $("cv"); gsap.set(cv, { x: 1150, y: 2140 });
      tl.fromTo(cv, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, S(2498.7));
      tl.fromTo(cv, { x: 1150, y: 2140 }, { x: 1226, y: 1840, duration: 1.7, ease: E.out, immediateRender: false }, S(2498.7));
      rise($("usl"), T(2498.84), { dur: 0.35, y: 10 });                  // United States
      rise($("acl"), T(2500.50), { dur: 0.3, y: 8 });                    // aircraft carrier
    })();

    FX.grain($("grain"), 3); FX.dust($("dust"), 5, 2);
    FX.mount(tl, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines[SEG] = tl;
  })();
  </script>
