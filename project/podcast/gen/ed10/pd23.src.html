    };
    const isRoc = (k) => ROC.indexOf(k) >= 0;
    const groups = {
      japan: ["japan"],
      asia: ["south_korea", "philippines", "thailand", "malaysia", "iran", "saudi_arabia", "jordan", "kuwait", "lebanon"],

      sam: ["mexico", "guatemala", "el_salvador", "honduras", "nicaragua", "costa_rica", "panama", "haiti", "dominican_rep", "jamaica", "colombia", "venezuela", "ecuador", "peru", "brazil", "bolivia", "paraguay", "chile", "argentina", "uruguay"],

    // ---- camera + screen-space labels ----
    const cam = { s: 0.395, cx: mx(20), cy: my(10) };

      $("ring").setAttribute("cx", tx.toFixed(1)); $("ring").setAttribute("cy", ty.toFixed(1));

      const dx = tx - 1380, dy = ty - 740, d = Math.hypot(dx, dy);

    // arcs (map space) from a region to Taiwan
    const arc = (lon, lat, lift, col, w) => {
      const x1 = mx(lon), y1 = my(lat), x2 = TW[0], y2 = TW[1], p = document.createElementNS(NS, "path");

      p.setAttribute("stroke", col); p.setAttribute("stroke-width", w); $("arcs").appendChild(p);
